  <title>UN Migrants Proportional Symbol Map</title>

  <meta name="template" content="proportional-symbol">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="googlebot" content="indexifembedded" />
  <meta name="Description" content="An interactive proportional symbol world map showing migrant totals by country." />

  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,600,700' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="lib/globalStyle.css" />

  <style>
    body {
      max-width: 960px;
      padding: 0 16px 16px;
    }

    h1 {
      margin: 20px 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }

    #subtitle {
      margin: 0 0 16px;
      color: var(--ons-color-grey-75);
      line-height: 1.5;
    }

    #mapStage {
      position: relative;
      width: 100%;
    }

    #mapDiv {
      width: 100%;
    }

    #mapDiv svg {
      display: block;
      width: 100%;
      height: auto;
    }

    #mobileCountryInfo {
      display: none;
      margin: 12px 0 6px;
      padding: 10px 12px;
      border: 1px solid var(--ons-color-grey-25);
      border-radius: 4px;
      background: #f5f5f6;
    }

    #mobileCountryInfo.is-visible {
      display: block;
    }

    #mobileCountryInfoTitle {
      margin: 0 0 6px;
      font-weight: 700;
    }

    #mobileCountryInfoValue {
      margin: 0;
    }

    #mobileCountryInfoClose {
      margin-top: 8px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ons-color-blue);
      text-decoration: underline;
      cursor: pointer;
      font-size: 14px;
    }

    .countries {
      stroke: var(--ons-color-grey-35);
      stroke-width: 0.7;
      vector-effect: non-scaling-stroke;
    }

    .countries.is-hovered {
      stroke: var(--ons-color-black);
      stroke-width: 1.4;
    }

    .country-symbol {
      fill: #27A0CC;
      fill-opacity: 0.75;
      stroke: #27A0CC;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .country-symbol.is-hovered {
      stroke: #222222;
      stroke-width: 1.5;
    }

    #legendNoData {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin: 12px 0 8px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 0;
      color: var(--ons-color-grey-75);
      font-size: 13px;
    }

    .legend-circle-swatch {
      border-radius: 50%;
      background: rgba(39, 160, 204, 0.75);
      border: 1px solid #27A0CC;
      box-sizing: border-box;
      flex: 0 0 auto;
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      /* border-radius: 50%; */
      opacity:75;
      box-sizing: border-box;
      flex: 0 0 auto;
    }

    .legend-swatch-no-data {
      background: repeating-linear-gradient(
        135deg,
        var(--ons-color-grey-15) 0,
        var(--ons-color-grey-15) 6px,
        var(--ons-color-grey-25) 6px,
        var(--ons-color-grey-25) 8px
      );
    }

    code {
      font-family: inherit;
      font-weight: 700;
      background: transparent;
    }

    @media (max-width: 599px) {
      body {
        padding: 0 12px 12px;
      }

      h1 {
        font-size: 26px;
      }

    }
  </style>

</head>
