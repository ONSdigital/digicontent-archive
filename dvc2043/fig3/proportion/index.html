  <script>
    var graphic = d3.select('#graphic');
    var legend = d3.select('#legend');
    var pymChild = null;

    function drawGraphic() {
      //set the screenreader H5
      // d3.select("#screenreadertext").text(dvc.essential.screenreadertext)

      maxweek = d3.max(graphic_data, function(d) {
        return d.date
      })

      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      if(dvc.essential.categorySort.on==true){
        categorySort = {}
        if (Array.isArray(dvc.essential.categorySort.sortby)) {
          for (i = 0; i < dvc.essential.categorySort.sortby.length; i++) {
            categorySort[dvc.essential.categorySort.sortby[i]] = i;
          }

          graphic_data.sort(function(a, b) {
            return categorySort[a.category] - categorySort[b.category]
          })

          categories = Object.keys(categorySort)
        } else if (dvc.essential.categorySort.sortby == "descending") {
          //auto sort the array by biggest value
          graphic_data.filter(function(d) {
            return d.date == maxweek
          }).sort(function(a, b) {
            return +b.chiffre - (+a.chiffre)
          }).forEach(function(item, i) {
            categorySort[item.category] = i
          });

          graphic_data.sort(function(a, b) {
            return categorySort[a.category] - categorySort[b.category]
          })

          categories = Object.keys(categorySort)
        } else if (dvc.essential.categorySort.sortby == "ascending") {
          graphic_data.filter(function(d) {
            return d.date == maxweek
          }).sort(function(a, b) {
            return +a.chiffre - (+b.chiffre)
          }).forEach(function(item, i) {
            categorySort[item.category] = i
          });

          graphic_data.sort(function(a, b) {
            return categorySort[a.category] - categorySort[b.category]
          })

          categories = Object.keys(categorySort)

        }
      }


      var margin = dvc.optional.margin[size]
      var chart_width = (parseInt(graphic.style("width"))-10) / dvc.optional.chart_every[size] - margin.left - margin.right;
      var height = 115;
      var height_lge =( Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]))*1.75;


console.log("height = " + height)
console.log("height_lge = " +height_lge)

      // clear out existing graphics
      graphic.selectAll("*").remove();
      legend.selectAll("*").remove();

      //draw legend
      legend.append('svg').attr("height", dvc.optional.legendHeight[size]).attr("width", dvc.optional.chart_every[size] * (chart_width + margin.left + margin.right)).append('g')
        .attr('transform', 'translate(5,5)')

      // createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        // dvc.essential.structure.map(function(d) {
        //   return d.series
        // }).forEach(function(d, i) {
        // }); // end foreach

        var k = 0;
        dvc.essential.structure.forEach(function(item) {
          item.series.forEach(function(key, i) {
            var colour = item.colour[i];
            drawLegendEntry(key, colour, k);
            k++;
          });
        });


        function drawLegendEntry(key, colour, i) {
          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").select('svg').append("g")

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", colour)
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 20)
            .attr("height", 3)

          var_group.append("text")
            .text(key)
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "12px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);


          d3.selectAll(".legend" + (i))
            .each(calcPosition);

          function calcPosition() {


            var BBox = this.getBBox()


            //prevY =BBox.width
            d3.select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function(d) {
                return prevX + 25;
              })


            d3.select(".rect" + (i))
              .attr("y", function(d) {

                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }

                if (dvc.essential.legendStyle == "rect") {
                  return eval((lineNo * 20) + 5);
                } else {
                  return eval((lineNo * 20) + 12);

                }
              })
              .attr("x", function(d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50



          }; // end function calcPosition()
        } // end drawLegendEntry
      } // end function createLegend()

      x = d3.scaleTime()
        .range([0, chart_width]);

      x.domain(d3.extent(graphic_data, function(d) {
        return d.date
      }))

      dates = d3.map(graphic_data, function(d) {
        return d.date
      }).keys()


      var xAxis = d3.axisBottom(x)

            return d.date.getTime()
          }) //just get dates as seconds past unix epoch
          .filter(function(d, i, arr) {
            return arr.indexOf(d) == i
          }) //find unique
          .map(function(d) {
            return new Date(d)
          }) //map back to dates
          .sort(function(a, b) {
            return a - b
          })
          .filter(function(d, i) {
            return i % dvc.optional.x_ticks_every[size] === 0 && i < dates.length - dvc.optional.x_ticks_every[size] || i == dates.length - 1 //Rob's fussy comment about labelling the last date
          })
        )
        .tickFormat(d3.timeFormat(dvc.essential.displayTicksFormat))

      line = d3.line()
        .x(function(d) {
          return x(d.date)
        })
        .y(function(d) {
          return y[d.category](d.chiffre)
        })


      nestedTemplate = d3.nest()
        .key(function(d) {
          return d.category
        })
        .key(function(d) {
          return d.series
        })
        .sortValues(function(a, b) {
          return a.date - b.date;
        })
      nested = nestedTemplate.entries(graphic_data)

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      y = {}


      // if (dvc.essential.yAxisScale == "auto_zero_max_total") {

      // colour in text
      dvc.essential.structure.forEach(function(item) {
        item.series.forEach(function(key, i) {

      var charts = chartGroups.selectAll("svg")

        //create axis truncation lines
      // svg.each(function(d,i){
      //   d3.select(this).append('line')

      //   .attr("y1",function(d){if(d.key!="Proportion"){return y[d.key](43)}})

      //create svg for chart

      drawyaxis = svg
        .append('g')
        .attr('class', 'y axis')

      //y axis label
      svg
        .each(function(d, i) { //only label the first graph
          if (i % dvc.optional.chart_every[size] == 0) {
            d3.select(this).append("text")
              .attr('transform', 'translate(' + (19 - margin.left) + ', -10)')
              .attr("font-size", "11px")
              .attr("fill", "#666")
              .text(function(d, i) {
                return dvc.essential.yAxisLabel[0]
              });
          }
        })
        .each(function(d, i) { //only label the first graph
          if (i % dvc.optional.chart_every[size] == 1) {
            d3.select(this).append("text")
              .attr('transform', 'translate( -22, -10)')
              .attr("font-size", "11px")
              .attr("fill", "#666")
              .text(function(d, i) {
                return dvc.essential.yAxisLabel[1]
              });
          }
        })
        .each(function(d, i) { //only label the first graph
          if (i % dvc.optional.chart_every[size] == 1) {
            d3.select(this).append("line")
            .attr('x1',0)
            .attr("x2",chart_width)
            .attr('y1',y[d.key](100))
            .attr("y2",y[d.key](100))
            .attr('stroke-width',"3px")
            .style("stroke","#bcbcbd")
          }
        })


      drawyaxis.each(function(d, i) {


        if (d.key=="Proportion of online sales") {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickValues([0,50,100])).selectAll("text");
          d3.select(this).append("rect")
            .attr('x',x(d3.timeParse(dvc.essential.dateFormat)("23/03/2020")))
            .attr('y',y[d.key](100))
            .attr('height',y[d.key](0))
            .attr('width',x(d3.timeParse(dvc.essential.dateFormat)("15/06/2020")) - x(d3.timeParse(dvc.essential.dateFormat)("23/03/2020")))
            .style('fill', "#ABCDEF")
            .style('stroke-width', 2)
            .style('opacity', 0.4);

            d3.select(this).append("rect")
              .attr('x',x(d3.timeParse(dvc.essential.dateFormat)("05/11/2020")))
              .attr('y',y[d.key](100))
              .attr('height',y[d.key](0))
              .attr('width',x(d3.timeParse(dvc.essential.dateFormat)("02/12/2020")) - x(d3.timeParse(dvc.essential.dateFormat)("05/11/2020")))
              .style('fill', "#ABCDEF")
              .style('stroke-width', 2)
              .style('opacity', 0.4);

              d3.select(this).append("rect")
                .attr('x',x(d3.timeParse(dvc.essential.dateFormat)("04/01/2021")))
                .attr('y',y[d.key](100))
                .attr('height',y[d.key](0))
                .attr('width',x(d3.timeParse(dvc.essential.dateFormat)("29/03/2021")) - x(d3.timeParse(dvc.essential.dateFormat)("04/01/2021")))
                .style('fill', "#ABCDEF")

        } else {

          d3.select(this).append("rect")

                .style('opacity', 0.4);

        .attr("class", function(d) {
          return "line" + d.key.replace(/\s/g, '')
        })
        .attr("stroke", function(d) {
          var structureEntry = dvc.essential.structure.filter(function(e) {
            return e.series.indexOf(d.key) > -1
          })[0];
         return structureEntry.colour[structureEntry.series.indexOf(d.key)]

      .text(function(d){return d3.format(",.1f")(+d.values[d.values.length-1].chiffre)})
      .attr("dy",function(d){
        var structureEntry = dvc.essential.structure.filter(function(e) {
          return e.series.indexOf(d.key) > -1
        })[0];
       return structureEntry.yoffset[d.values[0].category][structureEntry.series.indexOf(d.key)]
      })
      .attr("fill",function(d){
        var structureEntry = dvc.essential.structure.filter(function(e) {
          return e.series.indexOf(d.key) > -1
        })[0];
        if(d.key=="Construction"){
          return "#8A9B2E"
        }else{
          return structureEntry.colour[structureEntry.series.indexOf(d.key)]
        }
      })


      //create link to source
      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      d3.selectAll(".line2020").raise()

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config;

        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          graphic_data = data;

          graphic_data.forEach(function(d) {
            d.date = d3.timeParse(dvc.essential.dateFormat)(d.date)
          })
          //use pym to create iframed chart dependent on specified variables
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });

      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
  </script>
