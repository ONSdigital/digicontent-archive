<!DOCTYPE html>
<html lang="en">

<head>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
    <title>Milestones - timeline</title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <style>

        body {
          max-width:700px;
          margin:0px;
          height:130px;
        }

        svg {font-family: 'Open Sans', sans-serif; font-weight: 700}

        .bigcircles {
          cursor: pointer
        }

        .bigcircles:hover {
          fill: #8f9fa8!important;
          /* opacity:0.7 */
        }
        @media (min-width: 600px) {
            #tooltip {
              background: black;
              color: #fff;
              font-family: 'Open Sans';
              font-weight:400;
              border: 1px solid black;
              border-radius: 5px;
              padding: 5px;
              width: 150px;
              text-align:center;
              pointer-events: none;
              overflow:visible;
            }

            #tooltip::after {
                content: " ";
                position: absolute;
                bottom: 100%;  /* At the top of the tooltip */
                left: 50%;
                margin-left: -18px;
                border-width: 5px;
                border-style: solid;
                border-color: transparent transparent black transparent;
              }

              .tooltipleft::after {
                  left: 26px !important;
              }

              .tooltipright::after {
                  left: 155px !important;
              }
          }
    </style>

</head>


<body>

	  <div id="graphic">
      <div id="tooltip" display="none" style="position: absolute; opacity: 0;">
      </div>
    </div>



   		<script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
   		<script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
   		<script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>


   <script>

		var pymChild = null;

		function drawGraphic() {
            width=parseInt(d3.select("body").style("width"))

            var margin={ top: 25, right: 17, bottom: 10, left: 17}

            var chartwidth=width-margin.left-margin.right

            x=d3.scaleLinear()
            .range([0, chartwidth])
            .domain([31,74])

        var svg= d3.select("#graphic")
            .append("svg")
            .attr("width",width)
            .attr("height","150px")
            .append("g")
            .attr("transform", "translate("+margin.left +" "+margin.top+")")

        svg.append("line")
            .attr("x1",x(31))
            .attr("y1",20)
            .attr("x2",x(74))
            .attr("y2",20)
            .attr("stroke","#dadada")
            .attr("stroke-width","9.5px")
            .attr('stroke-linecap',"round")


        var linegradient = d3.select("svg")
            .append("defs")
            .append("linearGradient")
            .attr("id", "main")
            .attr("x1","0%")
            .attr("x2","100%")
            .attr("y1","0%")
            .attr("y2","0%")

        linegradient.append("stop")
            .style("stop-color","#206095")
            .attr("offset","0")
            .style("stop-opacity","1")

        linegradient.append("stop")
            .attr("offset","1")
            .style("stop-color","#008080")
            .style("stop-opacity","1")

      svg.selectAll('.smallrect')
          .data(graphic_data)
          .enter()
          .append('rect')
          .attr('class','smallrect')
          .attr('id',function(d){return 'smallrect'+d.age})
          .attr('x',function(d){return x(d.age)-4.75})
          .attr('width',9.5)
          .attr('y',function(d,i){if(i%2==0){return 5}else{if(i==7){return 5}else{return 20}}})
          .attr('height',15)
          .attr("fill",function(d){if(d.age==31){return "#206095"}else{return"#5f7682"}})
          // .attr("stroke",function(d){ return d.strokecolor})
          .on("click", function(d){ pymChild.scrollParentTo(d.anchor);})
          .on("mouseover", function(d){if(width>600){showTooltip(d);}})
          .on("mouseout", function(d){if(width>600){hideTooltip(d);}})


      svg.selectAll("circle")
          .data(d3.range(31,75,1))
          .enter()
          .append("circle")
          .attr("class","dots")
          .attr('id',function(d){return 'smalldots'+d})
          .attr("cx",function(d){ return x(d)})
          .attr("cy",20)
          .attr("r",4.75)
          .attr("fill",function(d){if(d==31){return "#206095"}else{return "#b7c2c7"}})//first dot is matisse
          .attr("opacity",1)


      if(window.location.hash) {
        hash = window.location.hash.substr(1);
        currage = graphic_data.filter(function(e){return e.anchor == hash})[0].age
        if(currage==65){currage=74;}
        svg.append("rect")
             .attr("class","transrect")
             .attr("x",x(31))
             .attr("y",15.25)
             .attr("height",9.5)
             .style("stroke-width","9.5px")
             .attr("fill","url(#main)")
             .attr("width", function (){return x(currage)})

             d3.select("#smalldots"+currage).attr("fill","#206095")//make the dot matisse
             d3.select("#smallrect"+currage).attr("fill","#206095")//make the rect matisse
             d3.select("#smalldots"+currage).raise()

             graphic_data.filter(function(d){return d.age<=currage}).forEach(function(d){
               d3.select("#smalldots"+d.age).attr('fill',"#206095")
               d3.select("#smalldots"+d.age).raise()
               d3.select("#smallrect"+d.age).attr("fill","#206095")//make the rect matisse
               d3.select("#smallrect"+d.age).raise()
             })

             graphic_data.filter(function(d){return d.age>currage}).forEach(function(d){
               d3.select("#smalldots"+d.age).attr("fill","#5f7682")//make the dot grey
               d3.select("#smallrect"+d.age).attr("fill","#5f7682")//make the rect grey
             })



      } else {
        svg.append("rect")
             .attr("x",x(31))
             .attr("y",15.25)
             .attr("class","transrect")
             .attr("width", x(74))
             .attr("height",9.5)
             .style("stroke-width","9.5px")
             .attr("fill","#206095")

         d3.selectAll('.bigcircles').style('fill',"#206095")
         d3.selectAll('.smallrect').style('fill','#206095')
         // d3.select
      }


      // d3.select(".bigrect").on("mouseover",function(d){
      //   d3.select("#circle65").style("fill","#00a7a3");
      //   d3.select("#circle74").style("fill","#00a7a3");
      // })
      //
      // d3.select(".bigrect").on("mouseout"),function(d){
      //   d3.select("#circle65").style("fill","black");
      //   d3.select("#circle74").style("fill","#5f7682");
      // }


      svg.selectAll(".svgbigcircles")
          .data(graphic_data)
          .enter()
          .append("circle")
          .attr("class","bigcircles")
          .attr("id", function(d,i){return "circle" + d.age})
          .attr("cx",function(d,i){ return x(d.age)})
          .attr("cy",function(d,i){if(i%2==0){return -5}else{if(i==7){return -5}else{return 45}}})
          .attr("r", function(){if(chartwidth > 400) {return 15} else {return 11}})
          .attr("fill",function(d){ return d.class})
          .attr("stroke",function(d){ return d.strokecolor})
          .attr("stroke-width","3px")
          .attr("tabindex", function(d,i){ return i+1})
          .on("click", function(d){ pymChild.scrollParentTo(d.anchor);})
          .on("keypress", function(d) {
            if(d3.event.keyCode === 32 || d3.event.keyCode === 13){
              pymChild.scrollParentTo(d.anchor);
            }
          })
          .on("mouseover", function(d){if(width>600){showTooltip(d);}})
          .on("mouseout", function(d){if(width>600){hideTooltip(d);}})

        svg.append('rect')
          .data([{
                "age":74,
                "title":"Peak happiness",
                "anchor":"happiness",
                "class":"#206095",
                "strokecolor":"none"
              }])
          .attr("class","bigcircles")
          .attr('x', x(65))
          .attr('y',15.25)
          .attr('width', x(74)-x(65))
          .attr('height',9.5)
          .attr('fill','#5f7682')
          .attr('pointer-events',"none")
          // .on("click", function(d){ pymChild.scrollParentTo(d.anchor);})
          // .on("keypress", function(d) {
          //   if(d3.event.keyCode === 32 || d3.event.keyCode === 13){
          //     pymChild.scrollParentTo(d.anchor);
          //   }
          // })
          // .on("mouseover", function(d){console.log(d);if(width>600){showTooltip(d);}})
          // .on("mouseout", function(d){if(width>600){hideTooltip(d);}})


    if(window.location.hash) {
      currage = graphic_data.filter(function(e){return e.anchor==hash})[0].age;
      if(currage==65){currage=74;}
		  d3.selectAll(".bigcircles")
        .attr("fill",function(d,i){
          if(d.age <= currage){
             return "#206095"
          } else {
             return "#5f7682"
          }
       })

		d3.selectAll(".bigcircles").style("stroke","rgba(255, 153, 51,0)")

		d3.select("#circle" + currage)
			 .attr("fill","#206095")
			 .style("stroke","rgba(255, 153, 51,1)")

      if(currage==74){
        d3.select("#circle65")
        .style("stroke","rgba(255, 153, 51,1)")
      }

    }else{
      d3.select("#circle57").style('stroke',"none")
      d3.select('rect.bigcircles').style('fill','#206095')
      d3.select('#smalldots74').style('fill','#206095')
    }

    svg.selectAll("text")
        .data(graphic_data)
        .enter()
        .append("text")
        .attr("x",function(d,i){ return x(d.age)})
        .attr("y",function(d,i){if(i%2==0){return 0}else{if(i==7){return 0}else {return 50}}})
        .style("fill", "white")
        .style("pointer-events","none")
        .attr("text-anchor","middle")
        .attr("font-size", function(){if(chartwidth > 400) {return "16px"} else {return "13px"}})
        .text(function(d,i){ return (d.age)})




    function showTooltip(d){

        // //make the lollipop a different colour
        // d3.select('#smallrect'+d.age).style('fill',"#8f9fa8")
        // d3.select('#smalldots'+d.age).style('fill',"#8f9fa8")
        //
        if(d.age==65||d.age==74){
          var foo = (d.age==65)?74:65
          d3.select('#circle'+foo).style('fill',"#8f9fa8")
        }

        if(d.age==31||d.age==45||d.age==63||d.age==65||d.age==74){csstop="40px"}else{csstop="90px"}

        if(x(d.age) + margin.left < 75) {
          d3.select("#tooltip")
                .classed("tooltipright",false)
                .classed("tooltipleft",true)
                .style("left", x(d.age) + "px")
                .style("top", csstop)
                .text(d.title)
                .transition()
                .duration(300)
                .style("opacity","1");
        } else if(x(d.age) - margin.right > (chartwidth - 75)) {
          d3.select("#tooltip")
                .classed("tooltipleft",false)
                .classed("tooltipright",true)
                .style("left", x(d.age) - 128 + "px")
                .style("top", csstop)
                .text(d.title)
                .transition()
                .duration(300)
                .style("opacity","1");
        } else {
          d3.select("#tooltip")
                .classed("tooltipleft",false)
                .classed("tooltipright",false)
                .style("left", (x(d.age) - 53) + "px")
                .style("top", csstop)
                .text(d.title)
                .transition()
                .duration(300)
                .style("opacity","1");
        }
    }

    function hideTooltip(d){
            // d3.select('#smallrect'+d.age).style('fill',"#5f7682")
            // d3.select('#smalldots'+d.age).style('fill',"#5f7682")
            //
            if(d.age==65||d.age==74){
              var foo = (d.age==65)?74:65
              if(currage>=65){
                d3.select('#circle'+foo).style('fill',"#206095")
              }else{
                d3.select('#circle'+foo).style('fill',"#5f7682")
              }
            }

            d3.select("#tooltip")
              .transition()
              .duration(300)
              .style("opacity","0");
    }

    if (pymChild) {
          pymChild.sendHeight();
    }
}  // ends draw graphic



	 //check whether browser can cope with svg
		if (Modernizr.svg) {
				//load chart data
				d3.csv("data2.csv", function(error, data) {
					graphic_data = data;

					//use pym to create iframed chart dependent on specified variables
					pymChild = new pym.Child();

          drawGraphic()

          //var pymChild = new pym.Child();


				});


		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		      pymChild.sendHeight();
		  }
		}
    </script>
