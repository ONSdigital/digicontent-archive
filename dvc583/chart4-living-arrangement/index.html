<!DOCTYPE html>
<html lang="en">

<head>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
    <title>Living arrangements</title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />
    <style type="text/css">


		body {
			max-width:700px;
			margin: 0px auto;
		}

		.slopeWorse {
			stroke:  #E2BC22;
			stroke-width:2px;
		}

		.slopeBetter {
			stroke: #0075A3;
			stroke-width:2px;
		}

		.slopeSame {
			stroke: #cccccc;
			stroke-width:2px;
		}

		.graphic .axis line {
			fill: none;
			stroke: none;
			shape-rendering: crispEdges;
		}


		.border0 { border-top: 2px solid #274796; }
    .border1 { border-top: 2px solid #F5942F; }
    .border2 { border-top: 2px solid #E73f40; }
		.border3 { border-top: 2px solid #7BCAE2; }

		.title {
			font-family: 'Open Sans';
			font-size:16px;
			color:#666;
			font-weight:bold;
			text-align:center;
			padding-bottom:10px;
		}

		text{
			font-family: 'Open Sans', sans-serif;
			font-size:12px;
		}

		p{
			font-family: 'Open Sans', sans-serif;
			font-size:12px;
		}

		.y text {
			display:none;
		}

		.graphic .grid .tick /* required */
		{
            stroke: #eee;
            stroke-width: 0px; /* set to 0 just to get rid */
            shape-rendering: crispEdges;
    }

		.fade {
			opacity:0.1;
		}

		.highlight {
			opacity:1;
		}

		.axis path {
			fill:none;
			stroke:#fff !important;
		}

		.slopegroup {
			cursor:pointer;

		}

		.textno0, .textno1, .boldtext {
			font-weight:bold;
		}

	  .textno0 {
			/*text-anchor:end;*/
			fill:#fff;
		}

		.textno1{
			/*text-anchor:start;*/
			fill:#fff;
		}

    .col-xs-6, .col-sm-6, .col-xs-12, .col-sm-12 {
      position: relative;
      min-height: 1px;
    }

    .col-xs-12 {
      width: 100%;
      float: left;
    }

    .col-xs-9 {
        width: 75%;
    	float: left;
    }

    .sparkle {
    	font-weight:bold;
    	fill: #02737d;
    }

    .tick text {
    	text-anchor: middle;
    	font-size: 14px;
    	font-weight: bold;
    }

@media (min-width: 635px) {
	#graphic {
		width:100%;
	}
}

@media (max-width: 500px) {
	.desk {
		fill:none;
	}
}


@media (min-width: 501px) {
	.mob {
		fill:none;
	}

}

#keypoints/* required. */
		{
			margin-bottom:10px;
			color:#666;
			font-weight:400 !important;
			font-size:13px;
		}
}

  .footer {
    font-size: 14px !important;
    font-weight:700 !important;
  }


    </style>
</head>

    	<img src="fallback.png" alt="[Chart]" />
    </div>
    </div>
    <div id="keypoints">
    </div>
