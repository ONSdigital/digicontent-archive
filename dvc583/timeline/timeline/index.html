    <style>

        body {
          max-width:800px;
          margin:0px;
          height:115px;


        }

        svg {font-family: 'Open Sans', sans-serif; font-weight: 700}

        .bigcircles {
          cursor: pointer
        }

        .bigcircles:hover {
          fill: #00a7a3
        }
        @media (min-width: 600px) {
            #tooltip {
              background: black;
              color: #fff;
              font-family: 'Open Sans';
              font-weight:400;
              border: 1px solid black;
              border-radius: 5px;
              padding: 5px;
              width: 150px;
              text-align:center;
            }

            #tooltip::after {
                content: " ";
                position: absolute;
                bottom: 100%;  /* At the top of the tooltip */
                left: 50%;
                margin-left: -18px;
                border-width: 5px;
                border-style: solid;
                border-color: transparent transparent black transparent;
              }

              .tooltipleft::after {
                  left: 26px !important;
              }

              .tooltipright::after {
                  left: 155px !important;
              }
          }
    </style>

	  <div id="graphic">
      <div id="tooltip" display="none" style="position: absolute; opacity: 0;">
      </div>

   		<script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>

   		<script src="../lib/pym.js" type="text/javascript"></script>


   <script>

		var pymChild = null;

		function drawGraphic() {



            width=parseInt(
            d3.select("body")
            .style("width"))

            var margin={ top: 10, right: 15, bottom: 10, left: 15}

            var chartwidth=width-margin.left-margin.right

            var x=d3.scaleLinear()
            .range([0, chartwidth])
            .domain([18,34])

        var svg= d3.select("#graphic")
            .append("svg")
            .attr("width",width)
            .attr("height","125px")
            .append("g")
            .attr("transform", "translate("+margin.left +" "+margin.top+")")

        svg.append("line")
            .attr("x1",x(18))
            .attr("y1",20)
            .attr("x2",x(34))
            .attr("y2",20)
            .attr("stroke","#dadada")
            .attr("stroke-width","9.5px")


        var linegradient = d3.select("svg")
            .append("defs")
            .append("linearGradient")
            .attr("id", "main")
            .attr("x1","0%")
            .attr("x2","100%")
            .attr("y1","0%")
            .attr("y2","0%")

        linegradient.append("stop")
            .style("stop-color","#206095")
            .attr("offset","0")
            .style("stop-opacity","1")

        linegradient.append("stop")
            .attr("offset","1")
            .style("stop-color","#008080")
            .style("stop-opacity","1")


        svg.selectAll("circle")
            .data(d3.range(18,34,1))
            .enter()
            .append("circle")
            .attr("class","dots")
            .attr("cx",function(d){ return x(d)})
            .attr("cy",20)
            .attr("r",4.75)
            .attr("fill","#5f7682")
            .attr("opacity",0.45)


      if(window.location.hash) {

        hash = window.location.hash.substr(1);

        svg.append("rect")
             .attr("class","transrect")
             .attr("x",x(18))
             .attr("y",15.25)
             .attr("height",9.5)
             .style("stroke-width","9.5px")
             .attr("fill","url(#main)")
             .attr("width", function (){return x(graphic_data.filter(function(e){return e.anchor == hash})[0].age)})




      } else {

        svg.append("rect")
             .attr("x",x(18))
             .attr("y",15.25)
             .attr("width", function (){return x(graphic_data.filter(function(e){return e.strokecolor!="none"})[0].age)})
             .attr("height",9.5)
             .style("stroke-width","9.5px")
             .attr("fill","url(#main)")
      }


      svg.selectAll(".svgigcircles")
          .data(graphic_data)
          .enter()
          .append("circle")
          .attr("class","bigcircles")
          .attr("id", function(d,i){return "circle" + d.age})
          .attr("cx",function(d,i){ return x(d.age)})
          .attr("cy",20)
          .attr("r", function(){if(chartwidth > 400) {return 15} else {return 11}})
          .attr("fill",function(d){ return d.class})
          .attr("stroke",function(d){ return d.strokecolor})
          .attr("stroke-width","3px")
          .attr("tabindex", function(d,i){ return i+1})
          .on("click", function(d){ pymChild.scrollParentTo(d.anchor);})
          .on("keypress", function(d) {
            if(d3.event.keyCode === 32 || d3.event.keyCode === 13){
              pymChild.scrollParentTo(d.anchor);
            }
          })
          .on("mouseover", function(d){if(width>600){showTooltip(d);}})
          .on("mouseout", function(d){if(width>600){hideTooltip(d);}})

      if(window.location.hash) {

          currage = graphic_data.filter(function(e){return e.anchor==hash})[0].age;

         // d3.selectAll(".bigcircles").attr("stroke","none").attr("fill","#5f7682")

		  d3.selectAll(".bigcircles").attr("fill",function(d,i){if(d.age <= currage){
                                 return "#206095"
                               } else {
                                 return "#5f7682"
                               }
                             })

		d3.selectAll(".bigcircles").style("stroke","rgba(255, 153, 51,0)")

		d3.select("#circle" + currage)
			 .attr("fill",function(d,i){if(d.age <= currage){
				  return "#206095"
				} else {
				  return "#5f7682"
				}
			  })
			 .style("stroke","rgba(255, 153, 51,1)")

      }

        svg.selectAll("text")
            .data(graphic_data)
            .enter()
            .append("text")
            .attr("x",function(d,i){ return x(d.age)})
            .attr("y",25)
            .style("fill", "white")
            .style("pointer-events","none")
            .attr("text-anchor","middle")
            .attr("font-size", function(){if(chartwidth > 400) {return "16px"} else {return "13px"}})
            .text(function(d,i){ return (d.age)})




      function showTooltip(d){


        if(x(d.age) + margin.left < 75) {
          d3.select("#tooltip")
                .classed("tooltipright",false)
                .classed("tooltipleft",true)
                .style("left", x(d.age) + "px")
                .style("top", "60px")
                .text(d.title)
                .transition()
                .duration(300)
                .style("opacity","1");


        } else if(x(d.age) - margin.right > (chartwidth - 75)) {
          d3.select("#tooltip")
                .classed("tooltipleft",false)
                .classed("tooltipright",true)
                .style("left", x(d.age) - 128 + "px")
                .style("top", "60px")
                .text(d.title)
                .transition()
                .duration(300)
                .style("opacity","1");

        } else {
          d3.select("#tooltip")
                .classed("tooltipleft",false)
                .classed("tooltipright",false)
                .style("left", (x(d.age) - 53) + "px")
                .style("top", "60px")
                .text(d.title)
                .transition()
                .duration(300)
                .style("opacity","1");
        }

      }

      function hideTooltip(d){

        d3.select("#tooltip")
          .transition()
          .duration(300)
          .style("opacity","0");

      }

      if (pymChild) {
            pymChild.sendHeight();

//

//                            .style("stroke","none")
//                            .transition()
//                            .delay(function(d,i){return durationanim * ((d.age -18)/18)})
//                            .duration(1000)
//                            .attr("fill",function(d,i){if(d.age <= currage){
//                                 return "#206095"
//                               } else {
//                                 return "#5f7682"
//                               }
//                             })
//
//                     d3.select("#circle" + currage)
//                         .style("stroke","rgba(255, 153, 51,0)")
//                         .transition()
//                         .delay(function(d,i){return (durationanim * ((d.age -18)/18))})
//                         .duration(1000)
//                         .attr("fill",function(d,i){if(d.age <= currage){
//                              return "#206095"
//                            } else {
//                              return "#5f7682"
//                            }
//                          })
//                         .style("stroke","rgba(255, 153, 51,1)")
//
//
//                  }
//                });
//                pymChild.getParentPositionInfo();  }
//                , 300);
//            }
            //Viewport width and height.
            //Iframe top, left, bottom and right positions.



            //console.log(pymChild.getParentPositionInfo());
      }

	  }  // ends draw graphic



	 //check whether browser can cope with svg
		if (Modernizr.svg) {
				//load chart data
				d3.csv("data2.csv", function(error, data) {
					graphic_data = data;

					//use pym to create iframed chart dependent on specified variables
					pymChild = new pym.Child();

          drawGraphic()

          //var pymChild = new pym.Child();


				});


		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		      pymChild.sendHeight();
		  }
		}
    </script>
