<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title>Deaths from all causes by place of death, percentage difference between deaths registered in each month of 2020 and five-year average for 2015 to 2019</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    .x.axis path {
      display: none;
    }

    /* Full width */

    .btn-form-fullwidth {
      display: -webkit-inline-box;
      display: -ms-inline-flexbox;
      display: inline-flex;
      font-family: 'Open Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 32px;
      width: 100%;
    }

    .form-group-fullwidth {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      cursor: pointer;
      height: 50px;
      box-sizing: border-box;
      text-align: center;
      width: 100%;
      margin-top: 3px;
      margin-right: 4px;
    }

    .form-group-fullwidth:last-child {
      /*  border-right: solid 3px #206095;*/
    }

    .form-group-fullwidth:focus {
      outline: orange 3px solid;
    }

    .label-primary-fullwidth {
      /* padding: 12px 16px; */
      cursor: pointer;
      color: #206095;
      background: #fff;
      border-top: solid 3px #206095;
      border-left: solid 3px #206095;
      border-bottom: solid 3px #206095;
      border-right: solid 3px #206095;
      width: 100%;
      position: relative;
      
    }

    .label-primary-fullwidth p {
      top: 50%;
      line-height: 1;
      display: inline-block;
      /* vertical-align: middle; */
      transform: translate(0 , -50%);
      padding-top: 42px;

    }

    .label-primary-fullwidth:hover,
    .label-primary-fullwidth:focus {
      background: #206095;
      color: #fff;
      border-color: #206095;
      width: 100%;
      outline: orange 3px solid;

    }

    .radio-primary-fullwidth:checked+.label-primary-fullwidth {
      background: #206095;
      color: #fff;
      border-color: #206095;
      cursor: default;
      width: 100%;

      /*outline: orange 3px solid; */
    }

    .radio-primary-fullwidth {
      display: none;
    }

    h5 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* stuff for legend */
    #legend {
      display: flex;
      margin-bottom: 20px;
    }

    .legenditem {
      display: flex;
      font-size: 14px;
      padding-right: 25px;
    }

    .square {
      height: 15px;
      width: 15px;
      /* border-radius: 50%; */
    }

    .legendtext {
      font-size: 16px;
      color: #707070;
    }

    p {
      line-height: 1em;
      margin-bottom: 10px;
    }

    @media (max-width: 400px) {
      .legend {
        flex-flow: column;
      }
    }
  </style>
</head>

<body>

  <h5 class="visuallyhidden">Deaths in private homes remained above average even as mortality rates elsewhere returned to normal</h5>

  <div id="buttons">
    <form id="buttonForm" class="btn-form btn-form-fullwidth" role="radiogroup">
      <div class="form-group form-group-fullwidth" role="radio" tabindex="0">
        <input id="button-1" class="radio-primary radio-primary-fullwidth" type="radio" name="button" value="England" aria-checked="true" checked>
        <label class="label-primary label-primary-fullwidth" for="button-1"><p>England</p></label>
      </div>
      <div class="form-group form-group-fullwidth" role="radio" tabindex="0">
        <input id="button-2" class="radio-primary radio-primary-fullwidth" type="radio" name="button" value="Wales" aria-checked="false">
        <label class="label-primary label-primary-fullwidth" for="button-2"><p>Wales</p></label>
      </div>
      <div class="form-group form-group-fullwidth" role="radio" tabindex="0">
        <input id="button-3" class="radio-primary radio-primary-fullwidth" type="radio" name="button" value="Scotland" aria-checked="false">
        <label class="label-primary label-primary-fullwidth" for="button-3"><p>Scotland</p></label>
      </div>
      <div class="form-group form-group-fullwidth" role="radio" tabindex="0">
        <input id="button-4" class="radio-primary radio-primary-fullwidth" type="radio" name="button" value="Northern Ireland" aria-checked="false">
        <label class="label-primary label-primary-fullwidth" for="button-4"><p>Northern Ireland</p></label>
      </div>
    </form>
  </div>
  <!-- <h5 id="switchSummary" class="visuallyhidden" aria-live="assertive"></h5> -->
  <div aria-hidden="true" id="legend"></div>

  <div id="graphic" aria-hidden="true">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <div id="keypoints">
    <p></p>
  </div>

  <div class="footer">
  </div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.js" type="text/javascript"></script>
  <script>
    var graphic = d3.select('#graphic');




    var keypoints = d3.select('#keypoints');
    var footer = d3.select(".footer");
    var pymChild = null;

    function drawGraphic() {
      var threshold_md = dvc.essential.mediumBreakpoint;
      var threshold_sm = dvc.essential.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) / dvc.optional.chart_every[size] - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      x = d3.scaleBand()
        .range([0, chart_width])
        .paddingInner(0.1)

      x.domain(d3.map(graphic_data, function(d) {
        return d.date;
      }).keys());

      y = d3.scaleLinear()
        .rangeRound([height, 0])
        .domain([-70, 200]);

      xtime = d3.scaleTime()
        .range([0, chart_width - x.bandwidth()])
        .domain(d3.extent(graphic_data, function(d) {
          return d.date
        }))

      var yAxis = d3.axisLeft(y)
        .tickSize(-chart_width)
        .tickPadding(10)
        .ticks(4)

      var xAxis = d3.axisBottom(xtime)
        .tickFormat(d3.timeFormat("%b %Y"))
        .ticks(4)

      nested = d3.nest()
        .key(function(d) {
          return d.category
        })
        .entries(graphic_data.filter(function(d) {
          return d.group == "England"
        }))

      charts = d3.select('#graphic')
        .selectAll('svg')
        .data(nested)
        .enter()
        .append('svg')
        .attr("class", function(d,i) {return d.key.replace(/\s+/g, '');})
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 12)
        .text(function(d) {
          return d.key
        })
        .attr('font-weight',700)
        .attr('font-size',"14px")

      svg = charts
        .append("g")
        .attr('class','chart')
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      svg
        .append('g')
        .attr('class', 'x axis')
        .attr('transform', 'translate('+(x.bandwidth()/2)+',' + (height * 1.00) + ')')
        .call(xAxis)
        .each(function(d,i){
          if(i%dvc.optional.chart_every[size]==dvc.optional.chart_every[size]-1){
            d3.select(this).append("text")
              .text(dvc.essential.xAxisLabel)
              .attr("transform", "translate("+chart_width+"," + (margin.bottom-5) + ")")
              .attr('text-anchor','end')
              .attr('fill',"#666");
          }
        })


      svg.append('g')
        .attr('class', 'y axis')
        .each(function(d, i) {
          if (i % dvc.optional.chart_every[size] == 0) {
            d3.select(this)
            .call(yAxis.tickFormat(d3.format(",.0f")))
            .append("text")
            .attr("x", -margin.left)
            .attr("y", -10)
            .style("text-anchor", "start")
            .text(dvc.essential.yAxisLabel);
          }else{
            d3.select(this).call(yAxis.tickFormat(""))
          }
        })

      drawChart(graphic_data.filter(function(d) {
        return d.group == "England"
      }))

      //a function that draws the chart given some data
      function drawChart(data) {
        t = d3.transition()
          .duration(1000)

        nested2 = d3.nest()
                .key(function(d) {
                  return d.category; 
                })
                .entries(data)
        

        nested2.forEach(function(item, i){
          d3.select('svg.'+item.key.replace(/\s+/g, '')).select('g.chart')
          .selectAll('rect.bars')
          .data(item.values)
          .enter()
          .append('rect')
          .attr('class','bars')
          .merge(d3.select('svg.'+item.key.replace(/\s+/g, '')).selectAll('rect.bars'))
          .attr('fill','#206095')
          .attr('x', function(d){return x(d.date)})
          .attr('width',x.bandwidth())
          .transition(t)
          .attr('y',function(d){return d3.min([y(0),y(+d.chiffre)])})
          .attr('height',function(d){return Math.abs(y(+d.chiffre)-y(0))})

        });



      }


      //code for clicking on buttons to switch the dataset
      d3.selectAll("input[name='button']")
        .on('click', function() {
          var foo = this.value

          drawChart(graphic_data.filter(function(d) {
            return d.group == foo
          }))
        })


      //code for keyboard control buttons
      d3.selectAll(".form-group-fullwidth")
        .on('keydown', function(e) {
          if (d3.event.keyCode === 13 || d3.event.keyCode === 32) {
            d3.select(this).select("input").attr("aria-checked", "true").property("checked", true);
            var foo = d3.select(this).select("input").node().value
            drawChart(graphic_data.filter(function(d) {
              return d.group == foo
            }))
          }
        })

      //create link to source
      d3.select(".footer").append("h5")
        .text("Source: " + dvc.essential.sourceText)

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config;

        d3.queue()
          .defer(d3.csv, dvc.essential.graphic_data_url)
          .await(function(error, data) {
            //load chart data
            graphic_data = data

            graphic_data.forEach(function(d) {
              d.date = d3.timeParse(dvc.essential.dateFormat)(d.date)
            })

            //use pym to create iframed chart dependent on specified variables
            pymChild = new pym.Child({
              renderCallback: drawGraphic
            });

          });
      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
  </script>

</html>
