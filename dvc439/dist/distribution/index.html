				   d3.select("#g" + i)

					.attr("width", x.rangeBand())

					.attr("height", function(d) { return y(lines["yr1996"][i].amt) - y(lines2["yr1996"][i].amt); })

			  }
			  
			  //create lines
			path1 = svg.append('g')
			        .append('path')
			            .attr('class', 'line')
						.attr('id', 'outline')

						.style("opacity",0);	
				
			path2 = svg.append('g')
			        .append('path')

						.attr('id', 'outline2')
			            .attr('d', linefunction(lines2["yr1996"]))

			//create timelabel
			svg.append("text")
				.attr("id","timecounter")

				//create lines

//			            .attr('d', linefunction(lines["yr"+dvc.timeArray[dvc.timeIndex]]));			
			
			if(dvc.timeIndex==0){
					d3.select('#NMWline').attr('opacity', 0)

			//x axis label
			d3.select('svg').select("g").append("text")

			d3.select('#graphic').select("g").append("text")

						// Add full-time / part-time labels
			
			d3.select('#graphic').select("g").append("text")

			for (var i = 0; i < d3.selectAll(".emplabels")[0].length; i++) {

		function backStepBtn(){
				dvc.timeIndex--;
				updateChart();

		}
		
		function forwardStepBtn(){
				dvc.timeIndex++;
				updateChart();	
		}
		
	function annotationCreation(){
		
			d3.selectAll("#backgroundrect").remove();
			//create line breaks for annotation
			var insertLinebreaks = function () {
				
			var el1 = this.firstChild;
			var el = el1.data;
		
			var words = el.split('  ');
				
			d3.select(this).text('');
		
				for (var i = 0; i < words.length; i++) {
					var tspan = d3.select(this).append('tspan').attr("id","tspan0").text(words[i]);
					if (i > 0)
						tspan.attr("id","tspan" + i).attr('x', x(dvc.essential.annoX[dvc.timeIndex])).attr('dy', '18');
				}
				
				for (var i = 0; i < d3.selectAll("tspan")[0].length; i++) {
				
				
					var tspanwidth = d3.select("#tspan" + i).node().getComputedTextLength();
					
					var yheight = d3.select("#annotext").attr("y");
					
					var padding = 2;
					
					d3.select('#graphic').select("g")
						.insert("rect","#annotext")
						.attr("id","backgroundrect")
						.attr("x", x(dvc.essential.annoX[dvc.timeIndex]) - padding)
						.attr("y", /*+yheight*/ + y(dvc.essential.annoY[dvc.timeIndex]) +12 - 18 + (i * 18) - padding)
						.attr("width", tspanwidth + (padding*2))
						.attr("height", 18 + (padding*2))
						.style("fill", "rgba(255,255,255,0.9)");		
				}
			};
				
			if (graphic.width() > threshold_sm) {
				
				d3.select('#graphic').select("g").append("text")
					.attr("id","annotext")
					.text(dvc.essential.fact[dvc.timeIndex])
					.attr("class","fact")
					.attr("text-anchor", dvc.essential.annoAlign[dvc.timeIndex])
					.attr('y',y(dvc.essential.annoY[dvc.timeIndex])+10)
					.attr('x',x(dvc.essential.annoX[dvc.timeIndex]));
				
				d3.selectAll(".fact").each(insertLinebreaks);
			} else {
				d3.select("#keypoints").append("p").text(dvc.essential.fact[dvc.timeIndex]);
			}
	}//end of annotationCreation
	
	
	//controls creation

					.attr("class", "col-xs-12 col-sm-2")
					.attr("id","btnDiv");

					.attr("class", "btn btn_z btn-default btn-xs col-xs-4 visible-xs")
					.attr("id", "backStepBtn");

			span1.append("span")
				.attr("class","glyphicon glyphicon-step-backward");
				
			span1.append("text").text(" back a year");
				
			span2 = group.append("button")
					.attr("type","button")
					.attr("class", "btn btn_z btn-default btn-xs col-xs-4 visible-xs")
					.attr("id", "forwardStepBtn");
			
			span2.append("span")
					.attr("class","glyphicon glyphicon-step-forward");
					
			span2.append("text").text(" forward a year");
			
			span2 = group.append("button")
					.attr("type","button")
					.attr("class", "btn btn_z btn-default col-sm-12 col-xs-4 btn-xs")
					.attr("id", "playPauseBtn");
							
			span2.append("span")
					.attr("class","glyphicon glyphicon-play");

			span2.append("text").text(" play");


			
			
			$("#backStepBtn").click(backStepBtn);
			$("#forwardStepBtn").click(forwardStepBtn);
			$("#playPauseBtn").click(PlayPauseBtn);
						
			d3.select("#controls").append("div")
					.attr("class", "sliderInc hidden-xs col-sm-10")
					.append("div")

					min: 0,
					max: 21,
					value: dvc.timeIndex,
					step: 1,
					tickLabels: {
					  0: "1996",
					  1: "'97",

					  3: "'99",
					  4: "2000",
					  5: "'01",
					  6: "'02",

					  8: "'04",

					  10: "'06",

					  12: "'08",
					  13: "'09",
					  14: "'10",
					  15: "'11",
					  16: "'12",

					  18: "'14",

		function PlayPauseBtn (){
			if (dvc.bAnimate==true){
				dvc.bAnimate=false;	
				dvc.play=false;	
				
				d3.select("#playPauseBtn")
					.select("span")
					.attr("class", "glyphicon glyphicon-play")
					
				d3.select("#playPauseBtn")
					.select("text")
					.text(" play")
					
				$('#backStepBtn').prop('disabled', false);
				$('#forwardStepBtn').prop('disabled', false);	
				
				clearInterval(dvc.theInterval);
				
				
							
			} else {
				dvc.bAnimate=true;
				dvc.play=true;	
					
				d3.select("#playPauseBtn")
					.select("span")
					.attr("class", "glyphicon glyphicon-pause")
				
				d3.select("#playPauseBtn")
					.select("text")
					.text("pause")
			}	

			playPauseAnimation()

		};

		

		function playPauseAnimation(){
			if (dvc.play==true) {	
				$('#backStepBtn').prop('disabled', true);
				$('#forwardStepBtn').prop('disabled', true);	
				
				if(dvc.timeIndex==0){
					   var totalLength = path1.node().getTotalLength();
					   
					   path1.style("opacity",1);
					   path2.style("opacity",1);

					   path1.attr("stroke-dasharray", totalLength + " " + totalLength)
						  .attr("stroke-dashoffset", totalLength)
						  .transition()
						  .duration(2000)
