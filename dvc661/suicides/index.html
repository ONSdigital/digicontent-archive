            var linearGradient = defs.append("linearGradient")

            linearGradient

                .attr("y1", "0%")
                .attr("x2", "0%")
                .attr("y2", "110%");

							.attr("font-size","12px")
							.attr("fill",function(d,i) {return dvc.essential.lineColours[i] })
							.attr("class",function(d,i){return "leftlabel leftlabel-" + i})

								.attr('y1',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][1]))
								.attr('y2',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][1]));
					})
			}




			writeAnnotation();


			function writeAnnotation(){

				if (parseInt(graphic.style("width")) < threshold_sm) {

						dvc.essential.annotationBullet.forEach(function(d,i) {

							d3.select("#keypoints").append("svg")
								.attr("width","20px")
								.attr("height","20px")
								.attr("class","circles")
								.append("circle")
								.attr("class", "annocirc" + (i))
								.attr("r", "2")
								.attr('cy',"12px")
								.attr("cx", "10px");

							d3.select("#keypoints").append("p").text(dvc.essential.annotationBullet[i]);

						})// end foreach
				}
				else {

						dvc.essential.annotationChart.forEach(function(d,i) {

							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","allannotext annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',y(dvc.essential.annotationXY[i][0]))
								.attr('x',x(dvc.essential.annotationXY[i][1]));

							d3.selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								.each(createBackRect);


							function insertLinebreaks() {

								var str = this;

								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;

								var words = el1.split('  ');

								d3.select(this/*str*/).text('');

								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(dvc.essential.annotationXY[i][1])).attr('dy', '18');
								}
							};

							function createBackRect() {

							var BBox = this.getBBox()

									svg.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("class","bbox")
										.attr("fill", "white")
										.attr("opacity", 0.6);

							}; // end function createBackRect()
							
						d3.select(".annotext4").style("fill","#0075A3").style("font-weight",700)

						});	// end foreach

				} // end else ...

				return;

			}// end function writeAnnotation()

			for (j = 0; j < endZone; j++) {

					translateBy = [j] * dvc.essential.nudgeBy -10; //translateBy + dvc.essential.nudgeBy; // each i we add another nudgeBy to step the next line down a bit more than the last

				}

	 createLegend();


function createLegend(){

							var prevX= 0;
							var prevY= 0;
							lineNo = 0;
							var lineNoOld = 0;

						dvc.essential.legendLabels.forEach(function(d,i) {

							// draw legend text based on content of var legendLabels ...
							var_group= d3.select("#legend").append("g")

							var_group.append("rect")
								.attr("class","rect" + i)
								.attr("fill", dvc.essential.colour_palette[i])
								.attr("x", 0)
								.attr("y", 0)
								.attr("width", function(d){
									if(dvc.essential.legendStyle=="rect"){
										return 15;
									} else {
										return 20;
									}
								})
								.attr("height", function(d){
									if(dvc.essential.legendStyle=="rect"){
										return 15;
									} else {
										return 3;
									}
								})

							var_group.append("text")
								.text(dvc.essential.legendLabels[i])
								.attr("class","legend" + i)
								.attr("text-anchor", "start")
								.style("font-size", "12px")
								.style("fill", "#666")
								.attr('y',15)
								.attr('x',0);



							d3.selectAll(".legend" + (i))
								.each(calcPosition);



							function calcPosition() {


							var BBox = this.getBBox()


							//prevY =BBox.width

								d3.select(".legend" + (i))
										.attr("y",function(d){
													if((prevX+BBox.width +50)>parseInt(graphic.style("width")) ){
														lineNoOld = lineNo;
														lineNo=lineNo + 1;
														prevX = 0;
													}
												return eval((lineNo*20) + 20);
										})
										.attr("x",function(d){ return prevX+25;})


								d3.select(".rect" + (i))
										.attr("y",function(d){

												if((prevX+BBox.width +50)>parseInt(graphic.style("width")) ){
													lineNoOld = lineNo;
													lineNo=lineNo + 1;
													prevX = 0;
												}

												if(dvc.essential.legendStyle=="rect"){
													return eval((lineNo*20)+5);
												} else {
													return eval((lineNo*20)+12);

												}
										})
										.attr("x",function(d){ return prevX; })

								prevX = prevX + BBox.width +50

								//d3.select("#chartarea").attr("transform", "translate(" + margin.left + "," +( margin.top + eval((lineNo+1)*margin.top))+ ")")

							}; // end function calcPosition()
						});	// end foreach
			}// end function createLegend()

			svg.append("text")
				 .attr('class', 'unit')
				 .attr('transform',"translate(" + -margin.left + "," + eval(-margin.top + (lineNo+1)*20 -10) + ")")
				 .attr("font-size","12px")
				 .attr("fill","#666")
				 .text(function(d,i) { return dvc.essential.yAxisLabel});


			if (dvc.optional.vertical_line == true){
					dvc.optional.annotateLineX1_Y1_X2_Y2.forEach(function(d,i) {

				svg.append("line")	.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][0])))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][0])))
				.style('stroke', '#ccc')
				.style('stroke-width', 2)
    				//.style('stroke-dasharray', '5 5') 						.attr('y1',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][1]))
.attr('y2',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][1]));
		})
}


			d3.selectAll(".x.axis").selectAll("text").attr("display",function(d,i){
				if(i==0|i==11|i==21|i==31|i==41|i==51|i==61|i==71|i==81){return "block"} else {return "none"};
        //if(i==0|i==6|i==11|i==16|i==21|i==26|i==31|i==36|i==41|i==46|i==51|i==56|i==61|i==66|i==71|i==76|i==81){return "block"} else {return "none"};
			})

			//create link to source
			d3.select(".footer").append("p")
				.text("Source: Office for National Statistics")
				.style("font-size","16px")
				.style("font-weight","700")
				.style("color","#323132")

			//use pym to calculate chart dimensions
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		}

		//check whether browser can cope with svg
		if (Modernizr.svg) {
		   //load config
			d3.json("config.json", function(error, config) {
			dvc=config

				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;

					graphic_data.forEach(function(d) {
						//d.date = d3.time.format(dvc.essential.dateFormat).parse(d.date);
						//if(d.combo != "null") {d.combo =parseFloat(d.combo)} else {d.combo=null};
						//if(d.diphtheria != "null") {d.diphtheria = parseFloat(d.diphtheria)} else {d.diphtheria=null};

					});

					//use pym to create iframed chart dependent on specified variables
					pymChild = new pym.Child({ renderCallback: drawGraphic});
				});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
    </script>
