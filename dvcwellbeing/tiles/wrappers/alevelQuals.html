<!DOCTYPE html>
<html lang="en">

<head>
  <title>Measures of National Wellbeing</title>

  <meta name="description" content="noindex">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="googlebot" content="indexifembedded" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

  <link rel="stylesheet" href="../../lib/globalStyle.css" />
  <link rel="stylesheet" href="wrapperstyle.css" />

</head>

<body>

  <hr class="topline">

  <section id="overview" tabindex="-1">
    <div aria-live="assertive" id="tileshere" tabindex="-1"></div>
    <div id="small" tabindex="-1"></div>
  </section>



  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
  <script src="../../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>

  <script>


    //variables to update 
    chart = ["alevelQuals"] //change these to put in alternate tiles


    var pymChild = null;
    pymChild = new pym.Child();
    pym.Child({ renderCallback: drawgraphic })

    function drawgraphic() {
      //read in l1 data and draw on load
      d3.csv("../datatext.csv", function (error, data) {
        graphic_data_l1 = data;
        drawl1(graphic_data_l1);
      });

      function drawl1(graphic_data_l1) {
        d3.select("#tileshere")
          .selectAll("*")
          .remove();

        //draw tiles


        populate1(graphic_data_l1.filter(function (d) { return chart.includes(d.measure) }));
      }



      function populate1(datafortiles) {

        datafortiles.sort((a, b) => chart.indexOf(a.measure) - chart.indexOf(b.measure))//this makes sure that the titles etc. match up to the right chart

        datafortiles.forEach(function (d, i) {

          //add top div
          d3.select("#tileshere")
            .append("div")
            .attr("aria-hidden", "true")
            .attr("id", "top")

          //add div second layer
          d3.select("#top")
            .append("div")
            .attr("aria-hidden", "true")
            .attr("id", "secondLayer")
            .attr("class", "layer layer" + i)

          //add div third layer
          d3.select("#top")
            .append("div")
            .attr("aria-hidden", "true")
            .attr("id", "thirdLayer")

          //add div for text elements
          d3.select(".layer" + i)
            .append("div")
            .attr("id", "tile")
            .attr("class", "tile tile" + i)

          //add container for measures and arrows
          d3.select(".tile" + i)
            .append("div")
            .attr("class", "containerTop containerTop" + i)

          //add measures
          d3.select(".containerTop" + i)
            .append("div")
            .attr("class", "BgColour")
            .append("div")
            .attr("class", "measure " + d.topic)
            .text(d.measuretitle)

          //add change arrow
          d3.select(".containerTop" + i)
            .append("div")
            .attr("class", "change item")
            .html(`</div> <div class="percent"> ${d.percent}pp </div> <div class="arrow"> <img src = "../../images/${d.change}.svg"> </div> `)//change arrow file names need to match the values in the csv

          //add improvement
          d3.select(".change")
            .append("div")
            .attr("class", "outlook " + d.outlook)
            .text(d.outlook)

          //add since
          d3.select(".tile" + i)
            .append("div")
            .attr("class", "since-line")

          d3.select(".since-line")
            .append("div")
            .attr("class", "since")
            .html(` <div class="since">Since ${d.since} </div> `)//change arrow file names need to match the values in the csv

          //add titles
          d3.select(".tile" + i)
            .append("div")
            .attr("class", "title item")
            .text(d.title)


          //create commentary 
          d3.select(".tile" + i)
            .append("div")
            .attr("class", "commentary item")
            .text(d.commstext)

          //create source text
          d3.select(".tile" + i)
            .append("div")
            .attr("class", "source item")
            .text("Source: " + d.sourcetext)

          //add second div
          d3.select(".layer" + i)
            .append("div")
            .attr("aria-hidden", "true")
            .attr("id", "chart")
            .attr("class", "chart chart" + i)


          //create divs for charts

          d3.select(".chart" + i)
            .append("div")
            .attr("class", "graphic")
            .attr("id", "l1chartdiv" + i)

          d3.select(".topline")
            .attr("class", "topline " + d.topic)





          var pymParent = new pym.Parent("l1chartdiv" + i, "../charts/" + chart[i] + "/index.html", { title: "Chart - " + d.title });


          //create source for mobile text
          d3.select("#thirdLayer")
            .append("div")
            .attr("class", "source2 item")
            .text("Source: " + d.sourcetext)


        }
        )

        //turn this on if you want clickable tiles
        // onClicks();
      };

      //and this for clickables - just update the link 
      //   function onClicks(){ //function for hashing
      // d3.select(".tile0")
      //   .style("cursor", "pointer")
      //   .style("cursor", "hand")
      //   .on("click", function () { window.open('https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/conditionsanddiseases/articles/coronaviruscovid19latestinsights/infections', '_blank'); })

      // }

      pymChild.sendHeight();

      setTimeout(function () {
        pymChild.sendHeight();
      }, 3000);

      setInterval(function () {
        pymChild.sendHeight();
      }, 1000);
    }


  </script>

</html>
