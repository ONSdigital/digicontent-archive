<!DOCTYPE html>
<html lang="en">

<head>
	<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
	<title>Bar chart</title>
	<meta name="description" content="">
	<meta name="robots" content="noindex" />
	<meta name="googlebot" content="indexifembedded" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />

	<link rel="stylesheet" href="../../../lib/globalStyle.css" />
	<link rel="stylesheet" href="../tiles_style.css" />

</head>

<body>

	<div class="visuallyhidden">
		<h5 id="screenreadertext">The chart canvas is hidden from screen readers. The main message is summarised by the
			chart title and the data behind the
			chart is available to download below.</h5>
	</div>
	<div id="graphic" aria-hidden="true">
	</div>

	<div id="keypoints" aria-hidden="true">
		<p></p>
	</div>

	<script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
	<script src="../../../lib/modernizr.svg.min.js"></script>
	<script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
	<script src="config.js"></script>

	<script>

		var graphic = d3.select('#graphic');
		var keypoints = d3.select('#keypoints');
		var footer = d3.select(".footer");
		var pymChild = null;
		var thismeasure = "belongNeigh";
		var cat = thismeasure + "_cat";
		var val = thismeasure + "_val";

		function beforedrawgraphic(width) {
			d3.csv("../../datatext.csv", function (error, data) {
				textdata = data.filter(function (d) { return d.measure == thismeasure });
				drawGraphic(width, textdata);
			});
		}

		function drawGraphic(width, textdata) {
			var threshold_md = 400;
			var threshold_sm = dvc.optional.mobileBreakpoint;

			//set variables for chart dimensions dependent on width of #graphic
			if (parseInt(graphic.style("width")) < threshold_sm) {
				var margin = {
					top: dvc.optional.margin_sm[0],
					right: dvc.optional.margin_sm[1],
					bottom: dvc.optional.margin_sm[2],
					left: dvc.optional.margin_sm[3]
				};
				var size = 0;	// used for margin_centre and x_ticks
				var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
				var height = 125 - (margin.top + margin.bottom);
			}

			else if (parseInt(graphic.style("width")) < threshold_md) {
				var margin = {
					top: dvc.optional.margin_md[0],
					right: dvc.optional.margin_md[1],
					bottom: dvc.optional.margin_md[2],
					left: dvc.optional.margin_md[3]
				};
				var size = 1;
				var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
				var height = 125 - (margin.top + margin.bottom);
			}

			else {
				var margin = {
					top: dvc.optional.margin_lg[0],
					right: dvc.optional.margin_lg[1],
					bottom: dvc.optional.margin_lg[2],
					left: dvc.optional.margin_lg[3]
				};
				var size = 2;
				var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
				var height = 125 - (margin.top + margin.bottom);
			}

			height = 110;

			// clear out existing graphics
			graphic.selectAll("*").remove();
			keypoints.selectAll("*").remove();
			footer.selectAll("*").remove();

			if (dvc.essential.screenreadertext != "") {
				d3.select("#screenreadertext")
					.text(dvc.essential.screenreadertext)
			}

			var x = d3.scaleBand()
				.rangeRound([0, chart_width])
				.paddingInner(0.1);


			var y = d3.scaleLinear()
				.range([height, 0]);

			x.domain(graphic_data.map(function (d) { return d[legendLabels[0]]; }));

			var xAxis = d3.axisBottom(x)
				.tickFormat(function (d, i) {
					//specify date format for x axis depending on #graphic width
					if (parseInt(graphic.style("width")) <= threshold_sm) {
						return i % 1 ? "" : + d;
					} else if (parseInt(graphic.style("width")) <= threshold_md) {
						return i % 1 ? "" : d;
					} else {
						return i % 1 ? "" : + d;
					}
				})

			var yAxis = d3.axisLeft(y);

			//specify number or ticks on y axis
			if (parseInt(graphic.style("width")) <= threshold_sm) {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
			} else if (parseInt(graphic.style("width")) <= threshold_md) {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
			} else {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
			}

			//gridlines
			var y_axis_grid = function () { return yAxis; }

			// parse data into columns
			var bars = {};

			for (var column in graphic_data[0]) {
				legendLabels.push(column);
				if (column == legendLabels[0]) continue;
				bars[column] = graphic_data.map(function (d) {
					return {
						'date': d[legendLabels[0]],
						'amt': d[column]
					};
				});
			}


			//    var startDate = new Date(bars["growth"][0].date);
			// var endDate = new Date(bars["growth"][bars["growth"].length-1].date);
			// var everyDate = d3.time.day.range(startDate, endDate);
			// var barWidth = chart_width/((everyDate
			// 	.length/365))-1;


			//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually

			var yDomain = [textdata[0].yaxisstart, textdata[0].yaxisend];


			y.domain(yDomain);



			//create svg for chart
			var svg = d3.select('#graphic').append('svg')
				.attr("id", "chart")
				.style("background-color", "#fff")
				.attr("width", chart_width + margin.left + margin.right)
				.attr("height", height + margin.top + margin.bottom + 30)
				.append("g")
				.attr("transform", "translate(" + margin.left + "," + margin.top + ")");

			svg.append('g')
				.attr('class', 'y axis')
				.call(yAxis.tickSize(-chart_width, 0))

			svg.append("text")
				.text(textdata[0].headingtext)
				.style("font-size", "14px")
				.call(wrap, 250, 0, 1.3)
				.attr("transform", "translate(-23,-48)")

			svg.append("text")
				.text("Updated: " + textdata[0].update)
				.style("font-size", "14px")
				.style("fill", "#414042")
				.attr("transform", "translate(-23,158)")


			//create x axis, if y axis doesn't start at 0 drop x axis accordingly
			svg.append('g')
				.attr('class', 'x axis')
				.attr('transform', function (d) {
					if (yDomain[0] != 0) {
						return 'translate(0,' + (height + 30) + ')'
					} else {
						return 'translate(0,' + height + ')'
					}
				})
				.call(xAxis);



			//create icon to symbolise break in y axis if required
			if (yDomain[0] > 0 && dvc.essential.yAxisBreak == true) {
				var paths = svg.append("defs")
					.append("g")
					.attr("id", "icon")
					.append("g");

				paths.append("polyline")
					.attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
					.attr("stroke", "#666")
					.attr("fill", "none")
				paths.append("polyline")
					.attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
					.attr("stroke", "#666")
					.attr("fill", "none");

				//specify position of icon
				svg.append("g").attr("id", "iconpath")
					.attr("transform", "translate(-10,3)")
					.append("use")
					.attr("xlink:href", "#icon")
					.attr("x", x(x.domain()[0]))
					.attr("y", function () {
						if (parseInt(graphic.style("width")) < threshold_sm) {
							return y(dvc.essential.yAxisBreak_sm_md_lg[0])
						} else if (parseInt(graphic.style("width")) < threshold_md) {
							return y(dvc.essential.yAxisBreak_sm_md_lg[1])
						} else {
							return y(dvc.essential.yAxisBreak_sm_md_lg[2])
						}
					});
			}

			svg.append('g').attr("class", "bars").selectAll('rect')
				.data(bars[legendLabels[1]])
				.enter()
				.append('rect')
				.attr("fill", function (d) { if (d.amt > 0) { return dvc.essential.colour_palette[0] } else { return dvc.essential.negative_colour } })
				.attr("width", x.bandwidth())
				.attr("x", function (d) { return x(d.date); })
				.attr("y", function (d) { return y(Math.max(0, d.amt)); })
				.attr("height", function (d) { return 0 + Math.abs(y(d.amt) - y(0)); });

			//create centre line if required
			if (dvc.optional.centre_line == true) {
				svg.append("line")
					.attr("id", "centreline")
					.attr('y1', y(dvc.optional.centre_line_value))
					.attr('y2', y(dvc.optional.centre_line_value))
					.attr('x1', 0)
					.attr('x2', chart_width);
			} else if (yDomain[0] < 0) {
				svg.append("line")
					.attr("id", "centreline")
					.attr('y1', y(0))
					.attr('y2', y(0))
					.attr('x1', 0)
					.attr('x2', chart_width);
			}

			// my nonsense

			// tick stuff

			d3.select("g.x.axis")
				.selectAll(".tick")
				.attr("class", function (d, i) { return "ticky ticky" + i })

			d3.selectAll(".ticky")
				.attr("display", "none")

			d3.select(".ticky0")
				.style("display", "block")
				.selectAll("text")
				.text(textdata[0].startdate)
				.attr("text-anchor", "middle")
				.style("color", "#707071");

			d3.select(".ticky" + (graphic_data.length - 1))
				.style("display", "block")
				.selectAll("text")
				.text(textdata[0].enddate)
				.attr("text-anchor", "middle")
				.style("color", "#707071");

			svg.append("text")
				.attr("x", chart_width + 5)
				.attr("y", y(graphic_data[graphic_data.length - 1][column]) + 6)
				.attr("text-anchor", "start")
				.text(d3.format(",.1f")(graphic_data[graphic_data.length - 1][column]) + "%")
				.style("font-weight", "bold")
				.style("fill", "#206095")
				.style("font-size", "15px")

			// grid gone 
			d3.select("g.y.axis")
				.selectAll(".tick")
				.selectAll("line")
				.style("display", "none");

			// end my nonsense

			writeAnnotation();

			function writeAnnotation() {

				if (parseInt(graphic.style("width")) < threshold_sm) {

					dvc.essential.annotationBullet.forEach(function (d, i) {

						d3.select("#keypoints").append("svg")
							.attr("width", "20px")
							.attr("height", "20px")
							.attr("class", "circles")
							.append("circle")
							.attr("class", "annocirc" + (i))
							.attr("r", "2")
							.attr('cy', "12px")
							.attr("cx", "10px");

						d3.select("#keypoints")
							.append("p")
							.style("font-size", "16px")
							.style("font-weight", 400)
							.text(dvc.essential.annotationBullet[i]);

					})// end foreach
				}
				else {

					dvc.essential.annotationChart.forEach(function (d, i) {

						// draw annotation text based on content of var annotationArray ...
						svg.append("text")
							.text(dvc.essential.annotationChart[i])
							.attr("class", "annotext" + i)
							.attr("text-anchor", dvc.essential.annotationAlign[i])
							.attr('y', y(dvc.essential.annotationXY[i][1]))
							.attr('x', x(dvc.essential.annotationXY[i][0]));

						d3.selectAll(".annotext" + (i))
							.attr('font-size', '13px')
							.attr("fill", "#666")
							.attr("font-size", "13px")
							.attr("font-weight", 500)
							.each(insertLinebreaks)
							.each(createBackRect);


						function insertLinebreaks() {

							var str = this;

							var el1 = dvc.essential.annotationChart[i];
							var el = el1.data;

							var words = el1.split('  ');

							d3.select(this/*str*/).text('');

							for (var j = 0; j < words.length; j++) {
								var tspan = d3.select(this).append('tspan').text(words[j]);
								if (j > 0)
									tspan.attr('x', x(dvc.essential.annotationXY[i][0])).attr('dy', '22');
							}
						};

						function createBackRect() {

							var BBox = this.getBBox()

							svg.insert("rect", ".annotext" + (i))
								.attr("width", BBox.width)
								.attr("height", BBox.height)
								.attr("x", BBox.x)
								.attr("y", BBox.y)
								.attr("fill", "white")
								.attr("opacity", 0.4);

						}; // end function createBackRect()


					});	// end foreach

				} // end else ...

				return;

			}// end function writeAnnotation()

			//wrap function 
			function wrap(
				text,
				width,
				dyAdjust,
				lineHeightEms,
				lineHeightSquishFactor,
				splitOnHyphen,
				centreVertically
			) {
				// Use default values for the last three parameters if values are not provided.
				if (!lineHeightEms) lineHeightEms = 1.05;
				if (!lineHeightSquishFactor) lineHeightSquishFactor = 1;
				if (splitOnHyphen == null) splitOnHyphen = true;
				if (centreVertically == null) centreVertically = true;

				text.each(function () {
					var text = d3.select(this),
						x = text.attr("x"),
						y = text.attr("y");

					if (x == null) x = 0;
					if (y == null) y = 0;

					var words = [];
					text
						.text()
						.split(/\s+/)
						.forEach(function (w) {
							if (splitOnHyphen) {
								var subWords = w.split("-");
								for (var i = 0; i < subWords.length - 1; i++)
									words.push(subWords[i] + "-");
								words.push(subWords[subWords.length - 1] + " ");
							} else {
								words.push(w + " ");
							}
						});

					text.text(null); // Empty the text element

					// `tspan` is the tspan element that is currently being added to
					var tspan = text.append("tspan");

					var line = ""; // The current value of the line
					var prevLine = ""; // The value of the line before the last word (or sub-word) was added
					var nWordsInLine = 0; // Number of words in the line
					for (var i = 0; i < words.length; i++) {
						var word = words[i];
						prevLine = line;
						line = line + word;
						++nWordsInLine;
						tspan.text(line.trim());
						if (tspan.node().getComputedTextLength() > width && nWordsInLine > 1) {
							// The tspan is too long, and it contains more than one word.
							// Remove the last word and add it to a new tspan.
							tspan.text(prevLine.trim());
							prevLine = "";
							line = word;
							nWordsInLine = 1;
							tspan = text.append("tspan").text(word.trim());
						}
					}

					var tspans = text.selectAll("tspan");

					var h = lineHeightEms;
					// Reduce the line height a bit if there are more than 2 lines.
					if (tspans.size() > 2)
						for (var i = 0; i < tspans.size(); i++) h *= lineHeightSquishFactor;

					tspans.each(function (d, i) {
						// Calculate the y offset (dy) for each tspan so that the vertical centre
						// of the tspans roughly aligns with the text element's y position.
						var dy = i * h + dyAdjust;
						if (centreVertically) dy -= ((tspans.size() - 1) * h) / 2;
						d3.select(this)
							.attr("y", y)
							.attr("x", x)
							.attr("dy", dy + "em");
					});
				});
			} //end wrap

			if (dvc.optional.vertical_line == true) {
				dvc.optional.annotateLineX1_Y1_X2_Y2.forEach(function (d, i) {
					svg.append("line")
						.attr('x1', x(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][0]))
						.attr('x2', x(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][0]))
						.style('stroke', '#888')
						.style('stroke-width', 2)
						.attr('y2', y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][1]));
				})
			}

			if (dvc.optional.annotateRect == true) {

				dvc.optional.annotateRectX_Y.forEach(function (d, i) {

					svg.append("rect")
						.attr('x', x(dvc.optional.annotateRectX_Y[i][0][0]))
						.attr('y', y(dvc.optional.annotateRectX_Y[i][0][1]))
						.attr('height', y(dvc.optional.annotateRectX_Y[i][1][1]) - y(dvc.optional.annotateRectX_Y[i][0][1]))
						.attr('width', x(dvc.optional.annotateRectX_Y[i][1][0]) - x(dvc.optional.annotateRectX_Y[i][0][0]))
						.style('fill', dvc.optional.rectStyle[i][0])
						.style('stroke-width', 2)
						.style('opacity', dvc.optional.rectStyle[i][1]);

				})
			}

			d3.select('#source')
				.text('Source: ' + dvc.essential.sourceText);

			lineNo = 0;

			svg.append("text")
				.attr('class', 'unit')
				.attr('transform', "translate(" + -margin.left + "," + eval(-margin.top + (lineNo + 1) * 20) + ")")
				.attr("font-size", "16px")
				.attr("fill", "#707071")
				.text(function (d, i) { return dvc.essential.yAxisLabel });




			d3.selectAll("path")
				.attr("fill", "none");

			d3.selectAll("text")
				.attr("font-family", "'Open Sans', sans-serif");

			d3.selectAll(".y text")
				.attr("font-size", "14px")
				.attr("fill", "#707071");

			d3.selectAll(".x text")
				.attr("font-size", "14px")
				.attr("fill", "#707071"); // dates - timelines

			//use pym to calculate chart dimensions
			if (pymChild) {
				pymChild.sendHeight();
			}
		}

		//check whether browser can cope with svg
		if (Modernizr.svg) {
			//load chart data
			d3.csv(dvc.essential.graphic_data_url, function (error, data) {
				graphic_data = data.filter(function (d) { return d[val] }).map(function (d) {
					d.num = d[cat]
					d.val = d[val]
					return [d.num, d.val]
				});

				legendLabels = d3.keys(graphic_data[0])

				//use pym to create iframed chart dependent on specified variables
				pymChild = new pym.Child({ renderCallback: beforedrawgraphic });
			});


		} else {
			//use pym to create iframe containing fallback image (which is set as default)
			pymChild = new pym.Child();
			if (pymChild) {
				pymChild.sendHeight();
			}
		}
	</script>
