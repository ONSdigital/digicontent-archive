<!DOCTYPE html>
<html lang="en">
	<head>
		<link
			href="https://fonts.googleapis.com/css?family=Open+Sans:400,700"
			rel="stylesheet"
			type="text/css"
		/>
		<title>Measures of National Well-being</title>

		<meta name="description" content="" />
		<meta name="robots" content="noindex" />
		<meta name="googlebot" content="indexifembedded" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta http-equiv="content-type" content="text/html; charset=utf-8" />

		<link rel="stylesheet" href="./lib/globalStyle.css" />
		<link rel="stylesheet" href="./filterCSS.css" />
		<link rel="stylesheet" href="./css/style-chosen.css" />
	</head>

	<body>
		<div class="filtercontainer">
			<h2>View by change</h2>
			<!-- 
		<input type="radio" id="all" name="categories" value="all" onclick="filterChange()" checked>
		<input type="radio" id="positive" name="categories" onclick="filterChange()" value="positive">
		<input type="radio" id="negative" name="categories" onclick="filterChange()" value="negative">
		<input type="radio" id="nochange" name="categories" onclick="filterChange()" value="nochange">
		<input type="radio" id="na" name="categories" onclick="filterChange()" value="na"> -->

			<ol class="filters">
				<li>
					<label for="all"
						>All (52)
						<input
							type="radio"
							id="all"
							name="categories"
							value="all"
							onclick="filterChange()"
							checked
						/>
					</label>
				</li>
				<li>
					<label for="positive"
						>Improved (8)
						<input
							type="radio"
							id="positive"
							name="categories"
							onclick="filterChange()"
							value="Improved"
						/>
					</label>
				</li>
				<li>
					<label for="negative"
						>Declined (6)
						<input
							type="radio"
							id="negative"
							name="categories"
							onclick="filterChange()"
							value="Declined"
						/>
					</label>
				</li>
				<li>
					<label for="nochange"
						>No change (24)
						<input
							type="radio"
							id="nochange"
							name="categories"
							onclick="filterChange()"
							value="Nochange"
						/>
					</label>
				</li>
				<li>
					<label for="na"
						>Not assessed (17)
						<input
							type="radio"
							id="na"
							name="categories"
							onclick="filterChange()"
							value="Changenotassessed"
						/>
					</label>
				</li>
			</ol>

			<h2>View by domain</h2>
			<div id="domain_dropdown" style="width: 350px; margin-bottom: 20px"></div>
			<div id="graphic" class="charts"></div>
		</div>
		<script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js"></script>
		<script
			src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"
			type="text/javascript"
		></script>
		<script src="./lib/modernizr.svg.min.js" type="text/javascript"></script>
		<script src="./lib/chosen.jquery.js"></script>
		<script
			src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"
			type="text/javascript"
		></script>

		<script>
			function keyup(e, that) {
				if (e == 'Enter' || e == 'Space') {
					d3.event.preventDefault();
					d3.select(that).select('input').property('checked', true);
					filterChange();
					console.log('Hello world');
				}
			}

			d3.selectAll('label').on('keyup', function () {
				keyup(d3.event.code, this);
			});

			var graphic = d3.select('#graphic');
			var pymChild = null;

	

	 function drawGraphic(width){
			graphic.selectAll("*").remove()

			//Friendly titles for headings and putting the domains in the right order
			var domains1 = [
				'all',
				'wellbeing',
				'relationships',
				'health',
				'do',
				'live',
				'finance',
				'economy',
				'skills',
				'governance',
				'environment'
			];
			var domains = [
				['all', 'All'],
				['wellbeing', 'Personal well-being'],
				['relationships', 'Our relationships'],
				['health', 'Health'],
				['do', 'What we do'],
				['live', 'Where we live'],
				['finance', 'Personal finance'],
				['economy', 'Economy'],
				['skills', 'Education and skills'],
				['governance', 'Governance'],
				['environment', 'Environment']
			];

			//Putting the tiles in the right order - N.B. needs to be updated manually each time a new tile is added or one taken away
			var order = [
				'lifeSat',
				'worthwhile',
				'happiness',
				'anxious',
				'satisRship',
				'relyOn',
				'loneliness',
				'commInt',
				'trustOthers',
				'lifeExpect',
				'satisHealth',
				'physicalHealth',
				'depressionAnxiety',
				'satisHealthcare',
				'satisJob',
				'unpaidWork',
				'volunteering',
				'artsCulture',
				'sportsPart',
				'nature',
				'satisAccomm',
				'belongNeigh',
				'digitalEx',
				'crime',
				'feelingSafe',
				'hholdIncome',
				'hholdWealth',
				'lowIncome',
				'incomeInequal',
				'genderPaygap',
				'diffFinance',
				'neet',
				'noQuals',
				'alevelQuals',
				'humanCapital',
				'satisEducation',
				'unemployInac',
				'inflation',
				'publicsecDebt',
				'voterTurnout',
				'trustGov',
				'voice',
				'satisPolice',
				'satisCourts',
				'greenhouseGas',
				'renewableEnergy',
				'hholdRecycling',
				'protectedArea',
				'biodiversity',
				'airPoll',
				'waterPoll',
				'envLifestyle'
			];

			//The text bit that goes at the top of each topic area
			var domainText = [
				'Personal well-being is the most direct representation of how people are doing. Measures in this domain cover people’s opinions on aspects of their current well-being.',
				"People's relationships can affect their well-being outcomes, including quality of life and happiness. Measures in this domain cover the presence and quality of relationships people may have with family, friends, and the community around them.",
				'Physical and mental health are important parts of people’s personal well-being. Measures in this domain cover both objective and subjective measures of health. They also cover satisfaction with the healthcare system to capture how the nation’s health is supported.',
				'Participation in, satisfaction with, and balance between work and leisure activities represent people’s lifestyle choices. Measures in this domain cover subjective and objective measures related to work, leisure and volunteering.',
				'Where people live, the quality of their local area and their community, and how they feel about it can affect personal well-being. Measures in this domain cover housing, the local environment, access to facilities, and being part of a cohesive community.',
				'How households and individuals are managing financially influences many aspects of their lives. Measures in this domain cover household income and wealth, poverty and financial inequalities, and people’s opinions about their own financial situations.',
				'Education and skills can determine individuals’ socioeconomic outcomes. Measures in this domain cover human capital, as well as qualifications and skills. They also cover satisfaction with the education system to capture how people’s education is supported.',
				'The economy affects the financial welfare of individuals, communities and the UK as a whole. Measures in this domain cover economic activity in the UK. They also cover consumer confidence to capture people’s perceptions of the country’s economic situation.',
				'Good governance contributes to better social and economic outcomes. Measures in this domain cover public trust and civic participation. They also cover satisfaction with the police and justice system to capture how public administration is supported.',
				'The natural environment is relevant to people’s quality of life because it makes human life and activity possible. Measures in this domain cover aspects of climate change, the UK’s natural environment and natural capital, and the effects of human activity on the environment.'
			];

			function createDropdown() {
				$('#domain_dropdown').empty();

				d3.select('#domain_dropdown')
					.insert('label')
					.attr('class', 'visuallyhidden')
					.attr('for', 'dropdown_child')
					.html('Inactive dropdown element, replaced by custom dropdown');

				var opts = d3
					.select('#domain_dropdown')
					.append('select')
					.attr('class', 'chosen-select')
					.attr('id', 'dropdown_child')
					.attr('style', 'width:370px');

				opts
					.selectAll('p')
					.data(domains)
					.enter()
					.append('option')
					.attr('domain_filter', function (d, i) {
						return domains[i][0];
					})
					.text(function (d, i) {
						return domains[i][1];
					});
				$('#dropdown_child').chosen({
					'disable_search': true,
					placeholder_text_single: 'All'
				});

				d3.select('input.chosen-search-input').attr('id', 'chosensearchinput');
				d3.select('div.chosen-search')
					.insert('label', 'input.chosen-search-input')
					.attr('class', 'visuallyhidden')
					.attr('for', 'chosensearchinput');
				// .html("Select a variable")

				$('#dropdown_child').on('change', function (evt, params) {
					d3.select('#selected_var').text(
						$('#dropdown_child option:selected').val()
					);

					setDomain();
				});
			}

			function setDomain() {
				var domain_select = document.querySelector('#dropdown_child');

				// console.log(domain_select)

				var domain_filter_code =
					domain_select.options[domain_select.selectedIndex].getAttribute(
						'domain_filter'
					);

				// console.log(domain_filter_code + "-" + displayRadioValue())

				d3.selectAll('.topic').style('display', 'none');

				d3.selectAll('.' + domain_filter_code + '-head').style(
					'display',
					'block'
				);

				//This works because of the order of the classes - I think
				d3.selectAll(
					'.' + domain_filter_code + 'domain' + '.' + displayRadioValue()
				).style('display', 'block');
			}


				// graphic_data.sort((a, b) => domains1.indexOf(a.topic) - domains1.indexOf(b.topic))//this makes sure that the titles etc. match up to the right chart
				graphic_data.sort(
					(a, b) => order.indexOf(a.measure) - order.indexOf(b.measure)
				); //this makes sure that the tiles are in the right order

				console.log(
					'Improved:',
					graphic_data.filter((d) => d.outlook == 'Improved').length +
						graphic_data.filter((d) => d.outlook2 == 'Improved').length
				);
				console.log(
					'Declined:',
					graphic_data.filter((d) => d.outlook == 'Declined').length +
						graphic_data.filter((d) => d.outlook2 == 'Declined').length
				);
				console.log(
					'No change:',
					graphic_data.filter((d) => d.outlook == 'No change').length +
						graphic_data.filter((d) => d.outlook2 == 'No change').length
				);
				console.log(
					'Not assessed:',
					graphic_data.filter((d) => d.outlook == 'Change not assessed')
						.length +
						graphic_data.filter((d) => d.outlook2 == 'Change not assessed')
							.length
				);
				console.log('All:', graphic_data.filter((d) => d.outlook).length);

				domainsUnique = [...new Set(graphic_data.map((d) => d.topic))];

				for (j = 0; j < domainsUnique.length; j++) {
					//filtering the data by topic areas
					domainData = graphic_data.filter((e) => e.topic == domainsUnique[j]);

					//This is the header/divider bit between the different topic areas
					graphic
						.append('div')
						.attr('id', domainsUnique[j] + '-head')
						.attr(
							'class',
							'topic ' +
								domainsUnique[j] +
								'domain alldomain ' +
								domainsUnique[j] +
								'-head all-head'
						)
						.attr('tabindex', -1)
						.html(
							`<hr class="textboxUpperLine"> <div class="topTextbox"> <img alt="" src = "./icons/${
								domainsUnique[j]
							}.svg"> <div class="innerTextbox"> <t class="domainHeading">${
								domains[domains1.indexOf(domainsUnique[j])][1]
							}</t><p class="domainExplainerText">${
								domainText[j]
							}</p> </div> </div>`
						);

					d3.select('.textboxUpperLine').attr(
						'class',
						'topline ' + domainsUnique[j]
					);

					for (i = 0; i < domainData.length; i++) {
						//a div for each tile wrapper
						graphic
							.append('div')
							.attr(
								'id',
								domainData[i].topic +
									'-' +
									domainData[i].outlook.replace(/\s+/g, '') +
									'-' +
									i
							)
							// .attr("data-category", domainData[i].change)
							.attr(
								'class',
								'all alldomain thischart topic ' +
									domainsUnique[j] +
									'domain ' +
									domainData[i].outlook.replace(/\s+/g, '') +
									' ' +
									domainsUnique[j] +
									'domain ' +
									domainData[i].outlook2.replace(/\s+/g, '')
							)
							.attr('tabindex', -1);

						//adding each tile wrapper to the div
						var pymParent = new pym.Parent(
							domainData[i].topic +
								'-' +
								domainData[i].outlook.replace(/\s+/g, '') +
								'-' +
								i,
							'./tiles/wrappers/' + domainData[i].measure + '.html',
							{ title: 'Chart - ' + domainData[i].title }
						);

						document
							.querySelector('div#' + domainsUnique[j] + '-head')
							.classList.add(domainData[i].outlook.replace(/\s+/g, ''));

						//back to the top link for the end of each topic section
						if (i == domainData.length - 1) {
							d3.select('div#graphic')
								.append('div')
								.attr(
									'class',
									'all topic ' + domainsUnique[j] + 'domain alldomain'
								)
								.html(
									`<div class="backToTop"><a href=#top>🠕 Back to the top</a></div>`
								);
						}
					}
				}

				createDropdown();

				
				
			

			function displayRadioValue() {
				var ele = document.getElementsByTagName('input');
				for (i = 0; i < ele.length; i++) {
					if ((ele[i].type = 'radio')) {
						if (ele[i].checked) {
							// console.log(ele[i].value);
							return ele[i].value;
						}
					}
				}
			}

			//Filter buttons
			function filterChange() {
				var dropdownselection = document
					.querySelector('#dropdown_child')
					.options[
						document.querySelector('#dropdown_child').selectedIndex
					].getAttribute('domain_filter');

				d3.selectAll('.topic').style('display', 'none');

				d3.selectAll('.' + dropdownselection + '-head').style(
					'display',
					'block'
				);

				//This works because of the order of the classes - I think
				d3.selectAll(
					'.' + dropdownselection + 'domain' + '.' + displayRadioValue()
				).style('display', 'block');
			}


			if (pymChild) {
				pymChild.sendHeight();
			}
		};
		


			// Test code

			//load chart data
			d3.csv('./tiles/datatext.csv', function (error, data) {
				graphic_data = data;

				

				pymChild = new pym.Child({
					renderCallback: drawGraphic, polling: 500
		})
	
	});

		</script>
