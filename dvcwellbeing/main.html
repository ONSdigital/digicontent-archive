	<section id="overview" tabindex="-1">
		<div class="filtercontainer">
			<h2>View by change</h2>
			<ol class="filters">
				<li>
					<label for="all">All (57)
						<input type="radio" id="all" name="categories" value="all" onclick="filterChange()" checked>
					</label>
				</li>
				<li>
					<label for="positive">Improved (10)
						<input type="radio" id="positive" name="categories" onclick="filterChange()" value="Improved">
					</label>
				</li>
				<li>
					<label for="negative">Declined (2)
						<input type="radio" id="negative" name="categories" onclick="filterChange()" value="Declined">
					</label>
				</li>
				<li>
					<label for="nochange">No change (23)
						<input type="radio" id="nochange" name="categories" onclick="filterChange()" value="Nochange">
					</label>
				</li>
				<li>
					<label for="na">Not assessed (26)
						<input type="radio" id="na" name="categories" onclick="filterChange()"
							value="Changenotassessed">
					</label>
				</li>
			</ol>

			<h2>View by domain</h2>
			<div id="domain_dropdown" style="width:350px; margin-bottom: 20px;"></div>
			<div aria-live="assertive" id="tileshere" tabindex="-1"></div>
		</div>

		<div id="small" tabindex="-1"></div>
	</section>
