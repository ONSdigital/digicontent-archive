<!DOCTYPE html>
<html lang="en">

<head>
	<link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
	<title>Headline number</title>

	<meta name="description" content="">
	<meta name="robots" content="noindex" />
	<meta name="googlebot" content="indexifembedded" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport"
		content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />

	<link rel="stylesheet" href="../../lib/globalStyle.css" />
	<link rel="stylesheet" href="../../css/tiles_style.css" />

</head>

<body>

	<div id="graphic">
		<img src="fallback.png" alt="[Chart]" />


		<div></div>

		<script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
		<script src="../../lib/modernizr.svg.min.js" type="text/javascript"></script>
		<script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
		<!-- <script src="../../lib/d3v4jetpack.js" type="text/javascript"></script> -->
		<script src="../../lib/swoopy-drag-d3v4.js" type="text/javascript"></script>

		<script>
			var graphic = d3.select('#graphic');
			var keypoints = d3.select('#keypoints');
			var pymChild = null;
			var thismeasure = "satisCourts";

			function beforedrawgraphic(width) {
				d3.csv("../../datatext.csv", function (error, data) {
					textdata = data.filter(function (d) { return d.measure == thismeasure });
					drawGraphic(width, textdata);
				});
			}

			function drawGraphic(width, textdata) {
				var threshold_md = 400;
				var threshold_sm = dvc.optional.mobileBreakpoint;

				//set variables for chart dimensions dependent on width of #graphic
				if (parseInt(graphic.style("width")) < threshold_sm) {
					var margin = {
						top: dvc.optional.margin_sm[0],
						right: dvc.optional.margin_sm[1],
						bottom: dvc.optional.margin_sm[2],
						left: dvc.optional.margin_sm[3]
					};
					var size = 0;	// used for margin_centre and x_ticks
					var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
					var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
				}

				else if (parseInt(graphic.style("width")) < threshold_md) {
					var margin = {
						top: dvc.optional.margin_md[0],
						right: dvc.optional.margin_md[1],
						bottom: dvc.optional.margin_md[2],
						left: dvc.optional.margin_md[3]
					};
					var size = 1;
					var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
					var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
				}

				else {
					var margin = {
						top: dvc.optional.margin_lg[0],
						right: dvc.optional.margin_lg[1],
						bottom: dvc.optional.margin_lg[2],
						left: dvc.optional.margin_lg[3]
					};
					var size = 2;
					var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
					var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
				}

				height = 110;
				// clear out existing graphics
				graphic.selectAll("*").remove();
				keypoints.selectAll("*").remove();


				// parse data into columns
				var lines = {};
				for (var column in graphic_data[0]) {
					if (column == 'date') continue;
					lines[column] = graphic_data.map(function (d) {
						return {
							'date': d.date,
							'amt': d[column]
						};
					});
				}


				//create svg 
				var legend = d3.select('#graphic')
					.append('svg')
					.append("g")


				var svg = d3.select('svg')
					.attr("id", "chart")
					.attr("width", chart_width + margin.left + margin.right)
					.attr("height", height + margin.top + margin.bottom)  //+30)
					.append("g")
					.attr("transform", "translate(" + margin.left + "," + margin.top + ")");

				svg.append("text")
					.text(textdata[0].headingtext)
					.style("font-size", "14px")
					.call(wrap, 250, 0, 1.3)
					.attr("transform", "translate(-23,-43)")

					svg.append("text")
					.text(graphic_data[graphic_data.length - 1][thismeasure] + "%")
					.style("font-size", "68px")
					.style("fill", "#206095")
					.style("font-weight", "bold")
					.attr("transform", "translate(0,65)")

				svg.append("text")
					.text(graphic_data[graphic_data.length - 1][thismeasure + "-date"])
					.style("font-size", "28px")
					.style("fill", "#206095")
					.style("text-anchor", "middle")
					.attr("transform", "translate(100,113)")

				svg.append("text")
					.text("Updated: " + textdata[0].update)
					.style("font-size", "14px")
					.style("fill", "#414042")
					.attr("transform", "translate(-23,160)")




				//wrap function 
				function wrap(
					text,
					width,
					dyAdjust,
					lineHeightEms,
					lineHeightSquishFactor,
					splitOnHyphen,
					centreVertically
				) {
					// Use default values for the last three parameters if values are not provided.
					if (!lineHeightEms) lineHeightEms = 1.05;
					if (!lineHeightSquishFactor) lineHeightSquishFactor = 1;
					if (splitOnHyphen == null) splitOnHyphen = true;
					if (centreVertically == null) centreVertically = true;

					text.each(function () {
						var text = d3.select(this),
							x = text.attr("x"),
							y = text.attr("y");

						if (x == null) x = 0;
						if (y == null) y = 0;

						var words = [];
						text
							.text()
							.split(/\s+/)
							.forEach(function (w) {
								if (splitOnHyphen) {
									var subWords = w.split("-");
									for (var i = 0; i < subWords.length - 1; i++)
										words.push(subWords[i] + "-");
									words.push(subWords[subWords.length - 1] + " ");
								} else {
									words.push(w + " ");
								}
							});

						text.text(null); // Empty the text element

						// `tspan` is the tspan element that is currently being added to
						var tspan = text.append("tspan");

						var line = ""; // The current value of the line
						var prevLine = ""; // The value of the line before the last word (or sub-word) was added
						var nWordsInLine = 0; // Number of words in the line
						for (var i = 0; i < words.length; i++) {
							var word = words[i];
							prevLine = line;
							line = line + word;
							++nWordsInLine;
							tspan.text(line.trim());
							if (tspan.node().getComputedTextLength() > width && nWordsInLine > 1) {
								// The tspan is too long, and it contains more than one word.
								// Remove the last word and add it to a new tspan.
								tspan.text(prevLine.trim());
								prevLine = "";
								line = word;
								nWordsInLine = 1;
								tspan = text.append("tspan").text(word.trim());
							}
						}

						var tspans = text.selectAll("tspan");

						var h = lineHeightEms;
						// Reduce the line height a bit if there are more than 2 lines.
						if (tspans.size() > 2)
							for (var i = 0; i < tspans.size(); i++) h *= lineHeightSquishFactor;

						tspans.each(function (d, i) {
							// Calculate the y offset (dy) for each tspan so that the vertical centre
							// of the tspans roughly aligns with the text element's y position.
							var dy = i * h + dyAdjust;
							if (centreVertically) dy -= ((tspans.size() - 1) * h) / 2;
							d3.select(this)
								.attr("y", y)
								.attr("x", x)
								.attr("dy", dy + "em");
						});
					});
				} //end wrap



				// css fix

				d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");




				//use pym to calculate chart dimensions
				if (pymChild) {
					pymChild.sendHeight();

				}
			}  // ends draw graphic



			//check whether browser can cope with svg
			if (Modernizr.svg) {
				//load config
				d3.json("config.json", function (error, config) {
					dvc = config

					//load chart data
					d3.csv(dvc.essential.graphic_data_url, function (error, data) {
						graphic_data = data.filter(function (d) { return d[thismeasure] !== "" });

						graphic_data.forEach(function (d) {
							d.date = d3.timeParse(dvc.essential.dateFormat)(d.date);

						});

						//use pym to create iframed chart dependent on specified variables
						pymChild = new pym.Child({ renderCallback: beforedrawgraphic });
					});
				})

			} else {
				//use pym to create iframe containing fallback image (which is set as default)
				pymChild = new pym.Child();
				if (pymChild) {
					pymChild.sendHeight();
				}
			}
		</script>

</html>
