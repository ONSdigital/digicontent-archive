<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Visits to and distance from greenspace</title>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <meta name="description" content="Plot data in a scatter plot with Voronoi detection to find the nearest point">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <style>
        body {;
          max-width: 700px;
        }

        .visuallyhidden {
           position: absolute;
           width: 1px;
           height: 1px;
           margin: -1px;
           padding: 0;
           overflow: hidden;
           clip: rect(0, 0, 0, 0);
           border: 0;
         }


        body, tspan, label, text {
          font-family: 'Open Sans', sans-serif;
          font-size: 12px;

        }

        .axis path,
        .axis line {
          fill: none;
          stroke: #000;
          shape-rendering: crispEdges;
        }

        #graphic .grid .tick line {
            stroke: #eee;
            stroke-width: 1px;
            shape-rendering: crispEdges;
        }

        path.domain {
            stroke: #eee;
        }
        .y.axis path {
          display: none;
        }

        .overlay {
            fill: none;
            stroke: none;
            pointer-events: all;
        }

        .focusLine {
            fill: none;
            stroke: steelblue;
            stroke-width: 0.5px;
        }

        .focusCircle {
            fill: red;
        }

        .brush {
          width: 500;
        }

        .annotation-note-bg {
          fill: #EAEAEA !important;
          fill-opacity: 0.8 !important;
        }

        h6 {
           font-size: 16px;
           margin: 16px 0 8px 0;
           font-weight: 700;
           color:#323132;
        }

        .svg-container {
          display: inline-block;
        }

    </style>
</head>
<body>
<div id="graphic"><img src="fallback.png" alt="[Chart]" /></div>

<div id="keypoints">
    <p></p>
</div>
<div class="footer"> <div id="footer"></div></div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js" type="text/javascript"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.1.0/d3-annotation.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="../lib/jquery.js" type="text/javascript"></script>
  <script src="../lib/bootstrap.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>

  <script>

var pymChild = null;
var graphic = d3.select('#graphic');
var keypoints = d3.select('#keypoints');
var footer = d3.select("#footer");
var dvc = {};
var xpos;
var ypos;
var makeAnnotations;


function drawGraphic(){

  // initialise breakpoint for medium and small screens
  var threshold_md = 788;
  var threshold_sm = dvc.optional.mobileBreakpoint;

  //set variables for chart dimensions dependent on width of #graphic
  if (parseInt(graphic.style("width"))  < threshold_sm) {
      // set mobile size margins, height and width
      var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]};
      var aspectRatio = dvc.optional.aspectRatio_sm
      var totalColumns = 1
  } else if (parseInt(graphic.style("width"))  < threshold_md) {
      // set medium size margins, height and width
      var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]};
      var aspectRatio = dvc.optional.aspectRatio_md
      var totalColumns = dvc.essential.pickydata.length
  } else {
      // set large size margins, height and width
      var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
      var aspectRatio = dvc.optional.aspectRatio_lg
      var totalColumns = dvc.essential.pickydata.length
  } // end else ...

  var chart_width = parseInt(graphic.style("width") )/totalColumns - margin.left - margin.right;
  var height = Math.ceil((chart_width * aspectRatio[1]) / aspectRatio[0]);

  // clear out existing graphics
		graphic.selectAll("*").remove();
		keypoints.selectAll("*").remove();
		footer.selectAll("*").remove();

  // parse data into columns
  dots = {};

  // for each 'column' in data object
  for (var column in graphic_data[0]) {
    // dots object with content from graphic_data
    dots[column] = graphic_data.map(function(d,i) {
      // return object variables to use in code. This needs to be updated in accordance with field content of files
      return {
        'group' : d.group,
        'name' : d.name,
        'xdata' : +d[dvc.essential.pickxdata],
        'ydata' : +d[dvc.essential.pickydata]
      };

    });
  }


  // set up axes
  console.log(dots);
        if(dvc.essential.AxisScale == "auto_min_max"){
        var minX = d3.min(d3.entries(dots), function(c) {
          									return d3.min(c.value, function(v) {
          										var n = v.xdata;
          										return Math.floor(n);
          									});
          								})
        var maxX = d3.max(d3.entries(dots), function(c) {
          									return d3.max(c.value, function(v) {
          										var n = v.xdata;
          										return Math.ceil(n);
          									});
          								});
        var minY = d3.min(d3.entries(dots), function(c) {
          									return d3.min(c.value, function(v) {
          										var n = v.ydata;
          										return Math.floor(n);
          									});
          								})
        var maxY = d3.max(d3.entries(dots), function(c) {
          									return d3.max(c.value, function(v) {
          										var n = v.ydata;
          										return Math.ceil(n);
          									});
          								})
        }else{
          var minX = dvc.essential.xAxisScale[0];
          var maxX = dvc.essential.xAxisScale[1];
          var minY = dvc.essential.yAxisScale[0];
          var maxY = dvc.essential.yAxisScale[1];
        }



        var ratio =  height / chart_width;

         x = d3.scaleLinear()
                       .range([0, chart_width])
                       .domain([minX, maxX]);

         y = d3.scaleLinear()
                       .range([height, 0])
                       .domain([minY, maxY]);


        var line = d3.line()
           .x(function(d) { return x(d[0]); })
           .y(function(d) { return y(d[1]); });


        var xAxis = d3.axisBottom(x),
            yAxis = d3.axisLeft(y);

      //specify number or ticks on y axis
    	if (parseInt(graphic.style("width") ) <= threshold_sm) {
    		yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
    	 } else if (parseInt(graphic.style("width") ) <= threshold_md){
    		yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
    	 } else {
    		yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
    	 }

       //specify number or ticks on y axis
      if (parseInt(graphic.style("width") ) <= threshold_sm) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
       } else if (parseInt(graphic.style("width") ) <= threshold_md){
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
       } else {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
       }



  dvc.essential.pickydata.forEach( function(item, plotNum) {
    drawScatter(item,plotNum);
  });

    function drawScatter(yVar,plotNum) {
        var svgContainer = d3.select('#graphic').append("div")
          .classed("svg-container", true)
          .style('width', chart_width + margin.left + margin.right + "px");

        svgContainer.append("h2")
          .text(yVar);
        svgContainer.append("h3")
          .attr("id", "screenreadertext")
          .attr("class", "visuallyhidden")
          .text(dvc.essential.screenreadertext[plotNum]);
        svg = svgContainer.append('svg')
          .attr("aria-hidden", true)
          .attr('width', chart_width + margin.left + margin.right)
          .attr('height', height + margin.top + margin.bottom +50);

        var g = svg.append('g')
          .attr('transform', 'translate(' + margin.left + ', ' + margin.top + ')')
          .attr('overflow', 'hidden');


       g.append('g')
          .attr('class', 'x-axis grid axis')
          .attr('transform', 'translate(0, ' + height + ')')
          .call(xAxis
            .tickSize(-height)
            .tickPadding(7)
          )
           .append('text')
            .attr("id", "xAxisLabel")
             .attr('x', chart_width+margin.right)
             .attr('dy', '3em')
             .attr('text-anchor', 'end')
             .attr('fill', 'rgb(54, 54, 54)')
             .attr('font-size', '1.2em')
             .text(function(d,i){return dvc.essential.xAxisLabel})


          // d3.select("#xAxisLabel").append("tspan").attr("x", (chart_width-180)).attr("y", 20).attr("dy", 1 + "em").text("Average NO")
          // d3.select("#xAxisLabel").append("tspan").attr("x", (chart_width-173)).attr("y", 24).attr("dy", 1 + "em").text("2")
          // d3.select("#xAxisLabel").append("tspan").attr("x", (chart_width-15)).attr("y", 20).attr("dy", 1 + "em").text(" concentration over 10 years")
          //
          // d3.select("#xAxisLabel").append("tspan").attr("x", (chart_width-20)).attr("y", 35).attr("dy", 1 + "em").text("(µg m")
          // d3.select("#xAxisLabel").append("tspan").attr("x", (chart_width-10)).attr("y", 31).attr("dy", 1 + "em").text("-3")
          // d3.select("#xAxisLabel").append("tspan").attr("x", (chart_width-5)).attr("y", 35).attr("dy", 1 + "em").text(")")

          g.append('g')
             .attr('class', 'y-axis grid axis')
             .call(yAxis.tickSize(-chart_width, 0 , -chart_width))
           .append('text')
               .attr('y', 10)
               .attr('dy', '-2em')
               .attr('x',-margin.left)
               .attr('text-anchor', 'start')
               .attr('fill', 'rgb(54, 54, 54)')
               .attr('font-size', '1.2em')
               .text(function(d,i){return dvc.essential.yAxisLabel})



          var main = g.append('g')
           .attr('class', 'main')

           main.append('path')
              .datum(dvc.optional.annotateLineX1_Y1_X2_Y2[plotNum])
              .attr('d', line)
              .attr('stroke', dvc.optional.lineColor_opcty[plotNum][0])
              .attr('stroke-width', 2)
              .attr('stroke-opacity',dvc.optional.lineColor_opcty[plotNum][1])
              .attr('fill', 'none')
              .attr('class', 'line');

           main.selectAll('.circles')
              .data(graphic_data.filter(function(d){return d[yVar] != "na"}))
              .enter().append('circle')
              .attr( "class" , function(d,i){ return "circles " + d.group; })
              .attr( "id" , function (d,i){ return "circle" +  i; })
              .attr( "cx" , function(d) { return x(d[dvc.essential.pickxdata]); })
      				.attr( "cy" , function(d) { return y(d[yVar]); })
              .attr('r', 4)
              .attr('fill', '#053d58')
              .attr("fill-opacity", 0.7)
              .attr('stroke', "#053d58")
              .attr('stroke-width', 1)
              .attr('class', 'circles');


            // make rectangle annotations
            dvc.essential.rectannotations.forEach(function(d,i) {
                     main.append('rect')
                      .datum(dvc.essential.rectannotations[i])
                      .attr("x",x(d.x))
                      .attr("y",y(d.y))
                      .attr("width",Math.abs(x(dvc.essential.rectannotations[i].width)-x(0)))
                      .attr("height",Math.abs(y(dvc.essential.rectannotations[i].height)-y(0)))
                      .attr('class','rect')
                      .attr("fill",d.colour)
                      .attr("opacity",d.opacity);
                    })

            // make written annotations
            dvc.essential.textAnnotations.forEach(function(d,i) {
                     main.append('text')
                      .datum(dvc.essential.textAnnotations[i])
                      .attr("x",x(d.x))
                      .attr("y",y(d.y))
                      .attr("class","annotext")
                      .text(d.text)
                      .call(wrap,dvc.essential.textAnnotationWrap);
                    })
      } // end drawScatter


      //add source
      d3.select('#footer')
        .append('h6')
        .text('Source: ' + dvc.essential.sourceText);


          //word wrapping function from https://stackoverflow.com/questions/24784302/wrapping-text-in-d3
      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
              words = text.text().split(/\s+/).reverse(),
              word,
              line = [],
              lineNumber = 0,
              lineHeight = 1.1, // ems
              x = text.attr("x"),
              y = text.attr("y"),
              dy = 0,//parseFloat(text.attr("dy")),
              tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }


}//end drawGraphic


    //then, onload, check to see if the web browser can handle 'inline svg'
    if (Modernizr.svg)
    {
      // open and load configuration file.
      d3.json("config.json", function(error, json)
      {
        // store read in json data from config file as as global dvc. variable ...
        dvc = json;
        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          // read in and store data held in CSV as global data variable.
          graphic_data = data;



          pymChild = new pym.Child({renderCallback: drawGraphic});
        })// end data load
      })// end of d3.json
    } // end modernizr if ...
    else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();

      d3.select("#graphic").empty();
      d3.select("#graphic").append("img").attr("src","fallback.png");

      if (pymChild) { pymChild.sendHeight(); }
    }	// end else ...


  </script>
