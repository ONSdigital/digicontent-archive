    .visuallyhidden{
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
    #buttonGroup {
      display:inline-block;
    }

    .bottonGroup{
      height: 40px;
      color: white;
      margin-left:4px;
      margin-top:10px;
      margin-bottom:0px;
      padding-left: 10px;
      padding-right: 10px;
      padding-bottom: 15px;
      font-weight: bold;
      font-size:18px;
      padding-top: 10px;
      float: left;
      border-width: 0px;
      cursor: pointer;
      cursor: hand;
    }
    .bottonGroup:hover{
      outline: 4px solid orange;
    }

    .readmore{
      cursor: pointer;
      cursor: hand;
    }

    .selectedButton{
      outline: 4px solid orange;
    }
    .selecteddiv{
      visibility: visible;
    }
    .hiddendiv{
      visibility: hidden;
    }
    .collapsible{
      color:#4774CC;
      margin-top: 10px;
      text-decoration: underline;
      font-size: 16px;
      cursor: pointer;
      cursor: hand;
    }
    .collapsibleContent{
      display: none;

      margin-top: 10px;
      background-color: #EAEAEA;
      border-color: #dadada;
      border-width: 4px;
      border-style: solid;
      font-size: 16px;
    }
    .collapsibleContent:focus{
      border-color: orange;
    }
    .toptext{
      font-size: 18px;
      font-weight: 400;

      cursor: pointer;
      cursor: hand;
