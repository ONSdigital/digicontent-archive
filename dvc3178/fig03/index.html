<!DOCTYPE html>
<html lang="en">

<head>
  <title>Beeswarm chart</title>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,bold" rel="stylesheet">
  <link href="./css/style-chosen.css" rel="stylesheet" />
  <link href="./css/beeStyle.css" rel="stylesheet" />
</head>

<body>
  <!-- <div id="legend">
  </div> -->
  <div id="dropdown">
  </div>
  <div id="info">
  </div>
  <div id="infohidden" aria-live="assertive" class="visuallyhidden">
  </div>
  <div>
    <svg width="100%"></svg>
  </div>
  <div id="source"></div>


  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
  <!-- <script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js"></script> -->
  <script src="./js/jquery-3.0.0.slim.min.js"></script>
  <script src="./js/chosen.jquery.js"></script>

  <script src="../lib/modernizr.svg.min.js"></script>




  <script>

    var pymChild = null;
    let legend = d3.select('#legend');

    function drawGraphic() {

      //clear the svg first
      legend.selectAll('*').remove(); // Ensure legend is cleared first
      d3.select("svg").selectAll("*").remove()

      clicked = false;

      var svg = d3.select("svg"),
        margin = { top: 20, right: 20, bottom: 40, left: 150 },
        svgwidth = parseInt(svg.style("width"));

      heightper = dvc.essential.heightperstrip;
      heightper = heightper;
      width = svgwidth - margin.left - margin.right;

      //get unique groups
      var groups = graphic_data.map(function (obj) { return obj.id; });
      groups = groups.filter(function (v, i) { return groups.indexOf(v) == i; });

      height = (heightper * groups.length) + margin.top + margin.bottom;

      svg.attr("height", height + 15 + "px")

      var formatValue = d3.format(".1f");

      var x = d3.scaleLinear()
        .rangeRound([0, width]);

      if (dvc.essential.xAxisScale == "auto") {
        x.domain(d3.extent(graphic_data, function (d) { return d.value; }));
      } else {
        x.domain(dvc.essential.xAxisScale);
      }

      groupeddata = {}

      separate = heightper;

      runningtotal = 0;

      // Create SINGLE legend BEFORE the group loop
      legend
        .append('div')
        .attr('id', 'legendDiamond')
        .attr('class', 'legend--item')
        .append('svg')
        .attr('width', 20)
        .attr('height', 20)
        .append('rect')
        .attr('id', 'legendDiamondSVG')
        .attr('class', 'legend--icon--diamond')
        .attr('x', 5)
        .attr('y', 2)
        .attr('width', 10)
        .attr('height', 10)
        .attr('stroke', 'black')
        .attr('stroke-width', 1.5)
        .attr('fill', 'none')
        .attr('transform', 'rotate(45,10,10)')

      d3.select('#legendDiamond')
        .append('p')
        .attr('class', 'legend--text')
        .html(dvc.essential.legendLabels)

      for (var j = 0; j < groups.length; j++) {

        groupeddata[j] = graphic_data.filter(function (v, i) { return v.id == groups[j]; });

        if (j > 0) {
          runningtotal = runningtotal + groupeddata[j - 1].length;
        }

        var g = svg.append("g")
          .attr("transform", "translate(" + margin.left + "," + (margin.top + (separate * j)) + ")");

        var simulation = d3.forceSimulation(groupeddata[j])
          .force("x", d3.forceX(function (d) { return x(d.value); }).strength(2))
          .force("y", d3.forceY(heightper / 2))
          .force("collide", d3.forceCollide(dvc.essential.dotradius))
          .stop();

        for (var i = 0; i < 120; ++i) simulation.tick();

        if (svgwidth < dvc.optional.mobileBreakpoint) {
          numberticks = dvc.optional.x_num_ticks_sm_md[0];
        } else {
          numberticks = dvc.optional.x_num_ticks_sm_md[1];
        }


        g.append("text").attr("class", "label").attr("dy", (heightper / 2) + 5).attr("x", -margin.left).text(groups[j]).call(wrap, 150)

        if (j == 0) {
          g.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", "translate(0,0)")
            .call(d3.axisTop(x).ticks(numberticks).tickFormat(d => d3.format('.0s')(d)));
        }

        if (j == groups.length - 1) {
          g.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", "translate(0," + (-heightper * (groups.length - 1)) + ")")
            .call(d3.axisBottom(x)
              .ticks(numberticks).tickFormat(d => d3.format('.0s')(d))
              .tickSize(height - heightper)

            );

          g.selectAll(".axis--x line").style("stroke", "#ddd").attr("stroke-dasharray", "2,2");

          g.append("line")
            .attr("transform", "translate(0," + (-heightper * (groups.length - 1)) + ")")
            .attr("x1", x(0))
            .attr("x2", x(0))
            .attr("y1", 0)
            .attr("y2", (heightper * (groups.length) + 10))
            .attr("stroke", "#666")
            .style("stroke-width", "1.5px");

        }

        var cell = g.append("g")
          .attr("class", "cells")
          .selectAll("g").data(d3.voronoi()
            .extent([[-margin.left, 0], [width + margin.right, heightper]])
            .x(function (d) { return d.x; })
            .y(function (d) { return d.y; })
            .polygons(groupeddata[j])).enter().append("g").attr("class", function (d, i) { /*console.log(d, i);*/ return i })


        cell.each(function (d, i) {
          if (!d.data.unique.includes("average")) {
            d3.select(this).append("circle")
              .attr("r", dvc.essential.dotradius)
              .attr("cx", function (d) { return d.data.x; })
              .attr("cy", function (d) { return d.data.y; })
              .attr("class", function (d) { return "cell cell" + (runningtotal + i) })
              .attr("fill", function (d) { return d.data.value >= 0 ? dvc.essential.colour_palette[0] : dvc.essential.colour_palette[1] });

            console.log
          } else {
            d3.select(this).append("rect")
              .attr("x", function (d) { return d.data.x - dvc.essential.rectSize * 0.5; })
              .attr("y", function (d) { return d.data.y - dvc.essential.rectSize * 0.5; })
              .attr("height", dvc.essential.rectSize * dvc.essential.dotradius)
              .attr("width", dvc.essential.rectSize * dvc.essential.dotradius)
              .attr("class", function (d, i) { return "cell cell" + (runningtotal + i) })
              .attr("fill", "none")
              .attr('stroke', "black")
              .attr("stroke-width", 1.5)
              .attr("transform", "rotate(45," + d.data.x + "," + d.data.y + ")");

          }
        })

        cell.append("path")
          .attr("d", function (d) { return "M" + d.join("L") + "Z"; })
          .attr("class", function (d, i) { return "path" + (runningtotal + i) })
          .on("mouseover", function (d, i) {
            pathidstr = d3.select(this).attr("class");
            pathid = +pathidstr.substr(4);

            // Update the text dynamically on hover
            if (!d.data.unique.includes("average")) {
              changetext(d.data.value, d.data.unique);

              // Update the dropdown to reflect the region hovered
              $("#dropselect").val("id" + pathid).trigger("chosen:updated");
              selectedOption = d.data.unique; // Update selectedOption variable based on the hovered region
              d3.select("#infohidden").html(selectedOption + " had a " + formatValue(d.data.value) + " percent change of first-time buyer mortgage sales per 1,000 dwellings");

              d3.select(".cell" + pathid).classed("cellsselected", true);
            }

          })
          .on("mouseout", function (d, i) {

            pathidstr = d3.select(this).attr("class");
            pathid = +pathidstr.substr(4);

            d3.select("#info").html("");
            $("#dropselect").val("").trigger("chosen:updated");
            d3.select(".cell" + pathid).classed("cellsselected", false)

            if (clicked == true) {
              changetext(d.data.value, d.data.unique)

              $("#dropselect").val("id" + pathid).trigger("chosen:updated");
              d3.select(".cell" + pathid).classed("cellsselected", true)

            }
          })
      }

      selectlist(graphic_data);

      function selectlist(datacsv) {
        var dropcodes = datacsv.map(function (d, i) { return "id" + i; });
        var dropnames = datacsv.map(function (d) { return d.unique; });
        var menuarea = d3.zip(dropnames, dropcodes).filter(function (d, i) { return !d[0].includes("average") }).sort(function (a, b) { return d3.ascending(a[0], b[0]); });
        //menuarea.shift();
        //menuarea.shift();

        //clear dropdown
        d3.select("#dropdown").selectAll("*").remove()

        // Build option menu 
        d3.select("#dropdown").append("div").attr("id", "sel").insert("label")
          .attr("class", "visuallyhidden")
          .attr("for", "dropselect")
          .html("Inactive dropdown element, replaced by custom dropdown")

        var optns = d3.select("#dropdown").select("#sel").append("select")
          .attr("id", "dropselect")
          .attr("style", "width:300px")
          .attr("class", "chosen-select");

        optns.append("option")
        // .attr("value","first")
        // .text("");

        optns.selectAll("p").data(menuarea).enter().append("option")
          .attr("value", function (d) { return d[1] })
          .attr("id", function (d) { return d[1] })
          .text(function (d) { return d[0] });

        myId = null;

        $('#dropselect').chosen({ placeholder_text_single: 'Select an area', width: "98%", allow_single_deselect: true })

        d3.select('input.chosen-search-input').attr('id', 'chosensearchinput')
        d3.select('div.chosen-search').insert('label', 'input.chosen-search-input')
          .attr('class', 'visuallyhidden')
          .attr('for', 'chosensearchinput')
          .html("Type to select an area")


        $('#dropselect').on('change', function (evt, params) {

          if ($('#dropselect').val() != "") {
            //if(typeof params != 'undefined') {
            clicked = true;
            d3.selectAll(".cell").classed("cellsselected", false);
            d3.selectAll(".cells path").style("pointer-events", "none")

            dropcode = $('#dropselect').val();

            dropcodeid = +dropcode.substr(2)


            d3.select(".cell" + dropcodeid).classed("cellsselected", true);
            datafilter = datacsv.filter(function (d, i) { return "id" + i == dropcode })

            changetext(datafilter[0].value, datafilter[0].unique)

            d3.select('abbr').on('keypress', function (evt) {
              if (d3.event.keyCode == 13 || d3.event.keyCode == 32) {
                d3.event.preventDefault()

                clicked = false;

                d3.select(".cell" + dropcodeid).classed("cellsselected", false)
                d3.selectAll(".cells path").style("pointer-events", "all")

                d3.select("#info").html("");

                $("#dropselect").val(null).trigger('chosen:updated');
              }
            })

          }
          else {
            clicked = false;

            d3.selectAll(".cell").classed("cellsselected", false);
            d3.selectAll(".cells path").style("pointer-events", "all");

            d3.select("#info").html("");

          }
        });
      } //end selectlist



      function changetext(value, id) {
        // Determine if the value is positive or negative
        let changeDirection = value >= 0 ? "increase" : "decrease";

        // Determine the color based on value
        let textColor = value >= 0 ? dvc.essential.colour_palette[0] : dvc.essential.colour_palette[1];

        d3.select("#info").html("<span id='label' style='color: " + textColor + "'>" + formatValue(Math.abs(value)) + "% " + changeDirection + "</span> in first-time buyer mortgage sales per 1,000 dwellings");
        
        selectedOption = $("#dropselect option:selected").text()
        d3.select("#infohidden").html(selectedOption + " had a " + formatValue(value) + " percent " + changeDirection + " in first-time buyer mortgage sales per 1,000 dwellings");
      }



      //add xaxislabel
      svg.append("g")
        .attr("transform", "translate(" + (svgwidth) + "," + (height + 10) + ")")
        .append("text")
        .attr("id", "xaxislabel")
        .attr("text-anchor", "end")
        .text(dvc.essential.xAxisLabel);

      //add source
      d3.select("#source").text("Source: " + dvc.essential.sourceText);

      if (pymChild) {
        pymChild.sendHeight();
      }

    }

    function wrap(text, width) {
      text.each(function () {
        var text = d3.select(this),
          words = text.text().split(/\s+/).reverse(),
          word,
          line = [],
          lineNumber = 0,
          lineHeight = 1.1, // ems
          // y = text.attr("y"),
          x = text.attr("x"),
          dy = parseFloat(text.attr("dy")),
          tspan = text.text(null).append("tspan").attr('x', x);
        while (word = words.pop()) {
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > width) {
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            tspan = text.append("tspan").attr('x', x).attr("dy", lineHeight + "em").text(word);
          }
        }
        var breaks = text.selectAll("tspan").size();
        text.attr("y", function () { return -6 * (breaks - 1); });
      });

    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function (error, config) {
        dvc = config
        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function (error, data) {
          graphic_data = data;
          //use pym to create iframed chart dependent on specified variables
          pymChild = new pym.Child({ renderCallback: drawGraphic });
        });
      })
    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    function type(d) {
      if (!d.value) return;
      d.value = +d.value;
      return d;
    }

  </script>
