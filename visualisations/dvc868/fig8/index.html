<!DOCTYPE html>
<html lang="en">

<head>
  <title>Horizontal clustered bar chart</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    .x.axis path.domain {
      opacity: 0;
    }
  </style>

</head>

<body>

  <div id="graphic"><img src="fallback.png" alt="[Chart]" /></div>
  <h6 id="source"></h6>



  <div id="keypoints">
    <p></p>
  </div>


  <!-- Define the source -->
  <div id="footer"> </div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>

  <script>
    var ageNames;
    var graphic = d3.select('#graphic');
    var keypoints = d3.select('#keypoints');
    var footer = d3.select(".footer");
    var pymChild = null;


    function drawGraphic(width) {

      var threshold_md = 600; // new code ..
      var threshold_sm = dvc.optional.mobileBreakpoint; // new code ..

      nested=d3.nest()
      .key(function(d){return d.category})
      .entries(graphic_data)


      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
      var height = dvc.essential.barHeight[size] * nested.length - margin.top - margin.bottom;

      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      var num_ticks = 10;

      var color = d3.scaleOrdinal().range(dvc.essential.colour_palette);

      // vertical
      y0 = d3.scaleBand().rangeRound([0, height]).paddingInner(0.1);;
      var y1 = d3.scaleBand();
      var x = d3.scaleLinear().range([0, chart_width]);

      var xAxis = d3.axisBottom(x);

      var legend = d3.select('#graphic').append('svg')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + 30)
        .append("g")
        .attr("id", "legend")

      var svg = d3.select('svg')
        .attr("id", "chart")
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + 30)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + (margin.top + 30) + ")")

      // vertical
      y0.domain(d3.map(graphic_data,function(d) {
        return d.category;
      }).keys());
      y1.domain(d3.map(graphic_data,function(d){return d.series}).keys()).range([0, y0.bandwidth()]);

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      if (dvc.essential.xAxisScale == "auto_zero_max") {
        var xDomain = [0, Math.ceil(d3.max(graphic_data,function(d){return d.value}) / 100) * 100];
      } else {
        var xDomain = dvc.essential.xAxisScale;
      }

      x.domain(xDomain);

      var yAxis = d3.axisLeft(y0)
        .tickFormat(function(d, i) {return d;})
        .tickPadding(15)
        .tickSize(0);

      //specify number of ticks on x axis
      if (parseInt(graphic.style("width")) < threshold_sm) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
      } else {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
      }

      // //specify number or ticks on y axis
      // if (parseInt(graphic.style("width")) <= threshold_sm) {
      //   yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[0]));
      // } else if (parseInt(graphic.style("width")) <= threshold_md) {
      //   yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[1]));
      // } else {
      //   yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[2]));
      // }



      svg.append("g")
        .attr("class", "x axis")
        .attr("id", "xAxis")
        .attr('transform', 'translate(0,' + height + ')')
        .call(xAxis.tickSize(-height, 0))


      //create y axis, if x axis doesn't start at 0 nudge y axis accordingly
      svg.append('g')
        .attr('class', 'y axis')
        .call(yAxis)
        .selectAll('text')
        .call(wrap, margin.left-25);

      d3.select(".y").select("path").style("stroke", "#666")





      writeAnnotation();

      function writeAnnotation() {

        if (parseInt(graphic.style("width")) < threshold_md) {

          dvc.essential.annotationBullet.forEach(function(d, i) {

            d3.select("#keypoints").append("svg")
              .attr("width", "20px")
              .attr("height", "20px")
              .attr("class", "circles")
              .append("circle")
              .attr("class", "annocirc" + (i))
              .attr("r", "2")
              .attr('cy', "12px")
              .attr("cx", "10px");

            d3.select("#keypoints")
              .append("p")
              .style("font-size", "12px")
              .style("font-weight", 400)
              .text(dvc.essential.annotationBullet[i]);

          }) // end foreach
        } else {

          dvc.essential.annotationChart.forEach(function(d, i) {

            // draw annotation text based on content of var annotationArray ...
            svg.append("text")
              .text(dvc.essential.annotationChart[i])
              .attr("class", "annotext" + i)
              .attr("text-anchor", dvc.essential.annotationAlign[i])
              .attr('y', y0(dvc.essential.annotationXY[i][1]))
              .attr('x', x(dvc.essential.annotationXY[i][0]));

            d3.selectAll(".annotext" + (i))
              .attr("fill", "#666")
              .attr("font-size", "13px")
              .attr("font-weight", 500)
              .each(insertLinebreaks)
              .each(createBackRect);


            function insertLinebreaks() {

              var str = this;

              var el1 = dvc.essential.annotationChart[i];
              var el = el1.data;

              var words = el1.split('  ');

              d3.select(this).text('');

              for (var j = 0; j < words.length; j++) {
                var tspan = d3.select(this).append('tspan').text(words[j]);
                if (j > 0)
                  tspan.attr('x', x /*0*/( /*d3.time.format(dvc.essential.dateFormat).parse(*/ dvc.essential.annotationXY[i][0] /*)*/ )).attr('dy', '22');
              }
            };

            function createBackRect() {

              var BBox = this.getBBox()

              svg.insert("rect", ".annotext" + (i))
                .attr("width", BBox.width)
                .attr("height", BBox.height)
                .attr("x", BBox.x)
                .attr("y", BBox.y)
                .attr("fill", "white")
                .attr("opacity", 0.4);

            }; // end function createBackRect()


            // draw circles, if var 'dvc.essential.circles' is set to true
            if (dvc.essential.circles == true) {

              svg.append("circle")
                .attr("class", "annocirc" + (i))
                .attr('cy', y0(dvc.essential.annotationCXCY[i][1]))
                .attr('cx', x(dvc.essential.annotationCXCY[i][0]))
                .attr("r", "3");

            } // end if ...

          }); // end foreach

        } // end else ...

        return;

      } // end function writeAnnotation()



      createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        dvc.essential.legendLabels.forEach(function(d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").append("g")

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", dvc.essential.colour_palette[i])
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", function(d) {
              if (dvc.essential.legendStyle == "rect") {
                return 15;
              } else {
                return 20;
              }
            })
            .attr("height", function(d) {
              if (dvc.essential.legendStyle == "rect") {
                return 15;
              } else {
                return 3;
              }
            })
            .attr('opacity',0.90)

          var_group.append("text")
            .text(dvc.essential.legendLabels[i])
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "12px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);



          d3.selectAll(".legend" + (i))
            .each(calcPosition);



          function calcPosition() {


            var BBox = this.getBBox()

            d3.select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function(d) {
                return prevX + 25;
              })


            d3.select(".rect" + (i))
              .attr("y", function(d) {

                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }

                if (dvc.essential.legendStyle == "rect") {
                  return eval((lineNo * 20) + 5);
                } else {
                  return eval((lineNo * 20) + 12);

                }
              })
              .attr("x", function(d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50

            //	d3.select("#chart").attr("transform", "translate(0, 0)")


          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()



      var state = svg.selectAll(".state")
        .data(nested)
        .enter()
        .append("g")
        .attr("class", "g")
        .attr("transform", function(d, i) {
          return "translate(0," + parseFloat(y0(d.key)) + ")";
        });


      legend_height = d3.select("#legend").node().getBBox()

      d3.select('#chart').attr("height", height + margin.top + margin.bottom + legend_height.height)

      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      svg.append("text")
        .attr('class', 'unit')
        .attr('transform', "translate(" + (chart_width - margin.left / 10) + "," + (height + margin.bottom / 1.5) + ")")
        .attr("font-size", "12px")
        .attr("fill", "#666666")
        .text(function(d, i) {
          return dvc.essential.xAxisLabel
        });

      state.selectAll("rect")
        .data(function(d) {
          return d.values;
        })
        .enter()
        .append("rect")
        .attr("width", function(d) {
          return Math.abs(x(d.value) - x(0));
        })
        .attr("x", function(d) {
          return x(Math.min(0, d.value));
        })
        .attr("y", function(d) {
          return y1(d.series);
        })
        .attr("height", function(d) {
          return y1.bandwidth();
        })
        .style("fill", function(d) {
          return color(d.series);
        })
        .style("opacity", 0.90);

      state.selectAll(".max")
        .data(function(d) {
          return d.values;
        })
        .enter()
        .append('line')
        .attr('class','max')
        .attr('x1',function(d){return x(d.max)})
        .attr('x2',function(d){return x(d.max)})
        .attr('y1',function(d){return y1(d.series)+y1.bandwidth()/4})
        .attr('y2',function(d){return y1(d.series)+y1.bandwidth()*0.75})
        .attr('stroke','#414042')
        .attr('stroke-width','1px')

      state.selectAll(".min")
        .data(function(d) {
          return d.values;
        })
        .enter()
        .append('line')
        .attr('class','min')
        .attr('x1',function(d){return x(d.min)})
        .attr('x2',function(d){return x(d.min)})
        .attr('y1',function(d){return y1(d.series)+y1.bandwidth()/4})
        .attr('y2',function(d){return y1(d.series)+y1.bandwidth()*0.75})
        .attr('stroke','#414042')
        .attr('stroke-width','1px')

      state.selectAll(".connector")
        .data(function(d) {
          return d.values;
        })
        .enter()
        .append('line')
        .attr('class','connector')
        .attr('x1',function(d){return x(d.min)})
        .attr('x2',function(d){return x(d.max)})
        .attr('y1',function(d){return y1(d.series)+y1.bandwidth()/2})
        .attr('y2',function(d){return y1(d.series)+y1.bandwidth()/2})
        .attr('stroke','#414042')
        .attr('stroke-width','1px')

      state.selectAll("text.samplesize")
      .data(function(d){
        return d.values;
      })
      .enter()
      .append('text')
      .attr('class',"samplesize")
      .attr('x',-10)
      .attr('y',function(d){return y1(d.series)+y1.bandwidth()})
      .attr('font-size',"12px")
      .attr('fill',"#666")
      .text(function(d){return d.smallsample})



      //create centre line if required
      if (dvc.optional.centre_line == true) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('x1', x(dvc.optional.centre_line_value))
          .attr('x2', x(dvc.optional.centre_line_value))
          .attr('y1', 0)
          .attr('y2', height);
      } else if (xDomain[0] < 0) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('y1', 0)
          .attr('y2', height)
          .attr('x1', x(0))
          .attr('x2', x(0));
      }

      d3.selectAll("path").attr("fill", "none");

      d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

      d3.selectAll(".y text").attr("font-size", "12px").attr("fill", "#666");
      d3.selectAll(".x text").attr("font-size", "12px").attr("fill", "#666"); // dates - timelines

      d3.selectAll(".x line")
        .attr("stroke", "#CCC")
        .attr("stroke-width", "1px")
        .style("shape-rendering", "crispEdges");

      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x")
            // dx = text.attr("dx"),
            dy = 0,//text.attr("dy"),
            tspan = text.text(null).append("tspan").attr("x", x).attr("dx", 0).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("dx", 0).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }


      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {

        dvc = config;

        d3.csv(dvc.essential.graphic_data_url, function(error, data) {

          graphic_data = data;

          // ageNames = d3.keys(graphic_data[0]).filter(function(key) {
          //   return key !== "state";
          // });
          //
          //
          // /* START MODIFIED */
          // dvc.dataMinArray = [];
          // dvc.dataMaxArray = [];
          // /* END MODIFIED */
          //
          // graphic_data.forEach(function(d, i) {
          //
          //   /* START MODIFIED */
          //   dvc.dataMinArray[i] = [];
          //   dvc.dataMaxArray[i] = [];
          //   dvc.minVal = Infinity;
          //   dvc.maxVal = -Infinity;
          //   /* END MODIFIED */
          //
          //   d.ages = ageNames.map(function(name) {
          //
          //     /* START MODIFIED */
          //     if (+d[name] <= dvc.minVal) {
          //       dvc.minVal = +d[name];
          //       dvc.dataMinArray[i] = +d[name];
          //     }
          //
          //     if (+d[name] >= dvc.maxVal) {
          //       dvc.maxVal = +d[name];
          //       dvc.dataMaxArray[i] = +d[name];
          //     }
          //     /* END MODIFIED */
          //
          //     return {
          //       name: name,
          //       value: +d[name]
          //     };
          //   });
          //
          // });

          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });
      })
    } else { //if modernizr is false
      pymChild = new pym.Child();
      pymChild.sendHeight();
    }
  </script>

</html>
