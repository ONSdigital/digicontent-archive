<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,700"
      rel="stylesheet"
      type="text/css"
    />
    <title>A chart showing rates of self report long COVID</title>

    <meta name="description" content="" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />
    <style type="text/css">
      body {
        /* max-width:944px; */
      }

      .x.axis path {
        display: none;
      }

      path.line {
        fill: none;
      }

      text {
        font-family: "Open Sans";
      }

      text.x,
      text.y {
        font-size: 12px;
        fill: #666;
      }

      line.y,
      line.x {
        stroke: #ccc;
        stroke-width: 1px;
        shape-rendering: crispEdges;
      }

      #legend {
        font-size: 12px;
      }

      h4 {
        font-size: 16px;
        line-height: 24px;
        margin: 16px 0 16px 0;
        padding: 24px 0 0 0;
        font-weight: bold;
      }

      h5 {
        font-size: 14px;
        margin: 0 0 16px 0;
        font-weight: normal;
        padding-top: 0;
      }

      h5,
      h6 {
        font-size: 16px;
        margin: 16px 0 8px 0;
        font-weight: 700;
        color: #323132;
      }

      ul,
      ol {
        margin: 16px 0;
        padding-left: 32px;
      }

      li {
        margin: 0 0 8px 0;
        line-height: 32px;
        font-weight: 400;
        font-size: 18px;
        padding: 0;
      }

      @media (max-width: 767px) {
        li {
          font-size: 16px;
        }
      }

      .line5-yearaverage {
        stroke: #666;
        stroke-dasharray: 5 8 !important;
        stroke-linecap: round !important;
        stroke-width: 2px !important;
      }

      a {
        text-decoration: underline;
        font-size: 18px;
        font-weight: 400;
        line-height: 32px;
      }

      .btn {
        font-family: "Open Sans", Helvetica, Arial, sans-serif;
        display: inline-block;
        width: auto;
        cursor: pointer;
        padding: 6px 16px 10px 16px;
        border: 0 none;
        text-align: center;
        -webkit-appearance: none;
        transition: background-color 0.25s ease-out;
      }

      .btn--primary:focus {
        background-color: #0b5d30;
      }

      .btn--primary {
        background-color: #0f8243;
        color: #fff;
      }

      .visuallyhidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>

  <body>
    <h5 class="visuallyhidden">
      The rates of reinfection have remained high since the Omicron variants
      became dominant.
    </h5>
    <div id="legend" aria-hidden="true"></div>

    <div id="graphic" aria-hidden="true" style="position: relative">
      <img
        src="fallback.png"
        alt="A series of charts showing the estimated percentage of the population testing positive for the coronavirus (COVID-19) on nose and throat swabs, daily, by region."
      />
    </div>

    <h6 id="source"></h6>

    <script
      src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"
      type="text/javascript"
    ></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script
      src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"
      type="text/javascript"
    ></script>
    <script src="../lib/d3v4jetpack.js" type="text/javascript"></script>

    <script>
      var graphic = d3.select("#graphic");
      var legend = d3.select("#legend");
      var pymChild = null;

      function drawGraphic() {
        maxweek = d3.max(graphic_data, function (d) {
          return d.date;
        });

        var threshold_md = dvc.optional.middleBreakpoint;
        var threshold_sm = dvc.optional.mobileBreakpoint;

        if (parseInt(graphic.style("width")) < threshold_sm) {
          size = "sm";
        } else if (parseInt(graphic.style("width")) < threshold_md) {
          size = "md";
        } else {
          size = "lg";
        }

        categorySort = {};
        if (Array.isArray(dvc.essential.categorySort)) {
          for (i = 0; i < dvc.essential.categorySort.length; i++) {
            categorySort[dvc.essential.categorySort[i]] = i;
          }

          graphic_data.sort(function (a, b) {
            return categorySort[a.category] - categorySort[b.category];
          });

          categories = Object.keys(categorySort);
        } else if (dvc.essential.categorySort == "descending") {
          //auto sort the array by biggest value
          graphic_data
            .filter(function (d) {
              return d.date == maxweek;
            })
            .sort(function (a, b) {
              return +b.chiffre - +a.chiffre;
            })
            .forEach(function (item, i) {
              categorySort[item.category] = i;
            });

          graphic_data.sort(function (a, b) {
            return categorySort[a.category] - categorySort[b.category];
          });

          categories = Object.keys(categorySort);
        } else if (dvc.essential.categorySort == "ascending") {
          graphic_data
            .filter(function (d) {
              return d.date == maxweek;
            })
            .sort(function (a, b) {
              return +a.chiffre - +b.chiffre;
            })
            .forEach(function (item, i) {
              categorySort[item.category] = i;
            });

          graphic_data.sort(function (a, b) {
            return categorySort[a.category] - categorySort[b.category];
          });

          categories = Object.keys(categorySort);
        }

        var margin = dvc.optional.margin[size];
        var chart_width =
          parseInt(graphic.style("width")) / dvc.optional.chart_every[size] -
          margin.left -
          margin.right;
        var height = Math.ceil(
          (chart_width * dvc.optional.aspectRatio[size][1]) /
            dvc.optional.aspectRatio[size][0]
        );

        // clear out existing graphics
        graphic.selectAll("*").remove();
        legend.selectAll("*").remove();

        //draw legend
        legend
          .append("svg")
          .attr("height", dvc.optional.legendHeight[size])
          .attr(
            "width",
            dvc.optional.chart_every[size] *
              (chart_width + margin.left + margin.right)
          )
          .append("g")

          .attr("transform", "translate(0,0)");

        createLegend();

        function createLegend() {
          var prevX = 0;
          var prevY = 0;
          lineNo = 0;
          var lineNoOld = 0;

          dvc.essential.colour_palette
            .map(function (d) {
              return d.key;
            })
            .forEach(function (d, i) {
              // draw legend text based on content of var legendLabels ...
              var_group = d3.select("#legend").select("svg").append("g");

              // use rectangles
              var_group
                .append("rect")
                .attr("class", "rect" + i)
                .attr("fill", dvc.essential.colour_palette[i].colour)
                .attr("x", 0)
                .attr("y", 0)
                .attr("width", function () {
                  if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                    return 15;
                  } else if (dvc.essential.colour_palette[i].dash == "true") {
                    return 10;
                  } else {
                    return 20;
                  }
                })
                .attr("height", function () {
                  if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                    return 15;
                  } else {
                    return 3;
                  }
                })
                .attr("opacity", dvc.essential.colour_palette[i].opacity);

              // add another line, where appropriate
              var_group
                .append("rect")
                .attr("class", "rect2" + i)
                .attr("fill", dvc.essential.colour_palette[i].colour)
                .attr("x", 0)
                .attr("y", 0)
                .attr("display", function () {
                  if (dvc.essential.colour_palette[i].dash == "true") {
                    return "block";
                  } else {
                    return "none";
                  }
                })
                .attr("width", function () {
                  if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                    return 15;
                  } else if (dvc.essential.colour_palette[i].dash == "true") {
                    return 10;
                  } else {
                    return 20;
                  }
                })
                .attr("height", function () {
                  if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                    return 15;
                  } else {
                    return 3;
                  }
                })
                .attr("opacity", dvc.essential.colour_palette[i].opacity);

              if (size !== "sm") {
                var_group
                  .append("text")
                  .text(dvc.essential.colour_palette[i].key)
                  .attr("class", "legend" + i)
                  .attr("text-anchor", "start")
                  .style("font-size", "12px")
                  .style("fill", "#666")
                  .attr("y", 15)
                  .attr("x", 0);
              } else {
                var_group
                  .append("text")
                  .text(dvc.essential.colour_palette[i].smallkey)
                  .attr("class", "legend" + i)
                  .attr("text-anchor", "start")
                  .style("font-size", "12px")
                  .style("fill", "#666")
                  .attr("y", 15)
                  .attr("x", 0);
              }

              d3.selectAll(".legend" + i).each(calcPosition);

              function calcPosition() {
                var BBox = this.getBBox();

                //prevY =BBox.width
                d3.select(".legend" + i)
                  .attr("y", function (d) {
                    if (
                      prevX + BBox.width + 50 >
                      parseInt(graphic.style("width"))
                    ) {
                      lineNoOld = lineNo;
                      lineNo = lineNo + 1;
                      prevX = 0;
                    }
                    return eval(lineNo * 20 + 20);
                  })
                  .attr("x", function (d) {
                    return prevX + 25;
                  });

                d3.select(".rect" + i)
                  .attr("y", function (d) {
                    if (
                      prevX + BBox.width + 50 >
                      parseInt(graphic.style("width"))
                    ) {
                      lineNoOld = lineNo;
                      lineNo = lineNo + 1;
                      prevX = 0;
                    }

                    if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                      return eval(lineNo * 20 + 5);
                    } else {
                      return eval(lineNo * 20 + 12); // was 20+14
                    }
                  })
                  .attr("x", function (d) {
                    return prevX;
                  });
                dashX = prevX;
                prevX = prevX + BBox.width + 50;

                // move second rect, where appropriate
                d3.select(".rect2" + i)
                  .attr("y", function (d) {
                    if (
                      dashX + BBox.width + 50 >
                      parseInt(graphic.style("width"))
                    ) {
                      lineNoOld = lineNo;
                      lineNo = lineNo + 1;
                      prevX = 0;
                    }

                    if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                      return eval(lineNo * 20 + 5);
                    } else {
                      return eval(lineNo * 20 + 12); // was 20+14
                    }
                  })
                  .attr("x", function (d) {
                    return dashX + 12;
                  });
              } // end function calcPosition()
            }); // end foreach
        } // end function createLegend()

        x = d3.scaleTime().range([0, chart_width]);

        x.domain(
          d3.extent(graphic_data, function (d) {
            return d.date;
          })
        );

        dates = d3
          .map(graphic_data, function (d) {
            return d.date;
          })
          .keys();

        var xAxis = d3
          .axisBottom(x)
          .tickValues(
            d3
              .map(graphic_data, function (d) {
                return d.date;
              })
              .keys()
              .map(function (d) {
                return d3.timeParse("%a %b %d %Y")(
                  d.match(/\b[\w']+(?:[^\w\n]+[\w']+){1,3}\b/g)[0]
                );
              })
              .sort(function (a, b) {
                return a - b;
              })
              .filter(function (d, i) {
                return (
                  (i % dvc.optional.x_ticks_every[size] === 0 &&
                    i < dates.length - dvc.optional.x_ticks_every[size]) ||
                  i == dates.length - 1
                ); //Rob's fussy comment about labelling the last date
                //return i== 0 ||  i==dates.length-1 // only first and last dates
              })
          )
          .tickFormat(d3.timeFormat("%b %y"));

        line = d3
          .line()
          .defined(function (d) {
            return d.chiffre != "null";
          })
          .x(function (d) {
            return x(d.date);
          })
          .y(function (d) {
            return y[d.category](d.chiffre);
          });

        line2 = d3
          .line()
          .defined(function (d) {
            return d.chiffre2 != "null";
          })
          .x(function (d) {
            return x(d.date);
          })
          .y(function (d) {
            return y[d.category](d.chiffre2);
          });

        var area = d3
          .area()
          .curve(d3.curveLinear)
          .x(function (d) {
            return x(d.date);
          })
          .y1(function (d) {
            return y[d.category](d.max);
          })
          .y0(function (d) {
            return y[d.category](d.min);
          });

        var area2 = d3
          .area()
          .curve(d3.curveLinear)
          .x(function (d) {
            return x(d.date);
          })
          .y1(function (d) {
            return y[d.category](d.max2);
          })
          .y0(function (d) {
            return y[d.category](d.min2);
          });

        nested = d3
          .nest()
          .key(function (d) {
            return d.category;
          })
          .key(function (d) {
            return d.series;
          })
          .sortValues(function (a, b) {
            return a.date - b.date;
          })
          .entries(graphic_data);

        //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
        y = {};

        if (dvc.essential.yAxisScale == "auto_zero_max_total") {
          var yDomain = [0, 50]; //this is manual
          // var yDomain = [0, d3.max(graphic_data, function(d) {   //these two lines are auto
          //   return +d.max
          // })];
          nested.forEach(function (item, i) {
            y[item.key] = d3
              .scaleLinear()
              .range([height, 0])
              .domain(yDomain)
              .nice();
          });
        } else if (dvc.essential.yAxisScale == "auto_min_max_total") {
          var yDomain = d3.extent(graphic_data, function (d) {
            return +d.chiffre;
          });
          nested.forEach(function (item, i) {
            y[item.key] = d3
              .scaleLinear()
              .range([height, 0])
              .domain(yDomain)
              .nice();
          });
        } else if (dvc.essential.yAxisScale == "auto_min_max_each") {
          rolledup = d3
            .nest()
            .key(function (d) {
              return d.category;
            })
            .rollup(function (v) {
              return [
                d3.min(v, function (d) {
                  return +d.chiffre;
                }),
                d3.max(v, function (d) {
                  return +d.chiffre;
                }),
              ];
            })
            .entries(graphic_data);

          rolledup.forEach(function (item, i) {
            y[item.key] = d3
              .scaleLinear()
              .range([height, 0])
              .domain(item.value)
              .nice();
          });
        } else if (dvc.essential.yAxisScale == "auto_zero_max_each") {
          rolledup = d3
            .nest()
            .key(function (d) {
              return d.category;
            })
            .rollup(function (v) {
              return [
                0,
                d3.max(v, function (d) {
                  return +d.chiffre;
                }),
              ];
            })
            .entries(graphic_data);

          rolledup.forEach(function (item, i) {
            y[item.key] = d3
              .scaleLinear()
              .range([height, 0])
              .domain(item.value)
              .nice();
          });
        }

        // sort these hardwired numbers maybe through the dimensions above
        charts = d3
          .select("#graphic")
          .selectAll("svg")
          .data(nested)
          .enter()
          .append("svg")
          .attr("id", function (d, i) {
            return "svg" + i;
          })
          .attr("width", chart_width + margin.left + margin.right)
          .attr("height", height + margin.top + margin.bottom);

          charts
          .append("text")
          .attr("x", 0)
          .attr("y", 12)
          .text(function (d) {
            return d.key;
          })
          .attr("font-weight", 700)
          .attr("font-size", "14px");

        svg = charts
          .append("g")
          .attr(
            "transform",
            "translate(" + margin.left + "," + margin.top + ")"
          );

        svg
          .append("g")
          .attr("class", "x axis")
          .attr("transform", "translate(0," + height + ")")
          .call(xAxis)
          .each(function (d, i) {
            if (
              i % dvc.optional.chart_every[size] ==
                dvc.optional.chart_every[size] - 1 ||
              i == nested.length - 1
            ) {
              d3.select(this)
                .append("text")
                .text(dvc.essential.xAxisLabel)
                .attr(
                  "transform",
                  "translate(" + chart_width + "," + (margin.bottom - 5) + ")"
                )
                .attr("text-anchor", "end")
                .attr("fill", "#666");
            }
          });

        //create svg for chart

        drawyaxis = svg.append("g").attr("class", "y axis");

        drawyaxis.each(function (d, i) {
          if (i % dvc.optional.chart_every[size] == 0) {
            d3.select(this).call(
              d3
                .axisLeft(y[d.key])
                .tickSize(-chart_width)
                .tickFormat(function (d) {
                  return d3.format(".0f")(d);
                })
                .ticks(4)
            );
          } else {
            d3.select(this).call(
              d3
                .axisLeft(y[d.key])
                .tickSize(-chart_width)
                .tickFormat("")
                .ticks(4)
            );
          }
        });

        svg
          .selectAll("g.area")
          .data(function (d) {
            return d.values;
          })
          .enter()
          .append("path")
          .attr("d", function (d) {
            return area(d.values);
          })
          .attr("class", "area")
          .attr("fill", dvc.essential.colour_palette[0].colour)
          .attr("opacity", 0.15);

        svg
          .selectAll("g.area")
          .data(function (d) {
            return d.values;
          })
          .enter()
          .append("path")
          .attr("d", function (d) {
            return area2(d.values);
          })
          .attr("class", "area")
          .attr("fill", dvc.essential.colour_palette[2].colour)
          .attr("opacity", 0.15);

        svg
          .selectAll("g.line")
          .data(function (d) {
            return d.values;
          })
          .enter()
          .append("path")
          .attr("d", function (d) {
            // console.log(d)
            return line(d.values);
          })
          .attr("class", function (d) {
            return "line";
          })
          .attr("stroke", dvc.essential.colour_palette[0].colour)
          .attr("stroke-width", "3px");

        svg
          .selectAll("g.line")
          .data(function (d) {
            return d.values;
          })
          .enter()
          .append("path")
          .attr("d", function (d) {
            // console.log(d)
            return line2(d.values);
          })
          .attr("class", function (d) {
            return "line";
          })
          .attr("stroke", dvc.essential.colour_palette[2].colour)
          .attr("stroke-width", "3px");

        // align x axis labels
        d3.select("g.x.axis")
          .selectAll(".tick")
          .attr("text-anchor", function (d, i) {
            if (i == 0) {
              return "middle";
            } else if (i == 2) {
              return "middle";
            }
          });

          svg
          .append("text")
          .attr("class", function (d, i) {
            return "ylab" + i;
          })
          .text(dvc.essential.yAxisLabel)
          .attr("x", 0 - margin.left +8 )
          .attr("y", -10)
          .attr("font-size", 12)
          .attr("text-anchor", "start")
          .attr("fill", "#323132");

        // add in annotations; final dot and it's value and uncertainty text and dashed line

        // calculate the reference date and it's annotation values
        var chartnames = d3
          .map(graphic_data, function (d) {
            return d.category;
          })
          .keys();
        firstage = chartnames[0];
        firstagedata = graphic_data.filter(function (d) {
          return d.category == firstage;
        });
        refdate = firstagedata[firstagedata.length - 4].date; // reference date is fourth one back
        refdateminusone = firstagedata[firstagedata.length - 5].date; // position of text
        datetext = d3.timeFormat("%-d %B %Y")(refdate);

        // adding new refdates
        refdate1 = "20/12/2021";
        refdate1_formatted = d3.timeParse(dvc.essential.dateFormat)(refdate1);

        refdate2 = "02/03/2022";
        refdate2_formatted = d3.timeParse(dvc.essential.dateFormat)(refdate2);

        refdate3 = "16/06/2022";
        refdate3_formatted = d3.timeParse(dvc.essential.dateFormat)(refdate3);

        // console.log(refdate1_formatted);
        // console.log(refdate1_fomratted_again);

        for (var i = 0; i < chartnames.length; i++) {
          filteredgraphic_data = graphic_data.filter(function (d) {
            return d.category == chartnames[i];
          });

          // add circle and text for first line
          d3.select("#svg" + i)
            .append("circle")
            .attr(
              "cx",
              margin.left +
                x(filteredgraphic_data[filteredgraphic_data.length - 1].date)
            )
            .attr(
              "cy",
              margin.top +
                y[chartnames[0]](
                  filteredgraphic_data[filteredgraphic_data.length - 1].chiffre
                )
            )

            .attr("r", 3)
            .attr("fill", dvc.essential.colour_palette[0].colour);

          d3.select("#svg" + i)
            .append("text")
            .attr(
              "x",
              margin.left +
                5 +
                x(filteredgraphic_data[filteredgraphic_data.length - 1].date)
            )
            .attr(
              "y",
              margin.top +
                5 +
                y[chartnames[0]](
                  filteredgraphic_data[filteredgraphic_data.length - 1].chiffre
                )
            )
            .attr("font-size", "11px")
            .attr("text-anchor", "start")
            .attr("fill", dvc.essential.colour_palette[0].colour)
            .attr("font-weight", "bold")
            .attr("class", "method1_" + i)
            .text(
              d3.format("(.1f")(
                filteredgraphic_data[filteredgraphic_data.length - 1].chiffre
              )
            );

               // add circle and text for second line
          d3.select("#svg" + i)
            .append("circle")
            .attr(
              "cx",
              margin.left +
                x(filteredgraphic_data[filteredgraphic_data.length - 1].date)
            )
            .attr(
              "cy",
              margin.top +
                y[chartnames[0]](
                  filteredgraphic_data[filteredgraphic_data.length - 1].chiffre2
                )
            )

            .attr("r", 3)
            .attr("fill", dvc.essential.colour_palette[2].colour);

          d3.select("#svg" + i)
            .append("text")
            .attr(
              "x",
              margin.left +
                5 +
                x(filteredgraphic_data[filteredgraphic_data.length - 1].date)
            )
            .attr(
              "y",
              margin.top +
                5 +
                y[chartnames[0]](
                  filteredgraphic_data[filteredgraphic_data.length - 1].chiffre2
                )
            )

          function writeAnnotation() {
            if (parseInt(graphic.style("width")) < threshold_sm) {
              dvc.essential.annotationBullet.forEach(function (d, i) {
                d3.select("#keypoints")
                  .append("svg")
                  .attr("width", "15px")
                  .attr("height", "15px")
                  .attr("class", "circles")
                  .append("circle")
                  .attr("class", "annocirc" + i)
                  .attr("r", "2")
                  .attr("cy", "9px")
                  .attr("cx", "10px");

                d3.select("#keypoints")
                  .append("p")
                  .style("font-size", "14px")
                  .style("font-weight", 400)
                  .text(dvc.essential.annotationBullet[i]);
              }); // end foreach
            } else {
              annotations = dvc.essential.annotationsChart;

              // For elements with time series
              for (i = 0; i < annotations.length; i++) {
                annotations[i].xVal = new Date(annotations[i].xVal);
              }

              var swoopy = d3
                .swoopyDrag()
                .x(function (d) {
                  return x(d.xVal);
                })
                .y(function (d) {
                  return y(d.yVal);
                })
                .draggable(dvc.essential.draggable)
                .annotations(annotations);

              var swoopySel = svg
                .append("g")
                .attr("class", "annotations")
                .call(swoopy); // Expected number, "translate()". error for each annotation

              svg
                .append("marker")
                .attr("id", "arrow")
                .attr("viewBox", "-10 -10 20 20")
                .attr("markerWidth", 20)
                .attr("markerHeight", 20)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M-6.75,-6.75 L 0,0 L -6.75,6.75")
                .attr("fill", "#808080");

              swoopySel.selectAll("path").attr("marker-end", "url(#arrow)");

              d3.selectAll(".annotations path")
                .style("stroke", "#808080")
                .attr("fill", "none");

              swoopySel
                .selectAll("text")
                .attr("font-size", "13px")
                .attr("font-size", "13px")
                .attr("font-size", "13px")
                .attr("font-weight", 500)
                .each(function (d, i) {
                  d3.select(this)
                    .text("") //clear existing text
                    .tspans(d3.wordwrap(d.text, dvc.essential.wordwrap[i])); //wrap after xx char
                });

              swoopySel.selectAll("text").each(function (d, i) {
                d3.select(this)
                  .selectAll("tspan")
                  .attr("text-anchor", dvc.essential.annoAlign[i]);
              });
            } // end else ...

            return;
          } // end function writeAnnotation()

          d3.selectAll(".method1_" + i).attr(

          d3.selectAll(".method2_" + i).attr(
            "transform",
            "translate(0," + dvc.essential.method2nudges[i] + ")"
          );
        });

        function wrap(text, width) {
          text.each(function () {
            var text = d3.select(this),
              words = text.text().split(/\s+/).reverse(),
              word,
              line = [],
              lineNumber = 0,
              lineHeight = 1.1, // ems
              y = text.attr("y"),
              x = text.attr("x");
            (dy = 0),
              (tspan = text
                .text(null)
                .append("tspan")
                .attr("x", x)
                .attr("y", y)
                .attr("dy", dy + "em"));
            while ((word = words.pop())) {
              line.push(word);
              tspan.text(line.join(" "));
              if (tspan.node().getComputedTextLength() > width) {
                line.pop();
                tspan.text(line.join(" "));
                line = [word];
                tspan = text
                  .append("tspan")
                  .attr("x", x)
                  .attr("y", y)
                  .attr("dy", ++lineNumber * lineHeight + dy + "em")
                  .text(word);
              }
            }
          });
        } // end wrap function
