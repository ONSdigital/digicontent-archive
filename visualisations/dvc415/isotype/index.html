<body>
            
    <div id="key"></div>       
    
	<div id="graphic">
    	<img src="fallback.png" alt="[Chart]" />

   <div class="footer"></div>      
    
    <script src="../lib/d3.v3.5.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
      
    <script>
		
		var dvc = {};
		var graphic = d3.select('#graphic');
		var key = d3.select('#key');
		var footer = d3.select(".footer");
		var pymChild = null;

		
		function drawGraphic(width) {
		   	var threshold_md = 800;// ONS website size 600px for content
		   	var threshold_sm = dvc.optional.mobileBreakpoint;
			dvc.colour = dvc.essential.color;  //["#3587A6","#FF1D25","#7AC943","#FF931E","#222"];
		//  ["#323834","#656f6b","#525b57","#4f8085","#007583","#235d77","#354969","#4c3863","#263256"]
		
		       	
		           	  	//set variables for chart dimensions dependent on width of #graphic
		    if (parseInt(graphic.style("width")) < threshold_sm) {     			 //radius = 6; 
												var margin = {
																top: 	dvc.optional.margin_sm[0], 
																right: 	dvc.optional.margin_sm[1], 
																bottom: dvc.optional.margin_sm[2],
																left: 	dvc.optional.margin_sm[3]
															};
															
												var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
												
												//var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    									}
												
			else {  //if (parseInt(graphic.style("width")) < threshold_md){ 			//radius = 8;
		        								var margin = {
																top: 	dvc.optional.margin_md[0],
																right: 	dvc.optional.margin_md[1],
																bottom: dvc.optional.margin_md[2],
																left: 	dvc.optional.margin_md[3]
															};
															 
												var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
												
		            							//var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
												}
												
		  	// else {   											//radius = 8;
//		        								var margin = {
//																top: 	dvc.optional.margin_lg[0],

				}

				}

					radius = chart_width / 50;
				}
							
				
												
				//console.log("dimensions trbl: " + margin.top + " " + margin.right + " " + margin.bottom + " " + margin.left);

														};

							keyDot.append("circle")

														return (i*20)+margin.left+8;
															})

								.style("fill", function(d,i){
														return dvc.colour[i]; // use bostock's
															})
								.style("opacity",1)
					
					//Add the SVG Text Element to the svgContainer

							legName.attr('y', function(d,i){
														return (i*20)+margin.left+ 12;
															})

								.text(function(d){
																return d.name;
															})

								.attr("font-size", "12px")
								.attr("fill", "#666");
				
					  }

							keyDot.append("circle")

																return (chart_width/3)+margin.left + 11 + radius;
																	} else {
																		return margin.left + radius;
																	}
														})
								.attr('cy', function(d,i){ if(i % 2 == 0){   // if odd 1 & 3 go down one
																return 20+"px";
																	} else {
																		return 50+"px";
																	}
															})
								.attr("r", radius)
								.style("fill", function(d,i){ 
														return dvc.colour[i]; // use bostock's
															})
								.style("opacity",1);
					
					//Add the SVG Text Element to the svgContainer
		
							//Add SVG Text Element Attributes
							legName.attr('x', function(d,i){ if(i > 1){ // second two go across
															
																return (chart_width/3)+margin.left + 26 + radius;
																	} else {
																		return margin.left + 18 + radius;
																	}
														})
								.attr('y', function(d,i){ if(i % 2 == 0){   // if odd 1 & 3 go down one
																return 25+"px";
																	} else {
																		return 55+"px";
																	}
															})
								.text(function(d){ 
																return d.name;
															})
								.attr("font-size", "12px")
								.attr("fill", "#666");
				
						  
					  
					  }  
					  
			//Hack to remove second legend elements
			
			
			d3.select("#legcircle1").remove();

		
				
			// Lets sort the data
			columnHeadings = d3.keys(graphic_data[0]).filter(function(key) { return key != 'isoNames'; } );	
			//console.log("isoName "+isoName);	

			//console.log(graphic_data);
			var cirArray = [];
				dvc.figArray = [];
				dvc.bigArray = [];
			dots = {};
			figures = [];
			var myMax = [];
			var j = 0;
		    for (var column in graphic_data[0]) { // get the length of any row
				if (column == "isoNames") continue; // not isoNames
				//console.log(column);
							cirArray[column] = [];
							myMax[j] = 0;
							dots[column] = graphic_data.map(function(d,i) { //console.log("column cir = " + column);
												//if(+d[column] > myMax) { myMax = +d[column] }
												
												//console.log(i+", j:"+j+"d "+columnHeadings[j]+" "+d[columnHeadings[j]]);
												myMax[j] = myMax[j] + (+d[columnHeadings[j]]);
												// max per row needed to Truely work out radius of dots
															cirArray[column].push( Math.round(d[columnHeadings[j]]/dvc.essential.oneIsotype) );
															//console.log(j+" "+i + "  " + Math.round(d[columnHeadings[j]]/dvc.essential.oneIsotype)  );
															});
															
							// if you use the figures to accompany the dots								
							/*dvc.figArray[j] = [];
							figures[column] = graphic_data.map(function(d) { //console.log("column fig = " + column);
															dvc.figArray[j].push(d[column]);
															}); */
													j++;
		    									};
			
			biggest = d3.max(myMax);
			//console.log("max:"+ biggest + " " + myMax);									
												
			//console.log("cirArray: "+cirArray+" [1]: "+cirArray["England"][3]+"  len: "+cirArray["England"].length ); //+" yr,0-4: "+cirArray[6][2]);
		
		
		// Let's make our bigArray so we have every data point to add to the DOM in a 3D array	
		// for (var fr = 0; fr < cirArray[0].length; fr++)  
		
		for (var fr in graphic_data[0]) {  // 2  Eng, Wales
			if (fr == "isoNames") continue; // not isoNames
			//console.log(fr);
			
			dvc.bigArray[fr] = [];
			for (var a = 0; a < cirArray[fr].length; a++)  // 4  c,v,c,w
			{  
				dvc.bigArray[fr][a] = [];
				//console.log("cirArray[fr][a]: "+cirArray[fr][a]);
				
					for (var amount = 0; amount < cirArray[fr][a]; amount++)  // push a unique no. that can be used for id 'm' amount of times
					{	//console.log("cA "+cirArray[fr][a]);
						dvc.bigArray[fr][a].push(a);
					}
			}
		}
			
		//  change the 1.8 coef if the svg container is the wrong size
			var height = radius*2 * dvc.essential.rows * columnHeadings.length * 2.75;
			//console.log(columnHeadings.length + " = h:"+height);
				
			 graphic.append("svg")
				.attr("id","grid")
				.style("fill", "#abc")
				.attr("width",chart_width)
				.attr("height", height); // 2 x radius x rows
				/*d3.select("svg")
				.attr("height",(dvc.graphHeight * howMany) + margin.top+margin.bottom);
				*/
		d3.selectAll(".someDots").remove();
		d3.selectAll(".figures").remove();
		
				//var dataSet = dvc.curr;
		
	var counter = 0;
	var figs = [];
	dvc.xArray = []; // x distance to place figs
	//for (var x = 0; x < columnHeadings.length; x++) {  // build each block with it's component
	for (var x in graphic_data[0]) {  // 2  Eng, Wales
			if (x == "isoNames") continue; // not isoNames
			//console.log("x "+x);
					
				dvc.currArray = dvc.bigArray[x];  // 0 to 13
				//console.log("dvc.currArray :"+dvc.currArray);
				dvc.enter = d3.select('#grid')
								.append("g")  // was select
								.attr("id", function(d) { return "group" + x; } ) 
								.attr("class","someDots")
								.selectAll("g")
								.data(dvc.currArray)
								.enter();
				
				//var colors = Array.prototype.slice.call(dvc.colour);				
				var newgroups = dvc.enter
									.append("g")
									.attr("id",function(d,i){return "dot" + i})
									.style("fill", function(d,i){
																return dvc.colour[i]; // use bostock's
																})
									.style("opacity", 1);
																	
		//dvc.xArray[0] = chart_width-(radius * 100);  // RESPONSIVE u r not
		var xCoord = -1;
		var xVar = 0;
		var yCoord = -1;
		
		newgroups.selectAll(".groups")
					.data(       function(d,i,j) { return d; } ) // bring in nested data [n,n,n,n...]
					.enter()
					.append("g")
					.attr("class","groups")
					.attr("id",  function(d,i,j) { return "circle" + i; } )  // i iterates j=0 on first pass
					.append("circle")
					.attr("cx",  function(d,i,j) {	
													xCoord++;
													if(xCoord == dvc.essential.rows) { xCoord=0; xVar++;} //dvc.xArray[x] = xVar*radius*2}  // when on the last row, reset and increase xVar
													if(d == 1 && i == 0) { dvc.xArray[x] = ( xVar*radius*2 )}  // dvc.xArray[0] will = 0 !!!!!
														//console.log("x: "+xVar +" "+xCoord%7);
															return (xVar*radius*2);  // never got the dvc.essential.xMargin working
										})  // ends cx function
					
					.attr("cy",  function(d,i,j) {  
												if(yCoord % (dvc.essential.rows-1) != 0 || yCoord == 0) 
													{
														yCoord++;
														//console.log(i+" y: "+yCoord);
														return (yCoord*radius*2.6);  // never got the dvc.essential.yMargin working
													}else
													{
													yCoord = 0;
													//console.log(i+" y1: "+yCoord);
													return 0;  //(yCoord*radius*4);
													}
											})
					.attr("r", radius) // var in config
					//var height = radius*2 * dvc.essential.rows * columnHeadings.length * 2;
					.attr("transform","translate("+(margin.left)+","+(margin.top+(counter*radius*2*dvc.essential.rows*2.75))+")"); // c was x  (radius*2)+
				

			// for adding iso name
					d3.select('#grid').attr('class', 'figures')
							.append("text")
							.style("fill", "#666")
							.text(columnHeadings[counter])
							.attr("transform", function(){ if (parseInt(graphic.style("width")) < threshold_sm) {
									return "translate(-8,"+(margin.top-15+(counter*radius*2*dvc.essential.rows*2.75))+")";
							}else{
									return "translate(-8,"+(margin.top-20+(counter*radius*2*dvc.essential.rows*2.75))+")";
								 }
							});
					
					
					//console.log("dvc.figArray[dataSet] "+dvc.figArray[dataSet]+"  "+x+" "+dvc.figArray[dataSet][x]);
					
					//figs[x] = dvc.figArray[x][0];
					//console.log("dvc.figArray[dvc.curr] "+dvc.figArray[dvc.curr]+"  "+x+" [0]:"+dvc.figArray[dvc.curr][0]);
				
					//dvc.xArray[0] = 36*radius*2;
					//console.log("dvc.xArray " + dvc.xArray);
			
			// Adds the other numbers if the isotype has more than one variable
				
//				dvc.figArray[dvc.curr].forEach(function(d,i) {  // append all figures for the selected group
//					
//							if(dvc.figArray[dvc.curr][i] != 0){
//								d3.select('#group'+x)

//											.attr("transform", function() {

//												return "translate("+(margin.left+dvc.xArray[0]/1.9 + i*45 )+","+(margin.top+(radius*2)+(x*radius*24))+") ";
//																							} 
//												if(parseInt(graphic.style("width")) < 600) {
//												return "translate("+(margin.left+dvc.xArray[0]/1.7 + i*50 )+","+(margin.top+(radius*2)+(x*radius*24))+") ";

			//use pym to calculate chart dimensions	
		    if (pymChild) {
		        pymChild.sendHeight();

		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   //load config 
			d3.json("config.json", function(error, config) {
			dvc=config
			
				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;
					
				//varnames = d3.keys(graphic_data[0]).filter(function(key) { return key});
						//use pym to create iframed chart dependent on specified variables
						pymChild = new pym.Child({ renderCallback: drawGraphic});
					
				});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {

		    }
