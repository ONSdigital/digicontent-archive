<!DOCTYPE html>
<html lang="en">

<head>
  <title>Black, Asian and Chinese or other ethnicities were less likely to return to employment compared to White ethnicity</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    body {
      padding-bottom: 20px;
    }

    path.connector-end.connector-arrow {
      fill: grey;
    }

    body {
      max-width: 700px;
    }

    g.tick line {
      stroke: #ccc;
    }

    path.connector-end.connector-arrow {
      fill: grey;
    }

    .annotation text {
      fill: #58595B;
    }

    .annotation-tip .annotation-note-bg {
      fill: white;
      fill-opacity: 0.9;
    }

    .annotation.badge path.subject-pointer,
    .annotation.badge path.subject {
      fill: #e8336D;
      stroke: none;
    }

    text.badge-text {
      fill: white;
    }

    .annotation.badge path.subject-ring {
      fill: none;
      stroke: none;
    }


    #graphic .axis text {
      font-size: 16px;
      fill: #58595B;
    }

    @media(max-width: 414px) {
      #graphic .axis text,#graphic text.unit {
        font-size: 12px;
        fill: #58595B;
      }

      .annotation text {
        font-size: 12px;
      }
    }
    h3,
    h4,
    h5 {
      font-weight: 700;
      margin: 16px 0 0 0;
      padding: 3px 0 5px 0;
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      color: #323132;
      -webkit-font-smoothing: antialiased;
    }


    h3 {
      font-size: 24px;
      line-height: 32px;
    }

    h4 {
      font-size: 20px;
      line-height: 32px;
    }

    h5 {
      padding: 0px;
      font-size: 16px;
      line-height: 32px;
    }

    @media(max-width: 767px) {
      h3 {
        font-size: 18px;
        line-height: 24px;
      }

      h4 {
        font-size: 16px;
        line-height: 24px;
      }

      h5 {
        font-size: 16px;
        line-height: 24px;
      }
    }


  </style>

</head>

<body>
  <h3 class="visuallyhidden">Black, Asian and Chinese or other ethnicities were less likely to return to employment compared to White ethnicity</h3>
  <div id="graphic"><img src="fallback.png" alt="[Chart]" /></div>




  <!-- Define the source -->
  <div id="footer"> </div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <script src="../lib/d3-annotation.js" type="text/javascript"></script>
  <script src="../lib/d3plus-text.v0.9.full.min.js"></script>
  <script>
    var graphic = d3.select('#graphic');
    var keypoints = d3.select('#keypoints');
    var footer = d3.select("#footer");
    var pymChild = null;


    function drawGraphic(width) {

      var threshold_md = 600; // new code ..
      var threshold_sm = dvc.optional.mobileBreakpoint;

      //set variables for chart dimensions dependent on width of #graphic
      if (parseInt(graphic.style("width")) < threshold_sm) {
        var margin = {
          top: dvc.optional.margin_sm[0],
          right: dvc.optional.margin_sm[1],
          bottom: dvc.optional.margin_sm[2],
          left: dvc.optional.margin_sm[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[0] * graphic_data.length - margin.top - margin.bottom;
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        var margin = {
          top: dvc.optional.margin_md[0],
          right: dvc.optional.margin_md[1],
          bottom: dvc.optional.margin_md[2],
          left: dvc.optional.margin_md[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[1] * graphic_data.length - margin.top - margin.bottom;
      } else {
        var margin = {
          top: dvc.optional.margin_lg[0],
          right: dvc.optional.margin_lg[1],
          bottom: dvc.optional.margin_lg[2],
          left: dvc.optional.margin_lg[3]
        }
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[2] * graphic_data.length - margin.top - margin.bottom;
      }


      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      var num_ticks = 10;

      var color = d3.scaleOrdinal().range(dvc.essential.colour_palette);

      // vertical
      y0 = d3.scaleBand().range([0, height]).paddingInner(0.1);;
      var x = d3.scaleLinear().range([0, chart_width]);
      var xDomain = dvc.essential.xAxisScale;

      x.domain(xDomain);

      var parseDate = d3.timeParse("%Y");

      xCategorial=d3.scaleOrdinal().range([x(-0.1), x(-0.05),x(-0.04),x(-0.03),x(-0.02),x(-0.01),x(0),x(0.05)]).domain(["10pp less likely","5pp less likely","4pp less likely","3pp less likely","2pp less likely","1pp less likely","No change","5pp more likely"])

      var xAxis = d3.axisBottom(xCategorial)




      var svg = d3.select('#graphic').append('svg').attr('id','chart1')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .attr("title", dvc.essential.title)
        .attr("desc", dvc.essential.desc)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + (margin.top) + ")")
        .attr('class','chart')

      // var svg2 = d3.select('#graphic').append('svg').attr('id','chart2')
      //   .attr("width", chart_width + margin.left + margin.right)
      //   .attr("height", height + margin.top + margin.bottom)
      //   .attr("title", dvc.essential.title2)
      //   .attr("desc", dvc.essential.desc2)
      //   .append("g")
      //   .attr("transform", "translate(" + margin.left + "," + (margin.top) + ")")
      //   .attr('class','chart')

      both=d3.selectAll('.chart')

      // vertical
      y0.domain(d3.map(graphic_data,function(d) {
        return d.state;
      }).keys());


      var yAxis = d3.axisLeft(y0)
        // .tickFormat(function(d, i) {
        //
        //   //specify date format for x axis depending on #graphic width
        //   if (parseInt(graphic.style("width")) <= threshold_sm) {
        //     var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[0]);
        //   } else if (parseInt(graphic.style("width")) <= threshold_md) {
        //     var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[1]);
        //   } else {
        //     var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[2]);
        //   }
        //
        //   if (dvc.essential.GraphType == "clusterBar") {
        //     return d;
        //   } /* new code */
        //   else {
        //     return fmt(d);
        //   } /* new code */
        //
        // })
        .tickPadding(5);

      //specify number of ticks on x axis
      if (parseInt(graphic.style("width")) < threshold_sm) {
        xAxis.tickValues(dvc.optional.x_num_ticks_sm_md_lg[0])
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        xAxis.tickValues(dvc.optional.x_num_ticks_sm_md_lg[1])
      } else {
        xAxis.tickValues(dvc.optional.x_num_ticks_sm_md_lg[2])
      }

      //specify number or ticks on y axis
      if (parseInt(graphic.style("width")) <= threshold_sm) {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[0]));
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[1]));
      } else {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[2]));
      }

      both.append("g")
        .attr("class", "x axis")
        .attr('transform', 'translate(' + 0 + ',' + height + ')')
        .call(xAxis.tickSize(-height, 0))

      // svg2.append("g")
      //   .attr("class", "x axis")
      //   .attr('transform', 'translate(' + 0 + ',' + height + ')')
      //   .call(xAxis.tickSize(-height, 0))

      d3.selectAll('.x path.domain').style('stroke','none')

      // svg
      // .append('text')
      // .text(dvc.essential.legendLabels[0])
      // .attr('fill',dvc.essential.colour_palette[0])
      // .attr('font-weight',700)
      // .attr('x',-margin.left)
      // .attr('y',-margin.top+12)

      // svg2
      // .append('text')
      // .text(dvc.essential.legendLabels[1])
      // .attr('fill',dvc.essential.colour_palette[1])
      // .attr('font-weight',700)
      // .attr('x',-margin.left)
      // .attr('y',-margin.top+12)


      //create y axis, if x axis doesn't start at 0 nudge y axis accordingly
      both.append('g')
        .attr('class', 'y axis')
        .call(yAxis);

      d3.selectAll(".y").select("path").style("stroke", "#666")

      firstcategory = graphic_data[0].state

      // annotations
      if (parseInt(graphic.style("width")) >= threshold_md) {
        var annotations = [
          {
            note: {
              label: "Decreased likelihood to return to work",
              bgPadding: 5,
              // wrap: 200,
              align: "middle",
              orientation: "top",
              wrap: 200
              // lineType: "vertical"
            },
            x: x(-0.035) + margin.left,
            y: y0(firstcategory) + margin.top -5,
            dy: 0,
            dx: x(0) - x(-0.01),
            type: d3.annotationLabel,
            connector: {
              end: "arrow",
            }
          },
          {
            note: {
              title: "Comparison group:\n"+dvc.essential.comparisonGroup,
              bgPadding: 5,
              wrap: 200,
              align: "middle",
              orientation: "top",
              wrapSplitter: /\n/
              // lineType: "vertical"
            },
            x: x(0) + margin.left,
            y: y0(firstcategory) + margin.top ,
            // dy: 0,
            // dx: x(1.0)-x(0.9),
            type: d3.annotationLabel,
            connector: {
              end: "arrow",
            }

          }
        ]
      }
      else {
        var annotations = [
          {
            note: {
              label: "Decreased likelihood to return to work",
              bgPadding: 5,
              // wrap: 200,
              align: "right",
              orientation: "top",
              wrap: 100
              // lineType: "vertical"
            },
            x: x(-0.025) + margin.left,
            y: y0(firstcategory) + margin.top -5,
            dy: 0,
            dx:  x(0) - x(-0.025),
            type: d3.annotationLabel,
            connector: {
              end: "arrow",
            }
          },
          {
            note: {
              title: "Comparison group:\n"+dvc.essential.comparisonGroup,
              bgPadding: 5,
              wrap: margin.left,
              align: "left",
              orientation: "top",
              wrapSplitter: /\n/
              // lineType: "vertical"
            },
            x: 0,
            y: y0(firstcategory) + margin.top ,
            // dy: 0,
            // dx: x(1.0)-x(0.9),
            type: d3.annotationLabel,
            connector: {
              end: "arrow",
            }

          }
        ]
      }


      var makeAnnotations = d3.annotation()
        .notePadding(0)
        .annotations(annotations)

      var makeAnnotations2 = d3.annotation()
        .notePadding(0)
        .annotations(annotations)



      d3.selectAll("svg")
        .append("g")
        .attr("class", "annotation-group")
        .call(makeAnnotations)



      d3.selectAll(".note-line").style("opacity", 0)

      //create link to source
      d3.select('#footer')
        .append("h5")
        .html("Source: " + dvc.essential.sourceText)

      both.append("text")
        .attr('class', 'unit')
        // .style("font-size", "16px")
        .attr("text-anchor", "end")
        .attr("fill", "#58595B")
        .attr("x",chart_width)
        .attr("y",height + 40)
        .text(function(d, i) {
          return "Percentage points difference of returning to employment compared to "+dvc.essential.comparisonGroup
        })
        .call(wrap,chart_width+margin.left);

      dots=[]
      graphic_data.forEach(function(d, i){
        dots.push({state:d.state,value:+d.value,name:d.category})
        // dots.push({state:d.state,value:+d.value,name:d.category})
      });

      ends=[]
      graphic_data.forEach(function(d){
        ends.push({state:d.state,value:+d.UCI,name:d.category})
        ends.push({state:d.state,value:+d.LCI,name:d.category})
      })

      lines=[]
      graphic_data.forEach(function(d){
        lines.push({state:d.state,name:d.category,upper:+d.UCI,lower:+d.LCI})
      })

      categories = d3.map(graphic_data,function(d){return d.category}).keys()

      svg.selectAll("circles")
        .data(dots.filter(function(d){return d.name==categories[0]}))
        .enter()
        .append("circle")
        .attr("cx", function(d) {
          return x(d.value);
        })
        .attr("cy", function(d) {
          return y0(d.state) + y0.bandwidth()/2
        })
        .attr("r", function(d) {
          return 5;
        })
        .style("fill", function(d) {
          return color(d.name);
        })
        .style("opacity", 1)

      svg.selectAll('line.ends')
          .data(ends.filter(function(d){return d.name==categories[0]}))
          .enter()
          .append('line')
          .attr('class','ends')
          .attr('x1',function(d){return x(d.value)})
          .attr('x2',function(d){return x(d.value)})
          .attr('y1',function(d){
            return y0(d.state)+y0.bandwidth()/2-5
          })
          .attr('y2',function(d){
            return y0(d.state)+y0.bandwidth()/2+5
          })
          .attr("stroke", function(d) {
            return color(d.name);
          })
          .attr('stroke-width','2px')

      svg.selectAll('line.between')
          .data(lines.filter(function(d){return d.name==categories[0]}))
          .enter()
          .append('line')
          .attr('class','between')
          .attr('x1',function(d){
            return x(d.upper)
          })
          .attr('x2',function(d){return x(d.lower)})
          .attr('y1',function(d){
            return y0(d.state)+y0.bandwidth()/2
          })
          .attr('y2',function(d){
            return y0(d.state)+y0.bandwidth()/2
          })
          .attr("stroke", function(d) {
            return color(d.name);
          })
          .attr('stroke-width','2px')


      //create centre line if required
      both.append("line")
        .attr("id", "centreline")
        .attr('x1', x(dvc.optional.centre_line_value))
        .attr('x2', x(dvc.optional.centre_line_value))
        .attr('y1', 0)
        .attr('y2', height);


      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x"),
            dy = 0//parseFloat(text.attr("dy")),
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }

      d3.selectAll("path").attr("fill", "none");

      d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

      d3.selectAll(".y text").attr("font-size", "12px").attr("fill", "#666");
      d3.selectAll(".x text").attr("font-size", "12px").attr("fill", "#666"); // dates - timelines

      d3.selectAll(".x line")
        .attr("stroke", "#CCC")
        .attr("stroke-width", "1px")
        .style("shape-rendering", "crispEdges");



      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {

        dvc = config;

        d3.csv(dvc.essential.graphic_data_url, function(error, data) {

          graphic_data = data;

          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });
      })
    } else {
      pymChild = new pym.Child();
      pymChild.sendHeight();
    }
  </script>

</html>
