<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title>Non-covid excess deaths by age groups</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    svg{
      vertical-align: middle;
    }

    body {
      color: #323132;
      padding-bottom: 10px;
    }

    .x.axis path {
      display: none;
    }

    path.line {
      fill: none;
    }

    text {
      font-family: 'Open Sans'
    }

    text.x,
    text.y {
      font-size: 12px;
      fill: #666;
    }

    line.y,
    line.x {
      stroke: #ccc;
      stroke-width: 1px;
      shape-rendering: crispEdges;
    }

    #legend {
      font-size: 12px;
      position:relative;
      width:100%;
    }

    #legend .axis{
      font-size: 12px;
    }

    #legend .axis line {
        fill: none;
        stroke: #ccc;
        shape-rendering: crispEdges;
    }



    h4 {
      font-size: 16px;
      line-height: 24px;
      margin: 16px 0 16px 0;
      padding: 24px 0 0 0;
      font-weight: bold;
    }

    h5 {
      font-size: 14px;
      margin: 0 0 16px 0;
      font-weight: normal;
      padding-top: 0;
    }

    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }
  </style>
</head>

<body>
  <!-- <h4>The North West and North East have the highest number of deaths compared to the 5 year average for week 19 (week ending 8 May 2020).</h4>
  <h5>Weekly deaths by English regions and Wales</h5> -->
  <div id="legend"></div>
  <div id="graphic" style="position:relative">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <h6 id="source"></h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="../lib/pym.js" type="text/javascript"></script>
  <script>
    var graphic = d3.select('#graphic');
    var legend = d3.select('#legend');
    var pymChild = null;

    function drawGraphic() {
      var maxweek=d3.max(graphic_data,function(d){return +d.date})

      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      if(Array.isArray(dvc.essential.categorySort)){
        categorySort = {}
        for (i = 0; i < dvc.essential.categorySort.length; i++) {
          categorySort[dvc.essential.categorySort[i]] = i;
        }

        graphic_data.sort(function(a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories=Object.keys(categorySort)
      } else {
        //auto sort the array by biggest value at the last date
        categorySort = {}

        graphic_data.filter(function(d){
          return d.date==maxweek
        }).sort(function(a,b){return +b.chiffre - (+a.chiffre)}).forEach(function(item, i){
          categorySort[item.category]=i
        });

        graphic_data.sort(function(a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories=Object.keys(categorySort)
      }





      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) / dvc.optional.chart_every[size] - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();
      legend.selectAll("*").remove();

      //draw legend
      legend.append('svg').attr("height", dvc.optional.legendHeight[size]).attr("width", dvc.optional.chart_every[size] * (chart_width + margin.left + margin.right)).append('g')
        .attr('transform', 'translate(5,5)')

      legenddef=legend.select('svg').append('defs').append('pattern')
            .attr('id',"hash")
            .attr('patternUnits',"userSpaceOnUse")
            .attr("patternTransform","rotate(45 0 0)")
            .attr("width",4)
            .attr("height",4)

            legenddef.append('rect')
            .attr("height","10")
            .attr("width","10")
            .attr("fill","#949494")

            legenddef.append("line")
            .attr("x1",0)
            .attr("x2",0)
            .attr("y1",0)
            .attr("y2",10)
            .style("stroke","#dedede")
            .style("stroke-width",4)

      createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        dvc.essential.colour_palette.map(function(d) {
          return d.key
        }).forEach(function(d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").select('svg').append("g")

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", dvc.essential.colour_palette[i].colour)
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", function() {
              if (dvc.essential.colour_palette[i].type == "rect") {
                return 15
              } else {
                return 20
              }
            })
            .attr("height", function() {
              if (dvc.essential.colour_palette[i].type == "rect") {
                return 15
              } else {
                return 3
              }
            })

          var_group.append("text")
            .text(dvc.essential.colour_palette[i].key)
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "12px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);


          d3.selectAll(".legend" + (i))
            .each(calcPosition);

          function calcPosition() {


            var BBox = this.getBBox()


            //prevY =BBox.width
            d3.select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function(d) {
                return prevX + 25;
              })


            d3.select(".rect" + (i))
              .attr("y", function(d) {

                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }

                if (dvc.essential.colour_palette[i].type == "rect") {
                  return eval((lineNo * 20) + 5);
                } else {
                  return eval((lineNo * 20) + 12);

                }
              })
              .attr("x", function(d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50



          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()

      colour=d3.scaleOrdinal()
      .range(["#234d70","#00a5a1"])
      .domain(["Men","Female"])

      hash=d3.scaleOrdinal()
      .range(["url(#Men)","url(#Female)"])
      // .range(["#53799f","#58d7d2"])
      .domain(["Men","Female"])


      daterange=d3.timeDays(d3.timeParse("%d%m%y")("030120"),d3.timeParse("%d%m%y")("080520"),7)

      swapdates=daterange.reduce(function(acc, cur, i) {
        acc[i+1] = cur;
        return acc;
      }, {});

      x = d3.scaleBand()
        .rangeRound([0, chart_width])
        .paddingInner(0.1);

      x.domain(d3.map(graphic_data, function(d) {
        return d.date
      }).keys())

      xCat=d3.scaleBand()
        .rangeRound([0,x.bandwidth()])
        .domain(["Men","Female"])

      var xAxis = d3.axisBottom(x)
        .tickValues(x.domain().filter(function(d, i) {
          return i % dvc.optional.x_ticks_every[size] === 0&&i<daterange.length-dvc.optional.x_ticks_every[size] || i==daterange.length-1 //Rob's fussy comment about labelling the last date
        }))
        .tickFormat(function(d){return d3.timeFormat("%d %b")(swapdates[d])})

      nested = d3.nest()
        .key(function(d) {
          return d.category
        })
        .key(function(d) {
          return d.sex
        })
        .entries(graphic_data)

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      y = {}


      if (dvc.essential.yAxisScale == "auto_zero_max_total") {
        var yDomain = [0, d3.max(graphic_data, function(d) {
          var max = d3.max([+d["max"], +d.chiffre])
          return max
        })];
        nested.forEach(function(item, i){
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.yAxisScale == "auto_min_max_total") {
        var yDomain = [d3.min(graphic_data,function(d){
          var min = d3.min([+d.min,+d.chiffre])
          return min
        }),
        d3.max(graphic_data, function(d) {
          var max = d3.max([+d["max"], +d.chiffre])
          return max
        })]

        nested.forEach(function(item, i){
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.yAxisScale == "auto_min_max_each") {
        rolledup = d3.nest()
          .key(function(d) {
            return d.category
          })
          .rollup(function(v) {
            return [d3.min(v, function(d) {
              var min = d3.min([+d["min"], +d.chiffre])
              return min
            }), d3.max(v, function(d) {
              var max = d3.max([+d["max"], +d.chiffre])
              return max
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(item.value)
            .nice();
        });

      } else if (dvc.essential.yAxisScale == "auto_zero_max_each") {
        rolledup = d3.nest()
          .key(function(d) {
            return d.category
          })
          .rollup(function(v) {
            return [0, d3.max(v, function(d) {
              var max = d3.max([+d["max"], +d.chiffre])
              return max
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(item.value)
            .nice();
        });
      }

      charts = d3.select('#graphic')
        .selectAll('svg')
        .data(nested)
        .enter()
        .append('svg')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 12)
        .text(function(d) {
          return d.key
        })
        .attr('font-weight', 700)
        .attr('font-size', "14px")

      svg = charts
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      svg
        .append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0," + height + ")")
        .call(xAxis)
        .each(function(d, i) {
          if (i % dvc.optional.chart_every[size] == dvc.optional.chart_every[size] - 1) {
            d3.select(this).append("text")
              .text("Week number")
              .attr("transform", "translate(" + chart_width + "," + (margin.bottom - 5) + ")")
              .attr('text-anchor', 'end')
              .attr('fill', "#666");
          }
        })

      patternMen=svg.append('defs').append('pattern')
      .attr('id',"Men")
      .attr('patternUnits',"userSpaceOnUse")
      .attr("patternTransform","rotate(45 0 0)")
      .attr("width",4)
      .attr("height",4)

      patternMen.append('rect')
      .attr("height","10")
      .attr("width","10")
      .attr("fill","#234d70")

      patternMen.append("line")
      .attr("x1",0)
      .attr("x2",0)
      .attr("y1",0)
      .attr("y2",10)
      .style("stroke","#83a7d0")
      .style("stroke-width",4)

      patternFemale=svg.append('defs').append('pattern')
      .attr('id',"Female")
      .attr('patternUnits',"userSpaceOnUse")
      .attr("patternTransform","rotate(45 0 0)")
      .attr("width",4)
      .attr("height",4)

      patternFemale.append('rect')
      .attr("height","10")
      .attr("width","10")
      .attr("fill","#00a5a1")

      patternFemale.append("line")
      .attr("x1",0)
      .attr("x2",0)
      .attr("y1",0)
      .attr("y2",10)
      .style("stroke","#74f1ec")
      .style("stroke-width",4)

      //create svg for chart

      drawyaxis = svg
        .append('g')
        .attr('class', 'y axis')

      drawyaxis.each(function(d, i) {
        if (dvc.essential.yAxisScale == "auto_min_max_each" || dvc.essential.yAxisScale == "auto_zero_max_each") {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).ticks(dvc.optional.y_axis_ticks[size]))
        } else {
          if (i % dvc.optional.chart_every[size] == 0) {
            d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickFormat(d3.format(".0%")).ticks(dvc.optional.y_axis_ticks[size]));
          } else {
            d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickFormat("").ticks(dvc.optional.y_axis_ticks[size]))
          }
        }


      })

      //special svg across the top for all ages
      specialnested=d3.nest().key(function(d){return d.sex}).entries(allages)

      special=d3.select('#legend').append('svg').data(specialnested)
      .attr("width", (chart_width + margin.left + margin.right)*dvc.optional.chart_every[size])
      .attr("height", height + margin.top + margin.bottom)

      special.append('text')
      .attr("x", margin.left)
      .attr("y", 12)
      .text(function(d) {
        return "All ages"
      })
      .attr('font-weight', 700)
      .attr('font-size', "14px")

      specialChart=special.append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      specialWidth=((chart_width + margin.left + margin.right)*dvc.optional.chart_every[size])-margin.left-margin.right

      xspecial=d3.scaleBand()
      .rangeRound([0,specialWidth])
      .domain(d3.map(allages,function(d){return d.date}).keys())
      .paddingInner(0.1)

      specialChart.append('g')
      .attr('class', 'x axis')
      .attr("transform", "translate(0," + height + ")")
      .call(d3.axisBottom(xspecial)
          .tickValues(xspecial.domain()
          .filter(function(d, i) {
            return i % dvc.optional.special_x_ticks_every[size] === 0&&i<daterange.length-dvc.optional.special_x_ticks_every[size] || i==daterange.length-1 //Rob's fussy comment about labelling the last date
          }))
          .tickFormat(function(d){return d3.timeFormat("%d %b")(swapdates[d])})
      )
      .append("text")
      .text("Week number")
      .attr("transform", "translate(" + specialWidth + "," + (margin.bottom - 5) + ")")
      .attr('text-anchor', 'end')
      .attr('fill', "#666");

      specialpatternMen=special.append('defs').append('pattern')
      .attr('id',"Men")
      .attr('patternUnits',"userSpaceOnUse")
      .attr("patternTransform","rotate(45 0 0)")
      .attr("width",4)
      .attr("height",4)

      specialpatternMen.append('rect')
      .attr("height","10")
      .attr("width","10")
      .attr("fill","#234d70")

      specialpatternMen.append("line")
      .attr("x1",0)
      .attr("x2",0)
      .attr("y1",0)
      .attr("y2",10)
      .style("stroke","#83a7d0")
      .style("stroke-width",4)

      specialpatternFemale=special.append('defs').append('pattern')
      .attr('id',"Female")
      .attr('patternUnits',"userSpaceOnUse")
      .attr("patternTransform","rotate(45 0 0)")
      .attr("width",4)
      .attr("height",4)

      specialpatternFemale.append('rect')
      .attr("height","10")
      .attr("width","10")
      .attr("fill","#00a5a1")

      specialpatternFemale.append("line")
      .attr("x1",0)
      .attr("x2",0)
      .attr("y1",0)
      .attr("y2",10)
      .style("stroke","#74f1ec")
      .style("stroke-width",4)

      specialChart.append('g')
      .attr('class','y axis')
      .call(d3.axisLeft(y["10 to 19"]).tickSize(-specialWidth).tickFormat(d3.format(".0%")).ticks(dvc.optional.y_axis_ticks[size]))

      specialxCat=d3.scaleBand().range([0,xspecial.bandwidth()]).domain(["Men","Female"])

      specialrects=specialChart.selectAll('g.sex').data(specialnested)
      .enter()
      .append('g')
      .attr('class',function(d){return d.key})
      .attr("transform",function(d){return 'translate('+specialxCat(d.key)+',0)'})

      specialrects.selectAll('rect.under')
      .data(function(d){return d.values})
      .enter()
      .append('rect')
      .attr('class','under')
      .attr('y',function(d){
        return y["10 to 19"](d3.max([1,+d.chiffre]))
      })
      .attr('x',function(d){return xspecial(d.date)})
      .attr('width',function(d,i){return specialxCat.bandwidth()})
      .attr('height',function(d){return Math.abs(y["10 to 19"](d.chiffre)-y["10 to 19"](1))})
      .attr('fill',function(d){
        if(d.chiffre>d.max||d.chiffre<d.min){
          return colour(d.sex)
        }else{
          return hash(d.sex)
        }
      })

      // annotation line
      specialChart.append('line')
        .attr("x1",xspecial(11))
        .attr("x2",xspecial(11))
        .attr("y1",3)
        .attr("y2",height)
        .attr("stroke-dasharray","5 5")
        .attr("stroke","#808080")
        .attr("stroke-width","2px")

      specialChart.append('text')
        .attr("x",xspecial(11)+3)
        .attr("y",0)
        .text('COVID-19 deaths first registered')
        .attr("fill","#808080")
        .attr("text-anchor","middle")

      specialrects.selectAll('rect.over')
      .data(function(d){return d.values.filter(function(d){return d.chiffre>d.max||d.chiffre<d.min})})
      .enter()
      .append('rect')
      .attr('class','over')
      .attr('y',function(d){
        if(+d.chiffre<1){return y["10 to 19"](1)}
        else{ return y["10 to 19"](d.max)}
      })
      .attr('x',function(d){return xspecial(d.date)})
      .attr('width',function(d,i){return specialxCat.bandwidth()})
      .attr('height',function(d){return Math.abs(y["10 to 19"](d.max)-y["10 to 19"](1))})
      .attr('fill',function(d){ return hash(d.sex)})


      //small multiples

      // annotation line
      svg.append('line')
        .attr("x1",x(11))
        .attr("x2",x(11))
        .attr("y1",0)
        .attr("y2",height)
        .attr("stroke-dasharray","5 5")
        .attr("stroke","#808080")
        .attr("stroke-width","2px")

      //stacked bars


      rects=svg.selectAll('g.sex').data(function(d){return d.values})
        .enter()
        .append('g')
        .attr('class',function(d){return d.key})
        .attr("transform",function(d){return 'translate('+xCat(d.key)+',0)'})

      rects.selectAll('rect.under')
      .data(function(d){return d.values})
      .enter()
      .append('rect')
      .attr('class','under')
      .attr('y',function(d){
        return y[d.category](d3.max([1,+d.chiffre]))
      })
      .attr('x',function(d){return x(d.date)})
      .attr('width',function(d,i){return xCat.bandwidth()})
      .attr('height',function(d){return Math.abs(y[d.category](d.chiffre)-y[d.category](1))})
      .attr('fill',function(d){
        if(d.chiffre>d.max||d.chiffre<d.min){
          return colour(d.sex)
        }else{
          return hash(d.sex)
        }
      })

      //now put hash over rectangles
      rects.selectAll('rect.over')
      .data(function(d){return d.values.filter(function(d){return d.chiffre>d.max||d.chiffre<d.min})})
      .enter()
      .append('rect')
      .attr('class','over')
      .attr('y',function(d){
        if(+d.chiffre<1){return y[d.category](1)}
        else{ return y[d.category](d.max)}
      })
      .attr('x',function(d){return x(d.date)})
      .attr('width',function(d,i){return xCat.bandwidth()})
      .attr('height',function(d){return Math.abs(y[d.category](d.max)-y[d.category](1))})
      .attr('fill',function(d){ return hash(d.sex)})
