    body {
      max-width: 700px;

    h5,h6 {

    .btn {

<body>

  <div id="graphic">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <h6 id="source"></h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <script>
    var graphic = d3.select('#graphic');
    var pymChild = null;



    function drawGraphic(width) {
      var threshold_md = dvc.essential.mediumBreakpoint;
      var threshold_sm = dvc.essential.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();

      x = d3.scaleBand()
        .range([0, chart_width])
        .paddingInner(0.1)

      x.domain(d3.map(graphic_data, function(d) {
        return d.date;
      }).keys());

      y = d3.scaleLinear()
        .rangeRound([height, 0]);

      xtime=d3.scaleTime()
      .range([0,chart_width-x.bandwidth()])
      .domain(d3.extent(graphic_data,function(d){return d.date}))

      // colour scale
      var z = d3.scaleOrdinal(dvc.essential.colour_palette);

      z.domain(graphic_data.columns.slice(1));

      var xAxis = d3.axisBottom(xtime)
        .tickValues(graphic_data.map(function(d){return d.date}).filter(function(d, i) {
          return i % dvc.optional.x_ticks_every[size] === 0&&i<graphic_data.length-dvc.optional.x_ticks_every[size] || i==graphic_data.length-1 //Rob's fussy comment about labelling the last date
        }))
        .tickPadding(8)
        .tickFormat(d3.timeFormat("%d %b"))
        // .tickSize(0)

      var yAxis = d3.axisLeft(y)
        .tickSize(-chart_width)
        .ticks(dvc.optional.y_num_ticks[size])

      var legend = d3.select('#graphic').append('svg')
        .append("g")
        .attr("id", "legend");

      var svg = d3.select('svg')
        .attr("id", "chart")
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");



      //y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      if (dvc.essential.yAxisScale == "auto_zero_max") {
        var yDomain = [
          0, Math.ceil(d3.max(graphic_data, function(d) {
            return d.total;
          }))
        ];
      } else if (dvc.essential.yAxisScale == "auto_min_max") {
        var yDomain = [
          Math.floor(d3.min(graphic_data, function(d) {
            return d.total
          })), Math.ceil(d3.max(graphic_data, function(d) {
            return d.total;
          }))
        ];
      } else {
        var yDomain = dvc.essential.yAxisScale;
      }

      y.domain(yDomain);

      svg.append('g')
        .attr('class', 'x axis')
        .attr('transform', 'translate('+(x.bandwidth()/2)+',' + (height * 1.00) + ')')
        .call(xAxis)
        .append("text")
        .attr("x", chart_width)
        .attr("y", +40)
        .style("text-anchor", "end")
        .text(dvc.essential.xAxisLabel)
        .attr('transform', 'translate('+(-x.bandwidth()/2)+',-3)')


      svg.append('g')
        .attr('class', 'y axis')
        .call(yAxis)
        .append("text")
        .attr("x", -margin.left)
        .attr("y", -20)
        .style("text-anchor", "start")
        .text(dvc.essential.yAxisLabel);

      var stack = d3.stack();

      var group = svg.selectAll(".year")
        .data(stack.keys(graphic_data.columns.slice(1))(graphic_data))
        .enter().append("g")
        .attr("class", "g bars")
        .attr("fill", function(d) {
          return z(d.key);
        });

      group.selectAll("rect")
        .data(function(d) {
          return d;
        })
        .enter().append("rect")
        .attr("class", function(d, i) {
          return "bar-" + i
        })
        .attr("x", function(d) {
          return x(d.data.date);
        })
        .attr("width", x.bandwidth())
        .attr("y", function(d) {
          if(d.data.excess<1){
            if(d[0]==0){return y(0)}
            else{return y(d[1]-d[0])}
          }else{
            if (d[1] < 0) {
              return y(0);
            } else {
              return y(d[1]);
            }
          }

        })
        .attr("height", function(d) {
          return Math.abs(y(d[0]) - y(d[1]));
        })
        .style("opacity", 1);



        //draw some annotations on by hand
        //
        // svg.append('defs').append('marker')
        // .attr('id','arrow')
        // .attr('viewBox',"0 0 10 10")
        // .attr('refX',5)
        // .attr('refY',5)
        // .attr('markerWidth',6)
        // .attr('markerHeight',6)
        // .attr('orient',"auto-start-reverse")
        // .append('path')
        // .attr('d',"M 0 0 L 10 5 L 0 10 z")
        //
        // svg.append('line')
        // .attr("x1",x("Fri Jan 10 2020 00:00:00 GMT+0000 (Greenwich Mean Time)")+x.bandwidth()/2)
        // .attr("x2",x("Fri Jan 10 2020 00:00:00 GMT+0000 (Greenwich Mean Time)")+x.bandwidth()/2)
        // .attr("y1",y(5000))
        // .attr("y2",y(3000))
        // .attr("stroke",'black')
        // .attr('marker-start',"url(#arrow)")
        //
        // svg.append('line')
        // .attr("x1",x("Fri Jan 10 2020 00:00:00 GMT+0000 (Greenwich Mean Time)")+x.bandwidth()/2)
        // .attr("x2",x("Fri Jan 10 2020 00:00:00 GMT+0000 (Greenwich Mean Time)")+x.bandwidth()/2)
        // .attr("y1",y(-3000))
        // .attr("y2",y(-1000))
        // .attr("stroke",'black')
        // .attr('marker-start',"url(#arrow)")
        //
        // svg.append('text')
        // .attr('class','annotext')
        // .attr('id','annotext0')
        // .attr('x',x("Fri Jan 10 2020 00:00:00 GMT+0000 (Greenwich Mean Time)")+x.bandwidth()*0.75)
        // .attr('y',y(3000)-6)
        // .text("Deaths above average")
        //
        // svg.append('text')
        // .attr('class',"annotext")
        // .attr('id','annotext1')
        // .attr('x',x("Fri Jan 10 2020 00:00:00 GMT+0000 (Greenwich Mean Time)")+x.bandwidth()*0.75)
        // .attr('y',y(-1500)+15)
        // .text("Deaths below average")


        d3.selectAll('text.annotext').each(function(d,i){
          var BBox=this.getBBox()
          d3.select(this.parentNode).insert("rect","#annotext"+i)
          .attr("x",BBox.x)
          .attr("y",BBox.y)
          .attr("width", BBox.width)
          .attr("height", BBox.height)
          .attr("fill", "white");
        })


        createLegend();

        function createLegend() {

          var prevX = 0;
          var prevY = 0;
          lineNo = 0;
          var lineNoOld = 0;

          dvc.essential.legendLabels.forEach(function(d, i) {

            // draw legend text based on content of var legendLabels ...
            var_group = d3.select("#legend").append("g")

            var_group.append("rect")
              .attr("class", "rect" + i)
              .attr("fill", dvc.essential.colour_palette[i])
              .attr("x", 0)
              .attr("y", 0)
              .attr("width", 15)
              .attr("height", 15)

            var_group.append("text")
              .text(dvc.essential.legendLabels[i])
              .attr("class", "legend" + i)
              .attr("text-anchor", "start")
              .style("font-size", "12px")
              .style("fill", "#666")
              .attr('y', 15)
              .attr('x', 0);


            d3.selectAll(".legend" + (i))
              .each(calcPosition);

            function calcPosition() {


              var BBox = this.getBBox()


              //prevY =BBox.width
              d3.select(".legend" + (i))
                .attr("y", function(d) {
                  if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                    lineNoOld = lineNo;
                    lineNo = lineNo + 1;
                    prevX = 0;
                  }
                  return eval((lineNo * 20) + 20);
                })
                .attr("x", function(d) {
                  return prevX + 25;
                })


              d3.select(".rect" + (i))
                .attr("y", function(d) {

                  if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                    lineNoOld = lineNo;
                    lineNo = lineNo + 1;
                    prevX = 0;
                  }

                  if (dvc.essential.legendStyle == "rect") {
                    return eval((lineNo * 20) + 5);
                  } else {
                    return eval((lineNo * 20) + 8);

                  }
                })
                .attr("x", function(d) {
                  return prevX;
                })

              prevX = prevX + BBox.width + 50



            }; // end function calcPosition()
          }); // end foreach
        } // end function createLegend()


      //create link to source
      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      if (pymChild) {
        pymChild.sendHeight();
      }
    }

    if (Modernizr.svg) {

      d3.json("config.json", function(error, config) {
        dvc = config

        d3.csv(dvc.essential.graphic_data_url, type, function(error, data) {
          graphic_data = data;

          graphic_data.forEach(function(d){
            d.date=d3.timeParse(dvc.essential.dateFormat)(d.date)
          })
          // sort data
          if (dvc.essential.sort_data === true) {
            graphic_data.sort(function(a, b) {
              return b.total - a.total;
            });
          }

          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });

        });
      });

      // strings to numbers
      function type(d, i, columns) {
        for (i = 1, t = 0; i < columns.length; ++i) t += d[columns[i]] = +d[columns[i]];
        d.total = t;
        return d;
      }

    } else {
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
  </script>
