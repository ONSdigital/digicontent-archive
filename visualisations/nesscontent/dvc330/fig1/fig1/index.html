<!DOCTYPE html>
<html lang="en">

<head>
    <title>International migration</title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="../lib/globalStyle.css" />

    <style type="text/css">

		/* START Graph-style specific CSS attribution DO NOT DELETE */
		.labels text{
			font-size:12px;	
			fill:#666666;	
		}
		
		#xAxis text{
            font-size: 22px;
            fill: none;
        } 
		
        #graphic .axis line {
            fill: none;
            stroke: none;
            shape-rendering: crispEdges;
        }
		
        #graphic .axis.x path { display: none; }
		
		.labels line {
			fill: none;
            stroke: #666;
            shape-rendering: crispEdges;
		}
		/* END Graph-style specific CSS attribution DO NOT DELETE */
		
		.footer > p{
			float:left;	
			margin-right:4px;	
		}
		
		.annolines{
			stroke:#666;
			stroke-width:2px;	
		}
		
		.annolines2{
			stroke:#666;
			stroke-width:2px;
			/*stroke-dasharray: 5;*/	
		}
		
    </style>

</head>
<body>
   <!-- <h1>Long Term International Net Migration by Citizenship, 1975 to 2014</h1>-->

    <div id="graphic"><img src="fallback.png" alt="[Chart]" /></div>

    <div id="keypoints">
        <p></p>
    </div>

    <!-- Define the source -->
   <div class="footer"> </div>    


    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.5.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>
    
	
	var graphic = $('#graphic');
	var keypoints = $('#keypoints');
	var footer = $(".footer");
	var pymChild = null;
							// n, imm, emigration
	var lineColourArray = [ "none" ,"#1695A3", "#004358" ]; // 004358 some (porobably usually the first 'X' depeding on how many lines are shown) may need to be "none" to avoid lines and bars being crawn for the same data
	var legendColourArray = [ "#F1C40F","#1695A3", "#004358" ]; // this one defines colours of the legend. Needs to be the length of the number of data variable streams displayed on graph.

	function drawGraphic(width) {
	
		var threshold_md = 788;
		var threshold_sm = dvc.optional.mobileBreakpoint; 
	  
		//set variables for chart dimensions dependent on width of #graphic
		if (graphic.width() < threshold_sm) {        	
				var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]}; 
				var chart_width = graphic.width() - margin.left - margin.right;
				var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		} else if (graphic.width() < threshold_md){
				var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]}; 
				var chart_width = graphic.width() - margin.left - margin.right;
				var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
		} else {
				var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
				var chart_width = graphic.width() - margin.left - margin.right;
				var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
		}

		// clear out existing graphics
		graphic.empty();
		keypoints.empty();
		footer.empty();
	

    var x = d3.time.scale().range([0, chart_width]);
	
/*	var xOrdDomain = ["1964", "1965", "1966", "1967", "1968", "1969", "1970", "1971", "1972", "1973", "1974", "1975", "1976", "1977", "1978", "1979", "1980", "1981", "1982", "1983", "1984", "1985", "1986", "1987", "1988", "1989", "1990", "1991", "1992", "1993", "1994", "1995", "1996", "1997", "1998", "1999", "2000", "2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015"];
*/
	
	var xOrdDomain = ["64", "65", "66", "67", "68", "69", "70", "71", "72", "73", "74", "75", "76", "77", "78", "79", "80", "81", "82", "83", "84", "85", "86", "87", "88", "89", "90", "91", "92", "93", "94", "95", "96", "97", "98", "99", "00", "01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15"];

	var xOrd = d3.scale.ordinal()
		.rangePoints([0, chart_width])
		.domain(xOrdDomain);
							
	var xOrdAxis = d3.svg.axis()
		.scale(xOrd)
		.orient("bottom")
		.tickFormat(function(d,i) {
			return i % 2 ? "": '\u2019' + d;
//            	if (chart_width/*width*/ <= /*mobile_threshold*/dvc.optional.mobileBreakpoint) {
//                	
//						str = d;
//						return i % 2 ? "": '\u2019' + str.substring(2,4); 
//				}
//				
//				else {
//						return i % 1 ? "" :  d;
//            	}
        })
		.tickPadding(5);
		//.ticks(23);
		
	
    var y = d3.scale.linear()
        .range([height, 0]);

    var formatAsPercentage = d3.formatPrefix('%',0);

    var xAxis = d3.svg.axis()
        .scale(x)
        .orient("bottom")
        .tickFormat(function(d,i) {
            if (width <= /*mobile_threshold*/dvc.optional.mobileBreakpoint) {
                var fmt = d3.time.format('%y');
                return '\u2019' + fmt(d);
            } else {
                var fmt = d3.time.format('%Y');
                return fmt(d);
            }
        });
		//.ticks(23);

			
	x.domain(d3.extent(graphic_data, function(d) { return d.date; }));	// was d.year
	

    
    var yAxis = d3.svg.axis()
        .scale(y)
        .orient('left')/*
        .ticks(num_ticks)*/;
		

					
	//specify number or ticks on y axis
	if (graphic.width() <= threshold_sm) {
		yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
	 } else if (graphic.width() <= threshold_md){
		yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
	 } else {
		yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
	 }	
	 
	 	

    var y_axis_grid = function() { return yAxis; }

    var line = d3.svg.line()
        .x(function(d) { return x(d.date); })
        .y(function(d) { return y(d.amt); });

    // parse data into columns
    var lines = {};
    for (var column in graphic_data[0]) {
        if (column == 'date') continue;
        lines[column] = graphic_data.map(function(d) {
            return {
                'date': d.date,
                'amt': d[column]
            };
        });
    }		
		
	var legend = d3.select('#graphic').append('ul')
                .attr('class', 'key')
            .selectAll('g')
                .data(d3.entries(lines))
            .enter().append('li')
                .attr('class', function(d, i) { return 'key-item key-' + i + ' ' + d.key.replace(' ', '-').toLowerCase(); });
			legend.append('b').attr("class", "legendBlocks").style("background-color", function(d,i) { return legendColourArray[i]; }).style("opacity", 0.95);
        legend.append('label')
            .text(function(d,i) { return dvc.essential.legendLabels[i]; });

	//y axis label
	d3.select('#graphic').append("p")
				.attr('class', 'unit')
				.text(function(d,i) { return dvc.essential.yAxisLabel; });	

    var svg = d3.select('#graphic').append('svg')
        .attr("width", chart_width/*width*/ + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    x.domain(d3.extent(graphic_data, function(d) { return d.date; }));


			
	
	//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
	if (dvc.essential.yAxisScale == "auto_zero_max"){
	   var yDomain = [
						0,
						d3.max(d3.entries(lines), function(c) {
							return d3.max(c.value, function(v) {
								var n = v.amt;
								return /*Math.ceil(n)*/Math.ceil(n/100)*100;
							});
						})
					 ];
	} else if (dvc.essential.yAxisScale == "auto_min_max"){
		var yDomain = [
						d3.min(d3.entries(lines), function(c) {
							return d3.min(c.value, function(v) {
								var n = v.amt;
								return Math.floor(n);
							});
						})
						
						,
					
						d3.max(d3.entries(lines), function(c) {
							return d3.max(c.value, function(v) {
								var n = v.amt;
								return /*Math.ceil(n)*/Math.ceil(n/100)*100;
							});
						})
					];
	} else {
	   var yDomain = dvc.essential.yAxisScale;
	}
				
		 
	y.domain(yDomain);


    svg.append('g')
        .attr('class', 'y axis')
	    .attr("id", "yAxis")
        .call(yAxis);
		
		d3.select("#yAxis").selectAll("text").each(function(d,i){ if (d == -200){ d3.select(this).text("")} else if (d == 800){ d3.select(this).text("")}})
		
    svg.append('g')
        .attr('class', 'y grid')
        .call(y_axis_grid()
            .tickSize(-chart_width/*width*/, 0, 0)
            .tickFormat('')
        );
		
d3.selectAll(".grid").selectAll("line").each(function(d,i){ if (d == 800){ d3.select(this).remove();}})



	
	var startDate = new Date(lines[dvc.essential.legendLabels[0]][0].date);
	var endDate = new Date(lines[dvc.essential.legendLabels[1]][lines[dvc.essential.legendLabels[1]].length-2].date);
	var everyDate = d3.time.day.range(startDate, endDate);
	var barWidth = chart_width/((everyDate.length/365)); //-5;
	
	svg.append('g')
        .attr('class', 'x axis')
	    .attr("id", "xAxis")
        .attr('transform', 'translate('+ barWidth +',' + (height) + ')')
//		.attr('transform', function(d){ 
//				        			if(yDomain[0] != 0){ console.log(yDomain[0]);
//										return 'translate('+ barWidth +',' + (height) + ')'
//									} else {
//										return 'translate('+ barWidth +',' + height  + ')'
//									}
//							})
        .call(xAxis);
		
		
						
		
	svg.append('g')
		.attr("class","bars")
		.selectAll('rect')
		.data(lines[/*"data1"*/dvc.essential.legendLabels[0]])
		.enter()
		.append('rect')
		.attr('class', 'bar')
		.attr('y',function(d){
			if(d.amt<0) {return y(0)}
			else {return y(d.amt)}
		})
		.attr('x', function(d , i) { return (x(d.date) - barWidth/2); })
		.attr('height',function(d){
			if(d.amt<0) {return (y(d.amt) - y(0))}
			else {return (y(0) - y(d.amt))}
		})
		.attr('width',barWidth)
		.attr('stroke',"white")
		.attr('padding',"1px")
		.attr("fill", "#e8ba00") //  F1C40F
		.attr('opacity'	, 0.85);
		
		
	svg.append('g').attr("class","lines")
		.selectAll('path')
        .data(d3.entries(lines))
        .enter()
        .append('path')
            .attr('class', function(d, i) {
                return 'line line-' + i;
            })
            .attr('d', function(d) {
                return line(d.value);
            })
			.style("stroke" , function(d,i){
				return lineColourArray[i];
			});
			
	svg.append("g")
		.attr("transform","translate(0,"+height+")")
		.attr("class","labels")
      	.call(xOrdAxis)
	  
	d3.select(".labels").attr("transform", "translate(0,"+(y(-200))+")")  // ***** ADD here your min   *********
		
	d3.selectAll(".labels").selectAll("text").attr("transform", "translate("+barWidth/2+",0)")
	d3.selectAll(".labels").selectAll("line").attr("transform", "translate("+barWidth/2+",0)")
	
	 //specify number of ticks on x axis and whether 1st and last data point labels are included
	        if(graphic.width()<threshold_sm){		
	            dash = dvc.optional.x_num_ticks_sm_md_lg[0];
	        } else if (graphic.width() <= threshold_md){
				dash = dvc.optional.x_num_ticks_sm_md_lg[1];
			} else {
	            dash = dvc.optional.x_num_ticks_sm_md_lg[2];
	        }
				
	d3.selectAll(".labels")
		.selectAll("line")
		.style("display", function(d, i){    // how many tick marks
			return i % dash ? "none": ""
		
	})
	
	d3.selectAll(".labels")
		.selectAll("text")
		.style("display", function(d, i){    // how many tick marks
			return i % dash ? "none": ""
		
	})		
		
	d3.selectAll(".bars").attr('transform', 'translate('+ barWidth/2 + ',0)')	
	d3.selectAll(".lines").attr('transform', 'translate('+ (barWidth/2) + ',0)')
	
	//get the lines existing length
	gridlength = d3.select(".grid line").attr("x2");
	
	d3.selectAll(".grid line").attr("x2", gridlength*1+barWidth); 	

	
//	svg.append("line")
//		.attr("id","ordline")
//		.attr('y1',y(0))
//		.attr('y2',y(0))
//		.attr('x1',x(x.domain()[0]))
//		.attr('x2',gridlength*1+barWidth/*x(x.domain()[1])*/);
		
				

				//create centre line if required
				if (dvc.optional.centre_line == true){
					svg.append("line")
						.attr("id","centreline")
						.attr('y1',y(dvc.optional.centre_line_value))
						.attr('y2',y(dvc.optional.centre_line_value))
						.attr('x1',0)
						.attr('x2',/*chart_width+margin.left*/x.range()[1]+margin.left);
				} else if(yDomain[0] < 0){
					svg.append("line")
						.attr("id","centreline")
						.attr('y1',y(0))
						.attr('y2',y(0))
						.attr('x1',0)
						.attr('x2',chart_width-margin.left);  // +margin.left
				} 	
					
					
					
							
			writeAnnotation();
							
			function writeAnnotation(){
			
				if (graphic.width() < threshold_sm) {
					
						dvc.essential.annotationBullet.forEach(function(d,i) {
						
							d3.select("#keypoints").append("svg")
								.attr("width","20px")
								.attr("height","20px")
								.attr("class","circles")
								.append("circle")
								.attr("class", "annocirc" + (i))
								.attr("r", "2")
								.attr('cy',"12px")
								.attr("cx", "10px");
							
							d3.select("#keypoints").append("p").text(dvc.essential.annotationBullet[i]);
						
						})// end foreach
				}		
				else {
					
						dvc.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',y(dvc.essential.annotationXY[i][1]))
								.attr('x',x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationXY[i][0])));
										
							d3.selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								.each(createBackRect);	
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationXY[i][0]))).attr('dy', '19');													
								}
							};					
													
							function createBackRect() {
								
							var BBox = this.getBBox()
											
									svg.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("fill", "white")
										.attr("opacity", 0.4);
										
							}; // end function createBackRect()
						
						
							// draw circles, if var 'dvc.essential.circles' is set to true
							if ( dvc.essential.circles == true ) {
								
								svg.append("circle")
									.attr("class", "annocirc" + (i))
									.attr('cy',y(dvc.essential.annotationCXCY[i][1]))
									.attr('cx',x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationCXCY[i][0])))
									.attr("r", "3");
								
							} // end if ... 
							
						});	// end foreach 		
					
				svg.append("line")
						.attr("id","annoline0")
						.attr("class","annolines")
						.attr('y1',y(20))
						.attr('y2',y(20))
						.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse("1964")))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse("1979")))
						
				svg.append("line")
						.attr("id","annoline0a")
						.attr("class","annolines")
						.attr('y1',y(5))
						.attr('y2',y(20))
						.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse("1964")))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse("1964")))
						
				svg.append("line")
						.attr("id","annoline0b")
						.attr("class","annolines")
						.attr('y1',y(5))
						.attr('y2',y(20))
						.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse("1979")))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse("1979")))
				
				svg.append("line")
						.attr("id","annoline1")
						.attr("class","annolines2")
						.attr('y1',y(0))
						.attr('y2',y(700))
						.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse("2004")))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse("2004")))
						
				svg.append("line")
						.attr("id","annoline2")
						.attr("class","annolines2")
						.attr('y1',y(0))
						.attr('y2',y(700))
						.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse("2007")))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse("2007")))
						
				svg.append("line")
						.attr("id","annoline3")
						.attr("class","annolines2")
						.attr('y1',y(0))
						.attr('y2',y(700))
						.attr('x1',x(d3.time.format(dvc.essential.dateFormat).parse("2014")))
						.attr('x2',x(d3.time.format(dvc.essential.dateFormat).parse("2014")))
				
				
				} // end else ... 
				
				return;
				
			}// end function writeAnnotation()
			
			
			
							
			//create link to source				
			d3.select(".footer").append("p")
				.text("Source: ")
				.append("a")
				.attr("href", dvc.essential.sourceURL0)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText0);
            
 			d3.select(".footer").append("p")
				.text(" and ")
				.append("a")
				.attr("href", dvc.essential.sourceURL1)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText1);       
							
						

    if (pymChild) {
        pymChild.sendHeight();
    }
}


	if (Modernizr.svg) {
		
		//load config 
		d3.json("config.json", function(error, config) {
			
			dvc=config;
			
			d3.csv(dvc.essential.graphic_data_url, function(error, data) {
				graphic_data = data;
						
				graphic_data.forEach(function(d , i) {
					
					d.date = d3.time.format(dvc.essential.dateFormat).parse(d.date);
				});
		
				pymChild = new pym.Child({renderCallback: drawGraphic});
			});
		})	
	} 
	
	else {
		pymChild = new pym.Child();
		
		if (pymChild) {
        	pymChild.sendHeight();
	    }
	}

	
    </script>
