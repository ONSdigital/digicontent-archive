		  }

		  }

</head>
<body>

	<div id="graphic">
    	
        <div class="col-sm-6 col-xs-12" id="left"><img src="fallback.png" alt="[Chart]" /></div>
        <div class="col-sm-6 col-xs-12" id="right"></div>
    </div>
	    
    <div id="keypoints">
        <p></p>
    </div>

   <div class="footer">        
   </div>
    
    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>

		var graphic = $('#graphic');
		var left = $('#left');
		var right = $('#right');
		var keypoints = $('#keypoints');
		var footer = $(".footer");
		var pymChild = null;

		function drawGraphic(width) {

		  
		   var threshold_md = 788;
		   var threshold_sm = dvc.optional.mobileBreakpoint; 
		  
		  	//set variables for chart dimensions dependent on width of #graphic
		    if (right.width() < threshold_sm) {        	
		            var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]}; 
					var chart_width = right.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    } else if (right.width() < threshold_md){
		        	var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]}; 
					var chart_width = right.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
		  	} else {
		        	var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
					var chart_width = right.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
			}

		    // clear out existing graphics
		    right.empty();
			keypoints.empty();
			footer.empty();
			

		    var x = d3.time.scale()
		        .range([0, chart_width]);
				
		    var y = d3.scale.linear()
		        .range([height, 0]);

		    x.domain(d3.extent(graphic_data, function(d) { return d.date; }));	

		    var xAxis = d3.svg.axis()
		        .scale(x)
		        .orient("bottom")
		        .tickFormat(function(d,i) {
		            //specify date format for x axis depending on #graphic width
		            if (right.width() <= threshold_sm) {
		                var fmt = d3.time.format(dvc.optional.xAxisTextFormat_sm_md_lg[0]);
		                return '\u2019' + fmt(d);
		            } else if (right.width() <= threshold_md){
		                var fmt = d3.time.format(dvc.optional.xAxisTextFormat_sm_md_lg[1]);
		                return '\u2019' + fmt(d);
		            } else {
		                var fmt = d3.time.format(dvc.optional.xAxisTextFormat_sm_md_lg[2]);
		                return fmt(d);
		            }
		        })
				.tickPadding(5)
		    
	        //specify number of ticks on x axis and whether 1st and last data point labels are included
	        if(right.width()<threshold_sm){		
	            xAxis.tickValues(x.ticks(dvc.optional.x_num_ticks_sm_md_lg[0]).concat( x.domain() ));
	        } else if (graphic.width() <= threshold_md){
				xAxis.tickValues(x.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])/*.concat( x.domain() )*/);
			} else {
	            xAxis.tickValues(x.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])/*.concat( x.domain() )*/);		
	        }
		    
		    var yAxis = d3.svg.axis()
		        .scale(y)
		        .orient('left');
		    			    
			//specify number or ticks on y axis
			if (graphic.width() <= threshold_sm) {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
			 } else if (graphic.width() <= threshold_md){
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
			 } else {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
			 }
				
		    //gridlines
		    var y_axis_grid = function() { return yAxis; }

		    var line = d3.svg.line()
		        .x(function(d) { return x(d.date); })
		        .y(function(d) { return y(d.amt); });

		    // parse data into columns
		    var lines = {};
		    for (var column in graphic_data[0]) {
		        if (column == 'date') continue;
		        lines[column] = graphic_data.map(function(d) {
		            return {
		                'date': d.date,
		                'amt': d[column]
		            };
		        });
		    }
			
		  	//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
	   		if (dvc.essential.yAxisScale == "auto_zero_max"){
			   var yDomain = [
								0,
								d3.max(d3.entries(lines), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
							 ];
			} else if (dvc.essential.yAxisScale == "auto_min_max"){
				var yDomain = [
								d3.min(d3.entries(lines), function(c) {
									return d3.min(c.value, function(v) {
										var n = v.amt;
										return Math.floor(n);
									});
								}),
							
								d3.max(d3.entries(lines), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
					 		];
			} else {
			   var yDomain = dvc.essential.yAxisScale;
		    }
				 
		    y.domain(yDomain);
		    
			//create legend
			if(dvc.essential.legendLabels.length > 1){
			var legend = d3.select('#graphic').select("#right").append('ul')
			                .attr('class', 'key')
			            .selectAll('g')
			                .data(dvc.essential.legendLabels)
			            .enter().append('li')

				    legend.append('b')
						 .attr("class",function(d,i){return "border" + i})
				    
					legend.append('label')
				         .html(function(d,i) { return dvc.essential.legendLabels[i]; });						
			}

			//y axis label
			d3.select('#graphic').select("#right").append("p")
		                .attr('class', 'unit')
		  		        .text(function(d,i) { return dvc.essential.yAxisLabel; });

		    //create svg for chart
		    var svg = d3.select('#graphic').select("#right").append('svg')
				        .attr("width", chart_width + margin.left + margin.right)
				        .attr("height", height + margin.top + margin.bottom +30)
				        .append("g")
				        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
				
					svg.append("rect")
						.attr("class","svgRect")
						.attr("width", chart_width)
						.attr("height", height)
			    
				    svg.append('g')
				        .attr('class', 'y axis')
				        .call(yAxis);

				    svg.append('g')
				        .attr('class', 'y grid')
				        .call(y_axis_grid()
				            .tickSize(-chart_width, 0, 0)
				            .tickFormat('')
				        );
					
					//create x axis, if y axis doesn't start at 0 drop x axis accordingly	
					svg.append('g')
				        .attr('class', 'x axis')
				        .attr('transform', function(d){ 
				        			if(yDomain[0] != 0){
										return 'translate(0,' + (height + 30) + ')'
									} else {
										return 'translate(0,' + height  + ')'
									}
							})
				        .call(xAxis);
					
				
				//create icon to symbolise break in y axis if required					
				if(yDomain[0] > 0 && dvc.essential.yAxisBreak == true){
					var paths = svg.append("defs")
								.append("g")
								.attr("id","icon")
								.append("g");
								
							paths.append("polyline")
								 .attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
								 .attr("stroke", "#666")
								 .attr("fill", "none")
							paths.append("polyline")
								.attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
								.attr("stroke", "#666")
								.attr("fill", "none");
				  
						//specify position of icon				  
						svg.append("g").attr("id","iconpath")
								.attr("transform","translate(-10,3)")
								.append("use")
								.attr("xlink:href","#icon")
								.attr("x", x(x.domain()[0]))
								.attr("y", function(){ 
									if (graphic.width() < threshold_sm) {
										return y(dvc.essential.yAxisBreak_sm_md_lg[0])
									} else if (graphic.width() < threshold_md){
										return y(dvc.essential.yAxisBreak_sm_md_lg[1])
									} else {
										return y(dvc.essential.yAxisBreak_sm_md_lg[2])
									}
								});
				}

				//create centre line if required
				if (dvc.optional.centre_line == true){
					svg.append("line")
						.attr("id","centreline")
						.attr('y1',y(dvc.optional.centre_line_value))
						.attr('y2',y(dvc.optional.centre_line_value))
						.attr('x1',0)
						.attr('x2',chart_width);
				} else if(yDomain[0] <0){
					svg.append("line")
						.attr("id","centreline")
						.attr('y1',y(0))
						.attr('y2',y(0))
						.attr('x1',0)
						.attr('x2',chart_width);
				} 
				
				//Create annotation line
				
//				svg.append("line")
//					.attr("class","annoline")
//					.attr("x1", x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationCXCY[0][0])))
//					.attr("x2", x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationCXCY[1][0])))
//					.attr('y1', y(dvc.essential.annotationCXCY[0][1]))
//					.attr('y2', y(dvc.essential.annotationCXCY[1][1]));

				//create lines 		
			    svg.append('g').selectAll('path')
			        .data(d3.entries(lines))
			        .enter()
			        .append('path')
			            .attr('class', function(d, i) {
			                return 'line line-' + i;
			            })
			            .attr('d', function(d) {
			                return line(d.value);
			            });						
							
			writeAnnotation();
							
			function writeAnnotation(){
					
						dvc.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',y(dvc.essential.annotationXY[i][1]))
								.attr('x',x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationXY[i][0])));
										
							d3.select("#right").selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								.each(createBackRect);	
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationXY[i][0]))).attr('dy', '22');													
								}
							};					
													
							function createBackRect() {
								
							var BBox = this.getBBox()
											
									svg.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("fill", "white")
										.attr("opacity", 0.4);
										
							}; // end function createBackRect()
						
						
							// draw circles, if var 'dvc.essential.circles' is set to true
							if ( dvc.essential.circles == true ) {
								
								svg.append("circle")
									.attr("class", "annocirc" + (i))
									.attr('cy',y(dvc.essential.annotationCXCY[i][1]))
									.attr('cx',x(d3.time.format(dvc.essential.dateFormat).parse(dvc.essential.annotationCXCY[i][0])))
									.attr("r", "3");
								
							} // end if ... 
							
						});	// end foreach 		
					

				
				return;
				
			}// end function writeAnnotation()
							
			//create link to source				
			d3.select(".footer").append("p")
				.text("Source: ")
				.append("a")
				.attr("href", dvc.essential.sourceURL)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText);
			
			drawGraphic2(width);				
			//use pym to calculate chart dimensions	
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		}


		function drawGraphic2(width) {
		   var threshold_md = 788;
		   var threshold_sm = dvc2.optional.mobileBreakpoint; 
		  
		  	//set variables for chart dimensions dependent on width of #graphic
		    if (left.width() < threshold_sm) {        	
		            var margin = {top: dvc2.optional.margin_sm[0], right: dvc2.optional.margin_sm[1], bottom: dvc2.optional.margin_sm[2], left: dvc2.optional.margin_sm[3]}; 
					var chart_width = left.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc2.optional.aspectRatio_sm[1]) / dvc2.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    } else if (graphic.width() < threshold_md){
		        	var margin = {top: dvc2.optional.margin_md[0], right: dvc2.optional.margin_md[1], bottom: dvc2.optional.margin_md[2], left: dvc2.optional.margin_md[3]}; 
					var chart_width = left.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc2.optional.aspectRatio_md[1]) / dvc2.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
		  	} else {
		        	var margin = {top: dvc2.optional.margin_lg[0], right: dvc2.optional.margin_lg[1], bottom: dvc2.optional.margin_lg[2], left: dvc2.optional.margin_lg[3]}
					var chart_width = left.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc2.optional.aspectRatio_lg[1]) / dvc2.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
			}

		    // clear out existing graphics
			left.empty();
			keypoints.empty();
			footer.empty();
			
			var x = d3.scale.ordinal()
				.rangeRoundBands([0, chart_width], .1)
				
				
		    var y = d3.scale.linear()
		        .range([ height, 0]);

		    x.domain(graphic_data2.map(function(d) { return d.date; }));

		    var xAxis = d3.svg.axis()
		        .scale(x)
		        .orient("bottom")
		        .tickFormat(function(d,i) {
		            //specify date format for x axis depending on #graphic width
		            if (left.width() <= threshold_sm) {
		                return i % 1 ? "" :  d;
		            } else if (left.width() <= threshold_md){
		                return i % 1 ? "" :  d;
		            } else {
		                return i % 1 ? "" :  d;
		            }
		        })
	
		    
		    var yAxis = d3.svg.axis()
		        .scale(y)
		        .orient('left');
		    			    
			//specify number or ticks on y axis
			if (left.width() <= threshold_sm) {
				yAxis.ticks(dvc2.optional.y_num_ticks_sm_md_lg[0])
			 } else if (left.width() <= threshold_md){
				yAxis.ticks(dvc2.optional.y_num_ticks_sm_md_lg[1])
			 } else {
				yAxis.ticks(dvc2.optional.y_num_ticks_sm_md_lg[2])
			 }
				
		    //gridlines
		    var y_axis_grid = function() { return yAxis; }

		    var bar = d3.svg.line()
		        .x(function(d) { return x(d.date); })
		        .y(function(d) { return y(d.amt); });

		    // parse data into columns
		    var bars = {};
		    for (var column in graphic_data2[0]) {
		        if (column == 'date') continue;
		        bars[column] = graphic_data2.map(function(d) {
		            return {
		                'date': d.date,
		                'amt': d[column]
		            };
		        });
		    }
			
		  	//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
	   		if (dvc2.essential.yAxisScale == "auto_zero_max"){
			   var yDomain = [
								0,
								d3.max(d3.entries(bars), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
							 ];
			} else if (dvc2.essential.yAxisScale == "auto_min_max"){
				var yDomain = [
								d3.min(d3.entries(bars), function(c) {
									return d3.min(c.value, function(v) {
										var n = v.amt;
										return Math.floor(n);
									});
								}),
							
								d3.max(d3.entries(bars), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
					 		];
			} else {
			   var yDomain = dvc2.essential.yAxisScale;
		    }
				 
		    y.domain(yDomain);
		    
			//create legend
			if(dvc2.essential.legendLabels.length > 1){
			var legend = d3.select('#graphic').append('ul')
			                .attr('class', 'key')
			            .selectAll('g')
			                .data(dvc2.essential.legendLabels)
			            .enter().append('li')

				    legend.append('b')
						 .attr("class",function(d,i){return "background" + i})
				    
					legend.append('label')
				         .html(function(d,i) { return dvc2.essential.legendLabels[i]; });						
			}

			//y axis label
			d3.select('#graphic').select("#left").append("p")
		                .attr('class', 'unit')
		  		        .text(function(d,i) { return dvc2.essential.yAxisLabel; });

		    //create svg for chart
		    var svg2 = d3.select('#graphic').select("#left").append('svg')
				        .attr("width", chart_width + margin.left + margin.right)
				        .attr("height", height + margin.top + margin.bottom +30)
				        .append("g")
				        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
				
					svg2.append("rect")
						.attr("class","svgRect")
						.attr("width", chart_width)
						.attr("height", height)
			    
				    svg2.append('g')
				        .attr('class', 'y axis')
				        .call(yAxis);

				    svg2.append('g')
				        .attr('class', 'y grid')
				        .call(y_axis_grid()
				            .tickSize(-chart_width, 0, 0)
				            .tickFormat('')
				        );
					
					//create x axis, if y axis doesn't start at 0 drop x axis accordingly	
					svg2.append('g')
				        .attr('class', 'x axis')
				        .attr('transform', function(d){ 
				        			if(yDomain[0] != 0){
										return 'translate(0,' + (height + 30) + ')'
									} else {
										return 'translate(0,' + height  + ')'
									}
							})
				        .call(xAxis);

				     //d3.selectAll(".tick.major").attr("transform, "translate(barWidth,0)))
				
				//create icon to symbolise break in y axis if required					
				if(yDomain[0] > 0 && dvc2.essential.yAxisBreak == true){
					var paths = svg2.append("defs")
								.append("g")
								.attr("id","icon")
								.append("g");
								
							paths.append("polyline")
								 .attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
								 .attr("stroke", "#666")
								 .attr("fill", "none")
							paths.append("polyline")
								.attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
								.attr("stroke", "#666")
								.attr("fill", "none");
				  
						//specify position of icon				  
						svg2.append("g").attr("id","iconpath")
								.attr("transform","translate(-10,3)")
								.append("use")
								.attr("xlink:href","#icon")
								.attr("x", x(x.domain()[0]))
								.attr("y", function(){ 
									if (graphic.width() < threshold_sm) {
										return y(dvc2.essential.yAxisBreak_sm_md_lg[0])
									} else if (graphic.width() < threshold_md){
										return y(dvc2.essential.yAxisBreak_sm_md_lg[1])
									} else {
										return y(dvc2.essential.yAxisBreak_sm_md_lg[2])
									}
								});
				}

							
						
			svg2.append('g').attr("class","bars").selectAll('rect')
					.data(bars["growth"])
					.enter()
					.append('rect')
					.attr('class', function(d, i) {
			                if ( d.amt <0 ) { 
								return 'bar bar_neg'; 
							} else { 
								return 'bar bar_pos'; 
							}
			            })
					.attr("width", x.rangeBand())
					.attr("x", function(d) { return x(d.date); })
					.attr("y", function(d) { return y(Math.max(0, d.amt)); })
					.attr("height", function(d) { return 0 + Math.abs(y(d.amt) - y(0)); });

					
				svg2.append("g").selectAll('text').data(bars["growth"])
					.enter()
					.append("text")
					.attr("x",function(d) { return x(d.date) + x.rangeBand()/2; })
					.attr("y", function(d) { return y(0) -5})
					.attr("width", x.rangeBand())
					.attr("text-anchor","middle")
					.attr("fill","#fff")
					.attr("font-size","20px")
					.text(function(d) { var xxx = +d.amt; return xxx.toLocaleString(); })
					
					//create centre line if required
					if (dvc2.optional.centre_line == true){
						svg2.append("line")
							.attr("id","centreline")
							.attr('y1',y(dvc2.optional.centre_line_value))
							.attr('y2',y(dvc2.optional.centre_line_value))
							.attr('x1',0)
							.attr('x2',chart_width);
					} else if(yDomain[0] <0){
						svg2.append("line")
							.attr("id","centreline")
							.attr('y1',y(0))
							.attr('y2',y(0))
							.attr('x1',0)
							.attr('x2',chart_width);
					}  	
					
			writeAnnotation2();
							
			function writeAnnotation2(){
						
						dvc2.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg2.append("text")
								.text(dvc2.essential.annotationChart[i])
								.attr("class","annotext" + i)
								.attr("text-anchor", dvc2.essential.annotationAlign[i])
								.attr('y',y(dvc2.essential.annotationXY[i][1]))
								.attr('x', function(d) { return x(dvc2.essential.annotationXY[i][0]) + x.rangeBand()/2; });
										
							d3.select("#left").selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								.each(createBackRect);	
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc2.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(dvc2.essential.annotationXY[i][0]) + x.rangeBand()/2).attr('dy', '22');													
								}
							};					
													
							function createBackRect() {
								
							var BBox = this.getBBox()
											
									svg2.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("fill", "white")
										.attr("opacity", 0.7);
										
							}; // end function createBackRect()

							
						});	// end foreach 		
					
//				} // end else ... 
				
				return;
				
			}// end function writeAnnotation()
							
			//create link to source				
			d3.select(".footer").append("p")
				.text("Source: ")
				.append("a")
				.attr("href", dvc.essential.sourceURL)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText);
						
			//use pym to calculate chart dimensions	
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		}

		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   //load config 
			d3.json("config.json", function(error, config) {
			dvc=config

				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;
					graphic_data.forEach(function(d) {
						d.date = d3.time.format(dvc.essential.dateFormat).parse(d.date); 
						
					});
					
					d3.json("config2.json", function(error, config) {
						dvc2=config
			
							//load chart data
							d3.csv(dvc2.essential.graphic_data_url, function(error, data) {
								graphic_data2 = data;
			
								names = d3.keys(graphic_data2[0]).filter(function(key) { return key !== "state"; });
						  
								graphic_data2.forEach(function(d) {
								  d.ages = names.map(function(name) { return {name: name, value: +d[name]}; });	
								}); 
									pymChild = new pym.Child({ renderCallback: drawGraphic});
									//use pym to create iframed chart dependent on specified variables
								});
						})
					
				});
			})




		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
    </script>
