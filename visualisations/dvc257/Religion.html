// Geolocation handlers




var markerL, markerR;




var generateMarkers = function(location) {


  var markerLocation = new google.maps.LatLng(location.lat, location.lng);


  if(!markerL && !markerR) {


    markerL = new google.maps.Marker({


      map: mapL,


      position: markerLocation


    });


    markerR = new google.maps.Marker({


      map: mapR,


      position: markerLocation


    });


    mapR.setCenter(markerLocation);


    mapR.setZoom(12);


    return;


  } else {


    markerL.setPosition(markerLocation);


    markerR.setPosition(markerLocation);


    mapR.setCenter(markerLocation);


    mapR.setZoom(12);


    return;


  };


};




var addressSubmit = function() {


  var userAddr = document.getElementById("dv-address").value;


  getLatLng(userAddr, function(latLng, err) {


    if(err) {


      alert(latLng.msg);


      return;


    };


    generateMarkers(latLng);


    prepareQuery(latLng);




  });


};




var getLatLng = function(address, callback) {


  if (!address) {


    callback({ msg: "Please enter an address." }, true);


    return;


  };


  var request = {


    'address': address


  };


  geocoder.geocode(request, function(results, status) {


    if (status === google.maps.GeocoderStatus.OK) {


      var coordinate = results[0].geometry.location;

      callback({ 'lat': coordinate.lat(), 'lng': coordinate.lng() });


    } else {


      callback({ msg: "Sorry, we were unable to find your address. Please try again." }, true);


    };


  });


  return;


};
