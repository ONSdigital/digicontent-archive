  <style>
    body {
      max-width: 700px;
      margin: 0px auto;

    /* #dropdown-container {

      float: left;

    #dropdownRegion {

    }

    @media (min-width:600px) {
      #dropdownRegion {
        float: right;
        width: 37%;
      }
    }
    @media (max-width:599px) {
      #dropdown {
        width: 100%;

      #dropdownRegion {
        display: inline-block;
        width: 60%;

      }

    #legend {
      clear: both;
      float: left;
    }

    #legend > div {
      float: left;
      margin-right: 15px;
    }

    #swarms-container {
      clear:both;
      height: 520px;
      overflow-x: hidden;

    #swarms {
      display: flex;
      flex-direction: column;
      align-content: stretch;
    }



    .item {
      display: flex;

    }

    /* @media (max-width:600px) { */

    /* @media (min-width:600px) {

        align-self: flex-end;

      }
    } */

    .infoText {
      fill: black;
      text-anchor: middle;
    }

    .infoTextBorder {
      stroke: white;
      stroke-width: 5px;

    p.unitText {
      margin: 0;
      text-align: right;
    }

    /* div.infoDiv {
      margin-top: 10px;
    } */

      display: none;
    }

    .axis text,
    #xaxislabel {
      font-family: 'Open Sans', sans-serif;
      fill: rgb(102, 102, 102);

    }

      stroke: black;

    }

      opacity: 0 !important;
    }

      display: inline;
    }
    .removed-voronoi {
      display: none;
    }

    #source {
      padding-top: 20px;
      font-size: 16px;
      font-weight: 700;
      color: #323132;
    }

    /* input.chosen-search-input,
    input,
    select {
      font-family: "Open Sans", sans-serif !importan;
      font-size: 18px;
    } */


    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }


    a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
    }

    select {
      font-size: 1.1em;
      border: none;
      box-shadow: none;
      border-radius: 0;
      background: transparent;
      height: 100%;
      width: 100%;
      cursor: pointer;
      outline: none;
      padding-right: 35px;
      padding-left: 15px;
      border: 2px solid #206095;
      -moz-appearance: none;
      -webkit-appearance: none;
      color: #206095;
    }

    div.info {
      min-width: 300px;
      position: relative;
      /* min-height: 110px; */
    }
    div.category {
      float: left;
      display: inline-block;
      font-size: 18px;
      width: 130px;
      font-weight: 700;
    }
    div.dropdown {
      /* left: 200px; */
      background: white;
      border: none;
      height: 45px;
      position: relative;
      /* min-width: 13em; */
      /* margin-top: 5px; */
      /* margin-left: 0.5%; */
      /* margin-right: 0.5%; */
    }

    @media (min-width:600px) {
      div.dropdown {
        display: inline-block;
        float: right;
        width: 50%;
      }
    }

    @media (max-width:599px) {
      div.dropdown {
        margin-top: 30px;
      }
    }

    .dropdown::before {

      height: 43px;
      width: 46px;
      position: absolute;
      top: 1px;
      right: 1px;
      bottom: 1px;
      background: #206095;
      content: '';
      pointer-events: none;

    }

    .dropdown::after {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      right: 17px;
      bottom: 0;
      margin: 18px 0 0 0;
      border-style: solid;
      border-width: 10px 9px 0 9px;
      border-color: #ffffff transparent transparent transparent;
      pointer-events: none;
    }

    select:focus {
      outline: 3px solid #FFA23A;
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .cellsselected.cellsselected0 {
      fill: #1e5c92;
    }
    .cellsselected.cellsselected1 {
      fill: #CD842F;
    }
    .cellsselected.cellsselected2 {
      fill: #35968A;
    }
    .cellsselected.cellsselected3 {

    }
    .cellsselected.cellsselected4 {

    }

<body>
  <h5 class='visuallyhidden'>The chart canvas is hidden from screen readers. The main message is summarised by the chart title and the data behind the chart is available to download below.</h5>
  <div id="dropdown-container">
    <div aria-hidden="true" id="dropdown"></div>
    <div aria-hidden="true" id="dropdownRegion"></div>
  </div>
  <div aria-hidden="true" id="legend">
    <div>
      <svg height="10" width="10" xmlns="http://www.w3.org/2000/svg">
        <circle cx="5" cy="5" r="2.5" fill="#666"/>
      </svg> Local authority
    </div>
    <div id="legendRegionalAverage">
      <svg height="10" width="20" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" x2="20" y1="5" y2="5" style="stroke: #666; stroke-dasharray:4 4; stroke-width:2;"/>
      </svg> Regional average
    </div>
  </div>
  <div id="swarms-container" aria-hidden="true">
    <div  id="swarms"></div>
  </div>
  <div id="source"></div>
  <!-- <h6 class="">Download this chart</h6>
  <a class="btn btn--primary" href="image.png" download>Image</a>
  <a class="btn btn--primary" title="Download as csv" href="datadownload.csv" target="_blank">.csv</a>
  <a class="btn btn--primary" title="Download as xls" href="data.xlsx" target="_blank">.xlsx</a> -->

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js"></script>
  <script src="../lib/chosen.jquery.js"></script>
  <script src="js/chosen.order.jquery.min.js"></script>
  <script src="../lib/modernizr.svg.min.js"></script>

  <script>
    // TODO: sort out mobile view
    // TODO: keyboard control for chosen


    var pymChild = null;
    var voronoiData = {};
    var firstDraw = {};
    var nSelected = 0;
    var selectedAreas = [null,null,null,null,null,null];
    var newAreaIndex = null;
    var oldAreaIndex = null;
    var hoveringOverAlreadySelectedArea = false;
    var clickedDot = false;
    var scales = {};

    function drawGraphic() {

      areas = graphic_datas[0]
      // .filter(function(d) {
      //   return d.AREACD != "A" //everything apart from the average
      // })
      .map(function(d) {
        return d.AREACD
      });

      names = graphic_datas[0]
      // .filter(function(d) {
      //   return d.AREACD != "A" //everything apart from the average
      // })
      .map(function(d) {
        return d.AREANM
      });

      margin = dvc.essential.margins;
      csvs = dvc.essential.graphic_data_url
      datakeys = []

      function getUnique(varname) {
        var uniqueNames = [];
        var list = graphic_datas[0].map(function(d) {
          return d[varname]
        });
        list.forEach(function(item, i) {
          if (list.indexOf(item) == i) {
            uniqueNames.push(item)
          }
        });
        return uniqueNames
      };

      var regionCodes = getUnique('RGNCD')
      var regionNames = getUnique('RGNNM')

      createDropdown(areas, names)
      createRegionDropdown(regionCodes, regionNames)

      createStructure(dvc.essential.setup)

      function createStructure(setup) {
        console.log(setup)

        items = d3.select("#swarms").selectAll("div.item")
          .data(setup)
          .enter()
          .append('div')
          .attr('class', "item")

        infoColumn = items.append('div')
          .attr('class', 'info')

        infoColumn.append('div').html(function(d) {
          return d.label
        }).attr('class', 'category')

        infoColumn.each(function(d) {
          if (d.dropdown) generateDropdown(d.csv, this)
        })

        swarmColumn = items.append('div')
          .attr('class', 'swarm')

        width = parseInt(d3.select('body').style('width'))
        // if (width > dvc.optional.mobileBreakpoint) {
          // chart_width = width - parseInt(d3.select('.info').style('width')) - margin.left - margin.right
        // } else {
          chart_width = width - margin.left - margin.right //- dvc.essential.infoColumnWidth
        // }
        height = dvc.essential.heightperstrip - margin.top - margin.bottom;

        var svgParent = swarmColumn.append('svg')
          .attr('width', chart_width + margin.left + margin.right)
          .attr('height', dvc.essential.heightperstrip);
        svg = svgParent.append('g')
          .attr('id', function(d) {
            return "svg" + d.csv
          })
          .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

        infoTextBorder = svgParent.append("text").attr("class", function(d) { return 'infoText infoTextBorder value' + d.csv + 'parent' } );
        infoText = svgParent.append('text').attr('class', function(d) { return 'infoText infoTextValue value' + d.csv + 'parent' } );

        setUpInfoText(infoText)
        setUpInfoText(infoTextBorder)

        function setUpInfoText(selection) {
          selection.attr("class", );
          selection.append('tspan')
            .attr('class', function(d) {
              return 'value' + d.csv
            })
            .attr('class', 'value');
          selection.append('tspan')
            .attr('class', 'unit');
        }


        svg.each(function(d, i) {
          drawBeeswarm(graphic_datas[i], graphic_datas[i].columns[4], d.csv)
        });

        lines = svg//.selectAll("line")
          // .data(function(d) { return d })
          // .enter()
          .append("line")
          .attr("class", function(d) { console.log(d); return "region-line " + d.csv } )
          .attr("y1", -margin.top)
          .attr("y2", dvc.essential.heightperstrip)
          .style("stroke", "#666")
          .style("stroke-dasharray", "4 4")
          .style("stroke-width", 2)
          .attr("opacity", 0);

        unitText = swarmColumn.append('p')
          .attr('class', 'unitText');
        //
        addUnits();
      }


      function generateDropdown(key, thisdiv) {
        var select = d3.select(thisdiv).append('div').attr('class', 'dropdown').append('select').attr('id', "select" + key).attr('class', 'keyDropdown')

        select.append('label').attr('for', function(d) {
          return "select" + key
        }).html("Choose " + key).attr("class", 'visuallyhidden')

        select.selectAll('option').data(graphic_datas[dvc.essential.graphic_data_url.indexOf(key)].columns.slice(4))
          .enter()
          .append('option')
          .attr("value", function(d) {
            return d
          })
          .attr('id', function(d, i) {
            return i
          })
          .text(function(d) {
            return d
          })

        select.on('change', function(d) {
          drawBeeswarm(graphic_datas[csvs.indexOf(d.csv)], select.node().value, d.csv)
          addUnits()

          // update region average line
          if (lines.attr("opacity") == 1) {
            var currentRegion = $("#dropselectRegion").val();
            lines
              .attr("x1", function(d,i) {
                if (d.dropdown) { var selectedKey = $("#select" + d.csv).val() }
                else { var selectedKey = d.label };
                var lineX = regions_data.filter(function(k) { return k.key == currentRegion } )
                  [0].values[0][selectedKey];
                return scales[d.csv](lineX)
              })
              .attr("x2", function(d,i) {
                if (d.dropdown) { var selectedKey = $("#select" + d.csv).val() }
                else { var selectedKey = d.label };
                var lineX = regions_data.filter(function(k) { return k.key == currentRegion } )
                  [0].values[0][selectedKey];
                return scales[d.csv](lineX)
              })
          }

          // if area dropdown is already selected
          // if ($("#dropselect").val()[$("#dropselect").val().length-1] != "") {
          //   // disableMouseover();
          //   showHoverValue($("#dropselect").val()[$("#dropselect").val().length-1],3000);
          // }
        })
      }


      function drawBeeswarm(thisdata, key, selection) {
        // draws or updates one individual beeswarm
        console.log(thisdata)

        // if we've seen this selection before, set firstDraw to false. otherwise, add it to firstDraw and set to true.
        console.log(selection)
        if (firstDraw.hasOwnProperty(selection)) {
          firstDraw[selection] = false
        } else {
          firstDraw[selection] = true
        }

        thissvg = d3.select("#svg" + selection)

        filteredOutAreacds = thisdata.filter(function(d) {
          return d[key] == "NA";
        }).map(function (d) {
          return d.AREACD;
        });
        console.log(filteredOutAreacds)

        data = thisdata.filter(function(d) {
          return d[key] != "NA"
        });
        console.log(data)
        // .filter(function(d){
          // return d.AREACD!="A"
        // })

        // var averageValue = thisdata.filter(function(d){
        //   return d.AREACD==="A"
        // })[0][key]

        //clear svg
        // thissvg.selectAll("*").remove() // TODO: remove this, transition x axis, add .merge and .transition to beeswarm creation

        var x = d3.scaleLinear()
          .range([0, chart_width])
          .domain(d3.extent(data.map(function(d) {
            return +d[key]
          })))

        scales[selection] = x

        var simulation = d3.forceSimulation(data)
          // .randomSource(function() {return 0})
          .force("x", d3.forceX(function(d) {
            return x(+d[key]);
          }).strength(2))
          .force("y", d3.forceY(height / 2))
          .force("collide", d3.forceCollide(dvc.essential.dotradius + dvc.essential.spaceBetweenDots))
          .stop();

        for (var i = 0; i < 290; ++i) simulation.tick();

        //draw average line
        // thissvg.append('line')
        //   .attr('x1',x(averageValue))
        //   .attr('x2',x(averageValue))
        //   .attr('y1',0)
        //   .attr('y2',height)
        //   .attr('stroke','grey')
        //   .attr('stroke-dasharray',"5 3")
        //
        // if(csvs.indexOf(selection)==0){
        //   thissvg.append('text')
        //     .attr('x',x(averageValue))
        //     .attr('y',-2)
        //     .attr('text-anchor','middle')
        //     .text('Average')
        // }

        //draw deprivation arrows
        if (firstDraw[selection]) {
          if(selection==="deprivation"){
            thissvg.append('text')
            .attr('x',x(x.domain()[1]))
            .attr('y',height-5)
            .text('More deprived ►')
            .attr('text-anchor','end')
          }

          thissvg.append('g')
            .attr('transform', 'translate(0,' + height + ')')
            .attr('class', 'x axis')

        }

        thissvg.select("g.x.axis")
          // .transition()
          // .duration(3500)
          .call(d3.axisBottom(x).ticks(5))

        voronoiData[selection] = d3.voronoi()
          .extent([
            [-margin.left, -margin.top],
            [chart_width + margin.right, height + margin.bottom]
          ])
          .x(function(d) {
            return d.x;
          })
          .y(function(d) {
            return d.y;
          })
          .polygons(data)
// console.log(voronoiData[selection])

        function keyfunc(d) { return d.data.AREACD };

        if (firstDraw[selection]) {
          thissvg.append("g")
            .attr("class", "cells");
        };

        thissvg.select("g.cells").selectAll("g")
          .data(voronoiData[selection], keyfunc)
          .enter()
          .append("g")
          .attr('class', function(d) {
            return 'g' + d.data.AREACD
          }); // should be able to just use .merge(cells) here and not need the next line?

        cells = thissvg.select("g.cells").selectAll("g");

        circles = cells.selectAll("circle")
          .data(function(d) { return [d] })

        function filterOutAreacds(d) {
          return (filteredOutAreacds.indexOf(d.data.AREACD) > -1)
        }
        circles
          .enter()
        .append("circle")
          .attr("r", dvc.essential.dotradius)
          .attr('class', function(d) {
            return d.data.AREACD + " dot " + d.data.RGNCD
          })
          .attr("fill", dvc.essential.dotcolour)
          .attr("cx", function(d) {
            return d.data.x;
          })
          .attr("cy", function(d) {
            return d.data.y;
          })
          .attr("opacity",1)
          .merge(circles)
          .classed("invisible", filterOutAreacds)
          .transition()
          .duration(3000)
          .attr("cx", function(d) {
            return d.data.x;
          })
          .attr("cy", function(d) {
            return d.data.y;
          });



        // this wasn't working as intended ..
        // circles.exit().remove();

        // cells.selectAll("circle")
        // // circles
        //   .transition()
        //   .duration(3000)
        //   .attr("cx", function(d) {
        //     return d.data.x;
        //   })
        //   .attr("cy", function(d) {
        //     return d.data.y;
        //   });

        // voronoi paths
        var voronoi = cells.selectAll("path")
          .data(function(d) {
            return [d]
          });

        voronoi.enter()
        .append("path")
          .attr('class', function(d) { return 'voronoiLayer ' + d.data.RGNCD } )
          .attr("d", function(d) {
            return "M" + d.join("L") + "Z";
          })
          .on("mouseover", function(d) {
            console.log('mouseover')
            // only add an area is if it wasn't already selected before mouseover
            if (selectedAreas.indexOf(d.data.AREACD) > -1) {
              console.log('do not add area because already selected')
              hoveringOverAlreadySelectedArea = true;
            } else {
              // only mouseover if no region is selected or moused over something in selected region
              if (
                ( $("#dropselectRegion").val() == "")
                || ( d3.select(this).attr("class").split(" ")[1] == $("#dropselectRegion").val() )
              ) {
              addNewArea(d.data.AREACD)
              }
            }
          })
          .on("mouseout", function(d) {
            // only remove an area if it wasn't already selected before mouseover
            console.log('mouseout')
            if (hoveringOverAlreadySelectedArea) {
              console.log('do not remove area because it was already selected before')
              hoveringOverAlreadySelectedArea = false;
            } else if (clickedDot) {
              console.log('do not remove area because it was clicked')
              clickedDot = false;
            } else {
              removeOldArea(d.data.AREACD);
            }
          })
          .on("click", function(d) {
            console.log('click');
            clickedDot = true;
          });

        // remove ignored ones -- not working
        // voronoi.exit().remove()

        // transition voronoi
        voronoi
          .classed("removed-voronoi", filterOutAreacds)
          .transition()
          .duration(3000)
          .attr("d", function(d) {
            return "M" + d.join("L") + "Z";
          });

        if (($("#dropselect").val() != null) && ($("#dropselect").val()[$("#dropselect").val().length-1] != "")) {
          // showHoverValue($("#dropselect").val()[$("#dropselect").val().length-1],3000);

        //   highlightDot($("#dropselect").val()[$("#dropselect").val().length-1])
        }

      } // end drawBeeswarm


      function RemoveHoverValue(areacd) {
        // TODO: only remove value and unit if it's labelling areacd dot
        d3.selectAll('.value').html("")
        d3.selectAll('.unit').html("")
      };

      function showHoverValue(code, transitionTime) {
        var dataForThisArea = [];
        graphic_datas.forEach(function(d) {
          dataForThisArea.push( d.find(function(e) {
            return e.AREACD === code
          }) );
        });

        // get all the keys from the selects
        getkeys()

        var dataLabels = []
        console.log(dataForThisArea)
        dataForThisArea.forEach(function(item, i) {
          if (item[datakeys[i]] === "NA") {
            dataLabels.push("Data unavailable")
          } else {
            dataLabels.push(item[datakeys[i]])
          }
        });

        //puts the value in the info text
        csvs.forEach(function(d, i) {
          // console.log(voronoiDataForArea)
          // var voronoiDataForArea = voronoiData[d].find(function(d) {return d.data.AREACD === code})
          d3.selectAll(".value" + d + "parent") // selects both value and border text elements
            .selectAll(".value")
            .text(dataLabels[i])
          d3.selectAll(".value" + d + "parent")
            .transition()
            .duration(transitionTime)
            .attr("transform", "translate(" + (margin.left + dataForThisArea[i].x) + "," + dataForThisArea[i].y + ")")
          console.log(d3.selectAll(".value" + d + "parent")
            .style("width"));
        });

        // q = d3.queue()
        // q.defer(addValueUnits, ".infoTextValue")
        // q.defer(addValueUnits, ".infoTextBorder")
        addValueUnits(".infoTextValue")
        addValueUnits(".infoTextBorder")

        //this put the unit on the value
        function addValueUnits(selector) {
          d3.selectAll(selector + " .unit").html(function(d, k, z) {
            if (dataLabels[k] != "Data unavailable") {
              if (typeof d.unit === "object") {
                console.log(d.unit)
                return " " + d.unit[datakeys[k]].unit
              } else {
                return " " + d.unit
              }
            }
          })

        } // end addValueUnits

        //this put the unit on the axis
        addUnits()
      } // ends showHoverValue

      function getkeys() {
        datakeys = [];
        d3.selectAll('select.keyDropdown').each(function(d) {
          datakeys.push(d3.select(this).node().value)
        })

        datakeys.splice(3, 0, "Key workers"); //hard coded for key workers
        datakeys.push("Average score") //hard coded for deprivation
      }

      function addNewArea(code) {
        newAreaIndex = addAreaToSelected(code);
        if (newAreaIndex > -1) {
          highlightDot(code, newAreaIndex);
          updateDropdown(code);
          // showHoverValue(code, 0);
        }
      }

      function removeOldArea(code) {
        oldAreaIndex = removeAreaFromSelected(code);
        if (oldAreaIndex > -1) {
          unHighlightDotByIndex(oldAreaIndex);
          updateDropdown(code);
          // RemoveHoverValue(code);
        }
      }

      function addAreaToSelected(code) {
        console.log('add to selected');
        console.log(selectedAreas);
        // is it possible for code to already be in selectedAreas? In which case do we just ignore?
        // find the first null in selectedAreas and replace with code
        newAreaIndex = selectedAreas.indexOf(null);
        // only add new area if it can replace a null in selectedAreas
        if (newAreaIndex > -1) {
          selectedAreas[newAreaIndex] = code;
          console.log(selectedAreas)
        }
        return newAreaIndex;
      }

      function removeAreaFromSelected(code) {
        console.log('remov from selected');
        console.log(selectedAreas);
        // is it possible for code not to be in selectedAreas?

        oldAreaIndex = selectedAreas.indexOf(code);
        // only remove old area if it is actually in the list
        if (oldAreaIndex > -1) {
          selectedAreas[oldAreaIndex] = null;
          console.log(selectedAreas)
        }
        return oldAreaIndex;
      }

      function highlightDot(code, index) {
        console.log('highlightDot')
        var thisdot = d3.selectAll("." + code);
        // only highlight the dot if it's not yet selected
        console.log(code)
        thisdot.classed('cellsselected', true)
          .classed('cellsselected' + index, true)

        // raise cell so highlighted dots don't get hidden
        d3.selectAll(".cellsselected")
          .each(function() { d3.select(this.parentNode).raise() } )
      }

      function unHighlightDotByIndex(index) {
        console.log('UN highlight dot');
        var thisdot = d3.selectAll(".cellsselected" + index)
          .classed('cellsselected', false)
          .classed('cellsselected' + index, false)
      }

      function updateDropdown() {
        // get what should be selected from selectedAreas

        var dropdownAreas = selectedAreas.filter(function (item){ return item !== null });//self.indexOf(item) === i; });

        // $("#dropselect").val(dropdownAreas).trigger('chosen:updated');
        $("#dropselect").setSelectionOrder(dropdownAreas, true);


        // add colours
        var searchChoices = d3.selectAll(".search-choice");
        console.log(searchChoices);
        // searchChoices.style("background-color", dvc.essential.colour_palette[selectedAreas.indexOf(code)]);
        searchChoices.each( function(d, i) {
          console.log(d3.select(this).style("background-color"));
          if (d3.select(this).style("background-color") == "rgba(0, 0, 0, 0)") {
            var currentCode = dropdownAreas[i];
            var currentIndex = selectedAreas.indexOf(currentCode);
            d3.select(this).style("background-color", dvc.essential.colour_palette[currentIndex]);
          }
        });

      }


      function disableMouseover() {
        d3.selectAll(".cells path").style("pointer-events", "none")
      }

      function enableMouseover() {
        d3.selectAll(".cells path").style("pointer-events", "all")
      }

      function addUnits() {
        //this function adds units to the beeswarms

        getkeys() // is this necessary?


        unitText.html(function(d, i) {
          if (typeof d.unit === "object") {
            return d.unit[datakeys[i]].unit+", "+d.unit[datakeys[i]].time
          } else {
            return d.unit+", "+d.time
          }
        })
      }

      function addClearBehaviour() {
        d3.select('abbr').on('keypress', function(evt) {
          if (d3.event.keyCode == 13 || d3.event.keyCode == 32) {
            d3.event.preventDefault();
            //clear behaviour
            removeOldArea(); // TODO: this needs an area code. Is this function even required??
            enableMouseover();
          }
        })
      }

      function createDropdown(areacd, areanm) {
        var menuarea = d3.zip(areacd, areanm).sort(function(a, b) {
          return d3.ascending(a[1], b[1]);
        });

        //clear dropdown
        d3.select("#dropdown").selectAll("*").remove()

        // Build option menu for dropdown
        var optns = d3.select("#dropdown").append("div").attr("id", "sel").append("select")
          .attr("id", "dropselect")
          .property("multiple", true)
          .attr("class", "chosen-select");

        optns.append("option") //blank option for placeholder


        optns.selectAll("p").data(menuarea).enter().append("option")
          .attr("id", function(d) { // TODO: is this necessary?
            return d[1].replace(/[,.' ]/g, "").trim()
          })
          .attr("value", function(d) {
            return d[0]
          })
          .text(function(d) {
            return d[1]
          });

        var maxLAs = 6;

        $('#dropselect').chosen({
          width: "98%",
          max_selected_options: maxLAs,
          // allow_single_deselect: true, // TODO: what's this for?
          placeholder_text: "Choose up to " + maxLAs + " Local Authorities"
        }).on('change', function(evt, params) {
          if (typeof params != 'undefined') {
            areaLocked = true;
            // disableMouseover();
            if ("selected" in params) {
              addNewArea(params.selected);
            } else if ("deselected" in params) {
              removeOldArea(params.deselected);
            }
            // addClearBehaviour();
          } else {
            // TODO: does this ever happen?? Need to clear any hovered dots maybe??
            enableMouseover();
          }
        });

        //label for option
        d3.select('input.chosen-search-input').attr('id', 'chosensearchinput')
        d3.select('div.chosen-search').insert('label', 'input.chosen-search-input').attr('class', 'visuallyhidden').attr('for', 'chosensearchinput').html("Type to select an area")

      } //end createDropdown

      function createRegionDropdown(areacd, areanm) {
        var menuarea = d3.zip(areacd, areanm).sort(function(a, b) {
          return d3.ascending(a[1], b[1]);
        });

        //clear dropdown
        d3.select("#dropdownRegion").selectAll("*").remove()

        // Build option menu for dropdownRegion
        var optns = d3.select("#dropdownRegion").append("div").attr("id", "sel").append("select")
          .attr("id", "dropselectRegion")
          .attr("class", "chosen-select");

        optns.append("option") //blank option for placeholder


        optns.selectAll("p").data(menuarea).enter().append("option")
          .attr("id", function(d) { // TODO: is this necessary?
            return d[1].replace(/[,.' ]/g, "").trim()
          })
          .attr("value", function(d) {
            return d[0]
          })
          .text(function(d) {
            return d[1]
          });

        $('#dropselectRegion').chosen({
          width: "98%",
          // max_selected_options: maxLAs,
          allow_single_deselect: true,
          placeholder_text: "Filter by region"
        }).on('change', function(evt, params) {
          console.log(evt)
          // // redraw beeswarms (to redraw voronoi)
          // items.each(function(d, i) {
          //   console.log(d)
          //   if (d.dropdown) {
          //     var selectedKey = $("#select" + d.csv).val()
          //   } else {
          //     var selectedKey = d.label
          //   }
          //   console.log(selectedKey)
          //   drawBeeswarm(graphic_datas[i], selectedKey, d.label)
          // });

          if (params != undefined) { // on area select
            // change dot opacity
            d3.selectAll("circle.dot." + params.selected)
              .transition()
              .duration(400)
              .attr("opacity",1);
            d3.selectAll("circle.dot:not(." + params.selected + ")")
              .transition()
              .duration(900)
              .attr("opacity",0.3);

            // show line for region average
            lines
              .attr("x1", function(d,i) {
                if (d.dropdown) { var selectedKey = $("#select" + d.csv).val() }
                else { var selectedKey = d.label };
                var lineX = regions_data.filter(function(k) { return k.key == params.selected } )
                  [0].values[0][selectedKey];
                return scales[d.csv](lineX)
              })
              .attr("x2", function(d,i) {
                if (d.dropdown) { var selectedKey = $("#select" + d.csv).val() //}
                console.log(regions_data.filter(function(k) { return k.key == params.selected } )
                  [0].values[0])
                console.log(selectedKey) }
                else { var selectedKey = d.label };
                var lineX = regions_data.filter(function(k) { return k.key == params.selected } )
                  [0].values[0][selectedKey];
                return scales[d.csv](lineX)
              })
              .attr("opacity", 1);


          } else { // on area deselect
            d3.selectAll("circle.dot")
              .transition()
              .attr("opacity",1);

            lines.attr("opacity", 0);
          }
        });

        //label for option
        // d3.select('input.chosen-search-input').attr('id', 'chosensearchinput')
        // d3.select('div.chosen-search').insert('label', 'input.chosen-search-input').attr('class', 'visuallyhidden').attr('for', 'chosensearchinput').html("Type to select an area")

      } //end createRegionDropdown

      //add source
      d3.select("#source").text("Source: " + dvc.essential.sourceText);

      if (pymChild) {
        pymChild.sendHeight();
      }

    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config
        //load chart data
        console.log(dvc);
        q = d3.queue()
        q.defer(d3.csv, 'regions.csv')
        dvc.essential.graphic_data_url.forEach(function(d) {
          console.log(d);
          q.defer(d3.csv, d + ".csv")
        })
        console.log('queue running')
        q.awaitAll(function(errors, datas) {
          dvc = config;
          regions_data = datas.shift();
          regions_data = d3.nest()
            .key(function(d) {return d.RGNCD})
            .entries(regions_data);
          graphic_datas = datas;
          console.log(dvc);
          console.log(regions_data)
          console.log(graphic_datas);
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        })

      })
    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
  </script>
