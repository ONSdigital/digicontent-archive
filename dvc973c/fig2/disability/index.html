<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    body {
      color: #323132;
      /* max-width:944px; */
    }

    .x.axis path {
      display: none;
    }

    path {
      fill: none;
    }

    text {
      font-family: 'Open Sans'
    }

    text.x,
    text.y {
      font-size: 12px;
      fill: #666;
    }

    #legend {
      font-size: 12px;
    }

    h4 {
      font-size: 16px;
      line-height: 24px;
      margin: 16px 0 16px 0;
      padding: 24px 0 0 0;
      font-weight: bold;
    }

    h5 {
      font-size: 14px;
      margin: 0 0 16px 0;
      font-weight: normal;
      padding-top: 0;
    }

    h5,
    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    ul,
    ol {
      margin: 16px 0;
      padding-left: 32px;
    }

    li {
      margin: 0 0 8px 0;
      line-height: 32px;
      font-weight: 400;
      font-size: 18px;
      padding: 0;
    }

    @media (max-width:767px) {
      li {
        font-size: 16px;
      }
    }

    a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
    }

    .btn {
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
    }

    .btn--primary:focus {
      background-color: #0b5d30;
    }

    .btn--primary {
      background-color: #0F8243;
      color: #fff;
    }

    .annotations .annotation text{
      font-size: 14px;
    }

    path.connector-end.connector-arrow{
      fill:grey;
    }
  </style>
</head>

<body>
  <!-- <h4>Deaths are still rising in some regions but are dropping in others in week 17 (week ending 24 April 2020)</h4> -->

  <div id="legend"></div>
  <div id="graphic" style="position:relative">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <h6 style="height:50px" id="source"></h6>
  <!-- <h6>Notes:</h6>
  <ol>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js" type="text/javascript"></script>
  <script src="../lib/d3-annotation.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <!-- <script src="../lib/d3-legend.min.js" type="text/javascript"></script> -->
  <script>
    var graphic = d3.select('#graphic');
    var legend = d3.select('#legend');
    var pymChild = null;

    function drawGraphic() {

      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      // categorySort = {}
      // if(Array.isArray(dvc.essential.categorySort)){
      //   for (i = 0; i < dvc.essential.categorySort.length; i++) {
      //     categorySort[dvc.essential.categorySort[i]] = i;
      //   }
      //
      //   graphic_data.sort(function(a, b) {
      //     return categorySort[a.category] - categorySort[b.category]
      //   })
      //
      //   categories=Object.keys(categorySort)
      // } else if(dvc.essential.categorySort=="descending"){
      //   //auto sort the array by biggest value
      //   graphic_data.filter(function(d){
      //     return d.date==maxweek
      //   }).sort(function(a,b){return +b.chiffre - (+a.chiffre)}).forEach(function(item, i){
      //     categorySort[item.category]=i
      //   });
      //
      //   graphic_data.sort(function(a, b) {
      //     return categorySort[a.category] - categorySort[b.category]
      //   })
      //
      //   categories=Object.keys(categorySort)
      // } else if (dvc.essential.categorySort=="ascending"){
      //   graphic_data.filter(function(d){
      //     return d.date==maxweek
      //   }).sort(function(a,b){return +a.chiffre - (+b.chiffre)}).forEach(function(item, i){
      //     categorySort[item.category]=i
      //   });
      //
      //   graphic_data.sort(function(a, b) {
      //     return categorySort[a.category] - categorySort[b.category]
      //   })
      //
      //   categories=Object.keys(categorySort)
      //
      // }

      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) / dvc.optional.chart_every[size] - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();
      legend.selectAll("*").remove();

      // draw legend
      legend.append('svg').attr("height", dvc.optional.legendHeight[size]).attr("width", dvc.optional.chart_every[size] * (chart_width + margin.left + margin.right)).append('g')
        .attr('transform', 'translate(5,5)').each(function(){createLegend(this,dvc.essential.legend)})

      function createLegend(selection,array) {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        array.forEach(function(d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select(selection)

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", d.colour)
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 15)
            .attr("height", 15)
            .attr("opacity",0.9)

          var_group.append("text")
            .text(d.key)
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "12px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);


          var_group.selectAll(".legend" + (i))
            .each(calcPosition);

          function calcPosition() {
            var BBox = this.getBBox()

            d3.select(this.parentNode).select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return (lineNo * 20) + 20;
              })
              .attr("x", function(d) {
                return prevX + 25;
              })

            d3.select(this.parentNode).select(".rect" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return (lineNo * 20) + 5;
              })
              .attr("x", function(d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50

          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()

      colour = d3.scaleOrdinal().range(dvc.essential.colour_palette.map(function(d){return d.colour}))
      .domain(dvc.essential.colour_palette.map(function(d){return d.key}))

      y = d3.scaleBand()
        .rangeRound([height, 0])
        .paddingInner(0.15);

      y.domain(d3.map(graphic_data, function(d) {
        return d.date
      }).keys())
//console.log(y.domain());

      var yAxis = d3.axisLeft(y)

      nested = d3.nest()
        .key(function(d) {
          return d.category
        })
        .key(function(d) {
          return d.series
        })
        .entries(graphic_data)

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      x = {}


      if (dvc.essential.xAxisScale == "auto_zero_max_total") {
        var xDomain = [0, d3.max(graphic_data, function(d) {
          return +d.chiffre
        })];
        nested.forEach(function(item, i) {
          x[item.key] = d3.scaleLinear()
            .range([0, chart_width])
            .domain(xDomain)
            .nice();
        });
      } else if (dvc.essential.xAxisScale == "auto_min_max_total") {
        var xDomain = d3.extent(graphic_data, function(d) {
          return +d.chiffre
        });
        nested.forEach(function(item, i) {
          x[item.key] = d3.scaleLinear()
            .range([0, chart_width])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.xAxisScale == "auto_min_max_each") {
        rolledup = d3.nest()
          .key(function(d) {
            return d.category
          })
          .rollup(function(v) {
            return [d3.min(v, function(d) {
              return +d.chiffre
            }), d3.max(v, function(d) {
              return +d.chiffre
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function(item, i) {
          x[item.key] = d3.scaleLinear()
            .range([0, chart_width])
            .domain(item.value)
            .nice();
        });

      } else if (dvc.essential.xAxisScale == "auto_zero_max_each") {
        rolledup = d3.nest()
          .key(function(d) {
            return d.category
          })
          .rollup(function(v) {
            return [0, d3.max(v, function(d) {
              return +d.chiffre
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function(item, i) {
          x[item.key] = d3.scaleLinear()
            .range([0, chart_width])
            .domain(item.value)
            .nice();
        });
      } else if (Array.isArray(dvc.essential.xAxisScale)){
        nested.forEach(function(d){
          x[d.key]=d3.scaleLinear()
          .range([0,chart_width])
          .domain(dvc.essential.xAxisScale)
          .nice();
        })
      }


      xOrd=d3.scaleOrdinal()
      .range([x["Male"](1),x["Male"](2),x["Male"](3)])
      .domain(["The same rate","2x the rate","3x the rate"])

      y1=d3.scaleBand()
      .rangeRound([0,y.bandwidth()])
      .domain(["Age adjusted","Fully adjusted"])

      // sort these hardwired numbers maybe through the dimensions above
      charts = d3.select('#graphic')
        .selectAll('svg')
        .data(nested)
        .enter()
        .append('svg')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)

      // charts.append('g')
      //   .attr('id',function(d){return 'legend'+d.key})
      //   .each(function(d){
      //     createLegend(this,dvc.essential.legend[d.key])
      //   })

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 12)
        .text(function(d) {
          return d.key
        })
        .attr('font-weight', 700)
        .attr('font-size', "14px")

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 30)
        .text("Comparison group: non-disabled")
        .attr('font-weight', 400)
        .attr('font-size', "14px")

      svg = charts
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      svg
        .append('g')
        .attr('class', 'y axis')
        // .attr("transform", "translate(0," + height + ")")
        .call(yAxis)
        .selectAll('text')
        .call(wrap,margin.left)
        // .each(function(d, i) {
        //   if (i % dvc.optional.chart_every[size] == dvc.optional.chart_every[size] - 1 || i == nested.length - 1) {
        //     d3.select(this).append("text")
        //       .text(dvc.essential.xAxisLabel)
        //       .attr("transform", "translate(" + chart_width + "," + (margin.bottom - 5) + ")")
        //       .attr('text-anchor', 'end')
        //       .attr('fill', "#666");
        //   }
        // })

      //create svg for chart

      drawyaxis = svg
        .append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0," + (height+y1.bandwidth()) + ")")

      drawyaxis.each(function(d, i) {
        d3.select(this).call(d3.axisBottom(xOrd).tickSize(-height).tickValues(xOrd.domain().filter(function(d,i){return i%dvc.optional.x_ticks_every[size]==0})));
      })

      drawyaxis
        .append('text')
        .attr('x',chart_width)
        .attr('text-anchor','end')
        .attr('fill','#323132')
        .attr('dy',30)
        .text(function(d,i){if(i%dvc.optional.chart_every[size]==dvc.optional.chart_every[size]-1){return dvc.essential.xAxisLabel}})



      rects=svg
        .selectAll('g.rects')
        .data(function(d) {
          return d.values;
        }).enter()
        .append('g')

      rects.selectAll("rects")
        .data(function(d) {
          return d.values;
        }).enter()
        .append('rect')
        .attr("x",function(d){
          // console.log(d);
          return d3.min([x[d.category](d.chiffre),x[d.category](1)])
        })
        .attr("y",function(d){
          return y(d.date)+y1(d.series)
        })
        .attr("width",function(d){
          return Math.abs(x[d.category](d.chiffre)-x[d.category](1));
        })
        .attr("height",function(d){
          return y1.bandwidth()
        })
        .attr('fill',function(d){return colour(d.series)})
        .attr("opacity",0.9)

      rects.append('line')
      .attr("x1",function(d){return x["Male"](1)})
      .attr("x2",function(d){return x["Male"](1)})
      .attr("y1",-5)
      .attr("y2",height+y1.bandwidth())
      .attr("stroke","#323132")

      paths=svg.selectAll('g.error')
      .data(function(d){return d.values;}).enter().append('g')
      .selectAll("path.ci")
      .data(function(d){return d.values})
      .enter().append('path')
      .attr('class','ci')
      .attr("d",function(e){
        return "M"+x[e.category](e.low)+" "+(y(e.date)+y1(e.series)+y1.bandwidth()*0.25)+"v"+y1.bandwidth()*0.5+" m0 "+(-y1.bandwidth()*0.25)+"h"
        +Math.abs(x[e.category](e.low)-x[e.category](e.up))+"m0"+(-y1.bandwidth()*0.25)+"v"+y1.bandwidth()*0.5
      })
      .attr("stroke","#414042")
      .attr("stroke-width","1px")


      // create a big SVG over the top for annotations
      // annotationsLayer = d3.select("#graphic")
      //   .append('svg')
      //   .attr('id', 'annotationLayer')
      //   .attr('height', Math.ceil(nested.length / dvc.optional.chart_every[size]) * (height + margin.top + margin.bottom))
      //   .attr('width', dvc.optional.chart_every[size] * (chart_width + margin.top + margin.bottom))
      //   .style('background-color', "rgba(255, 255, 255, 0)")
      //   .style('position', 'absolute')
      //   .style('left', "0px")
      //   .style('top', "0px")

      var annotations = [{
        type:d3.annotationLabel,
        note: {
          label: "Increased rate of death involving COVID-19",
          bgPadding: {"top":15,"left":10,"right":10,"bottom":10},
          //wrap:x["Male"](2)-x["Male"](1.1),
          wrap:x["Male"](2)-x["Male"](0.9),
          align:"left",
          orientation:"top",
        },
        connector:{"end":"arrow"},
        className: "show-bg",
        x:x["Male"](3),
        //y:y("Disabled - Limited a little")+y1("Fully adjusted")+y1.bandwidth()*1.5,
        y:120,
        dx: -x["Male"](2)+x["Male"](1.05),
        dy:0
      }]

 if (parseInt(graphic.style("width")) > 670) {
          var makeAnnotations = d3.annotation()
            .annotations(annotations)

          svg
            .append("g")
            .attr("class", "annotation-group")
            .call(makeAnnotations);
      }

      //create link to source
      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
              words = text.text().split(/\s+/).reverse(),
              word,
              line = [],
              lineNumber = 0,
              lineHeight = 1.1, // ems
              x = text.attr("x"),
              dy = parseFloat(text.attr("dy")),
              tspan = text.text(null).append("tspan").attr("x", x).attr("y", 0).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", 0).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }


      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config;

        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          graphic_data = data;


          //use pym to create iframed chart dependent on specified variables
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });

      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
  </script>
