<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title>Stacked area chart</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    body {
      color: #323132;
      /* max-width:944px; */
    }

    .x.axis path {
      display: none;
    }

    path {
      fill: none;
    }

    text {
      font-family: 'Open Sans'
    }

    text.x,
    text.y {
      font-size: 12px;
      fill: #666;
    }

    line.y,
    line.x {
      stroke: #ccc;
      stroke-width: 1px;
      shape-rendering: crispEdges;
    }

    #legend {
      font-size: 12px;
    }

    h4 {
      font-size: 16px;
      line-height: 24px;
      margin: 16px 0 16px 0;
      padding: 24px 0 0 0;
      font-weight: bold;
    }

    /* h5 {
      font-size: 14px;
      margin: 0 0 16px 0;
      font-weight: normal;
      padding-top: 0;
    } */

    h5,h6 {
      font-size: 16px;
      /* margin: 16px 0 8px 0; */
      font-weight: 700;
      /* color: #323132; */
    }

    ul, ol {
      margin: 16px 0;
      padding-left: 32px;
    }

    li {
        margin: 0 0 8px 0;
        line-height: 32px;
        font-weight: 400;
        font-size: 18px;
        padding: 0;
    }

    @media (max-width:767px){
        li{
          font-size:16px;
        }
    }

  	.line5-yearaverage {
  		stroke: #666;
  		stroke-dasharray: 5 8 !important;
  		stroke-linecap: round !important;
  		stroke-width: 2px !important;
  	}

    a {
        text-decoration: underline;
        font-size: 18px;
        font-weight: 400;
        line-height: 32px;
    }

    .btn {
        font-family: "Open Sans",Helvetica,Arial,sans-serif;
        display: inline-block;
        width: auto;
        cursor: pointer;
        padding: 6px 16px 10px 16px;
        border: 0 none;
        text-align: center;
        -webkit-appearance: none;
        transition: background-color 0.25s ease-out;
    }

    .btn--primary:focus {
    background-color: #0b5d30;
}

    .btn--primary {
    background-color: #0F8243;
    color: #fff;
}

  .ticky1 {
    display:none;
  }

  </style>
</head>

<body>
  <h5 class="visuallyhidden" id="screenreadertext"></h5>
  <div aria-hidden="true" id="legend"></div>
  <div aria-hidden="true" id="graphic" style="position:relative">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <h6 id="source"></h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js" type="text/javascript"></script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.1.0/d3-annotation.js" type="text/javascript"></script> -->
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <!-- <script src="../lib/d3-legend.min.js" type="text/javascript"></script> -->
  <script src="../lib/d3-annotation.js" type="text/javascript"></script>

  <script>
    var graphic = d3.select('#graphic');
    var legend = d3.select('#legend');
    var pymChild = null;

    function drawGraphic() {
      //set the screenreader H5
      d3.select("#screenreadertext").text(dvc.essential.screenreadertext)

      maxweek=d3.max(graphic_data,function(d){return d.date})

      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      categorySort = {}
      if(Array.isArray(dvc.essential.categorySort)){
        for (i = 0; i < dvc.essential.categorySort.length; i++) {
          categorySort[dvc.essential.categorySort[i]] = i;
        }

        graphic_data.sort(function(a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories=Object.keys(categorySort)
      } else if(dvc.essential.categorySort=="descending"){
        //auto sort the array by biggest value
        graphic_data.filter(function(d){
          return d.date==maxweek
        }).sort(function(a,b){return +b.chiffre - (+a.chiffre)}).forEach(function(item, i){
          categorySort[item.category]=i
        });

        graphic_data.sort(function(a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories=Object.keys(categorySort)
      } else if (dvc.essential.categorySort=="ascending"){
        graphic_data.filter(function(d){
          return d.date==maxweek
        }).sort(function(a,b){return +a.chiffre - (+b.chiffre)}).forEach(function(item, i){
          categorySort[item.category]=i
        });

        graphic_data.sort(function(a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories=Object.keys(categorySort)

      }

      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) / dvc.optional.chart_every[size] - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();
      legend.selectAll("*").remove();

      //draw legend
      legend.append('svg').attr("height", dvc.optional.legendHeight[size]).attr("width", dvc.optional.chart_every[size] * (chart_width + margin.left + margin.right)).append('g')
        .attr('transform', 'translate(5,5)')

      createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        dvc.essential.colour_palette.map(function(d) {
          return d.key
        }).forEach(function(d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").select('svg').append("g")

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", dvc.essential.colour_palette[i].colour)
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 15)
            .attr("height", 15)

          var_group.append("text")
            .text(dvc.essential.colour_palette[i].key)
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "12px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);


          d3.selectAll(".legend" + (i))
            .each(calcPosition);

          function calcPosition() {


            var BBox = this.getBBox()


            //prevY =BBox.width
            d3.select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function(d) {
                return prevX + 25;
              })


            d3.select(".rect" + (i))
              .attr("y", function(d) {

                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }

                if (dvc.optional.legendStyle == "rect") {
                  return eval((lineNo * 20) + 8);
                } else {
                  return eval((lineNo * 20) + 12);

                }
              })
              .attr("x", function(d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50



          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()

      x = d3.scaleTime()
        .range([0, chart_width]);

      x.domain(d3.extent(graphic_data, function(d) {
        return d.date
      }))

      dates=d3.map(graphic_data,function(d){return d.date}).keys()


      var xAxis = d3.axisBottom(x)
        // .tickValues(d3.timeMonth.range(x.domain()[0],x.domain()[1],1))
        // .tickValues([
        //   d3.timeParse("%b %Y")("Nov 2020"),
        //   d3.timeParse("%b %Y")("Jan 2021"),
        //   d3.timeParse("%b %Y")("Apr 2021")
        // ])
          // .tickValues(d3.map(graphic_data,function(d){return d.date}).keys()
            // .map(function(d){return d3.timeParse("%a %b %d %Y")(d.match(/\b[\w']+(?:[^\w\n]+[\w']+){1,3}\b/g)[0])})
            // .sort(function(a,b){return a - b})
            // .filter(function(d,i){
            //   return i % dvc.optional.x_ticks_every[size] === 0&&i<dates.length-dvc.optional.x_ticks_every[size] || i==dates.length-1 //Rob's fussy comment about labelling the last date
            // }))
          .tickFormat(d3.timeFormat(dvc.essential.displayTicksFormat))

      // line = d3.line()
      //   .x(function(d) {
      //     return x(d.date)
      //   })
      //   .y(function(d) {
      //     return y[d.category](d.chiffre)
      //   })

// console.log(d3.nest()
//   .key(function(d) { return d.category})
//   .entries(graphic_data))

      nested = d3.nest()
        .key(function(d) {
          return d.category
        })
        // .key(function(d) {
        //   return d.series
        // })
        .sortValues(function(a,b) { return a.date - b.date; } )
        .entries(graphic_data)

        categories = nested.map(function(d) {return d.key})

        keys = dvc.essential.colour_palette.map(function(d){return d.key})


      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      y = {}

      // gets all numbers into one flat array
      flatData = graphic_data.map(function(d) {
        return keys.map(function(k) {
          return +d[k]
        })
      }).flat()

      // calculates the total of each stack for setting axis domain
      stackTotals = graphic_data.map(function(d) {
        tmpData = [];
        keys.forEach(function(key) {
          tmpData.push(+d[key]);
        });
        // use reduce to sum up the current stack
        return tmpData.reduce(function(a,b) { return a + b }, 0);
      })

      if (dvc.essential.yAxisScale == "auto_zero_max_total") {
        var yDomain = [0, d3.max(stackTotals)];

        nested.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      // The following yAxisScales won't work - only auto_zero_max_total.
      // But the rest shouldn't be necessary for a stacked area chart anyway.

      // } else if (dvc.essential.yAxisScale == "auto_min_max_total") {
      //   var yDomain = d3.extent(graphic_data, function(d) {
      //     return +d.chiffre
      //   });
      //   nested.forEach(function(item, i) {
      //     y[item.key] = d3.scaleLinear()
      //       .range([height, 0])
      //       .domain(yDomain)
      //       .nice();
      //   });
      // } else if (dvc.essential.yAxisScale == "auto_min_max_each") {
      //   rolledup = d3.nest()
      //     .key(function(d) {
      //       return d.category
      //     })
      //     .rollup(function(v) {
      //       return [d3.min(v, function(d) {
      //         return +d.chiffre
      //       }), d3.max(v, function(d) {
      //         return +d.chiffre
      //       })]
      //     })
      //     .entries(graphic_data)
      //
      //   rolledup.forEach(function(item, i) {
      //     y[item.key] = d3.scaleLinear()
      //       .range([height, 0])
      //       .domain(item.value)
      //       .nice();
      //   });
      //
      // } else if (dvc.essential.yAxisScale == "auto_zero_max_each") {
      //   rolledup = d3.nest()
      //     .key(function(d) {
      //       return d.category
      //     })
      //     .rollup(function(v) {
      //       return [0, d3.max(v, function(d) {
      //         return +d.chiffre
      //       })]
      //     })
      //     .entries(graphic_data)
      //
      //   rolledup.forEach(function(item, i) {
      //     y[item.key] = d3.scaleLinear()
      //       .range([height, 0])
      //       .domain(item.value)
      //       .nice();
      //   });
      }

      // var z = d3.scaleOrdinal().range(dvc.essential.colour_palette);

      var stack = d3.stack();
      stack.keys(keys);

      var area = d3.area()
                  .x(function(d, i) { return x(d.data.date); })
                  .y0(function(d) { return y[d.data.category](d[0]); })
                  .y1(function(d) { return y[d.data.category](d[1]); });

      // console.log(stack(nested[0].values));

      charts = d3.select('#graphic')
        .selectAll('svg')
        .data(nested)
        .enter()
        .append('svg')
        .attr('id',function(d,i){return 'svg'+i})
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 12)
        .text(function(d) {
          return d.key
        })
        .attr('font-weight', 700)
        .attr('font-size', "14px")

      svg = charts
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      svg
        .append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0," + height + ")")
        .call(xAxis)
        .each(function(d, i) {
          if (i % dvc.optional.chart_every[size] == dvc.optional.chart_every[size] - 1||i==nested.length-1) {
            d3.select(this).append("text")
              .text(dvc.essential.xAxisLabel)
              .attr("transform", "translate(" + chart_width + "," + (margin.bottom - 5) + ")")
              .attr('text-anchor', 'end')
              .attr('fill', "#666");
          }
        })

      //create svg for chart

      drawyaxis = svg
        .append('g')
        .attr('class', 'y axis')

      //y axis label
         svg
          .each(function(d, i) { //only label the first graph
            if (i % dvc.optional.chart_every[size] == 0) {
              d3.select(this).append("text")
              .attr('transform','translate(' + (- 23) + ', -10)')
              .attr("font-size","11px")
              .attr("fill","#666")
              .text(function(d,i) { return dvc.essential.yAxisLabel});
            }
          })

      drawyaxis.each(function(d, i) {
        if (i % dvc.optional.chart_every[size] == 0) {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).ticks(3));
        } else {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickFormat("").ticks(3))
        }

      })

      var layer = svg.selectAll(".layer")
        .data(function(d) {
          return stack(d.values);
        })
        .enter()
        .append("g")
        .attr("class", "layer")

      layer.append("path")
        .attr("class", "area")
        // .style("fill", function(d) {return "black"})
        .style("fill", function(d) { return dvc.essential.colour_palette.filter(function(e) {return d.key == e.key})[0].colour})
        .attr("d", area);
        //
        // .selectAll('g.line')
        // .data(function(d) {
        //   console.log(d);
        //   return d.values;
        // })
        // .enter()
        // .append('path')
        // .attr("d", function(d) {
        //   // console.log(d)
        //   return line(d.values)
        // })
        // .attr("class",function(d){return "line"+d.key.replace(/\s/g, '')})
        // .attr("stroke", function(d) {
        //   console.log(dvc.essential.colour_palette.filter(function(e) {
        //     return e.key == d.key
        //   }));
        //   return dvc.essential.colour_palette.filter(function(e) {
        //     return e.key == d.key
        //   })[0].colour
        // })
        // .attr('stroke-width', "3px")

      d3.selectAll("g.x.axis")
        .selectAll(".tick")
        .attr("class", function(d,i) { return "ticky ticky" + (i%2) })

      makeD3annotations();

      function makeD3annotations() {
        annotations = [
          // {
          //   data: { x: d3.timeParse("%d %b %Y")("01 Nov 2020"), y:100 },
          //   type: d3.annotationBadge,
          //   subject: { text: "A", radius: 14, y: "top" }
          // },
          {
            data: { x: d3.timeParse("%d %b %Y")("02 Dec 2020"), y:100 },
            type: d3.annotationBadge,
            subject: { text: "A", radius: 14, y: "top" }
          }, {
            data: { x: d3.timeParse("%d %b %Y")("04 Jan 2021"), y:100 },
            type: d3.annotationBadge,
            subject: { text: "B", radius: 14, y: "top" }
          // }, {
          //   data: { x: d3.timeParse("%d %b %Y")("22 Feb 2021"), y:100 },
          //   type: d3.annotationBadge,
          //   subject: { text: "D", radius: 14, y: "top" }
          },{
            data: { x: d3.timeParse("%d %b %Y")("12 Apr 2021"), y:100},
            type: d3.annotationBadge,
            subject: { text: "C", radius: 14, y: "top" }
          }
        ]

        annotations2 = [
          // {
          //   data: { x: d3.timeParse("%d %b %Y")("01 Nov 2020"), y:100 },
          //   type: d3.annotationBadge,
          //   subject: { text: "A", radius: 14, y: "top" }
          // },
          {
            data: { x: d3.timeParse("%d %b %Y")("02 Dec 2020"), y:100 },
            type: d3.annotationBadge,
            subject: { text: "A", radius: 14, y: "top" }
          }, {
            data: { x: d3.timeParse("%d %b %Y")("04 Jan 2021"), y:100 },
            type: d3.annotationBadge,
            subject: { text: "B", radius: 14, y: "top" }
          // }, {
          //   data: { x: d3.timeParse("%d %b %Y")("22 Feb 2021"), y:100 },
          //   type: d3.annotationBadge,
          //   subject: { text: "D", radius: 14, y: "top" }
          },{
            data: { x: d3.timeParse("%d %b %Y")("12 Apr 2021"), y:100},
            type: d3.annotationBadge,
            subject: { text: "C", radius: 14, y: "top" }
          }
        ]

        var annotationLegend = [
          // {
          //   note: { label: "National lockdown begins." },
          //   subject: { text: "A" },
          //   x: 30,
          //   y: 25
          // },
          {
            note: { label: "National lockdown ends." },
            subject: { text: "A" },
            x: 30,
            y: 25
          },
          {
            note: { label: "National lockdown begins." },
            subject: { text: "B" },
            x: 30,
            y: 65
          },
          // {
          //   note: { label: "Roadmap out of lockdown announced." },
          //   subject: { text: "D" },
          //   x: 30,
          //   y: 145
          // },
          {
            note: { label: "Outside hospitality opens." },
            subject: { text: "C" },
            x: 30,
            y: 105
          }
        ]

          // make annotations on desktop - badges on
          makeAnnotations = d3.annotation()
            .notePadding(0)
            .accessors({
              x: function (d) { return x(d.x) + margin.left },
              y: function (d) { return y[categories[0]](d.y) + margin.top }
            })
            .annotations(annotations)

          makeAnnotations2 = d3.annotation()
            .notePadding(0)
            .accessors({
              x: function (d) { return x(d.x) + margin.left },
              y: function (d) { return y[categories[0]](d.y) + margin.top }
            })
            .annotations(annotations2)

          charts.each(function(d,i) {
            if(i==1){
              d3.select(this)
                .append("g")
                .attr("id", function() { return "Gs-annotation"+i})
                // .attr("class", "annotation-group")
                .call(makeAnnotations2)
            }

            if(i==0){
              d3.select(this)
                .append("g")
                .attr("id", function() { return "Gs-annotation"+i})
                // .attr("class", "annotation-group")
                .call(makeAnnotations)
            }

          })

          // make badge annotations on mobile
          var makeLegendAnno = d3.annotation()
            .type(d3.annotationBadge)
            .annotations(annotationLegend)

          d3.select("#graphic")
            .append('svg')
            .attr("class", "annotation-legend")
            .attr("height", "125px")
            .attr("width", d3.select("#graphic").style("width"))
            .call(makeLegendAnno)

          d3.select("svg.annotation-legend")
            .selectAll("text.legend")
            .data(annotationLegend)
            .enter()
            .append('text')
            .attr("class", "legend")
            .text(function (d) { return d.note.label })
            .attr("x", 60)
            // .attr("dy", function(d,))
            .attr("y", function (d) { return d.y + 4 })
            // .call(wrap, chart_width + margin.left + margin.right - 65)

        }

      d3.selectAll("text.annotation-note-label").attr("text-anchor", "middle");
      d3.selectAll(".subject,.subject-pointer").style("fill", "grey");
      d3.selectAll(".subject-ring").style("fill", "white");
      d3.selectAll(".leftlabel").select("text.annotation-note-label").attr("text-anchor", "left")

      if (dvc.optional.vertical_line == true) {
				dvc.optional.annotateLineX1_Y1_X2_Y2.forEach(function (d, i) {
					svg.each(function(){
            d3.select(this)
              .append("line")
  						.attr('x1', x(d3.timeParse(dvc.essential.dateFormat)(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][0])))
  						.attr('x2', x(d3.timeParse(dvc.essential.dateFormat)(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][0])))
  						.attr('y1', y[categories[0]](dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][1]))
  						.attr('y2', y[categories[0]](dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][1]))
  						.style('stroke', '#adadad')
  						.style('stroke-width', 2)
  						.style('stroke-dasharray', '10 5');
  				})
        })
			}


      //create link to source
      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config;

        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          graphic_data = data;

          graphic_data.forEach(function(d){
            d.date=d3.timeParse(dvc.essential.dateFormat)(d.date)
          })
