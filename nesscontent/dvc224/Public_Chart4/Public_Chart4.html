    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>
		
	// Labels for the key (same order as the columns in your csv file) - The names don't need to match those in the CSV. In fact the names in the csv must be all one string, no gaps or funny characters
	var legendTitle = "Number of bedrooms";
	
	// Labels for the key (same order as the columns in your csv file) - The names don't need to match those in the CSV. In fact the names in the csv must be all one string, no gaps or funny characters
	var labels = [  "Medical services" , "Central and other health services", "Medical research"];
	

	// Location and name of the file - if the csv is in the same folder then all you need to do is point it to the right filename
	var graphic_data_url = 'Public_Chart4.csv';
	var $graphic = $('#graphic');
	var graphic_data;
	var graphic_aspect_width = 16;
	var graphic_aspect_height = 9;
	var mobile_threshold = 500;
	var tablet_threshold = 600;
	var pymChild = null;
	
	
	function drawGraphic(width)
	{
		
		var margin = {top: 0, right: 0, bottom: 0, left: 0};
		var width = $graphic.width() - margin.left - margin.right;
		var height = Math.ceil((width * graphic_aspect_height) / graphic_aspect_width) - margin.top - margin.bottom;
		
		
		var radius = Math.min(width, height) / 2;
	
				
		var color = d3.scale.ordinal().range([ "#2C486E" , "#f3942f" , "#e73f40" , "#7bcae2" , "#979796" ]);
						
		
		var arc = d3.svg.arc()
			.outerRadius(radius*0.8)
			.innerRadius(radius*0.4);
					
	
		if (width < mobile_threshold)
		{
			//var height = Math.ceil((width * graphic_aspect_width) / graphic_aspect_width) - margin.top - margin.bottom;
			height = (width - margin.top - margin.bottom);
			
			radius = Math.min(width, height) / 1.9;
		
			arc = d3.svg.arc()
				.outerRadius(radius*0.8 )
				.innerRadius(radius*0.4 );
		}
		
		// clear out existing graphics
		$graphic.empty();
		
			 
		var pie = d3.layout.pie()
			.padAngle(.02)
			.sort(null)
			.value(function(d) { return d.value; });
		
		var lines = {};
		
		for (var column in graphic_data[0]) {
			if (column == 'date') continue;
			lines[column] = graphic_data.map(function(d) {
				return {
					'date': d.date,
					'amt': d[column]
				};
			});
		}
			
		var legend = d3.select('#graphic')
			.append('ul')
			.attr('class', 'key')
			.selectAll('g')
			.data(d3.entries(labels))
			.enter()
			.append('li')
			.style("background-color", function(d , i) { return color[i]; })
			.attr('class', function(d, i) { return 'key-item key-' + i + ' b'+ d.value.replace(' ', '-').toLowerCase(); });
	
		legend.append('b');
		legend.append('label').text(function(d,i) {
			var value = parseFloat(graphic_data[i].value).toFixed(1);
			return labels[i]/* + " (" + value + "%)"*/;
		});
		
	
		
		var svg = d3.select('#graphic')
			.append("svg")
			.attr("id" , "baseSVG")/*
			.attr("width", width)
			.attr("height", height)*/
			.attr("width", width + margin.left + margin.right)
			.attr("height", height + margin.top + margin.bottom)
			.append("g")
			.attr("transform", "translate(" + (width/2) + "," + (height/2) + ")");
			
		var g = svg.selectAll(".arc")
			.data(pie(graphic_data))
			.enter()
			.append("g")
			.attr("class", "arc");
	
		g.append("path")
			.attr("d", arc)
			.attr("id" , "donut")
			.style("fill", function(d) { return color(d.data.group); });
	
		g.append("text")		
//			.attr("transform", function(d) {
//				var c = arc.centroid(d);
//				return "translate(" + c[0]*1 + "," + c[1]*1 + ")";
//			})
			.attr("transform", function(d,i) {
				var c = arc.centroid(d),
					x = c[0],
					y = c[1],
					// pythagorean theorem for hypotenuse
					h = Math.sqrt(x*x + y*y),
					labelr = (i%2==0) ? radius*0.90 : radius*0.85;
				return "translate(" + (x/h * labelr) +  ',' +
				   (y/h * labelr) +  ")"; 
			})
			.attr("dy", ".35em")
			.style("text-anchor", "middle")
			.style("font-size", "12px")
			.attr("id" , function(d , i){
				return "arcNo" + i;
			})
			.text(function(d , i) {
				
				
				/*if ( i == 3 || i == 4 ) { return; }
				else { */return parseFloat(d.data.value).toFixed(1) + "%"; /*}
		*/
				
			});
		
		if (pymChild) { pymChild.sendHeight(); }
	
	}// end function drawGraphic()
	
	
	if (Modernizr.svg)
	{			
		d3.csv(graphic_data_url, function(error, data) {
			graphic_data = data;
			pymChild = new pym.Child({renderCallback: drawGraphic});
		});
	}
	
    </script>
