			#menu{

						#filters{
							
							padding-top:30px;
						}

						#filters li{

							float:none;
							
							display:inline;				

						}

						

						#filters a{

							float:left;

							text-align:center;

							cursor:pointer;
							
							width:100%;
							height:38px;
							line-height:25pt;
							color:#666;
							text-decoration: none;
							/*border-bottom:5px solid #999;*/

						}

						

						#btn1:hover, #btn2:hover, #btn3:hover, #btn4:hover, #btn5:hover{						
							background:#e1e1e1;

						}
						
						a#btn1.highlight, a#btn2.highlight, a#btn3.highlight, a#btn4.highlight, a#btn5.highlight{

                            </li> 
                        </ul>  
    
                </nav> 
    </div><!--end menu-->

<script type="text/javascript"> 



//init function

$(document).ready(function(){

	$('#filters a').click(function(){ 

			$(".highlight").toggleClass("highlight");

			$(this).toggleClass("highlight");

	})



});
