<script>
		var pymChild = new pym.Child();
		var svg;

		// Variable to hold the current page that we're on
		var pageCounter = 1;
		// Variable to hold the maximum number of pages
		var maxPages = 3;
		// global object variable to contain all variables prefixed with 'dvc.'
		var dvc = {};
		// Code for each of the lines		
		var projPermutations = ["Est", "PPP", "HPP", "LPP", "PHP", "PLP", "PPH", "PPL", "PPZ", "HHH", "LLL"];
			  
  		var keypoints = $('#keypoints');
		var chart = $("#chart");
		var chartwidth;
		var height;
		var margin;
		var width;
		var color;
		var lists;
		var cloneColour;
		
		// Variable to show when on mobile view
		var	threshold_sm;

	  	//then, onload, check to see if the web browser can handle 'inline svg'
	  	if (Modernizr.inlinesvg)
	  	{										
		  
		  	// And here's the full-fat code for everyone else		
		  	// function call to delay displaying opening screen until all data in 'data.js' has loaded			
			
			//Calling a function - that starts to build everything
		  	loadConfiguration();
		  
		
	  
	  	} // end if ... 
	  	else
	  	{
		  //Use this space to offer the user something else eg upgrade your broswer message or a fallback image.
			
		}
		
		
		

	  
		/*
			NAME: 			loadConfiguration
			DESCRIPTION: 	
			CALLED FROM:	
			CALLS:			
			REQUIRES: 		
			RETURNS: 		
		*/
		function loadConfiguration()
	  	{
		  
			
			// open and load configuration file. 
			// specify the path of where it sits.  A . means go up a level but not used here					
			d3.json("lib/config.json", function(json) // Here you're passing the content of this json file into the "json" variable.
			{			
			
				// store read in json data from config file as as global dvc. variable ...	
				// because the "json" variable is local to this function but we want to be able to use this config anywhere in your code
				dvc.chartConfig = json;	
				
				pymChild = new pym.Child({ renderCallback:makeChart});
									
				/* Build DataGroup selection list ... */			
				// First create an empty array variable that we can populate using the loop below.
				var valueArray = [];
				
				
				// Pair the arrays together in preparation for building a select / dropdown list. We're going to want to have a visable name but also a code that sits behind. See page here on d3.zip - https://github.com/mbostock/d3/wiki/Arrays eg d3.zip([hello","vicky","how"],[0,1,2] would return [[hello,0],[vicky,1],[how,2]] here paring the variant name with valuearray variable set above to give it a number/index
				var dataGroupsArrays = d3.zip( dvc.chartConfig.vars.VariantType , projPermutations );

				//Creating a copy of the same variable - not really necessary but leaving in here as the sort bit might be useful for sorting the array by alphabetic order.
				//slice function starts the array from the specified point/trims the array http://www.w3schools.com/jsref/jsref_slice_array.asp
				dvc.dataGroupsArrays = dataGroupsArrays.slice(2);/*.sort(function(b, a){ return d3.descending(a[0], b[0])})*/;
				
			// Just adding a text label for the buttons we're about to create.
				dropnext = d3.select("#varmenu").append("ul")
						.attr("class","dropdown-menu")
						.attr("role","menu");
						
				dropnext.selectAll("li")
						.data(dvc.dataGroupsArrays)
						.enter()
						.append("li")
						.append("a")
						.attr("href","#")
						.attr("value", function(d){	return d[1];})
						.text(function(d){ return d[0];})
						.on("click", function(d,i){
						// create a code to select the lines on click
							dvc.dataGroup = d3.select(this).attr("value");

							//appending the text of the variant 
							dvc.modelname = d3.select(this).text();
							//dvc.chartConfig.vars.AbbreviatedModelType[.dataGroupCode];
							d3.select("#varmenu").select("#varsel").text(dvc.modelname);
								
							transitionData()
					});

					d3.select("#filters").append("text").attr("id", "variantText").text("Select your variant:")
					lists = d3.select("#filters").attr("class","hidden-xs", "highlight").style("display","none").selectAll("li")
						.data(dvc.dataGroupsArrays)
						.enter()
						.append("li")
						.on("click", function(d,i){
								d3.select("#filters").selectAll("li").attr("class","");
								d3.select(this).attr("class","selectedli");

								dvc.dataGroup = d3.select(this).select("a").attr("value");

								//appending the text of the variant 
								d3.select("#varmenu").select("#varsel").text(dvc.modelname).attr("pointer-events", "none");
									
								transitionData()
							});


						lists.append("b")
							.attr("id",function(d,i){return "border" + i})
							.style("border-top",function(d,i){return "2px solid " + color.range()[i+2]});



						lists.append("a")
							.attr("id",function(d,i){return "btn" + (i+1)})
							.attr("href","#")
							.attr("value", function(d){	return d[1];})
							.text(function(d){ return d[0];})


//				//Setting the intial state for each of these variables...
//				
//				// y- and x-Axis variables ... initialises to first element of "axisType" array in config file 
				dvc.dataGroup = 0;
				dvc.dataGroupIndex = dvc.chartConfig.vars.AbbreviatedModelType.indexOf(dvc.dataGroup);
			
			});
	  
		} // end function loadConfiguration()
			
	
	  
		/*
			NAME: 			transitionData
			DESCRIPTION: 	
			CALLED FROM:	
			CALLS:			
			REQUIRES: 		
			RETURNS: 		
		*/

		
		function transitionData()
		{
			  			  
			//creating a variable to string together the variable set up. Previously with the 3 buttons had to create separate vars for each level and then string together.
			modelStr = "#" + dvc.dataGroup;
			  
			d3.select("#Est").style("stroke" , "#1f77b4").style("opacity", 1.00)
			d3.select("#PPP").style("stroke" , "#1f77b4").style("opacity" , 1.00)
		
	
			//remove any previously drawn line
			d3.select("#frontLine").remove();

			//create variable to clone line being drawn so can bring to front next
			var clonePath = d3.select(modelStr).attr("d");
			cloneColour = d3.select(modelStr).style("stroke");

			//bring line being drawn to front so not hidden by other transparent lines
			d3.select("#biggroup").append("path")
				.attr("class","line")
				.attr("id", "frontLine")
				.attr("d", clonePath)
				//.style("stroke" , "#2ca02c")
				.style("stroke",cloneColour)
				//.style("opacity" , 1.0)
				//.style("stroke-width", 4)
				.style("opacity", 0.0)
				.transition()
				.duration(500)
				.style("opacity", 1.0)
				.attr("stroke-linecap","round");

			//create variable to clone line being drawn so can bring to front next
			var clonePPPPath = d3.select("#PPP").attr("d");

			//bring line being drawn to front so not hidden by other transparent lines
			d3.select("#biggroup").append("path")
				.attr("class","line")
				.attr("id", "PPPFrontLine")
				.attr("d",clonePPPPath)
				.style("stroke" , "#1f77b4")
				.style("opacity" , 1)
				//.style("stroke-width", 4)
				.attr("stroke-linecap","round");

			return;		  


			  
		}// end function transitionData() 
	
	  
	  
	  
	  
	  
		/*
			NAME: 			makeChart
			DESCRIPTION: 	
			CALLED FROM:	
			CALLS:			
			REQUIRES: 		
			RETURNS: 		
		*/
		
		var pymChild = null;
		
		function makeChart()
		{
			  
			  
			//Then start constructing all the variables we'll need to make the chart
			// Starting with some margins and chart width
			// Can do some more ambitious width setting here by looking at the width of screen or width of a div
			// Eg $("chart").width();
			
			chartwidth = $("#chart").width();
			
			//Define an aspect ratio
			var aspectwidth = 4;
			var aspectheight = 3;
			
			//Define the threshold 
			var threshold_md = 780;
			//Updating value of threshold_sm
		   	threshold_sm = dvc.chartConfig.vars.mobileBreakpoint; 
			
			// Set the margin so that things like the yaxis labels fit in
			margin = {top: 20, right: 20, bottom: 67, left: 20},
			width = chartwidth - margin.left - margin.right;
				
			height = ((width * aspectheight)/aspectwidth) - margin.top - margin.bottom;
			
			 // clear out existing graphics
		    chart.empty();
			keypoints.empty();
			$("#commentary").empty();
			 pageCounter = 1;
			
			// Set up the format to match that of the data that is being read in - have a look here for a list of formats - https://github.com/mbostock/d3/wiki/Time-Formatting
				parseDate = d3.time.format("%Y").parse;
				bisectDate = d3.bisector(function(d) { return d.date; }).left;
				formatValue = d3.format(",.2f");
				formatCurrency = function(d) { return "$" + formatValue(d); };
			
			// Setting up the scaling objects
			// Really giving d3 the information on how wide  the chart is going to be using the dimensions set above.			
			x = d3.time.scale()
				.range([0, width]);
			
			// Same for the y axis
			y = d3.scale.linear()
				.range([height, 0]);
			
			// Same for colour.
			//color = d3.scale.category10();

			color = d3.scale.ordinal()
				  .domain(projPermutations)
				  .range(["#1f77b4", "#1f77b4", "#00438d", "#870b5f", "#e44800", "#878787", "#ffd600", "#33a02c", "#f4aaff", "#5abad3","#b15928"]);
				   // .range(['rgb(141,211,199)','rgb(255,255,179)','rgb(190,186,218)','rgb(217,217,217)','rgb(128,177,211)','rgb(253,180,98)','rgb(179,222,105)','rgb(252,205,229)','rgb(251,128,114)','rgb(188,128,189)','rgb(204,235,197)']);
			

			// label
			d3.select('#chart').append("p")
		                .attr('class', 'unit')
		  		        .text(function(d,i) { return dvc.chartConfig.vars.yAxisLabel; });

			//Setting y-axis up here using y scaling object
			var yAxis = d3.svg.axis()
				.scale(y)
				.orient("left")
				.tickSize(-width)
		
				if (chart.width() <= threshold_sm) {
						yAxis.ticks(dvc.chartConfig.vars.y_num_ticks_sm_md_lg[0])
					 } else if (chart.width() <= threshold_md){
						yAxis.ticks(dvc.chartConfig.vars.y_num_ticks_sm_md_lg[1])
					 } else {
						yAxis.ticks(dvc.chartConfig.vars.y_num_ticks_sm_md_lg[2])
					 }
					 
			// Setting up a d3 line object - used to draw lines later
			var line = d3.svg.line() // Set up the line object
				.defined(function(d) {return d.population !="";})
				.x(function(d) { return x(d.date); }) // Tell it what you want your x and y variables to be and wrap the values in the x and y caling objects.
				.y(function(d) { return y(d.population); });
			
			
			// Now to actually make something
			svg = d3.select("#chart").append("svg") // Select the chart div that already exists and add an SVG element.
				.attr("class", "svgele") // and give it some attributes such as class and id.
				.attr("id", "svgEle")  
				.attr("width", width + margin.left + margin.right) 
				.attr("height", height + margin.top + margin.bottom)
			  	.append("g")
				.attr("id","biggroup") //Append a group - makes it easier to move things about later and style them.
				.attr("transform", "translate(" + margin.left + "," + margin.top + ")"); // Let's move this a little bit based on the margins
			
			
			// Load in the data now...
			d3.csv("data.csv", function(error, data) {
				//saved data content of csv file as a variable stored within dvc object
				dvc.data = data
			 
			 // Not sure what this is doing
			  color.domain(d3.keys(dvc.data[0]).filter(function(key) { return key !== "date"; }));
			  
			  // Take each row and put the date column through the parsedate form we've defined above.	
			  dvc.data.forEach(function(d) {
				d.mydate = d.date;
				//formatting the data to universal time (e.g. Tue Jan 01 2002 00:00:00 GMT+0000 (GMT))
				d.date = parseDate(d.date);
				
			  }); //close forEach function

			  // Building an object with all the data in it
			  projections = color.domain().map(function(name) {
				return {
				  name: name,
				  values: dvc.data.map(function(d) {
					return {date: d.date, population: +d[name]};
					 })
				};
			  });
			
			  // Set the domain of the x-value
			  // We've already given the x-scale object a range, now give it a domain
			  // The domain looks at the minimum and maximum values for the axis - in this case the date variable.
			  x.domain(d3.extent(dvc.data, function(d) { return d.date; }));
			  
			  var ticks = x.ticks(0);
			  
			  dvc.chartConfig.vars.xAxisValues.forEach(function(d,i) {
			  	ticks.push(new Date(d,1,1));
			  });
			
			  // Do the same for the y-axis...[0,800000] by looking at the minimum and maximum for the population variable.
			  y.domain(
				dvc.chartConfig.vars.yAxisScale
			  );
			  
			  // Bind the x-axis to the svg object
			  svg.append("g")
				  .attr("class", "x axis")
				  .attr("transform", "translate(0," + (height +30)+ ")")
				  .call(
			//Setting x-axis up here using x scaling object
			d3.svg.axis()
				.scale(x)
				.orient("bottom")
				.tickFormat(function(d,i) {
		            //specify date format for x axis depending on #chart width
		            if (chart.width() <= threshold_sm) {
		                var fmt = d3.time.format(dvc.chartConfig.vars.xAxisTextFormat_sm_md_lg[0]);						
						return i % 1 ? "":'\u2019' + fmt(d);	
		            } else if (chart.width() <= threshold_md){
		                var fmt = d3.time.format(dvc.chartConfig.vars.xAxisTextFormat_sm_md_lg[1]);
						str= fmt(d);
						return i % 1 ? "": str;
						
		            } else {
		                var fmt = d3.time.format(dvc.chartConfig.vars.xAxisTextFormat_sm_md_lg[2]);
						str= fmt(d);
						return i % 1 ? "":str;
		            }
		        })
				.tickPadding(5)
				.tickValues(ticks)) // actually attaching the x-axis

				// append the yAxis and add label as before.
			  svg.append("g")
				  .attr("class", "y axis")
				  .attr("id", "#yAxis")
				  .call(yAxis)

				//create proj  and bind the projections data (we defined earlier) to it.
				var proj = svg.selectAll(".proj")
						.data(projections)
						.enter()
