  <meta charset="UTF-8">

  <style>
  *{
    margin:0;
    padding:0;
    -webkit-box-sizing:border-box;
    -moz-box-sizing:border-box;
    box-sizing:border-box;
  }
  body,html{
    height:588px;
  }
  
  #map{
    height:550px;
  }
  
  body{
    color:#333;
	background:#fafafa;
    font-family:sans-serif;
  }
  
  @font-face {
		font-family: 'open_sanslight';		
		src: url('assets/OpenSans-Light-webfont.woff') format('woff');
		font-weight: normal;
		font-style: normal;
	
	}
	
	@font-face {
		font-family: 'open_sansitalic';		
		src: url('assets/OpenSans-Italic-webfont.woff') format('woff');
		font-weight: normal;
		font-style: normal;
	
	}
	
	@font-face {
		font-family: 'open_sansregular';		
		src: url('assets/OpenSans-Regular-webfont.woff') format('woff');
		font-weight: normal;
		font-style: normal;
	
	}
	
	@font-face {
		font-family: 'open_sanssemibold';		
		src: url('assets/OpenSans-Semibold-webfont.woff') format('woff');
		font-weight: normal;
		font-style: normal;
	
	}
		
  
  #map{
    background:white;
	width:100%;
  }
  
  #keydiv {
	z-index:4;
	position:absolute;  
	height:550px;
	right:0px;
	background:rgba(255,255,255,.75);
  }
  
  #areadrop {
	z-index:5;
	position:absolute;  
	width:100%;
	height:72px;
	right:0px;
	background:rgba(255,255,255,.75);
  }
  
	#key path {
	  display: none;
	  
	}
	
	#key line {
	  stroke: #666;
	  shape-rendering: crispEdges;
	}
	
	#key rect {
	  stroke: #666;
	  stroke-width:1px;
	  shape-rendering: crispEdges;
	}
	
	#key g {
		font-size:11px;
		fill:#666;
	}
	
	
	#areaname {
		text-align:center;
		height:55px;
	}
	
	@media (min-width: 768px) {
	#areanm
	{	
		
		font-size:20px;
		color:#666;
		min-width:1%;
		font-family:open_sanssemibold, Arial, Helvetica, sans-serif;
		text-align:center;
		
	}

	#areainfo
	{	
		
		font-size:22px;
		color:#666;
		font-family:open_sanssemibold, Arial, Helvetica, sans-serif;
	}
	
	#areainfo span
	{	
		
		font-size:18px;
	}
	
	}
	
	@media (max-width: 767px) {
	#areanm
	{	
		
		font-size:16px;
		color:#666;
		font-family:open_sanssemibold, Arial, Helvetica, sans-serif;

	}

	#areainfo
	{	
		
		font-size:16px;
		color:#666;
		font-family:open_sanssemibold, Arial, Helvetica, sans-serif;

	}

	#areainfo span
	{	
		
		font-size:12px;
	}
	

	}

	
	#chosensel {
		height:50px;
		top:-18px;	
	}

	@media (min-width: 768px) {
	

	
	#keydiv {
		
		top:72px;
		width:140px;
		right:0%;
		height:462px;
	}
	

	#key {
		width:140px	
	}
	}
	
	@media (max-width: 767px) {
	#chosensel {
		top:0px;	
	}
	
	#keydiv {
		
		width:100%;
		height:60px;
		top: 490px;
	}
	
	#key {
		width:100%;	
	}
	.chosen-container {
		top: -10px;
		z-index:1002;
	}
	}



	.navbar {  
	  min-height: 0px !important;
	}
	
	#menu {
		z-index:1001;	
	}
	
	
	        /* chart */
        #graphic /* required */
		{
            width: 100%;
			top:100px;
			position:absolute;
        }
		
		
		
        #graphic:before, /* required */
        #graphic:after
		{
            content: " "; /* 1 */
            display: table; /* 2 */
        }
		
		
		
        #graphic:after /* required */
		{
			clear: both;
		}
		
		

        #graphic img /* required */
		{
            max-width: 100%;
            height: auto;
        }
		
		.svgRect{
			fill: white;	
		}
		
		/* y-axis tick labels */
        #graphic .axis  /* required */
		{
            font-size: 12px;
            fill: #666;
        }
		
		
		/* x-axis baseline; not to be confused with centreline. Can consider overlaying this with #centreline */
        #graphic .axis path  /* required */
		{
            fill: none;
            stroke: #666;
            shape-rendering: crispEdges;
        }
		
		
		#graphic .axis line /* required */
		{
            fill: none;
            stroke: #ccc;
            shape-rendering: crispEdges;
        }
		
		/* x-axis line path */
        #graphic .axis.x path /* required */
		{
			display: none;
		}
		
	
		
		/* y-axis full width grid lines */
        #graphic .grid .tick /* required */
		{
            stroke: #CCC;
            stroke-width: 1px;
            shape-rendering: crispEdges;
        }
		
		
		
		/* ploted graph line */
        #graphic .line /* required */
		{
            fill: none; /* must be 'none' */
            stroke-width: 3px;
			stroke-linecap:round;
			stroke-linejoin:round;
        }
		
		
		
		/* legend elements */
        #graphic .key li/* required */
		{
            display: inline-block;
            margin: 0 18px 0 0;
            padding: 0;
            line-height: 15px;
        }
		
		

        /* legend coloured elements */
        #graphic .key b/* required */
		{
            display: inline-block;
            width: 12px;
            height: 12px;
            margin: 4px 7px 10px 5px;
            float: left;
        }

				
		
		/* legend element labels */
        #graphic .key label/* required */
		{
            white-space: nowrap;
            font-size: 12px;
            color: #333;
            font-weight: normal;
        }

		
		
		/* y-axis units label */
        #graphic .unit/* required */
		{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            fill: #333333;
            text-align: left;
			width:130px;
			height:20px;
			display:block;
			float:none;
			
        }
		
		#textIntro {
			padding:10px 10px;
			height:90px;
		}
		
    	.bar_pos { fill: #F5942F; }
        .bar_neg { fill: #7BCAE2; }

		th {
			text-align:right;
		}
/*		#centreline /* required *
		{
			stroke:#666;
			stroke-width:3px;		
		}	*/

</head>

   <div id="graphic">Loading graphic...</div>
   <div class="row" id="navigation">

                  </button>

          </div>

   </div>

          <div id="mapPane" class="col-sm-12 col-xs-12">
          	<div id="map">

            </div>
          </div>
      <div class="row" id="areadrop">
          <div class="col-sm-12 col-xs-12" id="areaname">
                <div id="areanm"></div>
                <div id="areainfo"></div>
          </div>
      <div class="col-sm-3 col-sm-offset-9 col-xs-12" id="chosensel">
      </div>

      <div id="keydiv"></div>
	</div><!-- end row -->
