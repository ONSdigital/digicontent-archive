    <style type="text/css">
        /* base styles */

        body {
            margin: 0;

        h1 {

        h3 {

        #graphic .axis.y path { display: none; }
        #graphic .axis.y .tick line { stroke: #CCC; }
        #graphic .grid path { display: none; }
        #graphic .grid .tick {
            stroke: #CCC;

            shape-rendering: crispEdges;
        }
        
		
		/* x axis line */
		#graphic .axis.x path {  
           stroke: #CCC;
		}
        
		
		/* x axis vertical grid lines */
		#graphic .axis.x .tick line {

		}
		
        #graphic .line {

            stroke-width: 3px;
			stroke-linecap:round;
			stroke-linejoin:round;
        }

        #graphic .bars rect { fill: #17807E; }
        #graphic .label text,
        #graphic .value text {
            font-weight: normal;
            font-size: 12px;
            fill: #333;
            text-align: right;
        }
        #graphic .value text {
            fill: #fff;

        }

        #graphic .key {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0 0 1em 0;
            padding: 0;
            list-style-type: none;
        }
		
		#graphic .keyTitle {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0 0 0em 0;
            padding: 0;
            list-style-type: none;
        }

        #graphic .key li {
            display: inline-block;
            margin: 0 18px 0 0;
            padding: 0;
            line-height: 14px;
        }
		
		#graphic .keyTitle li {
            display: inline-block;
            margin: 0 25px 0 0;
            padding: 0;
            line-height: 14px;
        }

        #graphic .key  b {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 6px;
            float: left;
			background-color:red;
        }

        #graphic .key label {
            white-space: nowrap;
            font-size: 12px;
            color: #333;
            font-weight: normal;
        }
		
		#graphic .keyTitle label {
            white-space: nowrap;
            font-size: 12px;
            color: #333;
            font-weight: normal;
        }	
		
		#graphic .unit {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            fill: #333;
            text-align: left;
        }			

		.annotext {
		    font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
			fill: #333;

		}

        .line-0 { stroke: #11605E; }
        .line-1 { stroke: #8BC0BF; }
        .line-2 { stroke: red; }
    

        .key-0 b { background-color: #11605E; }
        .key-1 b { background-color: #8BC0BF; }
        .key-2 b { background-color: red; }
     
		#centreline {stroke:#666; stroke-width:3px};
		
		.legendBlocks
		{
			width:15%;
			height:15%;				
		}
		
	
	
    </style>

</head>
<body>

    <!-- Define some footnotes for underneath the charts - if you don't need all the lines then get rid of it, if you need more add another set of <p>???</p> -->
   

    <!-- Define the source -->
    <div class="footer">
        <p>Source: <a href="http://www.gov.uk/government/statistical-data-sets/owner-occupiers-recent-first-time-buyers-and-second-homes" target="_blank">English Housing Survey (EHS) 2012 to 2013, Table FC2101</a>, DCLG ; <a href="http://webarchive.nationalarchives.gov.uk/20121108165934/http://www.communities.gov.uk/documents/housing/xls/139277.xls" target="_blank">EHS 2001/02, Table S106</a>, DCLG</p>

    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>
		
	// Labels for the key (same order as the columns in your csv file) - The names don't need to match those in the CSV. In fact the names in the csv must be all one string, no gaps or funny characters
	var labels = ['1981', '1991', '2001/02', '2011/12'];
	
	// Location and name of the file - if the csv is in the same folder then all you need to do is point it to the right filename
	var graphic_data_url = 'House_Chart3.csv';
	
	// Define annotation text - put a double space where you want the line to break
	var annotext = "";
	
	// Define the starting x position for the annotation text
	var annoY = 160;
	
	// Define the starting y position for the annotation text
	var annoX = "2005";
	 
	// Define whether you want left or right aligned annotation text. Options start | middle | end 
	var annoAlign = 'end';
	
	//What is the date format in the csv file? e.g %Y-%m-%d would be format for 1970-01-25 - See here https://github.com/mbostock/d3/wiki/Time-Formatting
	var dateForm = "%Y"
	
	
	var ageNames;
	
	
	var $graphic = $('#graphic');
	var graphic_data;
	var graphic_aspect_width = 14;
	var graphic_aspect_height = 9;
	var mobile_threshold = 500;
	var pymChild = null;
	
	
	function drawGraphic(width) {
		
		var margin = {top: 25, right: 25, bottom: 25, left: 35};
		var width = $graphic.width() - margin.left - margin.right;
		var height = Math.ceil((width * graphic_aspect_height) / graphic_aspect_width) - margin.top - margin.bottom;
		var num_ticks = 10;
		
		var color = d3.scale.ordinal().range([ "#274796" , "#F5942F", "#E73F40", "#7BCAE2" ]);
		var colourArray = [ "#274796" , "#F5942F", "#E73F40", "#7BCAE2" ];
		
		if (width < mobile_threshold) { 
		
				num_ticks = 5;
				var height = Math.ceil((width * graphic_aspect_width) / graphic_aspect_width) - margin.top - margin.bottom;

		 }
	
		// clear out existing graphics
		$graphic.empty();
		
		var yearsarray = ["Calendar years", "" ,"Financial years", ""];
		
		var legendTitle = d3.select('#graphic')
			.append('ul')
            .attr('class', 'keyTitle')
            .selectAll('g')
            .data(yearsarray)
            .enter().append('li')
        
        legendTitle.append('label')
            .text(function(d,i) { return yearsarray[i]; });
		
		var legend = d3.select('#graphic')
			.append('ul')
            .attr('class', 'key')
            .selectAll('g')
            .data(labels)
            .enter().append('li').attr("id", function(d,i){return "leg"+i})
        legend.append('b')
		  	.attr("class", "legendBlocks")
			.style("background-color", function(d,i) { return colourArray[i]; })
			.style("opacity", 0.75);
        legend.append('label')
            .text(function(d,i) { return labels[i]; });
	
		
		
		var x0 = d3.scale.ordinal()
			.rangeRoundBands([0, width], .1);
		
		var x1 = d3.scale.ordinal();
		
		var y = d3.scale.linear()
			.range([height, 0]);

		var xAxis = d3.svg.axis()
			.scale(x0)
			.orient("bottom");
		
		var yAxis = d3.svg.axis()
			.scale(y)
			.orient("left")
			.tickFormat(d3.format(".1s"));

		var svg = d3.select('#graphic').append('svg')
			.attr("width", width + margin.left + margin.right)
			.attr("height", height + margin.top + margin.bottom)
			.append("g")
			.attr("transform", "translate(" + margin.left + "," + margin.top + ")");				
		
		x0.domain(graphic_data.map(function(d) { return d.state; }));
		x1.domain(ageNames).rangeRoundBands([0, x0.rangeBand()]);
		y.domain([0, 100/*d3.max(graphic_data, function(d) { return d3.max(d.ages, function(d) { return d.value; }); })*/]);

				
		  
		  svg.append("g")
			  .attr("class", "x axis")
			  .attr("id", "xAxis")
			  .attr("transform", "translate(0," + height + ")")
			  .call(xAxis)
//			  .append("text")
//			  .attr("transform", "rotate(0)")
//			  .attr("transform", "translate(" + (width - 0) + ", 30)")
//			  .attr("y", 6)
//			  .attr("dy", ".71em")
//			  .style("text-anchor", "end")
//			  .text("Non-UK born residents(thousands)");
		
		  svg.append("g")
			  .attr("class", "y axis")
			  .attr("id", "yAxis")
			  .call(yAxis)
			  .append("text")
			  .attr("transform", "rotate(0)")
			  .attr("transform", "translate(-5, -25)")
			  .attr("y", 3)
			  .attr("dy", ".71em")
			  .style("text-anchor", "end")
			  .text("%");
			  

		
		  var state = svg.selectAll(".state")
			  .data(/*data*/graphic_data)
			  .enter()
			  .append("g")
			  .attr("class", "g")
			  .attr("transform", function(d,i) { return "translate(" + x0(d.state) + ",0)"; });
			  		
		  state.selectAll("rect")
			  .data(function(d) { return d.ages; })
			  .enter()
			  .append("rect")
			  .attr("width", x1.rangeBand())
			  .attr("x", function(d) { return x1(d.name); })
			  .attr("y", function(d) { return y(d.value); })
			  .attr("height", function(d) { return height - y(d.value); })
			  .style("fill", function(d) { return color(d.name); })
			  .style("opacity", 0.75);
		
			var yticks = svg.selectAll('#yAxis').selectAll('.tick');	
			yticks.append('svg:line')
				.attr( 'class' , "tick" )
				.attr( 'y0' , 0 )
				.attr( 'y1' , 0 )
				.attr( 'x1' , 0 )
				.attr( 'x2',  width );	  
				
			if (pymChild) {
				pymChild.sendHeight();
			}
		}
		
		
		if (Modernizr.svg) {
			 
			
			d3.csv(graphic_data_url, function(error, data) {
		        graphic_data = data;

				ageNames = d3.keys(/*data*/graphic_data[0]).filter(function(key) { return key !== "state"; });
			  
				/*data*/graphic_data.forEach(function(d) {
				  d.ages = ageNames.map(function(name) { return {name: name, value: +d[name]}; });	
				}); 				
		
				pymChild = new pym.Child({renderCallback: drawGraphic});
			});
		} else {
				pymChild = new pym.Child();
				pymChild.sendHeight();
		}

	
    </script>
