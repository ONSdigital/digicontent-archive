}


#leftdiv {
	width:calc(50% - 6px);
	float:left;
	height:400px;
	position:relative;
	padding-bottom:40px;
	display:block;
}

#rightdiv {
	width:calc(50% - 6px);
	float:right;
	position:relative;
	height:440px;
	display:block;
}



#left {
	width:100%;
	float:left;
	height:400px;
	position:relative;
}

#right {
	width:100%;
	float:right;
	position:relative;
	height:400px;

}


#lefttext {
	width:100%;
	float:left;
	color:#666;
	display:block;
}

#righttext {
	width:100%;
	float:right;
	color:#666;
}

{
	font-size: 14px;
	color: #808080;
	font-weight:100;
	padding-bottom:15px;

{
	color: #4774CC;
	text-decoration: none;
}

{
	opacity: 0.7;
}


@media (max-width: 610px) {

	#leftdiv {
		width:100%;
		float:left;
	}
	
	#rightdiv {
		width:100%;
		float:right;

<body>

<div id="graphic">
	<img src="fallback.png" alt="[Chart]" />
</div>
<div id="tree">

</div>

<p>Source: <a href="http://www.ons.gov.uk/ons/rel/vsob1/cancer-statistics-registrations--england--series-mb1-/no--44--2013/stb-cancer-registration-2013.html#tab-Cancer-incidence-in-England-" target="_blank">Office for National Statistics</a></p>

    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>

    <script>


var pymChild = null;
	
function drawGraphic() {

d3.select("#right").remove();
d3.select("#left").remove();

var treeleft = {
    name: "tree",
    children: [
		{ name: "Prostate", size: 40372 },
        { name: "Lung", size: 19830 },
        { name: "Colorectal", size: 18839 },
        { name: "Other", size: 70777 }
    ]
};

var treeright = {
    name: "tree",
    children: [
		{ name: "Breast", size: 44540},
        { name: "Lung", size: 16823 },
        { name: "Colorectal", size: 14926 },
        { name: "Other", size: 66573 }
    ]
};

var height = 400,
    color = d3.scale.category20c(),
	//color = ["#6baed6","#3182bd","#08519c","#fdbe85"],

    divleft = d3.select("#leftdiv").append("div").attr("id","left")
      // .style("position", "relative");

    divright = d3.select("#rightdiv").append("div").attr("id","right")
      // .style("position", "relative");


var width = $("#left").width();

colour = d3.scale.ordinal()
    .range(["#6baed6","#3182bd","#08519c","#74c476"]);

colour1 = d3.scale.ordinal()
    .range(["#f768a1","#c51b8a","#7a0177","#74c476"]);

var treemapleft = d3.layout.treemap()
    .size([width, height])
    .sticky(true)
    .value(function(d) { return d.size; });
 
var node = divleft.datum(treeleft).selectAll(".node")
      .data(treemapleft.nodes)
    .enter().append("div")
      .attr("class", "node")
      .call(position)
      .style("background-color", function(d) {
          return d.name == 'tree' ? '#fff' : colour(d.name); })
      .append('div')
      .style("font-size", function(d) {
          // compute font size based on sqrt(area)
          return Math.max(20, 0.18*Math.sqrt(d.area)) -7 +'px'; })
      .html(function(d) { return d.children ? null : d.name + "<br>" + d.size.toLocaleString(); });

var treemapright = d3.layout.treemap()
    .size([width, height])
    .sticky(true)
    .value(function(d) { return d.size; });
 
var node = divright.datum(treeright).selectAll(".node")
      .data(treemapright.nodes)
    .enter().append("div")
      .attr("class", "node")
      .call(position)
      .style("background-color", function(d) {
          return d.name == 'tree' ? '#fff' : colour1(d.name); })
      .append('div')
      .style("font-size", function(d) {
          // compute font size based on sqrt(area)
          return Math.max(20, 0.18*Math.sqrt(d.area)) -8+'px'; })
      .html(function(d) { return d.children ? null : d.name + "<br>" + d.size.toLocaleString(); });

			if (pymChild) {
		        pymChild.sendHeight();
		    }

 
function position() {
  this.style("left", function(d) { return d.x + "px"; })
      .style("top", function(d) { return d.y + "px"; })
      .style("width", function(d) { return Math.max(0, d.dx - 1) + "px"; })
      .style("height", function(d) { return Math.max(0, d.dy - 1) + "px"; });
}


}

		if (Modernizr.svg) {
			d3.select("#graphic").remove();
			pymChild = new pym.Child({ renderCallback: drawGraphic});
		} else {
			d3.select("#tree").remove();
			pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}

    </script>
