			function writeAnnotation(){
			
				if (graphic.width() < threshold_sm) {
						
						svg.append("text").attr("class","annotext0")
								.text(chosendata.values[0].imin)
								.attr("class","lifeExp0")

								.attr("text-anchor", "middle")

								.attr('x',x(chosendata.values[0].imax));
								
						svg.append("text").attr("class","annotext2")
								.text(chosendata.values[0].median)
								.attr("class","lifeExp1")
								.attr("text-anchor", "middle")
								.attr('y',$(graphic).height()*0.6)
								.attr('x',x(chosendata.values[0].median));
						
								
						dvc.essential.annotationBullet.forEach(function(d,i) {
						
							d3.select("#keypoints").append("svg")
								.attr("width","20px")
								.attr("height","20px")
								.attr("class","circles")
								.append("circle")
								.attr("class", "annocirc" + (i))
								.attr("r", "2")
								.attr('cy',"12px")
								.attr("cx", "10px");
							
							d3.select("#keypoints").append("p").text(dvc.essential.annotationBullet[i]);
						
						})// end foreach
				}		
				else {
					
						dvc.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',$(graphic).height()*0.6)
								.attr('x',function(){
									if(sexSel=="M"){
										return x(dvc.essential.annotationXY[i][0])
									} else {
										return x(dvc.essential.annotationXY[i][1])
									}	
								});
										
							d3.selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').attr('x', function(){
									if(sexSel=="M"){
										return x(dvc.essential.annotationXY[i][0])
									} else {
										return x(dvc.essential.annotationXY[i][1])
									}	
								}).text(words[j]);
									if (j > 0)
										tspan.attr('x', function(){
									if(sexSel=="M"){
										return x(dvc.essential.annotationXY[i][0])
									} else {
										return x(dvc.essential.annotationXY[i][1])
									}	
								}).attr('dy', '18');													
								}
								
								
							};					
							

						});	// end foreach 		
					
				} // end else ... 
				
				// If you have labels rather than years then you can split the lines using a double space (in the CSV file).
			
			
				function insertLinebreaksLabels() {
								var str = this.textContent;
			
								var words = str.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan
										.attr('x', -10)			
										.attr('dy', '1em');													
										}
				};	
				
				d3.selectAll(".y text").each(insertLinebreaksLabels)
				
				d3.select(".annotext0").append('tspan')
						.attr("class","lifeExp0")
						.text(chosendata.values[0].imin)
						.attr('x', x(chosendata.values[0].imin))

						.text(chosendata.values[0].imax)
						.attr('x',x(chosendata.values[0].imax))

	function buttonClicked(clicked_id){
				
				sexSel=clicked_id.substring(3,4);

				if(sexSel=="M"){
					$("#btnM").toggleClass("btn-primary");
					$("#btnM").toggleClass("btn-default");
					$("#btnF").toggleClass("btn-primary");
					$("#btnF").toggleClass("btn-default");
					
				} else {
					$("#btnM").toggleClass("btn-primary");
					$("#btnM").toggleClass("btn-default");
					$("#btnF").toggleClass("btn-primary");
					$("#btnF").toggleClass("btn-default");
					
				}
			transitionChart();
	}

					.attr("id", function(d,i){ return "opt_"+i}) /* Optional */ 
					.text(function(d){ return d.occupation});
				
				$('#occselect').chosen({width: "100%",allow_single_deselect: false, }).on('change',function(d){
						 
						 occSel = this.value;
						
						occIndex = this.options[this.selectedIndex].getAttribute("id").replace("opt_", "")
						
						 nssecReformat = d3.entries(nssec_data)
						
					
						 markerObj = nssecReformat[occIndex]
						 
						if(firstChartChosen==true){
							 transitionChart()
						} else {
							//d3.select("#goBtn").classed("hidden", false);
							//d3.select("#goBtn").classed("show", true);
							chooseChart();

						}
						 //chooseChart(dvc.selectedYear+"data/"+dvc.area);
						 
						 //dvc.defaultSelections = document.getElementById('areaselect').selectedIndex
						 
						 
						})
						
				$(".chosen-select").val('').trigger("chosen:updated");
				
				pymChild = new pym.Child();
				pymChild.sendHeight();
	}

		
			
		function chooseChart(){//load config 
			
			d3.select("#goBtn").remove();
			firstChartChosen = true;
			
			values= d3.nest().key(function(d) { return d.name; })
						.entries(graphic_data);
						
			if(sexSel=="M"){
				chosendata = values[0];
			} else {
				chosendata = values[1];
			}
			
			if(sexSel=="M"){
				currentVal = markerObj.value.m2007
			} else {
				currentVal = markerObj.value.f2007
			}
			
			d3.select("#nssecText").append("text").append("tspan").attr('class', 'boldText').text(markerObj.value.occupation)
			d3.select("#nssecText").select("text").append("text").text(" are part of the ")
			d3.select("#nssecText").select("text").append("tspan").attr('class', 'boldText').text(markerObj.value.nssec_title)
			d3.select("#nssecText").select("text").append("text").text(" group. People in this group can expect to live for ")
			d3.select("#nssecText").select("text").append("tspan").attr('class', 'boldText').text(currentVal)
			d3.select("#nssecText").select("text").append("text").text(" years.")
			
			if(sexSel=="M"){
				pastVal = markerObj.value.m1982
			} else {
				pastVal = markerObj.value.f1982
			}
			
			d3.select("#pastText").append("text").text("In 1982-86 the life expectancy in this group was ")
			d3.select("#pastText").select("text").append("tspan").attr('class', 'boldText').text(pastVal)
			d3.select("#pastText").select("text").append("text").text(" years.")
			
			
			//use pym to create iframed chart dependent on specified variables
			pymChild = new pym.Child({ renderCallback: drawGraphic});
						
			
		}	
		
		function transitionChart(){
			if(firstChartChosen==true){
					values= d3.nest().key(function(d) { return d.name; })
								.entries(graphic_data);
								
					if(sexSel=="M"){
						chosendata = values[0];
					} else {
						chosendata = values[1];
					}
					
					d3.select(".circle1").transition().duration(1000)
							.attr('cx',function(d,i) { 	return x(chosendata.values[0].imin); }) 
					d3.select(".med").transition().duration(1000)
							.attr('cx',function(d,i) { 	return x(chosendata.values[0].median); }) 
					d3.select(".circle2").transition().duration(1000)
							.attr('cx',function(d,i) { 	return x(chosendata.values[0].imax); }) 
					
					
					d3.select(".tiefighter").transition().duration(1000)
							.attr('x1', function(d) {return x(chosendata.values[0].imin); })  //d.mymin
							.attr('x2', function(d) { return x(chosendata.values[0].imax); });
					
					
	//				d3.select(".").transition().duration(1000).attr('x',x(chosendata.values[0].imin));
//					d3.select(".annotext1").transition().duration(1000).attr('x',x(chosendata.values[0].median));
//					d3.select(".annotext2").transition().duration(1000).attr('x',x(chosendata.values[0].imax));		
		
					d3.select(".annotext0").selectAll("tspan").transition().duration(1000).attr('x',x(chosendata.values[0].imin));
					d3.select(".annotext1").selectAll("tspan").transition().duration(1000).attr('x',x(chosendata.values[0].median));
					d3.select(".annotext2").selectAll("tspan").transition().duration(1000).attr('x',x(chosendata.values[0].imax));
					
					d3.select(".lifeExp0").transition().duration(1000).attr('x',x(chosendata.values[0].imin));
					d3.select(".lifeExp1").transition().duration(1000).attr('x',x(chosendata.values[0].median));
					d3.select(".lifeExp2").transition().duration(1000).attr('x',x(chosendata.values[0].imax));
					
					
					$(".lifeExp0").countTo({
						from: parseInt($(".lifeExp0").text()),
						to:	chosendata.values[0].imin,
						speed: 1000,
						formatter: function(value, options){
						 return value.toFixed(1);	
						}
					})
					
					$(".lifeExp1").countTo({
						from: parseInt($(".lifeExp1").text()),
						to:	chosendata.values[0].median,
						speed: 1000,
						formatter: function(value, options){
						 return value.toFixed(1);	
						}
					})
					
					$(".lifeExp2").countTo({
						from: parseInt($(".lifeExp2").text()),
						to:	chosendata.values[0].imax,
						speed: 1000,
						formatter: function(value, options){
						 return value.toFixed(1);	
						}
					})
					
					d3.select(".marker").select("line")
					.transition()
					.duration(1000)
					.attr('x1', function(){
								if(sexSel=="M"){
									return x(markerObj.value.m2007)
								} else {
									return x(markerObj.value.f2007)
								}
						})  
					.attr('x2', function(){
								if(sexSel=="M"){
									return x(markerObj.value.m2007)
								} else {
									return x(markerObj.value.f2007)
								}
						}) 
					
				d3.select(".marker").selectAll("tspan")
								.transition()
								.duration(1000)
								.attr('x',function(){
											if(sexSel=="M"){
												return x(markerObj.value.m2007)
											} else {
												return x(markerObj.value.f2007)
											}
									}) 
				if(sexSel=="M"){
					myLifeExp = markerObj.value.m2007;
				} else {
					myLifeExp = markerObj.value.f2007;
				}	
									
				$(".myLifeExp").countTo({
						from: parseInt($(".myLifeExp").text()),
						to:	myLifeExp,
						speed: 1000,
						formatter: function(value, options){
						 return value.toFixed(1);	
						}
					})
				
				d3.select("#nssecText").select("text").remove()			
				d3.select("#pastText").select("text").remove()
				
				if(sexSel=="M"){
					pastVal = markerObj.value.m1982
				} else {
					pastVal = markerObj.value.f1982
				}
				
			
			d3.select("#nssecText").append("text").append("tspan").attr('class', 'boldText').text(markerObj.value.occupation)
			d3.select("#nssecText").select("text").append("text").text(" are part of the ")
			d3.select("#nssecText").select("text").append("tspan").attr('class', 'boldText').text(markerObj.value.nssec_title)
			d3.select("#nssecText").select("text").append("text").text(" group. People in this group can expect to live for ")
			d3.select("#nssecText").select("text").append("tspan").attr('class', 'boldText').text(myLifeExp)
			d3.select("#nssecText").select("text").append("text").text(" years.")
						
				if(sexSel=="M"){
					currentVal = markerObj.value.m2007
				} else {
					currentVal = markerObj.value.f2007
				}
						
			d3.select("#pastText").append("text").text("In 1982-86 the life expectancy in this group was ")
			d3.select("#pastText").select("text").append("tspan").attr('class', 'boldText').text(pastVal)
			d3.select("#pastText").select("text").append("text").text(" years.")
			
				
				
			}
					
		}
		
			
		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   d3.json("config.json", function(error, config) {
						dvc=config;

						//load chart data
						d3.csv(dvc.essential.graphic_data_url, function(error, data) {
								graphic_data = data;
								 
						
							//load selection data
							d3.csv("selection.csv", function(error, data) {
								selection_data = data;
								
								d3.csv("nssec.csv", function(error, data) {
									nssec_data = data;
									createUI();
								});	
								
								
								;
							});	
						});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			d3.select(".allContent").attr("class","allcontent hidden");
			d3.select(".container-fluid").append("img").attr("src","fallback.png")
			 
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
			
		}
