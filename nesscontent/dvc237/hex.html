
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Hexagon map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css" media="screen">
    <link rel="stylesheet" href="css/style-chosen.css">

    <style>
		
		
		@font-face {
			font-family: 'open_sanslight';		
			src: url('assets/OpenSans-Light-webfont.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		
		}
		
		@font-face {
			font-family: 'open_sansitalic';		
			src: url('assets/OpenSans-Italic-webfont.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		
		}
		
		@font-face {
			font-family: 'open_sansregular';		
			src: url('assets/OpenSans-Regular-webfont.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		
		}
		
		@font-face {
			font-family: 'open_sanssemibold';		
			src: url('assets/OpenSans-Semibold-webfont.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		
		}
		
		
		#container {
			
			pointer-events:none;
			z-index:6;	
		}
		
		@media (min-width: 768px) {
		#container {
			position:absolute;
			width:100%;
		}
		}
		
		@media (min-width: 768px) {
		#key1 {
			position:absolute;
			margin-top:122px;
			width:100%;
		}
		
		#key {
			width:95px;
			height:450px;
		}
		

		}
		
		@media (max-width: 767px) {
		#key1 {
			margin-top:0px;
		
		}
		
		#key {
			width:100%;
			height:60px;
		}
		}
		
		@media (min-width: 768px) {
		#areaname {
			position:absolute;
			width:100%;
			z-index:16;
			pointer-events:none;
		}
		}
		
		@media (max-width: 767px) {
		#areaname {
			width:100%;
			z-index:16;
			pointer-events:none;
			height:0px;
			background-color:rgba(255,255,255,0.6);
		}
		}
		
		
		
		
		#mainChart {
			margin: 0px auto;
			display: block;
			background:rgba(255,255,255,0.3);			
		}
		
	
		@media (min-width: 768px) {
		#left {
			height:520px;
			z-index:5;	
			padding-right:0px;
		}
		}
		
		@media (max-width: 767px) {
		#left{
			
			height:520px;
			
		}
		}
		
		#right {
			height:520px;
			padding-left:0px;
			z-index:5;	
		}
		
		#chartfloat {
			position:absolute;
			left:30%;	
		}
		#svgElement {
			max-height:600px;
			z-index: 5;	
		}
		
		#svgElement2 {
			max-height:600px;	
		}

		#states, #states1
		{
			stroke: #ccc;
			stroke-width:0.5px;
		}

		.axis path,
		.axis line
		{
			fill: none;
			stroke: #333333;
			stroke-width: 0.1%
		}
		
		.axis text
		{
			fill:#666;
			font-size:12px;
			font-family:open_sansregular, Arial, Helvetica, sans-serif;
		}
		
		.grid path,
		.grid line
		{
			fill: none;
			stroke: #cccccc;
			stroke-width: 0.1%
		}
		
		/*don't need to display the text on the secondary grid element*/
		.grid text
		{
			display:none;
		}
		
		.barMarker
		{
			fill:steelblue;
			fill-opacity:0.5;
		}
		
		.intBar
		{
			fill-opacity:0;	
		}
		
		.intBarActive
		{
		fill-opacity:0.1;
		}

		
		.chartBarSel
		{
			fill:orange;	
		}
		
		.chartBars
		{
			fill:#0581c9;
		}

		.barText {
			text-anchor:end;
			fill:#666;	
			font-family:open_sansregular, Arial, Helvetica, sans-serif;	
			font-size:12px;
		}
		
		.barText2 {
			text-anchor:start;
			font-family:open_sansregular, Arial, Helvetica, sans-serif;	
			font-size:12px;
		}
		
		#yLabel {
			text-anchor:start;
			fill:#666;
			font-size:12px;
			font-family:open_sansregular, Arial, Helvetica, sans-serif;
		}

		@media (min-width: 768px) {
		#areanm
		{	
			
			font-size:20px;
			color:#666;
			min-width:1%;
			font-family:open_sanssemibold, Arial, Helvetica, sans-serif;
			text-align:center;
			z-index:20;
			margin: 0px auto;
			background-color:rgba(255,255,255,0.7);
			height:30px;
			margin-top:5px;
			padding:0px 5px;
			display: table;
			
		}

		#areainfo
		{	
			
			font-size:22px;
			color:#666;
			font-family:open_sanssemibold, Arial, Helvetica, sans-serif;
			font-weight:bold;
			text-align:center;
			width:200px;
			padding:5px 5px;
			line-height:0.9;
			margin: 0px auto;
			background-color:rgba(255,255,255,0.7);
			z-index:20;
			height:30px;
		}
		
		#areaunit
		{	
			
			font-size:16px;
			color:#666;
			font-family:open_sanslight, Arial, Helvetica, sans-serif;
			text-align:center;
			width:200px;
			padding:0px 5px;
			line-height:1.2;
			margin: 0px auto;
			background-color:rgba(255,255,255,0.7);
			z-index:20;
		}

		}
		
		@media (max-width: 767px) {
		#areanm
		{	
			
			font-size:16px;
			color:#666;
			min-width:1%;
			font-family:open_sanssemibold, Arial, Helvetica, sans-serif;
			text-align:center;
			z-index:20;
			margin: 0px auto;
			background-color:rgba(255,255,255,0.7);
			height:22px;
			margin-top:0px;
			padding:0px 5px;
			display: table;

		}
	
		#areainfo
		{	
			
			font-size:16px;
			color:#666;
			font-family:open_sanssemibold, Arial, Helvetica, sans-serif;
			text-align:center;
			width:100%;
			padding-top:5px;
			line-height:0.9;
			margin: 0px auto;
			height:16px;
			background-color:rgba(255,255,255,0.7);

		}

		#areainfo span
		{	
			
			font-size:12px;
		}
		
		#areaunit
		{	
			
			font-size:12px;
			color:#666;
			font-family:open_sanslight, Arial, Helvetica, sans-serif;
			text-align:center;
			padding:5px 5px;
			line-height:0.9;
			margin: 0px auto;
			background-color:rgba(255,255,255,0.7);
		}
		}
		
		#chartSubtitle, #chartUnits
		{
			font-size:12px;
			fill:#666;
			font-family:open_sanslight,Arial, Helvetica, sans-serif
			
		}
		

		/*Key*/

		

		#caption {
		  font-family: 'open_sansregular';
		  font-size:13px;
		  fill:#2f8dd1;
		  
		}
		
		#key1 {
			z-index:14;
			pointer-events:none;

		}
		
		#key {
			display:block;
			margin: 0px auto;
			top:600px;
			background-color:rgba(255,255,255,0.7);
			
		}
		
		#key path {
		  display: none;
		  
		}
		
		#key line {
		  stroke: #000;
		  shape-rendering: crispEdges;
		}
		
		#key g {
			font-size:11px;
			fill:#666;
		}
		
		#key rect {
			stroke:#666;
			stroke-width:0.5px;
			z-index:+1;
		}

		.tickValues {
			font-size:10px;
			fill:#666;
		}
		
		#inputSuccess4 {
			text-transform: uppercase;
		}
		
		#navigation {
			background-color:#fff;	
		}
		
		#content {
			background-color:#fff;	
		}
		
		#foot {
			background-color:#fff;	
			padding-top:10px;
			padding-bottom:10px;
     		font-family: 'open_sansregular';
			font-size:11px;
			line-height:1.3;
			
		}
		@media (min-width: 768px) {
		
		#rightfoot {
			text-align: right;
		}
		}
		
		@media (max-width: 767px) {
		#rightfoot {
			text-align: left;
		}
		}
		
		.labels {
			font-family: 'open_sansregular';
			font-size:14px;
			color:#008cba;
			position:absolute;
			width:100%;
			text-align: center;
		}
			
			
		#selectarea {
			height:50px;	
		}
		
		.pcon {
			
			stroke:#ccc;
			stroke-width:0.5px;
		
		}
		
		.pconhex2 {
			
			stroke:#ccc;
			stroke-width:0.5px;
		
		}
		
		@media (max-width: 767px) {
		#chosensel {
			
			z-index:21;
			height:40px;
			right:0px;
			
		}
		}
		
		@media (min-width: 768px) {
		#chosensel {
		z-index:21;
		position:absolute;
		right:0px;
		height:32px;
		}
		}
		
		@media (min-width: 768px) {

		.chosen-container {
			top:3px;
		}
		}
		
		.navbar {
			margin-bottom:0px;	
		}
	</style>
