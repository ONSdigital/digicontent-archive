<!DOCTYPE html>
<html lang="en">

<head>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600|Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
    <title></title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />
    <style type="text/css">
		
		body {
			max-width:800px;
			margin: 0px auto;
		}
		
		#graphic .axis path {
			fill: none;
			stroke: none;
			shape-rendering: crispEdges;
		}
	
    	.bar_pos { fill: #7be2c7; }
        .bar_neg { fill: #7BCAE2; }
        
	
		.background0 { background: #F5942F; }
        .background1 { background: #7BCAE2; }  
		
		#question {
			font-weight:bold;
			font-size: 14px;
			color:#666;	
		}
		
		#salary{
			font-size: 14px;
			color:#D45C5E;
			font-weight:bold;
			text-align:right;
		}
		
		
		#salary[type="number"] {
		  padding: 5px;
		  border: solid 3px #c9c9c9;
		  transition: border 0.3s;
		  width:100px;
		}
		#salary[type="number"]:focus,
		#salary[type="number"].focus {
		  border: solid 3px #969696;
		}
		
		#hours{
			font-size: 14px;
			color:#D45C5E;
			font-weight:bold;
			text-align:right;
		}
		
		#hours[type="number"] {
		  padding: 5px;
		  border: solid 3px #c9c9c9;
		  transition: border 0.3s;
		  width:35px;
		}
		#hours[type="number"]:focus,
		#hours[type="number"].focus {
		  border: solid 3px #969696;
		}
		
		#perWhat {
		font-size: 14px;
		color:#666;
		height:28px;
		font-weight:bold;
		  padding: 5px;
		  border: solid 3px #c9c9c9;
		  
	 border: 0;
     outline: solid 3px #c9c9c9;
     background-color: white;
		  transition: border 0.3s;
		  width:100px;
		}
		#perWhat:focus,
		#perWhat.focus {
		  border: solid 3px #969696;
		  border: 0;
		  height:28px;
		   padding: 5px;
    	 outline: solid 3px #969696;
    	 background-color: white;
		}
		
		
		.textclass {
	
			font-size: 14px;
			font-weight:bold;
			fill:#666;
			
		}
    
    </style>
</head>
<body>

	<div id="question">
    	<form>I get paid £ <input id="salary" type="number" name="salary" min="1" max="5000000"></input> per&nbsp; <select id="perWhat">
        <option value="1">Hour</option>
        <option value="2">Week</option>
        <option value="3">Month</option>
        <option value="4" selected>Year</option>
        </select>&nbsp;&nbsp;before tax and I work approximately <input id="hours" type="number" name="hours" min="1" max="168" value="40"> hours per week*.</input></form>
    </div>
<br>
	<div id="graphic">
    	<img src="fallback.png" alt="[Chart]" />
    </div>
	    
    <div id="keypoints">
        <p></p>
    </div>

   <div class="footer"> 
   
   </div>
    
    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>

		var graphic = $('#graphic');
		var keypoints = $('#keypoints');
		var footer = $(".footer");
		var pymChild = null;
		
		var defaulthours = 40;

		function drawGraphic(width) {
		   threshold_md = 788;
		   threshold_sm = dvc.optional.mobileBreakpoint; 
		  
		  	//set variables for chart dimensions dependent on width of #graphic
		    if (graphic.width() < threshold_sm) {        	
		            var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]}; 
					var chart_width = graphic.width() - margin.left - margin.right;
		            height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    } else if (graphic.width() < threshold_md){
		        	var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]}; 
					var chart_width = graphic.width() - margin.left - margin.right;
		            height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
		  	} else {
		        	var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
					var chart_width = graphic.width() - margin.left - margin.right;
		            height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
			}

		    // clear out existing graphics
		    graphic.empty();
			keypoints.empty();
			footer.empty();
			
			footer.text("*excluding overtime");
			
			x = d3.scale.linear()
		        .range([ 0, chart_width]);

			y = d3.scale.ordinal()
				.rangeRoundBands([0, height], .1)
			
		    y.domain(graphic_data.map(function(d) { return d.name; }));

		    var yAxis = d3.svg.axis()
		        .scale(y)
		        .orient("left")
		    
		    xAxis = d3.svg.axis()
		        .scale(x)
		        .orient('bottom');
		    			    
			//specify number or ticks on x axis
			
			var mobilefmt = d3.format("s");
			var numberfmt = d3.format(",.0f");
			
				
			 if (graphic.width() <= threshold_sm) {
				xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
				xAxis.tickFormat(mobilefmt);
				
			 } else if (graphic.width() <= threshold_md){
				xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
			 } else {
				xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
			 }
				
				
		    //gridlines
		    x_axis_grid = function() { return xAxis; }

		    var bar = d3.svg.line()
		        .y(function(d) { return y(d.name); })
		        .x(function(d) { return x(d.amt * defaulthours * 52); });

		    // parse data into columns
		    var bars = {};
		    for (var column in graphic_data[0]) {
		        if (column == 'name') continue;
		        bars[column] = graphic_data.map(function(d) {
		            return {
		                'name': d.name,
		                'amt': d[column]
		            };
		        });
		    }
			
		  	//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
	   		if (dvc.essential.xAxisScale == "auto_zero_max"){
			   var xDomain = [
								0,
								d3.max(d3.entries(bars), function(c) {
									return d3.max(c.value, function(v) {
										var n = (v.amt * defaulthours * 52);
										return Math.ceil(n);
									});
								})
							 ];
			} else if (dvc.essential.xAxisScale == "auto_min_max"){
				var xDomain = [
								d3.min(d3.entries(bars), function(c) {
									return d3.min(c.value, function(v) {
										var n = (d.amt * defaulthours * 52);
										return Math.floor(n);
									});
								}),
							
								d3.max(d3.entries(bars), function(c) {
									return d3.max(c.value, function(v) {
										var n = (d.amt * defaulthours * 52);
										return Math.ceil(n);
									});
								})
					 		];
			} else {
			   var xDomain = dvc.essential.xAxisScale;
		    }
				 
		    x.domain(xDomain);
		    
			//create legend
			if(dvc.essential.legendLabels.length > 1){
			var legend = d3.select('#graphic').append('ul')
			                .attr('class', 'key')
			            .selectAll('g')
			                .data(dvc.essential.legendLabels)
			            .enter().append('li')

				    legend.append('b')
						 .attr("class",function(d,i){return "background" + i})
				    
					legend.append('label')
				         .html(function(d,i) { return dvc.essential.legendLabels[i]; });						
			}

			
		    //create svg for chart
		    var svg = d3.select('#graphic').append('svg')
				        .attr("width", chart_width + margin.left + margin.right)
				        .attr("height", height + margin.top + margin.bottom +30)
				        .append("g")
				        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
				
					svg.append("rect")
						.attr("class","svgRect")
						.attr("width", chart_width)
						.attr("height", height)
			    
				    svg.append('g').attr("id","xAxis")
				        .attr('class', 'x axis')
				        .attr("transform", "translate(0, "+height+")")
				        .call(xAxis).append("text")
						 .attr("y", 25)
						 .attr("x",chart_width)
						 .attr("dy", ".71em")
						 .style("text-anchor", "end")
						 .text(dvc.essential.xAxisLabel);

				    svg.append('g').attr("id","xgrid")
				        .attr('class', 'x grid')
				        .call(x_axis_grid()
				            .tickSize(height, 0, 0)
				            .tickFormat('')
				        );
					
					//create y axis, if x axis doesn't start at 0 drop x axis accordingly	
					svg.append('g')
				        .attr('class', 'y axis')
				        .attr('transform', function(d){ 
				        			if(xDomain[0] != 0){
										return 'translate(' + ( - 30) + ',0)'
									} else {
										return 'translate(' + 0  + ', 0)'
									}
							})
				        .call(yAxis);

			svg.append('g').attr("class","bars").selectAll('rect')
					.data(bars["value"])
					.enter()
					.append('rect')
					.attr('class', function(d, i) {
			                if ((d.amt * defaulthours * 52) <0 ) { 
								return 'bar bar_neg'; 
							} else { 
								return 'bar bar_pos'; 
							}

			            })
					.attr("width", function(d) { return 0 + Math.abs(x((d.amt * defaulthours * 52)) - x(0)); })
					.attr("x", function(d) { return x(Math.min(0, (d.amt * defaulthours * 52))); })
					.attr("y", function(d) { return y(d.name); })
					.attr("height", y.rangeBand())
					
			svg.append('g').selectAll('text')
					.data(bars["value"])
					.enter()
					.append('text')
					.attr('class', "textclass")
					.attr("x", 10)
					.attr("y", function(d) { return y(d.name) + y.rangeBand()/2 + 4})
					.text(function(d){return "£" + numberfmt(d.amt * defaulthours * 52)})
					
					//create centre line if required
					if (dvc.optional.centre_line == true){
						svg.append("line")
							.attr("id","centreline")
							.attr('y1',0)
							.attr('y2',height)
							.attr('x1',x(dvc.optional.centre_line_value))
							.attr('x2',x(dvc.optional.centre_line_value))
					
					} else if(xDomain[0] <0){
						svg.append("line")
						svg.append("line")
							.attr("id","centreline")
							.attr('y1',0)
							.attr('y2',height)
							.attr('x1',x(0))
							.attr('x2',x(0))
					}  	
					
			writeAnnotation();
							
			function writeAnnotation(){
			
				if (graphic.width() < threshold_sm) {
					
						dvc.essential.annotationBullet.forEach(function(d,i) {
						
							d3.select("#keypoints").append("svg")
								.attr("width","20px")
								.attr("height","20px")
								.attr("class","circles")
								.append("circle")
								.attr("class", "annocirc" + (i))
								.attr("r", "2")
								.attr('cy',"12px")
								.attr("cx", "10px");
							
							d3.select("#keypoints").append("p").text(dvc.essential.annotationBullet[i]);
						
						})// end foreach
				}		
				else {
					
						dvc.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',y(dvc.essential.annotationXY[i][1]))
								.attr('x',x(dvc.essential.annotationXY[i][0]));
										
							d3.selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								.each(createBackRect);	
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(dvc.essential.annotationXY[i][0])).attr('dy', '22');													
								}
							};					
													
							function createBackRect() {
								
							var BBox = this.getBBox()
											
									svg.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("fill", "white")
										.attr("opacity", 0.4);
										
							}; // end function createBackRect()

						});	// end foreach 		
					
				} // end else ... 
				
				// If you have labels rather than years then you can split the lines using a double space (in the CSV file).
			
			
				function insertLinebreaksLabels() {
								var str = this.textContent;
			
								var words = str.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan
										.attr('x', -10)			
										.attr('dy', '1em');													
										}
				};	
				
				d3.selectAll(".y text").each(insertLinebreaksLabels)
				
				
			}// end function writeAnnotation()
							
			//create link to source				
			d3.select(".footer").append("p")
				.text("Source: ")
				.append("a")
				.attr("href", dvc.essential.sourceURL)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText);
						
			//use pym to calculate chart dimensions	
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
		
		
		
		function addListeners() {
		
			d3.select("#salary").on("change", calcSalaries).on("keyup", calcSalaries);
			d3.select("#perWhat").on("change", calcSalaries);
			d3.select("#hours").on("change", calcSalaries).on("keyup", calcSalaries);
			
		}
		
		function calcSalaries() {
			salaryPer = $("#salary").val();
			perWhat = $("#perWhat").val();
			hours = $("#hours").val();
			
			if(perWhat == 1) {
				
				sal = salaryPer * hours * 52;
				
			} else if(perWhat == 2) {
				
				sal = salaryPer * 52;
				
			} else if(perWhat == 3) {
				
				sal = salaryPer * 12;
				
			} else if(perWhat == 4) {
				
				sal = salaryPer;
				
			}
	
			updateChart();
			
		}
		
		
		function updateChart() {
			
			newData = [sal,(graphic_data[1].value * hours * 52)];
			 var xDomain = d3.max(newData);
			 
			 
			 
			 x.domain([0,xDomain]);
			 

		  
			 xAxis = d3.svg.axis()
		        .scale(x)
		        .orient('bottom');
				
			var mobilefmt = d3.format("s");
			var numberfmt = d3.format(",.0f");
			
				
			 if (graphic.width() <= threshold_sm) {
				xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
				xAxis.tickFormat(mobilefmt);
			 } else if (graphic.width() <= threshold_md){
				xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
			 } else {
				xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
			 }
				
			x_axis_grid = function() { return xAxis; }
			
			d3.select("#xAxis").transition().duration(2000).call(xAxis);
			
			d3.select("#xgrid").transition().duration(2000).call(x_axis_grid().tickSize(height, 0, 0)
				            .tickFormat(''));
			
			d3.selectAll('.bar')
					.data(newData)
					.transition()
					.duration(2000)
					.attr("width", function(d) { return 0 + Math.abs(x(d) - x(0)); })
					.attr("x", function(d) { return x(Math.min(0, d)); })
					.attr("height", y.rangeBand())


			d3.selectAll('.textclass')
					.data(newData)
					.transition()
					.duration(2000)
					.text(function(d){return "£" + numberfmt(d)})

			
		}
		
		
		
		
		
		
		

		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   //load config 
			d3.json("config.json", function(error, config) {
			dvc=config

				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;
					
					// graphic_data.forEach(function(d) {
					// 	d.name = d3.time.format(dvc.essential.dateFormat).parse(d.name); 
						
					// });

					names = d3.keys(/*data*/graphic_data[0]).filter(function(key) { return key !== "state"; });
			  
					/*data*/graphic_data.forEach(function(d) {
					  d.ages = names.map(function(name) { return {name: name, value: +d[name]}; });	
					}); 
					

						addListeners();
						
						//use pym to create iframed chart dependent on specified variables
						pymChild = new pym.Child({ renderCallback: drawGraphic});
					});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
    </script>

</html>
