    <style type="text/css">
        /* base styles */

        body {
            margin: 0;

        /* chart */

        #graphic .axis path,

        #graphic .axis.y .tick line { display: none; }
        #graphic .grid path { display: none; }
        #graphic .grid .tick {
            stroke: #CCC;
            stroke-width: 1px;
            shape-rendering: crispEdges;
        }
        
		
		/* x axis line */
		#graphic .axis.x path {  
           stroke: #CCC;
		}
        
		
		/* x axis vertical grid lines */
		#graphic .axis.x .tick line { 
            stroke: #CCC;
		}
		
        #graphic .line {
            fill: none;
            stroke-width: 3px;
        }

        #graphic .bars rect { fill: #17807E; }
        #graphic .label text,

        #graphic .key {

        #graphic .key li {
            display: inline-block;

            padding: 0;

        }

        #graphic .key  b {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 6px;
            float: left;
			background-color:red;
        }

        #graphic .key label {
            white-space: nowrap;

        }	
		
		#graphic .unit {
            font-family: Arial, Helvetica, sans-serif;

            fill: #333;

        }			

		.annotext {
		    font-family: Arial, Helvetica, sans-serif;

			fill: #333;

		}

        .line-0 { stroke: #11605E; }
        .line-1 { stroke: #8BC0BF; }

        .key-0 b { background-color: #11605E; }
        .key-1 b { background-color: #8BC0BF; }

		#centreline {stroke:#666; stroke-width:3px};
		
		.legendBlocks
		{
			width:15%;
			height:15%;

    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>
		
	// Labels for the key (same order as the columns in your csv file) - The names don't need to match those in the CSV. In fact the names in the csv must be all one string, no gaps or funny characters
	var labels = ['2004', '2013'];
	
	// Location and name of the file - if the csv is in the same folder then all you need to do is point it to the right filename
	var graphic_data_url = 'Mig_Chart5.csv';
	
	// Define annotation text - put a double space where you want the line to break
	var annotext = "";
	
	// Define the starting x position for the annotation text
	var annoY = 160;
	
	// Define the starting y position for the annotation text
	var annoX = "2005";
	 
	// Define whether you want left or right aligned annotation text. Options start | middle | end 
	var annoAlign = 'end';
	
	//What is the date format in the csv file? e.g %Y-%m-%d would be format for 1970-01-25 - See here https://github.com/mbostock/d3/wiki/Time-Formatting
	var dateForm = "%Y"
	
	
	var ageNames;
	
	
	var $graphic = $('#graphic');
	var graphic_data;
	var graphic_aspect_width = 14;
	var graphic_aspect_height = 9;
	var mobile_threshold = 500;
	var pymChild = null;
	
	
	function drawGraphic(width) {
		
		var margin = {top: 30, right: 35, bottom: 50, left: 110};
		var width = $graphic.width() - margin.left - margin.right;
		var height = Math.ceil((width * graphic_aspect_height) / graphic_aspect_width) - margin.top - margin.bottom;
		var num_ticks = 10;
		
		var color = d3.scale.ordinal().range([ "#274796" , "#F5942F" ]);
		var colourArray = [ "#274796" , "#F5942F" ];
		
		if (width < mobile_threshold) { 
		
				num_ticks = 5;
				var height = Math.ceil((width * graphic_aspect_width) / graphic_aspect_width) - margin.top - margin.bottom;

		 }
	
		// clear out existing graphics
		$graphic.empty();
		
		
		var legend = d3.select('#graphic').append('ul')
            .attr('class', 'key')
            .selectAll('g')
            .data(labels)
            .enter().append('li')
        legend.append('b')
		  .attr("class", "legendBlocks")
			.style("background-color", function(d,i) { return colourArray[i]; });
        legend.append('label')
            .text(function(d,i) { return labels[i]; });
	

		var svg = d3.select('#graphic').append('svg')
			.attr("width", width + margin.left + margin.right)
			.attr("height", height + margin.top + margin.bottom)
			.append("g")
			.attr("transform", "translate(" + margin.left + "," + margin.top + ")");				
					
			
			var y0 = d3.scale.ordinal().rangeRoundBands([0, height], .2);
			var y1 = d3.scale.ordinal();
			var x = d3.scale.linear().range([0, width]);					
			
			var yAxis = d3.svg.axis()
				.scale(y0)
				.orient("left");
					
			var xAxis = d3.svg.axis()
				.scale(x)
				.orient("bottom")
				.tickFormat(d3.format(".1s"));				

				
		  y0.domain(/*data*/graphic_data.map(function(d) { return d.State; }));
		  y1.domain(ageNames).rangeRoundBands([0, y0.rangeBand()]);
		  x.domain([0, 800 /*d3.max(graphic_data, function(d) { return d3.max(d.ages, function(d) { return d.value; }); } )*/ ]);
		
		  svg.append("g")
			  .attr("class", "x axis")
			  .attr("id", "xAxis")
			  .attr("transform", "translate(0," + height + ")")
			  .call(xAxis)
			  .append("text")
			  .attr("transform", "rotate(0)")
			  .attr("transform", "translate(" + (width - 0) + ", 30)")
			  .attr("y", 6)
			  .attr("dy", ".71em")
			  .style("text-anchor", "end")
			  .text("Non-UK born residents (thousands)");
		
		  svg.append("g")
			  .attr("class", "y axis")
			  .call(yAxis)
			  .append("text")
			  .attr("transform", "rotate(0)")
			  .attr("transform", "translate(-5, -25)")
			  .attr("y", 6)
			  .attr("dy", ".71em")
			  .style("text-anchor", "end")
			  .text("Country");
			  

		
		  var state = svg.selectAll(".state")
			  .data(/*data*/graphic_data)
			  .enter()
			  .append("g")
			  .attr("class", "g")
			  .attr("transform", function(d) { return "translate(0 , "   + y0(d.State) + ")"; });
		
		  state.selectAll("rect")
			  .data(function(d) { return d.ages; })
			  .enter()
			  .append("rect")
			  .attr("width", function(d) { return x(d.value); })
			  .attr("x", function(d) { return 0; })
			  .attr("y", function(d, i) { return y1(d.name); })
			  .attr("height", y1.rangeBand() )
			  .style("fill", function(d) { return color(d.name); })
			  .style("opacity", 0.85);
		
			var xticks = svg.selectAll('#xAxis').selectAll('.tick');	
			xticks.append('svg:line')
				.attr( 'class' , "tick" )
				.attr( 'y0' , 0 )
				.attr( 'y1' , -height )
				.attr( 'x1' , 0 )
				.attr( 'x2',  0 );	  
				
			if (pymChild) {
				pymChild.sendHeight();
			}
		}
		
		
		if (Modernizr.svg) {
			 
			
			d3.csv(graphic_data_url, function(error, data) {
		        graphic_data = data;

				ageNames = d3.keys(/*data*/graphic_data[0]).filter(function(key) { return key !== "State"; });
			  
				/*data*/graphic_data.forEach(function(d) {
				  d.ages = ageNames.map(function(name) { return {name: name, value: +d[name]}; });	
				}); 				
		
				pymChild = new pym.Child({renderCallback: drawGraphic});
			});
		} else {
				pymChild = new pym.Child();
				pymChild.sendHeight();
		}

	
    </script>
