    <script>
	
// Labels for the key (same order as the columns in your csv file) - The names don't need to match those in the CSV. In fact the names in the csv must be all one string, no gaps or funny characters
var labels = ['',''];

// Location and name of the file - if the csv is in the same folder then all you need to do is point it to the right filename
var graphic_data_url = 'Pop_Chart5.csv';

// Define annotation text - put a double space where you want the line to break
var annotext1 = "1983: 322 of every 100,000  UK residents were aged 90+";
var annotext2 = "The dip here is mainly because there  were fewer births during WW1";
var annotext3 = "2014: 853 of every 100,000  UK residents were aged 90+";
var annotext4 = "The shape between 2004 and 2011 is due to the effects of WW1 and the influenza pandemic in the early 20th century";

// Define the starting x position for the annotation text
var annoY1 = 305;
var annoY2 = 631;
var annoY3 = 857;

// Define the starting y position for the annotation text
var annoX1 = "1984";
var annoX2 = "2011";
var annoX3 = "2013";
 
// Define whether you want left or right aligned annotation text. Options start | middle | end 
var annoAlign1 = 'start';
var annoAlign2 = 'end';
var annoAlign3 = 'end';

//What is the date format in the csv file? e.g %Y-%m-%d would be format for 1970-01-25 - See here https://github.com/mbostock/d3/wiki/Time-Formatting
var dateForm = "%Y"

//What are the Y-axis units?
var yUnit = "Number per 100,000";

var dashArray = ["2px solid #274796", "2px solid #F3942F"];



var $graphic = $('#graphic');
var keypoints1 = $('#keypoints1');
var keypoints2 = $('#keypoints2');
var keypoints3 = $('#keypoints3');
var graphic_data;
var graphic_aspect_width = 16;
var graphic_aspect_height = 9;
var mobile_threshold = 500;
var pymChild = null;



function drawGraphic(width) {
    var margin = {top: 15, right: 20, bottom: 35, left: 30};
    var width = $graphic.width() - margin.left - margin.right;
    var height = Math.ceil((width * graphic_aspect_height) / graphic_aspect_width) - margin.top - margin.bottom + 30;
    var num_ticks = 10;
    if (width < mobile_threshold) {
        num_ticks = 5;
    }

    // clear out existing graphics
    $graphic.empty();
	keypoints1.empty();
	keypoints2.empty();
	keypoints3.empty();

    var x = d3.time.scale()
        .range([0, width]);

    var y = d3.scale.linear()
        .range([height, 0]);

    var formatAsPercentage = d3.formatPrefix('%',0);

    x.domain(d3.extent(graphic_data, function(d) { return d.date; }));	

    var xAxis = d3.svg.axis()
        .scale(x)
        .orient("bottom")
        .tickFormat(function(d,i) {
            if (width <= mobile_threshold) {
                var fmt = d3.time.format('%y');
                return '\u2019' + fmt(d);
            } else {
                var fmt = d3.time.format('%Y');
                return fmt(d);
            }
        })
		.tickPadding(1)
		.tickValues(x.ticks(7).concat( x.domain() ));
		

		
		
		
//	xAxis.tickValues(d3.range(1983, 2018, 5))

    var yAxis = d3.svg.axis()
        .scale(y)
        .orient('left')
        .ticks(num_ticks);

    var y_axis_grid = function() { return yAxis; }

	/*	var legend = d3.select('#graphic').append('ul')
                .attr('class', 'key')
            .selectAll('g')
                .data(labels)
            .enter().append('li')
                //.attr('class', function(d, i) { return 'key-item key-' + i + ' ' + d.key.replace(' ', '-').toLowerCase(); });
        legend.append('b')
		.style("border-top", function(d,i) { return dashArray[i]; })
        legend.append('label')
            .html(function(d,i) { return labels[i]; });*/


    var line = d3.svg.line()
		.defined(function(d) { return d.amt!= null; })
        .x(function(d) { return x(d.date); })
        .y(function(d) { return y(d.amt); });

    // parse data into columns
    var lines = {};
    for (var column in graphic_data[0]) {
        if (column == 'date') continue;
		
        lines[column] = graphic_data.map(function(d) {
		    return {
                'date': d.date,
                'amt': d[column]
            };
        });
    }
	
//	var legend = d3.select('#graphic').append('ul')
//                .attr('class', 'key')
//            .selectAll('g')
//                .data(d3.entries(lines))
//            .enter().append('li')
//                .attr('class', function(d, i) { return 'key-item key-' + i + ' ' + d.key.replace(' ', '-').toLowerCase(); });
//        legend.append('b');
//        legend.append('label')
//            .text(function(d,i) { return labels[i]; });


	var units = d3.select('#graphic').append("p")
                .attr('class', 'unit')
  		        .text(function(d,i) { return yUnit; });


    var svg = d3.select('#graphic').append('svg')
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom +30)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

   y.domain([
//        d3.min(d3.entries(lines), function(c) {
//            return d3.min(c.value, function(v) {
//                var n = v.amt;
//                return Math.floor(n);
//            });
//        }),
		300,850
//        d3.max(d3.entries(lines), function(c) {
//            return d3.max(c.value, function(v) {
//                var n = v.amt;
//                return Math.ceil(n);
//            });
//        })
   ]);
	
   	

    svg.append('g')
        .attr('class', 'x axis')
        .attr('transform', 'translate(0,' + (height + 30) + ')')
        .call(xAxis);

    svg.append('g')
        .attr('class', 'y axis')
        .call(yAxis);

    svg.append('g')
        .attr('class', 'y grid')
        .call(y_axis_grid()
            .tickSize(-width, 0, 0)
            .tickFormat('')
        );

		
/*	var paths = svg.append("defs")
                .append("g")
                .attr("id","icon")
				.append("g");
				
		paths.append("polyline")
			 .attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
			 .attr("stroke", "#666")
			 .attr("fill", "none")
		paths.append("polyline")
			.attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
			.attr("stroke", "#666")
		 	.attr("fill", "none");
  
            
	
	svg.append("g").attr("id","iconpath")
		.attr("transform","translate(-10,3)")
		.append("use")
		.attr("xlink:href","#icon")
		.attr("x", x(x.domain()[0]))
		.attr("y", function(){ 
			if (width < mobile_threshold) {
			  	return  y(295)
			} else {
				return y(295)
			}	
		});*/

    svg.append('g').selectAll('path')
        .data(d3.entries(lines))
        .enter()
        .append('path')
            .attr('class', function(d, i) {
                return 'line line-' + i;
            })
            .attr('d', function(d) {
					
					return line(d.value);
            })
			
	
	var insertLinebreaks1 = function () {
		
		var el1 = this.firstChild;
		var el = el1.data;

		var words = el.split('  ');
		
		d3.select(this).text('');

	
		for (var i = 0; i < words.length; i++) {
			var tspan = d3.select(this).append('tspan').text(words[i]);
			if (i > 0)
				tspan.attr('x', x(d3.time.format(dateForm).parse(annoX1))).attr('dy', '14');
		}
	};
	var insertLinebreaks2 = function () {
		
		var el1 = this.firstChild;
		var el = el1.data;

		var words = el.split('  ');
		
		d3.select(this).text('');

	
		for (var i = 0; i < words.length; i++) {
			var tspan = d3.select(this).append('tspan').text(words[i]);
			if (i > 0)
				tspan.attr('x', x(d3.time.format(dateForm).parse(annoX2))).attr('dy', '15');
		}
	};
	var insertLinebreaks3 = function () {
		
		var el1 = this.firstChild;
		var el = el1.data;

		var words = el.split('  ');
		
		d3.select(this).text('');

	
		for (var i = 0; i < words.length; i++) {
			var tspan = d3.select(this).append('tspan').text(words[i]);
			if (i > 0)
				tspan.attr('x', x(d3.time.format(dateForm).parse(annoX3))-10).attr('dy', '14');
		}
	};

    if (width > mobile_threshold) {
		
		svg.append("text")
			.text(annotext1)
			.attr("class","annotext1")
			.attr("text-anchor", annoAlign1)
			.attr('y',y(annoY1))
			.attr('x',x(d3.time.format(dateForm).parse(annoX1)));
		
		d3.selectAll(".annotext1").each(insertLinebreaks1);
				svg.append("text")
			.text(annotext2)
			.attr("class","annotext2")
			.attr("text-anchor", annoAlign2)
			.attr('y',y(annoY2))
			.attr('x',x(d3.time.format(dateForm).parse(annoX2)));
		
		d3.selectAll(".annotext2").each(insertLinebreaks2);
		
		svg.append("text")
			.text(annotext3)
			.attr("class","annotext3")
			.attr("text-anchor", annoAlign3)
			.attr('y',y(annoY3))
			.attr('x',x(d3.time.format(dateForm).parse(annoX3))-10);
		
		d3.selectAll(".annotext3").each(insertLinebreaks3);
	} else {
		d3.select("#keypoints3").append("p").text(annotext1);
		d3.select("#keypoints2").append("p").text(annotext4);
		d3.select("#keypoints1").append("p").text(annotext3);
	}
		
    if (pymChild) {
        pymChild.sendHeight();
    }
}


if (Modernizr.svg) {
    d3.csv(graphic_data_url, function(error, data) {
        graphic_data = data;
		
        graphic_data.forEach(function(d) {
            d.date = d3.time.format(dateForm).parse(d.date);
			
        });

	
        pymChild = new pym.Child({renderCallback: drawGraphic});
    });
} else {
	 pymChild = new pym.Child();
	if (pymChild) {
        pymChild.sendHeight();
    }
}

	
    </script>
