    <style type="text/css">

		/* base styles */
        html { -webkit-text-size-adjust: none; /* prevent font scaling in landscape */ }

        body {

        /* chart */
        #graphic {
            width: 100%;
        }
        #graphic:before,

        }

        #graphic svg {

        }
        #graphic .axis {

            fill: #666;
        }
        #graphic .axis path{
            fill: none;
            stroke: #666666;
            shape-rendering: crispEdges;
        }
        #graphic .axis line {
            fill: none;
            stroke: none;
            shape-rendering: crispEdges;
        }
        #graphic .axis.y path { display: inline; }
        #graphic .axis.y .tick line { display: none; }
        #graphic .grid path { display: none; }
        #graphic .grid .tick {
            stroke: #ccc;
            /*stroke-dasharray: 1px 3px;*/
            stroke-width: 1px;
            shape-rendering: crispEdges;
        }
        
		
		/* x axis vertical grid lines */
		#graphic .axis.x .tick line { 
            stroke: #CCC;
		}
		
        		
		
        #graphic .line {
            fill: none;
            stroke-width: 3px;
        }

        #graphic .bars rect { fill: #17807E; }
        #graphic .label text,
        #graphic .value text {

        }
        #graphic .value text {
            fill: #fff;

        }

        #graphic .key {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0 0 1em 0;
            padding: 0;
            list-style-type: none;
        }

        #graphic .key li {
            display: inline-block;

        }

        #graphic .key  b {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-right: 6px;
            float: left;
			background-color:red;
        }

        #graphic .key label {
            white-space: nowrap;
            font-size: 12px;
            color: #333;
            font-weight: normal;
        }
		
		#graphic .unit {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            fill: #333;
            text-align: left;
        }

		.annotext, #keypoints {
		    font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
			fill: #333;

		}

        #centreline {stroke:#666; stroke-width:3px; }
		
		.annoline {stroke:#666; stroke-width:1px; }

   	<div class="footer">
        <p>Source: 
        <a href="https://www.gov.uk/government/statistics/public-spending-statistics-release-april-2016" target="_blank">Public Spending Statistics: Expenditure on Services, Table 10a, April 2016, HM Treasury</a>

    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/d3.v3.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>
	
	// Labels for the key (same order as the columns in your csv file) - The names don't need to match those in the CSV. In fact the names in the csv must be all one string, no gaps or funny characters
	var labels = ["Social protection","Health","Education","General public services","Defence","Public order and safety","Other"]
	// Location and name of the file - if the csv is in the same folder then all you need to do is point it to the right filename
	var graphic_data_url = 'Public_Chart2.csv';
	
	// Define annotation text - put a double space where you want the line to break
	var annotext = "";
	
	// Define the starting y position for the annotation text
	var annoY = -45;
	
	// Define the starting x position for the annotation text
	var annoX = "2005";
	
	// Define whether you want left or right aligned annotation text. Options start | middle | end 
	var annoAlign = 'middle';
	
	//What is the year format in the csv file? e.g %Y-%m-%d would be format for 1970-01-25 - See here https://github.com/mbostock/d3/wiki/Time-Formatting
	//var yearForm = "%Y"
	
	//What are the Y-axis units?
	var yUnit = "Percentage";
	
	var colourArray = [ "#2C486E" , "#648BC0", "#41699F",  "#cbd7e9" , "#8CA9D0", "#B4C7E0" , "#CCCCCC" ];
	
		
	var $graphic = $('#graphic');
	var keypoints = $('#keypoints');
	var graphic_data;
	var graphic_aspect_width = 16;
	var graphic_aspect_height = 6;
	var mobile_threshold = 400;
	var pymChild = null;

	var labels1 = ["162.6", "62.8", "57.7", "52.1", "37.1", "24.9", "55.4", "258.4", "134.1", "84.4", "58.6", "36.7", "29.6", "76.0"]

	function drawGraphic(width) {
		var margin = {top: 35, right: 35, bottom: 20, left: 55};
		var width = $graphic.width() - margin.left - margin.right;
		var height = Math.ceil((width * graphic_aspect_height) / graphic_aspect_width) - margin.top - margin.bottom;
		var num_ticks = 10;
		
		if (width < mobile_threshold) {
			num_ticks = 7;
			graphic_aspect_height = 10;
			height = Math.ceil((width * graphic_aspect_height) / graphic_aspect_width) - margin.top - margin.bottom;	
		}
		
	
		// clear out existing graphics
		$graphic.empty();
		keypoints.empty();

		var x = d3.scale.linear().rangeRound([width, 0]);
		var y = d3.scale.ordinal().rangeRoundBands([0, height ], .1);	
	
		var color = d3.scale.ordinal().range(colourArray);
					
		var formatAsPercentage = d3.formatPrefix('%',0);
	
		y.domain(d3.extent(graphic_data, function(d) { return d.group; }));	
			
		var xAxis = d3.svg.axis()
			.scale(x)
			.orient("bottom")
			.tickFormat(function(d,i) {
            	if (width <= mobile_threshold) {
                	
						str = d;
						return i % 2 ? "" :  d;
					
				} else {
                	
						return i % 1 ? "" :  d;
					
            	}
      		  })
			.tickPadding(1);
	
		d3.selectAll(".tick").selectAll("line").attr("transform", "translate(30,0)");
	
		var yAxis = d3.svg.axis()
			.scale(y)
			.orient('left')
			.ticks(num_ticks);
	
		var y_axis_grid = function() { return yAxis; }
	
		var legend = d3.select('#graphic').append('ul')
				.attr('class', 'key')
				.selectAll('g')
				.data(labels)
				.enter().append('li');
				
				legend.append('b')
				.style("background-color", function(d,i) { return colourArray[i]; });
				
				legend.append('label')
				.html(function(d,i) { return labels[i]; });
	
		var svg = d3.select('#graphic').append('svg')
			.attr("width", width + margin.left + margin.right)
			.attr("height", height + margin.top + margin.bottom)
			.append("g")
			.attr("transform", "translate(" + margin.left + "," + margin.top + ")");
	
		//	x.domain(graphic_data.map(function(d) { return d.group; }));
		//	y.domain([0, /*d3.max(graphic_data, function(d) { return d.total; })*/100]);
		x.domain([100, 0]);
		y.domain(graphic_data.map(function(d) { return d.group; }));
	
		svg.append('g')
			.attr('class', 'x axis')
		    .attr("id", "xAxis")
			.attr('transform', 'translate(0,' + (height) + ')')
			.call(xAxis)
			.append("text")
			.attr("transform", "rotate(0)")
			.attr("transform", "translate(" + (width + 25) + ", 1)")
			.attr("y", 6)
			.attr("dy", ".71em")
			.style("text-anchor", "end")
			.text("%");
	
		svg.append('g')
			.attr('class', 'y axis')
			.call(yAxis)
		 	.append("text")
			.attr("x", 0)
			.attr("y", -30)
			.attr("dy", ".71em")
			.style("text-anchor", "middle")
			.text(/*yUnit*/"");
	
		svg.append('g')
			.attr('class', 'y grid')
			.call(y_axis_grid()
			.tickSize(0, 0, 0)
			.tickFormat(''));
	
		
		var group = svg.selectAll(".group")
			.data(graphic_data)
			.enter()
			.append("g")
			.attr("class", "g bars")
			.attr("transform", function(d) { return "translate(0," + y(d.group) + ")"; });
	
	
		
		group.selectAll("rect")
			.data(function(d) {return d.vars; })
			.enter()
			.append("rect")
			.attr("class",function(d,i){return "bar barg" + i})
			.attr("height", y.rangeBand())
			.attr("x", function(d) { 
				if (d.x1 >=0){
					return x(d.x0);
				} else {
					return x(d.x2)+ (x(d.x0) - x(d.x1));
				}	  
			})
			.attr("width", function(d) { 
				if (d.x2 >=0){
					return Math.abs(x(d.x0) - x(d.x1));
				} else {
					return Math.abs(x(d.x0) - x(d.x1));
				}
			})
			.style("fill", function(d) { return color(d.name); })
			.attr("opacity", 0.85);

		
		d3.selectAll(".bar")
			.on('mouseover', function(d){ 
				var classy = this.getAttribute("class").substring(8);

				d3.selectAll(".barg" + classy).each(function(d,i){
						var xPos =this.getAttribute("x");
						var yPos =this.getAttribute("y");
						var width =this.getAttribute("width");		
						var height =this.getAttribute("height");
						
						d3.selectAll(".ProdToolTip" + i).style("text-anchor","middle").style("pointer-events","none").style("fill","#fff").style("font-size","12px").style("opacity", 1).attr("transform", "translate("+(+xPos+(0.5*width))+","+((+height/2)-6) +")").text(d.x2 + "%");
			
						d3.selectAll(".ProdToolTip2" + i).style("text-anchor","middle").style("pointer-events","none").style("text-anchor","middle").style("fill","#fff").style("font-size","12px").style("opacity", 1).attr("transform", "translate("+(+xPos+(0.5*width))+","+((+height/2)+6) +")").text("(" + labels1[(+classy + (i*7))] + "bn)");			
						
						
				})
			})
			 .on('mouseout', function(d){	
					d3.selectAll(".ProdToolTip").style("opacity", 0);
					d3.selectAll(".ProdToolTip2").style("opacity", 0);

			});


		group.append("text").attr("class",function(d,i){return "ProdToolTip ProdToolTip" + i}).attr("transform", "translate(0,0)").text("kjjh").style("opacity", 0);
		group.append("text").attr("class",function(d,i){return "ProdToolTip2 ProdToolTip2" + i}).attr("transform", "translate(0,0)").text("kjjh").style("opacity", 0);
				

			var xticks = svg.selectAll('#xAxis').selectAll('.tick');	
			xticks.append('svg:line')
				.attr( 'class' , "tick" )
				.attr( 'y0' , 0 )
				.attr( 'y1' , -height )
				.attr( 'x1' , 0 )
				.attr( 'x2',  0 );				
	
	
			
		if (pymChild) {
			pymChild.sendHeight();
		}
	}
	
	
	if (Modernizr.svg) {
		d3.csv(graphic_data_url, function(error, data) {
			graphic_data = data;
	
			var color = d3.scale.ordinal().range(colourArray);
					
			color.domain(d3.keys(graphic_data[0]).filter(function(key) { return key !== "group"; }));
			
			graphic_data.forEach(function(d) {
				var x0 = 0;
				d.vars = color.domain().map(function(name){
																return {
																		name: name, 
																		x0: x0, 
																		x1: x0 += +d[name],
																		x2: d[name],
																	}; 
														 });
			});
	
			pymChild = new pym.Child({ renderCallback: drawGraphic});
		});
		
	} else {
		 pymChild = new pym.Child();
		if (pymChild) {
			pymChild.sendHeight();
		}
	}

	
    </script>
