      background: white;
      border: none;

      ;

      /* font-size: 1.1em; */
      border: none;
      box-shadow: none;
      border-radius: 0;
      background: transparent;
      height: 100%;
      width: 100%;
      cursor: pointer;
      outline: none;
      padding-right: 35px;
      padding-left: 4px;

      /* display: inline-block; */
    }

    .button {
      overflow: visible;
      text-transform: none;
      font: inherit;
    }

    .btn--primary {
      background-color: #206095 !important;
    }

    .btn {
      position: relative;
      padding: 10px 15px;
      margin: 0 0 20px;
      line-height: normal;
      color: #fff;
      font-size: 1.3em !important;
      border-radius: 0px;
      display: inline-block;
      text-rendering: optimizeLegibility;
      transition: background-color .2s ease-in, color .2s ease-in;
    }


    .chosen-container:focus {
      margin-top: 10px;
      outline: 3px solid #FFA23A;
    }


    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    #industry-text {
      font-size: 18px;
      line-height: 32px;
      color: #323132;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

    #industry-text-later {

      padding-top: 20px;
      line-height: 32px;
      color: #323132;
      -webkit-font-smoothing: antialiased;

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js" type="text/javascript"></script>
  <script src="../lib/chosen.jquery.js"></script>
  <script src="../lib/chosen.order.jquery.min.js"></script>


  <script>

    var pymChild = null;

    $(".chosen-select.industry").chosen({
      allow_single_deselect: false,
      disable_search: true
    })

    $(".chosen-select.area").chosen({
      allow_single_deselect: true,
      disable_search: false
    })
    // pymChild = new pym.Child();



    // pym.Child({ renderCallback: drawgraphic })


    function drawgraphic() {

      // console.log(industry_data)

      var pymParent = new pym.Parent('map', '../fig4/index.html', {});
      var pymParent1 = new pym.Parent('scatter', '../fig5/index.html', {});

      d3.select("#smallimage").remove();

      // pymChild.sendHeight();

      termselected = "0";
      area_selected = "E07000170";
      setText(industry_data[termselected]);

      $("#yearbox").chosen().change(function () {
        if ($('#yearbox').val() != '') {
          termselected = d3.select("#yearbox").property("value");
          setregion(termselected);
          setText(industry_data[termselected])

          // area_selected = d3.select("#areabox").property("value");


          // // clear the chart via keyboard
          // d3.select('button.abbr').on('keypress', function (evt) {
          //   if (evt.keyCode == 13 || evt.keyCode == 32) {
          //     evt.preventDefault();
          //     clearIndustry();
          //   }
          // });
        } else {
          //on clear
          clearIndustry();
        }

        pymParent.sendMessage("Industry", selectedregion + " " + area_selected);
        pymParent1.sendMessage("Industry", selectedregion + " " + area_selected);

      })

      $("#areabox").chosen().change(function () {

        if ($('#areabox').val() != '') {
          area_selected = d3.select("#areabox").property("value");

          // clear the chart via keyboard
          d3.selectAll('abbr').on('keypress', function (evt) {
            if (evt.keyCode == 13 || evt.keyCode == 32) {
              // evt.preventDefault();
              clearArea();
            }
          });

          // clear the chart via keyboard
          d3.selectAll('abbr').on('click', function (evt) {

            // evt.preventDefault();
            clearArea();

          });
        } else {
          //on clear
          clearArea();
        }

        pymParent.sendMessage("Industry", selectedregion + " " + area_selected);
        pymParent1.sendMessage("Industry", selectedregion + " " + area_selected);

      })


      function clearIndustry() {
        $('#yearbox').val(null).trigger('chosen:updated');

      }

      function clearArea() {
        $('#areabox').val(null).trigger('chosen:updated');
        update_dropdown(null)
      }

      pymParent.onMessage("Area", update_dropdown)

      function update_dropdown(new_area) {
        $('#areabox').val(new_area).trigger('chosen:updated');
        area_selected = d3.select("#areabox").property("value");
        pymParent.sendMessage("Industry", selectedregion + " " + area_selected);
        pymParent1.sendMessage("Industry", selectedregion + " " + area_selected);
        pymChild.sendHeight();
      }
      // //add event listeners to chosen dropdown
      // d3.select(".chosen-drop").on("click", function () {
      //   termselected = d3.select("#yearbox").property("value");
      //   setregion(termselected);
      //   setText(industry_data[termselected])
      // })
      // d3.select(".chosen-drop").on("touchend", function () {
      //   termselected = d3.select("#yearbox").property("value");
      //   setregion(termselected);
      // })

      // d3.select(".chosen-drop").on("keyup", function () {
      //   if (d3.event.keyCode === 13) {
      //     setTimeout(function () {
      //       termselected = d3.select("#yearbox").property("value");
      //       setregion(termselected);
      //     }, 100);
      //   }
      // })

      selectedregion = "0";
      area_selected = "";

      function setregion(termselected) {
        selectedregion = termselected;
        pymChild.sendHeight()
      }

      function setText(d) {
        if (d !== "") {
          d3.selectAll("#industry-text")
            .text(function () { return d.text })
          d3.selectAll("#industry-text-later")
            .html(function () { return d.textlater })
        }
        pymChild.sendHeight()
      }

      setTimeout(function () {
        pymChild.sendHeight();
      }, 3000);

      setInterval(function () {
        pymChild.sendHeight();
      }, 6000);
    }

    d3.csv("industry_text.csv", function (error, data) {
      industry_data = data;

      pymChild = new pym.Child();

      pym.Child({ renderCallback: drawgraphic })
    })


  </script>
