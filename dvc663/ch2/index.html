    <script src="../lib/d3.v3.5.17.min.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.js" charset="utf-8"></script>
	<script src="../lib/saveSvgAsPng.js" type="text/javascript"></script>
    <script src="../lib/footer.js"></script>

    <script>

		var graphic = d3.select('#graphic');
		var keypoints = d3.select('#keypoints');
		var footer = d3.select(".footer");
		var pymChild = null;
		var numberFormat = d3.format(",.1f");	

		function drawGraphic(width) {
		   var threshold_md = 788;
		   var threshold_sm = dvc.optional.mobileBreakpoint; 
		  
		  	//set variables for chart dimensions dependent on width of #graphic
		    if (parseInt(graphic.style("width"))< threshold_sm) {        	
		            var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]}; 
					var chart_width = parseInt(graphic.style("width"))- margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    } else if (parseInt(graphic.style("width"))< threshold_md){
		        	var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]}; 
					var chart_width = parseInt(graphic.style("width"))- margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
		  	} else {
		        	var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
					var chart_width = parseInt(graphic.style("width"))- margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
			}

		    // clear out existing graphics
		    graphic.selectAll("*").remove();
			keypoints.selectAll("*").remove();
			footer.selectAll("*").remove();

			
			var x = d3.scale.ordinal()
				.rangeRoundBands([0, chart_width], .2)
				
				
		    var y = d3.scale.linear()
		        .range([ height, 0]);

		    x.domain(graphic_data.map(function(d) { return d.date; }));

		    var xAxis = d3.svg.axis()
		        .scale(x)
		        .orient("bottom")
				.tickSize(5)
		        .tickFormat(function(d,i) {
		            //specify date format for x axis depending on #graphic width
		            if (parseInt(graphic.style("width"))<= threshold_sm) {
		                return i % 1 ? "" :  d;
		            } else if (parseInt(graphic.style("width"))<= threshold_md){
		                return i % 1 ? "" :  d;
		            } else {
		                return i % 1 ? "" :  d;
		            }
		        })
				//.tickPadding(5)
		    
	        //specify number of ticks on x axis and whether 1st and last data point labels are included
	  //       if(parseInt(graphic.style("width"))<threshold_sm){		
	  //           xAxis.tickValues(x.ticks(dvc.optional.x_num_ticks_sm_md_lg[0]).concat( x.domain() ));
	  //       } else if (parseInt(graphic.style("width"))<= threshold_md){
			// 	xAxis.tickValues(x.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])/*.concat( x.domain() )*/);
			// } else {
	  //           xAxis.tickValues(x.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])/*.concat( x.domain() )*/);		
	  //       }
		    
		    var yAxis = d3.svg.axis()
		        .scale(y)
		        .orient('left');
		    			    
			//specify number or ticks on y axis
			if (parseInt(graphic.style("width"))<= threshold_sm) {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
			 } else if (parseInt(graphic.style("width"))<= threshold_md){
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
			 } else {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
			 }
				
		    //gridlines
		    var y_axis_grid = function() { return yAxis; }

		    var bar = d3.svg.line()
		        .x(function(d) { return x(d.date); })
		        .y(function(d) { return y(d.amt); });

		    // parse data into columns
		    var bars = {};
		    for (var column in graphic_data[0]) {
		        if (column == 'date') continue;
		        bars[column] = graphic_data.map(function(d) {
		            return {
		                'date': d.date,
		                'amt': d[column]
		            };
		        });
		    }

		 //    var startDate = new Date(bars["growth"][0].date);
			// var endDate = new Date(bars["growth"][bars["growth"].length-1].date);
			// var everyDate = d3.time.day.range(startDate, endDate);
			// var barWidth = chart_width/((everyDate
			// 	.length/365))-1;	

			
		  	//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
	   		if (dvc.essential.yAxisScale == "auto_zero_max"){
			   var yDomain = [
								0,
								d3.max(d3.entries(bars), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
							 ];
			} else if (dvc.essential.yAxisScale == "auto_min_max"){
				var yDomain = [
								d3.min(d3.entries(bars), function(c) {
									return d3.min(c.value, function(v) {
										var n = v.amt;
										return Math.floor(n);
									});
								}),
							
								d3.max(d3.entries(bars), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
					 		];
			} else {
			   var yDomain = dvc.essential.yAxisScale;
		    }
				 
		    y.domain(yDomain);
	    
		

		    //create svg for chart
		    var svg = d3.select('#graphic').append('svg')
				.attr("id","chart")
				.style("background-color","#fff")
				.attr("width", chart_width + margin.left + margin.right)
				.attr("height", height + margin.top + margin.bottom +30)
				.append("g")
				.attr("transform", "translate(" + margin.left + "," + margin.top + ")");

			   svg.append('g')
					.attr('class', 'y axis')
					.call(yAxis.tickSize(-chart_width, 0))

				 
					
				//create x axis, if y axis doesn't start at 0 drop x axis accordingly	
				svg.append('g')
					.attr('class', 'x axis')
					.attr('transform', function(d){ 
								if(yDomain[0] != 0){
									return 'translate(0,' + (height + 30) + ')'
								} else {
									return 'translate(0,' + height  + ')'
								}
						})
					.call(xAxis)
					.selectAll(".tick text")
      				.call(wrap, x.rangeBand()+8);
						
					function wrap(text, width) {
					  text.each(function() {
						var text = d3.select(this),
							words = text.text().split(/\s+/).reverse(),
							word,
							line = [],
							lineNumber = 0,
							lineHeight = 1.1, // ems
							y = text.attr("y"),
							dy = parseFloat(text.attr("dy")),
							tspan = text.text(null).append("tspan").attr("x", 0).attr("y", y).attr("dy", dy + "em");
						while (word = words.pop()) {
						  line.push(word);
						  tspan.text(line.join(" "));
						  if (tspan.node().getComputedTextLength() > width) {
							line.pop();
							tspan.text(line.join(" "));
							line = [word];
							tspan = text.append("tspan").attr("x", 0).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
						  }
						}
					  });
					}
					
				d3.selectAll(".x .tick line").attr("stroke",function(d,i){
					//if (i%78){return "none"}
//					else{return "#777"}
				})

				 d3.select(".x").select("path").style("stroke", "#666")	
					 
				//create icon to symbolise break in y axis if required					
				if(yDomain[0] > 0 && dvc.essential.yAxisBreak == true){
					var paths = svg.append("defs")
								.append("g")
								.attr("id","icon")
								.append("g");
								
							paths.append("polyline")
								 .attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
								 .attr("stroke", "#666")
								 .attr("fill", "none")
							paths.append("polyline")
								.attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
								.attr("stroke", "#666")
								.attr("fill", "none");
				  
						//specify position of icon				  
						svg.append("g").attr("id","iconpath")
								.attr("transform","translate(-10,3)")
								.append("use")
								.attr("xlink:href","#icon")
								.attr("x", x(x.domain()[0]))
								.attr("y", function(){ 
									if (parseInt(graphic.style("width"))< threshold_sm) {
										return y(dvc.essential.yAxisBreak_sm_md_lg[0])
									} else if (parseInt(graphic.style("width"))< threshold_md){
										return y(dvc.essential.yAxisBreak_sm_md_lg[1])
									} else {
										return y(dvc.essential.yAxisBreak_sm_md_lg[2])
									}
								});
				}

							
					
					//create centre line if required
					if (dvc.optional.centre_line == true){
						svg.append("line")
							.attr("id","centreline")
							.attr('y1',y(dvc.optional.centre_line_value))
							.attr('y2',y(dvc.optional.centre_line_value))
							.attr('x1',0)
							.attr('x2',chart_width);
					} else if(yDomain[0] <0){
						svg.append("line")
							.attr("id","centreline")
							.attr('y1',y(0))
							.attr('y2',y(0))
							.attr('x1',0)
							.attr('x2',chart_width);
					}  	
					
			writeAnnotation();
							
			function writeAnnotation(){
			
				if (parseInt(graphic.style("width"))< threshold_sm) {
					
					d3.select(".annotationrect").style("display","none");
					
					
						dvc.essential.annotationBullet.forEach(function(d,i) {
						
//							d3.select("#keypoints").append("svg")
//								.attr("width","20px")
//								.attr("height","20px")
//								.attr("class","circles")
//								.append("circle")
//								.attr("class", "annocirc" + (i))
//								.attr("r", "2")
//								.attr('cy',"12px")
//								.attr("cx", "10px");
//							
//							d3.select("#keypoints")
//								.append("p")
//								.style("font-size","12px")
//								.style("font-weight",400)
//								.text(dvc.essential.annotationBullet[i]);
						
						})// end foreach
				}		
				else {
					
						dvc.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","annotextall annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',y(dvc.essential.annotationXY[i][1]))
								.attr('x',x(dvc.essential.annotationXY[i][0]));
										
							d3.selectAll(".annotext" + (i))
								.attr("fill",dvc.essential.annotextcolour[i])
    							.attr("font-size", "14px")
    							.attr("font-weight", 700)
								.each(insertLinebreaks)
								.each(createBackRect);	
								
							d3.selectAll(".annotextall").attr("transform","translate(0" +  x.rangeBand()/2 + ")")
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(dvc.essential.annotationXY[i][0])).attr('dy', '22');													
								}
							};					
													
							function createBackRect() {
								
							var BBox = this.getBBox()
											
									svg.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("fill", "white")
										.attr("opacity", 0);
										
							}; // end function createBackRect()

							
						});	// end foreach 		
					
				} // end else ... 
				
				return;
				
			}// end function writeAnnotation()
				
			
				
			if (dvc.optional.annotateRect == true){
					
					dvc.optional.annotateRectX_Y.forEach(function(d,i) {
						
						svg.append("rect")
							.attr('x',x(dvc.optional.annotateRectX_Y[i][0][0]))
							.attr("class","annotationrect")
							.attr('y',y(dvc.optional.annotateRectX_Y[i][0][1]))
							.attr('height',y( dvc.optional.annotateRectX_Y[i][1][1] ) - y(dvc.optional.annotateRectX_Y[i][0][1])) 
							.attr('width',x(dvc.optional.annotateRectX_Y[i][1][0]) - x(dvc.optional.annotateRectX_Y[i][0][0]))
							.style('fill', dvc.optional.lineColor_opcty[i][0] )
							.style('stroke-width', 2)
							.style('opacity', dvc.optional.lineColor_opcty[i][1] );						
						
					})
				} 
				
		//populate header image
		d3.select("#headerimage").html('<img src="' + dvc.essential.headerimage + '" alt="headerimage" style="max-width:400px; margin-bottom:10px;">')
		//populate title
		d3.select("#questioncontainer").text(dvc.essential.toptitle);
		//populate subtitle
		d3.select("#subtitlecontainer").text(dvc.essential.subtitle);
			//populate reveal (1)
			d3.select("#revealcontainer1").text(dvc.essential.revealtext1);
			//populate reveal (2)
			d3.select("#revealcontainer2").text(dvc.essential.revealtext2);
			//populate reveal (3)
			d3.select("#revealcontainer3").text(dvc.essential.revealtext3);
			//populate reveal (4)
			d3.select("#revealcontainer4").text(dvc.essential.revealtext4);
			
		svg.append('g').attr("class","bars").selectAll('rect')
					.data(bars["growth"])
					.enter()
					.append('rect')
					.attr("class",function(d,i){return "bar" + i})
					.attr("fill", function(d) {
						if(d.amt > 0){
							return dvc.essential.colour_palette[0]}
						else {return dvc.essential.colour_palette[1]}})
					.attr("width", x.rangeBand())
					.attr("x", function(d) { return x(d.date); })
					.attr("y", function(d) { return y(Math.max(0, d.amt)); })
					.attr("height", function(d) { return 0 + Math.abs(y(d.amt) - y(0)); });
					
		//hide the answer bar
		//first get its height so we can transition it back on reveal
		var revealBarHeight = d3.select(".bar2").attr("height");
		var revealBarYPosition = d3.select(".bar2").attr("y");
			//now dissappear it
			d3.select(".bar2").attr("height",0).attr("y",y(0));

					
		if (dvc.optional.vertical_line == true){
					dvc.optional.annotateLineX1_Y1_X2_Y2.forEach(function(d,i) {
						svg.append("line")	
							.style('stroke-dasharray',dvc.optional.isdashed[i][0])
							.attr('x1',x(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][0]))
							.attr('x2',x(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][0]))
							.style('stroke', '#333')
							.style('stroke-width', 1.5)
							.attr('y1',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][1]))
							.attr('y2',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][1]));
			})
		} 


		//dummy rect in background for pointer
		svg.append("rect")
				.attr("class","dummyRectangle")
				.attr('x',x(dvc.essential.varTestName))
				.attr("y", function(d) { return y(Math.max(0, dvc.essential.yAxisScale[1])); })
					.attr("height", function(d) { return 0 + Math.abs(y(dvc.essential.yAxisScale[1]) - y(0)); }) 
				.attr('width',x.rangeBand())
				.style("opacity",0)
				.attr("cursor","hand")
				.attr("cursor","pointer")
				
			
			//now make the rectangle that the user can manipulate to make a selection
			svg.append("rect")
				.attr('x',x(dvc.essential.varTestName))
				.attr("class","userRectangle")
				.attr("height", function(d) { return 0 + Math.abs(y(15) - y(0)); }) 
				.attr("y", function(d) { return y(Math.max(0, 15)); })
				.attr('width',x.rangeBand())
				.style('fill',"#ff9933")
				.attr("cursor","hand")
				.attr("cursor","pointer")	
				
			//now insert the prompt tag image
			d3.select("#chart")
				.append("png:image")
				.attr("xlink:href", "../banners/prompt.png")
				.attr("id","prompt")
				.attr("width",x.rangeBand())
				.attr("height",x.rangeBand() * 0.527)
				.attr('x',x(dvc.essential.varTestName)+24)
				.attr("y", function(d) { return y(Math.max(0,15)); })
				
			
			var mypositionY = y(15);
			var stopUpdating = true;
			var alldone= false;
			
			//fade out the tag thing
					d3.select("#graphic")
						.on("mouseover", function() {
							d3.select("#prompt")
							.transition()
							.duration(600)
							.style("opacity","0")
							
					});
			
			//return y position of mouse and update the user rectangle			
			d3.select("#chart").on("mousemove",function(){
				if(stopUpdating == true){
					mypositionY = y.invert(d3.mouse(this)[1]-50);
					
					
							
					
					//make sure within range	
					if(mypositionY >= dvc.essential.yAxisScale[0]  &&  mypositionY <= dvc.essential.yAxisScale[1]){
						
						d3.select(".userRectangle")
							.attr("height", function(d) { return 0 + Math.abs(y(mypositionY) - y(0)); }) 
							.attr("y", function(d) { return y(Math.max(0, mypositionY)); })
						d3.select(".annotext0").transition().delay(1000).duration(500).style("opacity",1)
					
						d3.select(".annotext0").text(numberFormat(mypositionY) + "%").attr('y',y(mypositionY)-15);
						if(stopUpdating == true){
							d3.select(".annotext0").text(numberFormat(mypositionY) + "%").attr('y',y(mypositionY)-15)
							d3.select("#prompt").attr('y',y(mypositionY))
						}
					}			
				}				

			})
			
			//now deal with when a user clicks the bar (makes their selection)
			d3.select("#chart").on("click",function(){
				if(stopUpdating == true && mypositionY >= dvc.essential.yAxisScale[0]  &&  mypositionY <= dvc.essential.yAxisScale[1]){
					
					stopUpdating = false;
					d3.select(".annotext0").transition().duration(500).style("opacity",1)
					
					d3.select("#submitanswer")
						.style("cursor","pointer")
						.style("cursor","hand")
						.style("background-color","#206095")
						.style("color","white")
						.on("mouseover",function(){
							d3.select(this).transition().duration(300).style("background-color","#003C57")
						})
						.on("mouseout",function(){
							d3.select(this).transition().duration(300).style("background-color","#206095")
						})
					
				} else if (stopUpdating == false && alldone == false && y.invert(d3.mouse(this)[1]-50) >= dvc.essential.yAxisScale[0]  &&  y.invert(d3.mouse(this)[1]-50) <= dvc.essential.yAxisScale[1]){
					
				mypositionY = y.invert(d3.mouse(this)[1]-50);					
					
					//make sure within range	
					if(mypositionY >= dvc.essential.yAxisScale[0]  &&  mypositionY <= dvc.essential.yAxisScale[1]){
						d3.select(".userRectangle")
							.attr("height", function(d) { return 0 + Math.abs(y(mypositionY) - y(0)); }) 
							.attr("y", function(d) { return y(Math.max(0, mypositionY)); })
							
						d3.select("#prompt").attr('y',y(mypositionY))
						d3.select(".annotext0").text(numberFormat(mypositionY) + "%").attr('y',y(mypositionY)-15)
					};
						
				};//end if
			})//end onclick
			
			
			
			//now deal with when a user clicks submit
			d3.select("#submitanswer").on("click",function(){
				if(stopUpdating == false){
					
					alldone=true;
					
					
					d3.select(".userRectangle").style("display","none")
					d3.select(".dummyRectangle").style("display","none")
					
					//now make a proper fixed rectangle
					svg.append("rect")
						.attr('x',x(dvc.essential.varTestName))
						.attr("class","finalRectangle")
						.attr("height", function(d) { return 0 + Math.abs(y(mypositionY) - y(0)); }) 
						.attr("y", function(d) { return y(Math.max(0, mypositionY)); })
						.attr('width',x.rangeBand())
						.style('fill',"#ff9933")
						
					dataLayer.push({
						'event':'buttonClicked',
						'selected':mypositionY
					})

					//get rid of the button
					d3.select("#submitanswer").style("display","none")	
					//fade in your value
					d3.select("#prompt").style("opacity",0)
					d3.select(".annotext0").transition().delay(500).duration(500).style("opacity",1)
	
					//now grow your actual answer bar
					d3.select(".bar2")
						.transition()
						.delay(1000)
						.duration(1500)
						.attr("height",revealBarHeight)
						.attr("y",revealBarYPosition);
						
					//and reveal the answer
					d3.select(".annotext1")
						.attr('y',y(dvc.essential.revealValue)-14)
						.transition()
						.delay(2500)
						.duration(1)
						.text(dvc.essential.revealValue + "%")	
				

				
				//now deal with maths of how far away the guess was	in % terms
				//first calculate the difference
				distanceAway = mypositionY-dvc.essential.revealValue;
				//now express as a % of the actual value
				percentageOut = (distanceAway/dvc.essential.revealValue)*100;
				
				//now figure out what message we will reveal depending how far +/- % we are from the actual
				userMessage = null;
				if(percentageOut <= -50){userMessage = "You're way too low"}
				else if(percentageOut <-25 && percentageOut >=-50){userMessage = "You're quite low"}
				else if(percentageOut <-5 && percentageOut >=-25){userMessage = "Not far away"}
				else if(percentageOut <5 && percentageOut >=-5){userMessage = "Great effort"}
				else if(percentageOut <25 && percentageOut >=5){userMessage = "Not far away"}
				else if(percentageOut >25 && percentageOut <=50){userMessage = "You're quite high"}
				else if(percentageOut >50){userMessage = "You're way too high"};
				
				dataLayer.push({
					'event':'mapDropSelect',
					'selected':percentageOut
				})
				
				d3.select("#userMessageText").text(userMessage)
					
				//and reveal the text underneath
				d3.select("#underneathRevealText")
					.transition()
					.delay(1000)
					.duration(1500)
					.style("opacity",1)
					
				};//end if
			})//end onclick
			
			
		
		d3.select('#graphic').select('svg')
			.append("g")
			.attr("id", "source")
			.append("text")
			.attr("text-anchor", "start")
			.style("font-size", "16px")
			.style("font-weight","700")
			.style("fill", "#323132")
			.attr('y',height + margin.top + margin.bottom+30-5)
			.attr('x',0)
			.text("Source: Community Life Survey, 2017 to 2018")

			
			lineNo = 0;
			 				
			svg.append("text")
				 .attr('class', 'unit')
				 .attr('transform',"translate(" + -margin.left + "," + eval(-margin.top + (lineNo+1)*20) + ")")  	
				 .attr("font-size","12px")
				 .attr("fill","#666")
				 .text(function(d,i) { return dvc.essential.yAxisLabel});
				 
				 
			

			d3.selectAll("path").attr("fill","none");
						
			d3.selectAll("text").attr("font-family","'Open Sans', sans-serif");
						
			d3.selectAll(".y text").attr("font-size","12px").attr("fill","#666");
			d3.selectAll(".x text").attr("font-size","12px").attr("fill","#666"); // dates - timelines
						
			d3.selectAll(".y line")
				.attr("stroke","#e8e8e8")
				.attr("stroke-width","1px")
				.style("shape-rendering","crispEdges");
			
			//use pym to calculate chart dimensions	
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		}

		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   //load config 
			d3.json("config.json", function(error, config) {
			dvc=config

				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;
					
					// graphic_data.forEach(function(d) {
					// 	d.date = d3.time.format(dvc.essential.dateFormat).parse(d.date); 
						
					// });

					names = d3.keys(/*data*/graphic_data[0]).filter(function(key) { return key !== "state"; });
			  
					/*data*/graphic_data.forEach(function(d) {
					  d.ages = names.map(function(name) { return {name: name, value: +d[name]}; });	
					}); 
						
						//use pym to create iframed chart dependent on specified variables
						pymChild = new pym.Child({ renderCallback: drawGraphic});
					});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
		
    </script>
