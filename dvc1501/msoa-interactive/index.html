  <!-- In simple static charts, hide the chart from screen readers but provide a written summary in a screenreadertext tag -->
  <h5 class="visuallyhidden" id="screenreadertext" aria-live="assertive"></h5>
  <!-- <p>Use your postcode to see the number of excess deaths each month where you live</p> -->
  <div id='postcodeNav'>
    <div class="input-group">
      <label class='visuallyhidden' for="postcodeInput">Type to enter a postcode</label>
      <input id="postcodeInput" type="text" class="search-control clearable" placeholder="Enter a postcode">
      <div class="input-group-addon search-group">
        <button id="submitPost" type="submit" style="background: none;border:0;">
          <span class="visuallyhidden">Postcode search</span>
          <span class="glyphicon glyphicon-search"></span>
        </button>
      </div>
    </div>
    <div id="pcError">
      <p id=pcErrorText aria-live="assertive"></p>
    </div>
  </div>
  <p id="msoanmhc" aria-hidden="true"></p>

  <div id="graphic" aria-hidden="true">
    <svg>
      <g id="legend"></g>
      <g id="annotations"></g>
      <g id="chart"></g>
    </svg>
  </div>
