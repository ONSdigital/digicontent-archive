    <style type="text/css">
/* base styles */

html {
    -webkit-text-size-adjust: none;
    /* prevent font scaling in landscape */
}

@import url("https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,700italic,400,300,700");
body {
    font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px;
}

h1 {
    margin: 0 0 15px 0;
    font-size: 16px;
    line-height: 1.3;
}

a,
a:link,
a:visited {
    color: #4774CC;
    text-decoration: none;
}

a:hover,
a:active {
    opacity: 0.7;
}

.footnotes {
    margin-bottom: 20px;
}

.footnotes h4 {
    margin: 2px 0 7px 0;
    color: #666;
    font-size: 11px;
}

.footnotes p,
.footer p {
    margin: 2px 0 0 0;
    font-size: 11px;
    line-height: 1.3;
    color: #808080;
}

table {
    border-collapse: collapse;
    padding: 0;
    margin: 0 0 11px 0;
    width: 100%;
}

table th {
    text-align: left;
    border-bottom: 2px solid #eee;
    vertical-align: bottom;
    padding: 0 10px 10px 10px;
    /*text-align: right;*/
}

table td {
    border-bottom: 1px solid #eee;
    vertical-align: top;
    padding: 10px;
    text-align: left;
    /*text-align: right;*/
}

table th:nth-child(1),
table td:nth-child(1) {
    text-align: left;
    padding-left: 0;
    font-weight: bold;
}

tr:nth-child(even) {
    background: #f0f5f7
}

tr:nth-child(odd) {
    background: #FFF
}


/* responsive table */

@media screen and (max-width: 680px) {
    table,
    tbody {
        display: block;
        width: 100%:
    }
    thead {
        display: none;
    }
    table tr,
    table th,
    table td {
        display: block;
        padding: 0;
        text-align: left;
        white-space: normal;
    }
    table tr {
        border-bottom: 1px solid #eee;
        padding-bottom: 11px;
        margin-bottom: 11px;
    }
    table th[data-title]:before,
    table td[data-title]:before {
        content: attr(data-title) ":\00A0";
        font-weight: bold;
    }
    table td {
        border: none;
        margin-bottom: 6px;
        color: #444;
    }
    table td:empty {
        display: none;
    }
    table td:first-child {
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #333;
    }
    table td:first-child:before {
        content: '';
    }
}

br{
	margin-bottom:10px;
}
    </style>
