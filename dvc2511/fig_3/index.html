    function createLegend(graphic_width, margin) {

      //draw legend
    legend.append('svg').attr("height", dvc.optional.legendHeight[size]).attr("width", graphic_width).append('g')
      .attr('transform', 'translate(5,5)')

    const legendArray = (size == "sm") ? [0.15, 0.4] : [0.1, 0.3]

    legend.select("svg")
      .append('line')
      .attr("stroke", function(d) {return "#414042"} )
      .attr("x1", legendArray[0]*graphic_width)
      .attr("x2", legendArray[1]*graphic_width)
      .attr("y1", dvc.optional.legendHeight[size]/3)
      .attr("y2", dvc.optional.legendHeight[size]/3)
      .attr("stroke-width", "1.5px")

    legend.select("svg")
            .selectAll("circle")
            .data([{cx: legendArray[0]*graphic_width, r: 3.5},{cx: legendArray[1]*graphic_width, r: 6.5}])
            .enter()
            .append("circle")
            .attr("stroke", function(d,i) {return (i!=1) ? "#414042" : "white"} )
            .attr("fill", function(d,i) {return (i==1) ? "#414042": "white"} )
            .attr("cx", function(d) {return d["cx"] })
            .attr("cy", dvc.optional.legendHeight[size]/3)
            .attr("r", function(d) {return d["r"] })
            .attr("stroke-width", "1.5px")

      legend.select("svg")
            .selectAll("text")
            .data([{x: legendArray[0]*graphic_width, y: 17, text: "December"},
            {x: legendArray[0]*graphic_width, y: 31, text: "2021"},
            {x: legendArray[1]*graphic_width, y: 17, text: "December"},
            {x: legendArray[1]*graphic_width, y: 31, text: "2022"}
          ])
            .enter()
            .append("text")
            .text((d) => {return d["text"]})
            .style("fill", "#414042")
            .attr("x", (d) => {return d["x"] })
            .attr("dy", "0.32em")
            .attr("y", (d) => {return d["y"]+dvc.optional.legendHeight[size]/3})
            .attr("text-anchor", "middle")
            .style("font-size", size == "lg" ? "14px" : "12px")
      
    } // end function createLegend()

      } else {

        }

        graphic_data.sort(function(a, b) {
          return categorySort[a.plot] - categorySort[b.plot]
        })

        categories=Object.keys(categorySort)
      } else if(dvc.essential.categorySort=="descending"){
        // TODO: NOT SURE THIS WILL WORK

        //auto sort the array by biggest value

          categorySort[item.plot]=i
        });*/

          return categorySort[a.plot] - categorySort[b.plot]
        })
