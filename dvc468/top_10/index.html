<script type="text/javascript">


var graphic = d3.select('#graphic');
var keypoints = d3.select('#keypoints');
var footer = d3.select(".footer");
var pymChild = null;

function drawGraphic(width) {

		   var threshold_md = 788;
		   var threshold_sm = dvc.optional.mobileBreakpoint;

		  	//set variables for chart dimensions dependent on width of #graphic
		    if (parseInt(graphic.style("width")) < threshold_sm) {
					var margin = {	top: 	dvc.optional.margin_sm[0],
									right: 	dvc.optional.margin_sm[1],
									bottom: dvc.optional.margin_sm[2],
									left: 	dvc.optional.margin_sm[3]
								};
					var size = 0;	// used for margin_centre and x_ticks
					var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
					var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    } else if (parseInt(graphic.style("width")) < threshold_md){
					var margin = {	top: 	dvc.optional.margin_md[0],
									right: 	dvc.optional.margin_md[1],
									bottom: dvc.optional.margin_md[2],
									left: 	dvc.optional.margin_md[3]
								};
					var size = 1;
					var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
					var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
			} else {
					var margin = {	top: 	dvc.optional.margin_lg[0],
									right: 	dvc.optional.margin_lg[1],
									bottom: dvc.optional.margin_lg[2],
									left: 	dvc.optional.margin_lg[3]
								};
					var size = 2;
					var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
					var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
			}
			
	// clear out existing graphics
	graphic.selectAll("*").remove();
	keypoints.selectAll("*").remove();
	footer.selectAll("*").remove();


	var specialDate = new Date(2001,4,14),

	 y = d3.scale.linear()
		.range([height,0])
		.domain([0,125]);
	
	var voronoi = d3.geom.voronoi()
				.x(function(d) {console.log(d); return 16; })
				.y(function(d) {console.log(d); return y(d.value); })
				.clipExtent([[0, 0], [chart_width, height]]);
	
	
	svg = d3.select('#graphic')
			.append('svg')
			.attr("width", chart_width + margin.left + margin.right)
			.attr("height", height + margin.top + margin.bottom )  
			.append("g")
			.attr("transform", "translate(" + margin.left + "," + margin.top + ")");
			
//	yAxis = d3.svg.axis()
//				.scale(y)
//				.tickSize(5,5)
//				.orient("left");

//	svg.append('g')
//			.attr('class', 'y axis')
//			.call(yAxis);

	svg.append('line')
			.attr('class',"line" )
			.attr("width", "2px")
			.attr("x1",16)
			.attr("y1", y(0))
			.attr("x2", 16)
			//.attr("y2", y(0))
			.attr("y2", y(46));
	
//	d3.select('.line')
//			.transition()
//			.duration(3000)
//			.attr("y2", y(46));
			
	svg.selectAll("circle")
			.data(graphic_data)
			.enter()
			.append("circle")
			.attr("class","circles")
			.attr("id",function(d,i){return "circle" + i})
			.attr("cx",16)
			//.attr("cy",y(0))
			.attr("cy", function(d,i){ return y(d.value)})
			.attr("r",5)
			.attr("fill","white")
			.attr("stroke","#004366")
			.attr("stroke-width","4px");
			
//	d3.selectAll(".circles")
//			.transition()
//			.duration(3000)
//			.attr("cy", function(d,i){ return y(d.value)});
			
	svg.append("circle")
			.attr("class","circles")
			.attr("id","zero_circle")
			.attr("cx",16)
			.attr("cy",y(0))
			.attr("r",5)
			.attr("fill","white")
			.attr("stroke","#ee3a9d")
			.attr("stroke-width","4px");
					
	svg.append('g')
			.attr("class","textlabels")
			.selectAll("text")
			.data(graphic_data)
			.enter()
			.append("text")
//			.attr("y",y(0)+5)
.attr("y", function(d,i){return y(d.value)+5})
			.attr("x",30)
			.html(function(d,i){return '<tspan class="boldtext">' + d.film + '</tspan> - ' + d.value})
			.attr("opacity", 0.2);
			
//	d3.select(".textlabels").selectAll("text")
//			.transition()
//			.duration(3000)
//			.attr("y", function(d,i){return y(d.value)+5});
			
			//Create the Voronoi grid
			svg.selectAll(".polygon")
				.data(voronoi(graphic_data)) //Use vononoi() with your dataset inside
				.enter().append("path")
				.attr("class", "polygon")
				.attr("d", function(d, i) { return "M" + d.join("L") + "Z"; })
				.datum(function(d, i) { return d.point; })
					//Give each cell a unique class where the unique part corresponds to the circle classes
				.attr("class", function(d,i) { return "voronoi " + d.code; })
				//.style("stroke", "#2074A0") //If you want to look at the cells
				.style("fill", "none")
				.style("pointer-events", "all")
				.on("mouseover", mouseOver)
				.on("mouseout",  mouseOut);
			
			
      		function mouseOver(d, i) {  
				
				svg.append("text")
					.attr("id", "tooltip")
					.attr("x", function() { return 40; })
					.attr("y", function() { return y(d.value)+5; })
					.text(function() {	return d.film+ " took £"+ d.value +" million"; });
			}

			function mouseOut(d, i) {
				d3.select("#tooltip").remove();  
			}
					
			
	
	} //end drawGraphic		

	//check whether browser can cope with svg
		if (Modernizr.svg) {
		   //load config
			d3.json("config.json", function(error, config) {
			dvc=config

				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;

					graphic_data.forEach(function(d) {
						d.date = d3.time.format(dvc.essential.dateFormat).parse(d.date);

					});

					//use pym to create iframed chart dependent on specified variables
					pymChild = new pym.Child({ renderCallback: drawGraphic});
				});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
</script>
</html>
