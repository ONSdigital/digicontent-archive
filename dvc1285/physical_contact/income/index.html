<!DOCTYPE html>
<html lang="en">

<head>
  <title>Clustered bar chart</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

  <link rel="stylesheet" href="../../lib/globalStyle.css" />
  <style type="text/css">
  h5,h6 {
    font-size: 16px;
    margin: 16px 0 8px 0;
    font-weight: 700;
    color: #323132;
    font-family: "Open Sans";
  }

    .x.axis path.domain {
      opacity: 0;
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>

</head>

<body>

  <p style="font-size:16px; min-height: 30px;">Income</p>
  <div id="graphic"><img src="fallback.png" alt="[Chart]" /></div>
  <!-- <h6 id="source"></h6> -->



  <div id="keypoints">
    <p></p>
  </div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="../../lib/pym.js" type="text/javascript"></script>
  <script src="../../lib/saveSvgAsPng.js" type="text/javascript"></script>

  <script>
    var ageNames;
    var graphic = d3.select('#graphic');
    var keypoints = d3.select('#keypoints');
    var footer = d3.select(".footer");
    var pymChild = null;


    function drawGraphic(width) {

      var threshold_md = 788; // new code ..
      var threshold_sm = dvc.optional.mobileBreakpoint; // new code ..

      //set variables for chart dimensions dependent on width of #graphic
      if (parseInt(graphic.style("width")) < threshold_sm) {
        var margin = {
          top: dvc.optional.margin_sm[0],
          right: dvc.optional.margin_sm[1],
          bottom: dvc.optional.margin_sm[2],
          left: dvc.optional.margin_sm[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[0] * graphic_data.length;
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        var margin = {
          top: dvc.optional.margin_md[0],
          right: dvc.optional.margin_md[1],
          bottom: dvc.optional.margin_md[2],
          left: dvc.optional.margin_md[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[1] * graphic_data.length;
      } else {
        var margin = {
          top: dvc.optional.margin_lg[0],
          right: dvc.optional.margin_lg[1],
          bottom: dvc.optional.margin_lg[2],
          left: dvc.optional.margin_lg[3]
        }
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[2] * graphic_data.length;
      }


      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      var num_ticks = 10;

      var color = d3.scaleOrdinal().range(dvc.essential.colour_palette);

      // vertical
      y0 = d3.scaleBand().rangeRound([0, height]).paddingInner(0.1);;
      var y1 = d3.scaleBand();
      var x = d3.scaleLinear().range([0, chart_width]);


      var parseDate = d3.timeParse("%Y");

      var xAxis = d3.axisBottom(x);

      var svg = d3.select('#graphic')
        .append('svg')
        .attr("id", "chart")
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + (margin.top) + ")")

      // vertical
      y0.domain(graphic_data.map(function(d) {
        return d.state;
      }));
      y1.domain(ageNames).range([0, y0.bandwidth()]);

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      if (dvc.essential.xAxisScale == "auto_zero_max") {
        var xDomain = [0, Math.ceil(dvc.maxVal / 100) * 100];
      } else if (dvc.essential.xAxisScale == "auto_min_max") {
        var xDomain = [dvc.minVal, Math.ceil(dvc.maxVal / 100) * 100];
      } else {
        var xDomain = dvc.essential.xAxisScale;
      }

      x.domain(xDomain);

      var yAxis = d3.axisLeft(y0)
        .tickFormat(function(d, i) {

          //specify date format for x axis depending on #graphic width
          if (parseInt(graphic.style("width")) <= threshold_sm) {
            var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[0]);
          } else if (parseInt(graphic.style("width")) <= threshold_md) {
            var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[1]);
          } else {
            var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[2]);
          }

          if (dvc.essential.GraphType == "clusterBar") {
            return d;
          } /* new code */
          else {
            return fmt(d);
          } /* new code */

        })
        .tickPadding(5);

      //specify number of ticks on x axis
      if (parseInt(graphic.style("width")) < threshold_sm) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
      } else {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
      }

      //specify number or ticks on y axis
      if (parseInt(graphic.style("width")) <= threshold_sm) {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[0]));
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[1]));
      } else {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[2]));
      }



      svg.append("g")
        .attr("class", "x axis")
        .attr("id", "xAxis")
        .attr('transform', function(d) {
          if (xDomain[0] != 0) {
            return 'translate(' + (0) + ',' + height + ')';
          } else {
            return 'translate(' + (0) + ',' + height + ')';
          }
        })
        .call(xAxis.tickSize(-height, 0))

      //create y axis, if x axis doesn't start at 0 nudge y axis accordingly
      svg.append('g')
        .attr('class', 'y axis')
        .call(yAxis);

      d3.select(".y").select("path").style("stroke", "#666")

      var state = svg.selectAll(".state")
        .data(graphic_data)
        .enter()
        .append("g")
        .attr("class", "g")
        .attr("transform", function(d, i) {
          return "translate(0," + parseFloat(y0(d.state)) + ")";
        });

      writeAnnotation();

      function writeAnnotation() {

        if (parseInt(graphic.style("width")) < threshold_sm) {

          dvc.essential.annotationBullet.forEach(function(d, i) {

            d3.select("#keypoints").append("svg")
              .attr("width", "20px")
              .attr("height", "20px")
              .attr("class", "circles")
              .append("circle")
              .attr("class", "annocirc" + (i))
              .attr("r", "2")
              .attr('cy', "12px")
              .attr("cx", "10px");

            d3.select("#keypoints")
              .append("p")
              .style("font-size", "12px")
              .style("font-weight", 400)
              .text(dvc.essential.annotationBullet[i]);

          }) // end foreach
        } else {

          dvc.essential.annotationChart.forEach(function(d, i) {

            // draw annotation text based on content of var annotationArray ...
            svg.append("text")
              .text(dvc.essential.annotationChart[i])
              .attr("class", "annotext" + i)
              .attr("text-anchor", dvc.essential.annotationAlign[i])
              .attr('y', y0(d3.timeParse(dvc.essential.dateFormat)(dvc.essential.annotationXY[i][1])))
              .attr('x', x(dvc.essential.annotationXY[i][0]));

            d3.selectAll(".annotext" + (i))
              .attr("fill", "#666")
              .attr("font-size", "13px")
              .attr("font-weight", 500)
              .each(insertLinebreaks)
              .each(createBackRect);


            function insertLinebreaks() {

              var str = this;

              var el1 = dvc.essential.annotationChart[i];
              var el = el1.data;

              var words = el1.split('  ');

              d3.select(this).text('');

              for (var j = 0; j < words.length; j++) {
                var tspan = d3.select(this).append('tspan').text(words[j]);
                if (j > 0)
                  tspan.attr('x', x /*0*/( /*d3.time.format(dvc.essential.dateFormat).parse(*/ dvc.essential.annotationXY[i][0] /*)*/ )).attr('dy', '22');
              }
            };

            function createBackRect() {

              var BBox = this.getBBox()

              svg.insert("rect", ".annotext" + (i))
                .attr("width", BBox.width)
                .attr("height", BBox.height)
                .attr("x", BBox.x)
                .attr("y", BBox.y)
                .attr("fill", "white")
                .attr("opacity", 0.4);

            }; // end function createBackRect()


            // draw circles, if var 'dvc.essential.circles' is set to true
            if (dvc.essential.circles == true) {

              svg.append("circle")
                .attr("class", "annocirc" + (i))
                .attr('cy', y0(dvc.essential.annotationCXCY[i][1]))
                .attr('cx', x(dvc.essential.annotationCXCY[i][0]))
                .attr("r", "3");

            } // end if ...

          }); // end foreach

        } // end else ...

        return;

      } // end function writeAnnotation()

        svg.append("text")
          .attr('class', 'unit')
          .attr('transform', "translate(" + (chart_width- margin.right+30) + "," + (height + margin.bottom / 1.5) + ")") // - margin.left / 10
          .attr("font-size", "12px")
          .attr("fill", "#666666")
          .attr("text-anchor", "end")
          .text(function(d, i) {
            return dvc.essential.xAxisLabel
          });


      state.selectAll("rect")
        .data(function(d) {
          return d.ages;
        })
        .enter()
        .append("rect")
        .attr("width", function(d) {
          return 0 + Math.abs(x(d.value) - x(0));
        })
        .attr("x", function(d) {
          return x(Math.min(0, d.value));
        })
        .attr("y", function(d) {
          return y1(d.name);
        })
        .attr("height", function(d) {
          return y1.bandwidth();
        })
        .style("fill", function(d) {
          return color(d.name);
        })
        .style("opacity", 0.75);

      //create centre line if required
      if (dvc.optional.centre_line == true) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('x1', x(dvc.optional.centre_line_value))
          .attr('x2', x(dvc.optional.centre_line_value))
          .attr('y1', 0)
          .attr('y2', height);
      } else if (xDomain[0] < 0) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('y1', 0)
          .attr('y2', height)
          .attr('x1', x(0))
          .attr('x2', x(0));
      }

      d3.selectAll("path").attr("fill", "none");

      d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

      d3.selectAll(".y text").attr("font-size", "12px").attr("fill", "#666");
      d3.selectAll(".x text").attr("font-size", "12px").attr("fill", "#666"); // dates - timelines

      d3.selectAll(".x line")
        .attr("stroke", "#CCC")
        .attr("stroke-width", "1px")
        .style("shape-rendering", "crispEdges");


      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {

        dvc = config;

        d3.csv(dvc.essential.graphic_data_url, function(error, data) {

          graphic_data = data;

          ageNames = d3.keys(graphic_data[0]).filter(function(key) {
            return key !== "state";
          });


          /* START MODIFIED */
          dvc.dataMinArray = [];
          dvc.dataMaxArray = [];
          /* END MODIFIED */

          graphic_data.forEach(function(d, i) {

            /* START MODIFIED */
            dvc.dataMinArray[i] = [];
            dvc.dataMaxArray[i] = [];
            dvc.minVal = Infinity;
            dvc.maxVal = -Infinity;
            /* END MODIFIED */

            d.ages = ageNames.map(function(name) {

              /* START MODIFIED */
              if (+d[name] <= dvc.minVal) {
                dvc.minVal = +d[name];
                dvc.dataMinArray[i] = +d[name];
              }

              if (+d[name] >= dvc.maxVal) {
                dvc.maxVal = +d[name];
                dvc.dataMaxArray[i] = +d[name];
              }
              /* END MODIFIED */

              return {
                name: name,
                value: +d[name]
              };
            });

          });

          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });
      })
    } else { //if modernizr is false
      pymChild = new pym.Child();
      pymChild.sendHeight();
    }
  </script>
