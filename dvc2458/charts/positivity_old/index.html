<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title>Small multiple line charts with band</title>

  <meta name="description" content="">
  <meta name="robots" content="noindex" />
  <meta name="googlebot" content="indexifembedded" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../../lib/globalStyle.css" />
  <style type="text/css">
    body {
      color: #323132;
      /* max-width:944px; */
    }

    .x.axis path {
      display: none;
    }

    path.line {
      fill: none;
    }

    path.line2 {
      fill: none;
    }

    path.line3 {
      fill: none;
    }

    path.line4 {
      fill: none;
    }

    path.line5 {
      fill: none;
    }

    path.line6 {
      fill: none;
    }

    path.line7 {
      fill: none;
    }

    text {
      font-family: 'Open Sans'
    }

    text.x,
    text.y {
      font-size: 12px;
      fill: #666;
    }

    line.y,
    line.x {
      stroke: #ccc;
      stroke-width: 1px;
      shape-rendering: crispEdges;
    }

    #legend {
      font-size: 12px;
    }

    h4 {
      font-size: 16px;
      line-height: 24px;
      margin: 16px 0 16px 0;
      padding: 24px 0 0 0;
      font-weight: bold;
    }

    h5 {
      font-size: 14px;
      margin: 0 0 16px 0;
      font-weight: normal;
      padding-top: 0;
    }

    h5,
    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    ul,
    ol {
      margin: 16px 0;
      padding-left: 32px;
    }

    li {
      margin: 0 0 8px 0;
      line-height: 32px;
      font-weight: 400;
      font-size: 18px;
      padding: 0;
    }

    @media (max-width:767px) {
      li {
        font-size: 16px;
      }
    }

    .line5-yearaverage {
      stroke: #666;
      stroke-dasharray: 5 8 !important;
      stroke-linecap: round !important;
      stroke-width: 2px !important;
    }

    a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
    }

    .btn {
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
    }

    .btn--primary:focus {
      background-color: #0b5d30;
    }

    .btn--primary {
      background-color: #0F8243;
      color: #fff;
    }

    /* legend div */

    #legend {
      display: flex;
      flex-wrap: wrap;
    }

    .legend--item {
      display: flex;
      padding-right: 40px;
      padding-bottom: 12px;
    }

    .legend--box {
      height: 12px;
      width: 12px;
      align-self: center;
    }

    .legend--icon {
      height: 3px;
      width: 12px;
      align-self: center;

    }

    .legend--text {
      color: #707070;
      line-height: 14px;
      font-size: 14px;
      padding-left: 12px
    }

    @media (max-width: 400px) {
      #legend {
        flex-flow: column;
      }

      .legend--item {
        padding-bottom: 8px;
      }
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>

<body>

  <h5 class="visuallyhidden">Modelled percentage of people that have received one or more doses of a COVID-19 vaccine,
    UK, and modelled percentage of people testing positive for antibodies to SARS-CoV-2 from a blood sample, UK</h5>
  <div id="legend" aria-hidden="true"></div>
  <div id="graphic" aria-hidden="true" style="position:relative">
    <img src="fallback.png"
      alt="Modelled percentage of people that have received one or more doses of a COVID-19 vaccine and modelled percentage of people testing positive for antibodies to SARS-CoV-2 from a blood sample, regions, England" />
  </div>

  <h6 id="source"></h6>
  <!-- <h6>Notes:</h6>
    <ol>
      <li>Based on area of usual residence</li>
      <li>Figures exclude deaths of non-residents.</li>
      <li>Based on date a death was registered rather than occurred.</li>
      <li>All figures for 2020 are provisional.</li>
      <li>The International Classification of Diseases, Tenth Edition (ICD-10) definitions are as follows: coronavirus (COVID-19) (U07.1 and U07.2).</li>

    </ol>

  <!-- <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js" type="text/javascript"></script> -->
  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.1.0/d3-annotation.js" type="text/javascript"></script> -->
  <script src="../../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <script src="../lib/d3-legend.min.js" type="text/javascript"></script>
  <script>
    var graphic = d3.select('#graphic');
    var legend = d3.select('#legend');
    var pymChild = null;


    function drawGraphic() {

        // Set up the legend
        var legenditem = d3.select('#legend')
            .selectAll('div.legend--item')
            .data(dvc.essential.colour_palette)
            .enter()
            .append('div')
            .attr('class', 'legend--item')

        legenditem.append('div').attr('class', function (d,i) { if(i == 0) {return 'legend--box'} else{ return 'legend--icon'}})
            .style('background-color', function (d) {
                return d.colour
            })

        legenditem.append('div')
            .append('p').attr('class', 'legend--text').html(function (d) {
                return d.key
            })

      maxweek = d3.max(graphic_data, function (d) { return d.date })

      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      categorySort = {}
      if (Array.isArray(dvc.essential.categorySort)) {
        for (i = 0; i < dvc.essential.categorySort.length; i++) {
          categorySort[dvc.essential.categorySort[i]] = i;
        }

        graphic_data.sort(function (a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories = Object.keys(categorySort)
      } else if (dvc.essential.categorySort == "descending") {
        //auto sort the array by biggest value
        graphic_data.filter(function (d) {
          return d.date == maxweek
        }).sort(function (a, b) { return +b.chiffre - (+a.chiffre) }).forEach(function (item, i) {
          categorySort[item.category] = i
        });

        graphic_data.sort(function (a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories = Object.keys(categorySort)
      } else if (dvc.essential.categorySort == "ascending") {
        graphic_data.filter(function (d) {
          return d.date == maxweek
        }).sort(function (a, b) { return +a.chiffre - (+b.chiffre) }).forEach(function (item, i) {
          categorySort[item.category] = i
        });

        graphic_data.sort(function (a, b) {
          return categorySort[a.category] - categorySort[b.category]
        })

        categories = Object.keys(categorySort)

      }


      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) / dvc.optional.chart_every[size] - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();
      // legend.selectAll("*").remove();

      //draw legend
      // legend.append('svg').attr("height", dvc.optional.legendHeight[size]).attr("width", dvc.optional.chart_every[size] * (chart_width + margin.left + margin.right)).append('g')
      //   .attr('transform', 'translate(5,5)')
      //
      // createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        dvc.essential.colour_palette.map(function (d) {
          return d.key
        }).forEach(function (d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").select('svg').append("g")

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", dvc.essential.colour_palette[i].colour)
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", function () { if (i == 0) { return 15 } else { return 20 } })
            .attr("height", function () { if (i == 0) { return 15 } else { return 3 } })


          if (size !== "sm") {
            var_group.append("text")
              .text(dvc.essential.colour_palette[i].key)
              .attr("class", "legend" + i)
              .attr("text-anchor", "start")
              .style("font-size", "12px")
              .style("fill", "#666")
              .attr('y', 15)
              .attr('x', 0);

            // maybe attach the next bit of text here
            // and the next, all with different fomatting

          } else {
            var_group.append("text")
              .text(dvc.essential.colour_palette[i].smallkey)
              .attr("class", "legend" + i)
              .attr("text-anchor", "start")
              .style("font-size", "12px")
              .style("fill", "#666")
              .attr('y', 15)
              .attr('x', 0);
          }

          d3.selectAll(".legend" + (i))
            .each(calcPosition);

          function calcPosition() {


            var BBox = this.getBBox()


            //prevY =BBox.width
            d3.select(".legend" + (i))
              .attr("y", function (d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function (d) {
                return prevX + 25;
              })


            d3.select(".rect" + (i))
              .attr("y", function (d) {

                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }

                if (dvc.essential.colour_palette[i].legendstyle == "rect") {
                  return eval((lineNo * 20) + 5);

                } else {

                  return eval((lineNo * 20) + 12); // was 20+14

                }
              })
              .attr("x", function (d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50



          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()

      x = d3.scaleTime()
        .range([0, chart_width]);

      x.domain(d3.extent(graphic_data, function (d) {
        return d.date
      }))

      dates = d3.map(graphic_data, function (d) { return d.date }).keys()


      var xAxis = d3.axisBottom(x)
        .tickValues(d3.map(graphic_data, function (d) { return d.date }).keys()
          .map(function (d) { return d3.timeParse("%a %b %d %Y")(d.match(/\b[\w']+(?:[^\w\n]+[\w']+){1,3}\b/g)[0]) })
          .sort(function (a, b) { return a - b })
          .filter(function (d, i) {
            return i % dvc.optional.x_ticks_every[size] === 0 && i < dates.length - dvc.optional.x_ticks_every[size] || i == dates.length - 1 //Rob's fussy comment about labelling the last date
          }))
        .tickFormat(d3.timeFormat("%m/%y"))

      // add another line

      line7 = d3.line()
        .defined(function (d) { return d.chiffre7 != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre7)
        })

      // add another line

      line6 = d3.line()
        .defined(function (d) { return d.chiffre6 != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre6)
        })

              // add another line

      line5 = d3.line()
        .defined(function (d) { return d.chiffre5 != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre5)
        })

      // add another line

      line4 = d3.line()
        .defined(function (d) { return d.chiffre4 != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre4)
        })


      // add another line

      line3 = d3.line()
        .defined(function (d) { return d.chiffre3 != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre3)
        })

      // add another line

      line2 = d3.line()
        .defined(function (d) { return d.chiffre2 != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre2)
        })


      // add a line
      line = d3.line()
        .defined(function (d) { return d.chiffre != "null" })
        .x(function (d) {
          return x(d.date)
        })
        .y(function (d) {
          return y[d.category](d.chiffre)
        })






      var area = d3.area()
        .defined(function (d) { return d.chiffre != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max);
        })
        .y0(function (d) {
          return y[d.category](d.min);
        });

      // add area 2
      var area2 = d3.area()
        .defined(function (d) { return d.chiffre2 != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max2);
        })
        .y0(function (d) {
          return y[d.category](d.min2);
        });

      // // add area 3
      var area3 = d3.area()
        .defined(function (d) { return d.chiffre3 != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max3);
        })
        .y0(function (d) {
          return y[d.category](d.min3);
        });

      // // add area 4
      var area4 = d3.area()
        .defined(function (d) { return d.chiffre4 != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max4);
        })
        .y0(function (d) {
          return y[d.category](d.min4);
        });

      // // add area 5
      var area5 = d3.area()
        .defined(function (d) { return d.chiffre5 != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max5);
        })
        .y0(function (d) {
          return y[d.category](d.min5);
        });

              // // add area 6
      var area6 = d3.area()
        .defined(function (d) { return d.chiffre6 != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max6);
        })
        .y0(function (d) {
          return y[d.category](d.min6);
        });

                      // // add area 7
      var area7 = d3.area()
        .defined(function (d) { return d.chiffre7 != "null" })
        .curve(d3.curveLinear)
        .x(function (d) {
          return x(d.date);
        })
        .y1(function (d) {
          return y[d.category](d.max7);
        })
        .y0(function (d) {
          return y[d.category](d.min7);
        });

      nested = d3.nest()
        .key(function (d) {
          return d.category
        })
        .key(function (d) {
          return d.series
        })
        .sortValues(function (a, b) { return a.date - b.date; })
        .entries(graphic_data)

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      y = {}

      if (dvc.essential.yAxisScale == "auto_zero_max_total") {
        var yDomain = [0, 0.12];
        // var yDomain = [0, d3.max(graphic_data, function(d) {
        //   return +d.max
        // })];
        nested.forEach(function (item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.yAxisScale == "auto_min_max_total") {
        var yDomain = d3.extent(graphic_data, function (d) {
          return +d.chiffre
        });
        nested.forEach(function (item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.yAxisScale == "auto_min_max_each") {
        rolledup = d3.nest()
          .key(function (d) {
            return d.category
          })
          .rollup(function (v) {
            return [d3.min(v, function (d) {
              return +d.chiffre
            }), d3.max(v, function (d) {
              return +d.chiffre
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function (item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(item.value)
            .nice();
        });

      } else if (dvc.essential.yAxisScale == "auto_zero_max_each") {
        rolledup = d3.nest()
          .key(function (d) {
            return d.category
          })
          .rollup(function (v) {
            return [0, d3.max(v, function (d) {
              return +d.chiffre
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function (item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(item.value)
            .nice();
        });

      }

      // sort these hardwired numbers maybe through the dimensions above
      charts = d3.select('#graphic')
        .selectAll('svg')
        .data(nested)
        .enter()
        .append('svg')
        .attr("id", function (d, i) { return "svg" + i })
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 12)
        .text(function (d) {
          return d.key
        })
        .attr('font-weight', 700)
        .attr('font-size', "14px")
        .attr("fill", "#666")


      svg = charts
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      svg
        .append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0," + height + ")")
        .call(xAxis)
        .each(function (d, i) {
          if (i % dvc.optional.chart_every[size] == dvc.optional.chart_every[size] - 1 || i == nested.length - 1) {
            d3.select(this).append("text")
              .text(dvc.essential.xAxisLabel)
              .attr("transform", "translate(" + chart_width + "," + (margin.bottom - 5) + ")")
              .attr('text-anchor', 'end')
              .attr('fill', "#666");
          }
        })

      //create svg for chart

      drawyaxis = svg
        .append('g')
        .attr('class', 'y axis')
        .each(function (d, i) {
          if (i % dvc.optional.chart_every[size] == 0) {
            d3.select(this).append("text")
              .text(dvc.essential.yAxisLabel)
              .attr("transform", "translate(" + (10 - margin.left) + "," + (-10) + ")")
              .attr('text-anchor', 'start')
              .attr('fill', "#666");
          }
        })

      drawyaxis.each(function (d, i) {
        if (i % dvc.optional.chart_every[size] == 0) {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickFormat(function (d) { return d3.format(".2f")(d)*100 }).ticks(4));
        } else {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickFormat("").ticks(4))
        }

      })

      svg
        .selectAll('g.area')
        .data(function (d) {
          return d.values;
        }).enter()
        .append('path')
        .attr("d", function (d) {
          return area(d.values)
        })
        .attr('class', "area")
        .attr("fill", dvc.essential.colour_palette[1].colour)
        .attr("opacity", dvc.essential.areaOpacity)

      svg
        .selectAll('g.area2')
        .data(function (d) {
          return d.values;
        }).enter()
        .append('path')
        .attr("d", function (d) {
          return area2(d.values)
        })
        .attr('class', "area2")
        .attr("fill", dvc.essential.colour_palette[2].colour)
        .attr("opacity", dvc.essential.areaOpacity)

      svg
        .selectAll('g.area3')
        .data(function (d) {
          return d.values;
        }).enter()
        .append('path')
        .attr("d", function (d) {
          return area3(d.values)
        })
        .attr('class', "area3")
        .attr("fill", dvc.essential.colour_palette[3].colour)
        .attr("opacity", dvc.essential.areaOpacity)

      svg
        .selectAll('g.area4')
        .data(function (d) {
          return d.values;
        }).enter()
        .append('path')
        .attr("d", function (d) {
          return area4(d.values)
        })
        .attr('class', "area4")
        .attr("fill", dvc.essential.colour_palette[4].colour)
        .attr("opacity", dvc.essential.areaOpacity)

        svg
        .selectAll('g.area5')
        .data(function (d) {
          return d.values;
        }).enter()
        .append('path')
        .attr("d", function (d) {
          return area5(d.values)
        })
        .attr('class', "area5")
        .attr("fill", dvc.essential.colour_palette[5].colour)
        .attr("opacity", dvc.essential.areaOpacity)

        svg

      function wrap(text, width) {
        text.each(function () {
          var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x")
          dy = 0,
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];

        });
