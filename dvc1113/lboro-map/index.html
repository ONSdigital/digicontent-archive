    body {
		margin:0;
		padding:0;
		font-family: 'Open Sans', sans-serif;

		max-width:950px;
		margin: 0px auto;
		display:block;
	}

	#header{
		height:70px;
		width:100%
	}

	.mapboxgl-ctrl-group .mapboxgl-ctrl-compass {
		display: none;
	}


  .playbackcontrols {
    font-size: 27px;
  }

  .playbackcontrols div {
      display: inline;
  }

  .playbackcontrols div button {
    vertical-align: top;
    margin-top: 2px;
  }


  #selectnav:before{
      width: 46px;
      position: absolute;
      top: 1px;
      right: 1px;
      bottom: 1px;
      background: #206095;
      content: '';
      pointer-events: none;
    }

    #selectnav:after{
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      right: 14px;
      bottom: 0;
      margin: auto;
      border-style: solid;
      border-width: 9px 10px 0 10px;
      border-color: #ffffff transparent transparent transparent;
      pointer-events: none;
    }

    #selectNav {
      position:relative;
      left:4px;
      width: calc(100% - 8px);
    }

    @media (min-width: 600px) {
      #map {
        height: 500px;
      }

      #horiz {
        display: none;
      }

      #selectnav {
        display: none;
      }

      #controls {
        padding-top: 35px;
        margin-left: 20px;
      }

      #currVal {
        font-size: 12px;
      }
    }


	@media (min-width: 599px) {
		#map {
			height: 500px;
			width: 100%;
		}

		#selectNav {
			position:absolute;
			top:0px;
			left:0px;
			width:25%;
			height:40px;
			background-color:rgba(0,0,0,0.8);
			z-index:1;
		}

		#keydiv {
			position:absolute;
			top:40px;
			left:0px;
			width:25%;
			/* height:80px; */
			background-color:rgba(255,255,255,0.8);
			z-index:1;
      color: #323132;
      border-bottom-right-radius: 25px;
		}

		#currVal {
			font-size:14px;

		}
	}

	@media (max-width: 600px) {


    #map {

			height: 350px;
			width: 100%;
			overflow:visible;
		}

    #legend{
      flex-direction: column;
    }
	}

      #map:focus{
        outline:none;
        box-shadow: 0 0 0 3px orange;
      }

      h6 {
          font-size: 14px;
          font-weight: 700;
          margin: 16px 0 0 0;
          color:#323132!important;
      }

     a {
         text-decoration: underline;
         color: #206095;
         word-wrap: break-word;
     }

      .slider text{
        font-size: 18px;
      }

      #slider-simple text{
        font-size: 18px;
      }

      div#slider-simple g.tick text{
        fill:#414042;
      }

      div#slider-simple g.tick line{
        stroke:#414042;
      }

      .parameter-value path{
        fill:#0F8243;
        stroke:white;
        stroke-width:1.5px;
      }
      .parameter-value path:focus{
        fill:#0F8243;
        stroke:orange;
        stroke-width:3px;
      }

      .legend{
        min-width:15px;
        height:15px;
        border-radius:50%;
        margin-top:4px;
        margin-right:5px;
      }

      .item {
        display:flex;
        flex-direction: row;
        margin-right:10px;
      }

      #legend{
        display:flex;
      }

      #halls{
        background-color: #A8BD3A;
      }

      #private{
        background-color: #206095;
      }

      #nhs{
        background-color: gray
      }

      #legend p {
        font-size:18px;
        color: #313032;
      }
