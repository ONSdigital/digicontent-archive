		function backStepBtn(){
				dvc.timeIndex--;
				updateChart();

		}
		
		function forwardStepBtn(){
				dvc.timeIndex++;
				updateChart();	
		}
		
		
		
		
		function PlayPauseBtn (){
			if (dvc.bAnimate==true){
				dvc.bAnimate=false;	
				dvc.play=false;	
				
				d3.select("#playPauseBtn")
					.select("span")
					.attr("class", "glyphicon glyphicon-play")
					
				d3.select("#playPauseBtn")
					.select("text")
					.text(" play")
					
				$('#backStepBtn').prop('disabled', false);
				$('#forwardStepBtn').prop('disabled', false);	
				
				clearInterval(dvc.theInterval);
							
			} else {
				dvc.bAnimate=true;
				dvc.play=true;	
					
				d3.select("#playPauseBtn")
					.select("span")
					.attr("class", "glyphicon glyphicon-pause")
				
				d3.select("#playPauseBtn")
					.select("text")
					.text("pause")
			}	
			playPauseAnimation()
		}
		
		function playPauseAnimation(){
			if (dvc.play==true) {	
				$('#backStepBtn').prop('disabled', true);
				$('#forwardStepBtn').prop('disabled', true);		
					
				//start animation
				dvc.theInterval=setInterval("updateChart()",1000);	
							
			 } 			
		}
		
		
	function annotationCreation(){
			//create line breaks for annotation
			counter++;
			if (counter == dvc.essential.fact.length + 1) counter = 1;
			
			var insertLinebreaks = function () {
				
											var el1 = this.firstChild;
											var el = el1.data;
										
											var words = el.split('  ');
												
											d3.select(this).text('');
										
												for (var i = 0; i < words.length; i++) {
													var tspan = d3.select(this).append('tspan').text(words[i]);
													if (i > 0)
														tspan.attr('x', x(40000/*dvc.essential.annoX[dvc.timeIndex]*/)).attr('dy', '26');
												}
											};
				
			if (graphicWidth > threshold_sm) {
				
				d3.select('#graphic').select("g").append("text")
					.text(dvc.essential.fact[counter-1])
					.attr("class", "fact")
					//.attr("text-anchor", "middle")
					.attr('y',y(50))  //(dvc.essential.annoY[dvc.timeIndex])+10)
					.attr('x',x(40000));  //(dvc.essential.annoX[dvc.timeIndex]));
				
				d3.selectAll(".fact").each(insertLinebreaks);
			} else {
				d3.select("#keypoints").append("p").text(dvc.essential.fact[counter-1]);
			}
			
	}//end of annotationCreation

		function updateChart(){

				.enter();

				.selectAll("rect")
				.transition()
				.duration(1000)

				.attr("height", function(d) { return 2/* + Math.abs(y(d.amt) - y(0));*/ });

				if(dvc.timeIndex==0||dvc.timeIndex==1){
