            <!-- Text labels desktop-->

            <text class="headingTop" x="128.88" y="83.65">Some important events a centenarian has lived through</text>

            <g>
                <text class="headingDateR" x="236" y="174">1921</text>
                <text class="headingAgeR" x="290" y="174">– Birth</text>
                <text class="infotextR" x="236" y="200">Recovering country post World War 1 with a post-war increase</text>
                <text class="infotextR" x="236" y="225">in births</text>
            </g>

            <g style="transform: translate(0, 102px);">
                <text class="headingDateR" x="236" y="174">1928</text>
                <text class="headingAgeR" x="290" y="174">– 7 years old</text>
                <text class="infotextR" x="236" y="200">Women receive right to vote on same terms as men</text>
            </g>

            <g style="transform: translate(0, 184px);">
                <text class="headingDateR" x="236" y="174">1929</text>
                <text class="headingAgeR" x="290" y="174">– 8 years old</text>
                <text class="infotextR" x="236" y="200">Wall Street crash in America sparks the Great Depression</text>
            </g>

            <g style="transform: translate(0, 265px);">
                <text class="headingDateR" x="236" y="174">1939</text>
                <text class="headingAgeR" x="290" y="174">– 18 years old</text>
                <text class="infotextR" x="236" y="200">British entry to World War 2</text>
            </g>

            <g style="transform: translate(0, 346px);">
                <text class="headingDateR" x="236" y="174">1945</text>
                <text class="headingAgeR" x="290" y="174">– 24 years old</text>
                <text class="infotextR" x="236" y="200">World War 2 ends</text>
            </g>

            <g style="transform: translate(0, 429px);">
                <text class="headingDateR" x="236" y="174">1948</text>
                <text class="headingAgeR" x="290" y="174">– 27 years old</text>
                <text class="infotextR" x="236" y="200">British Rail and NHS established</text>
            </g>

            <g style="transform: translate(0, 511px);">
                <text class="headingDateR" x="236" y="174">1955</text>
                <text class="headingAgeR" x="290" y="174">– 34 years old</text>
                <text class="infotextR" x="236" y="200">Commercial television starts</text>
            </g>

            <g style="transform: translate(0, 592px);">
                <text class="headingDateR" x="236" y="174">1960</text>
                <text class="headingAgeR" x="290" y="174">– 39 years old</text>
                <text class="infotextR" x="236" y="200">Birth control pill becomes commercially available</text>
            </g>

            <g style="transform: translate(0, 674px);">
                <text class="headingDateR" x="236" y="174">1967</text>
                <text class="headingAgeR" x="290" y="174">– 46 years old</text>
                <text class="infotextR" x="236" y="200">Homosexuality and abortion legalised</text>
            </g>

            <g style="transform: translate(0, 756px);">
                <text class="headingDateR" x="236" y="174">1971</text>
                <text class="headingAgeR" x="290" y="174">– 50 years old</text>
                <text class="infotextR" x="236" y="200">UK introduces decimalised currency</text>
            </g>

            <g style="transform: translate(0, 840px);">
                <text class="headingDateR" x="236" y="174">1992</text>
                <text class="headingAgeR" x="290" y="174">– 71 years old</text>
                <text class="infotextR" x="236" y="200">UK’s first commercial internet provider began providing</text>
                <text class="infotextR" x="236" y="225">dial-up internet access</text>
            </g>

            <g style="transform: translate(0, 943px);">
                <text class="headingDateR" x="236" y="174">2000</text>
                <text class="headingAgeR" x="290" y="174">– 79 years old</text>
                <text class="infotextR" x="236" y="200">New millennium</text>
            </g>

            <g style="transform: translate(0, 1023px);">
                <text class="headingDateR" x="236" y="174">2013</text>
                <text class="headingAgeR" x="290" y="174">– 92 years old</text>
                <text class="infotextR" x="236" y="200">Same-sex marriage legalised</text>
            </g>

            <g style="transform: translate(0, 1102px);">
                <text class="headingDateR" x="236" y="174">2016</text>
                <text class="headingAgeR" x="290" y="174">– 95 years old</text>
                <text class="infotextR" x="236" y="200">UK votes to leave the EU</text>
            </g>

            <g style="transform: translate(0, 1185px);">
                <text class="headingDateR" x="236" y="174">2020</text>
                <text class="headingAgeR" x="290" y="174">– 99 years old</text>
                <text class="infotextR" x="236" y="200">Coronavirus (COVID-19) pandemic</text>
            </g>


        </svg>
