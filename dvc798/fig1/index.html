          var yDomain = [
            0, Math.ceil(d3.max(graphicfiltered, function(d) { return d.total; }))
          ];

        y.domain(yDomain);

          .call(xAxis)
          .append("text")
		  .attr("class","xAxisLabel")
          .attr("x", 0)
          .attr("y", 45)
          .attr("dy", ".71em")
          .style("text-anchor", "start")
          .text(function(){return dvc.essential.xAxisLabel});

        svg.append('g')
          .attr('class', 'y axis')
          .attr('transform', function(){if(k%nocols) {return 'translate(0,0)'} else {return 'translate(20,0)'}})
          .call(yAxis.tickSize(-chart_width, 0, 0))
          .append("text")
          .attr("x", -15)
          .attr("y", -25)
          .attr("dy", ".71em")
          .style("text-anchor", "start")
          .text(dvc.essential.yAxisLabel);


        var group = svg.append("g")

            .attr("x2",x(d3.timeParse(dvc.essential.dateFormat)("23/03/2020")) + x.bandwidth()/2)
            .attr("y1",y(50))
            .attr("y2",y(-100))
            .attr("stroke","black")
            .attr("stroke-width","1px");

        group.selectAll("rect")
            .data(graphicfiltered)
            .enter().append("rect")
              .attr("width", x.bandwidth())
              .attr("x", function(d) {return x(d.group); })
              .attr("y", function(d) {if(d.prop > 0){return y(d.prop)} else {return y(0)} })
              .attr("height", function(d) {if(d.prop > 0) {return y(0) - y(d.prop); } else {return y(d.prop) - y(0)}})
              .style("opacity", 0.85);




	  if(k%nocols) {} else {d3.selectAll(".bars" + k).attr("transform","translate(" + margin.left + ",0)")}
	  if(k%nocols) {} else {d3.selectAll(".bars" + k).attr("transform","translate(" + margin.left + ",0)")}

	  //if(k%nocols) {} else {d3.selectAll(".axis" + k).attr("transform","translate(" + margin.left + ",0)")}
      if(k%nocols) {svg.select(".y").selectAll("text").remove()};
