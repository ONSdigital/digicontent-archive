  <script>

var pymChild = null;
var graphic = d3.select('#graphic');
var keypoints = d3.select('#keypoints');
var footer = d3.select("#footer");
var dvc = {};
var xpos;
var ypos;
var makeAnnotations;

function drawGraphic(){

  // initialise breakpoint for medium and small screens
  var threshold_md = 700;
  var threshold_sm = dvc.optional.mobileBreakpoint;

  //set variables for chart dimensions dependent on width of #graphic
  if (parseInt(graphic.style("width"))  < threshold_sm) {
      // set mobile size margins, height and width
      var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]};
      var chart_width = parseInt(graphic.style("width") ) - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]);
  } else if (parseInt(graphic.style("width"))  < threshold_md) {
      // set medium size margins, height and width
      var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]};
      var chart_width = parseInt(graphic.style("width") ) - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]);
  } else {
      // set large size margins, height and width
      var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
      var chart_width = parseInt(graphic.style("width") ) - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]);

  } // end else ...

  // clear out existing graphics
		graphic.selectAll("*").remove();
		keypoints.selectAll("*").remove();
		footer.selectAll("*").remove();

  // parse data into columns
  dots = {};

  // for each 'column' in data object
  for (var column in graphic_data[0]) {
    // dots object with content from graphic_data
    dots[column] = graphic_data.map(function(d,i) {
      // return object variables to use in code. This needs to be updated in accordance with field content of files
      return {
        'group' : d.group,
        'name' : d.name,
        'GDHI' : +d[dvc.essential.pickxdata],
        'ULEV' : +d[dvc.essential.pickydata]
        // 'GDHI_label': +d[dvc.essential.pickzdata]
      };

    });
  }

//reformat the data for the voronoi
  var makingdata = [];
  makingdata.push(makedata());
  function makedata(){
      var data=[];
      for(var i=0;i<graphic_data.length;i++)
      {
      data.push([graphic_data[i][dvc.essential.pickxdata],graphic_data[i][dvc.essential.pickydata],graphic_data[i][dvc.essential.pickzdata]]);
      }
    return data;
  }

  selectlist();
  selectlistLA();

  if(dvc.essential.AxisScale == "auto_min_max"){
  var minX = d3.min(d3.entries(dots), function(c) {
                      return d3.min(c.value, function(v) {
                        var n = v.GDHI;
                        return Math.floor(n);
                      });
                    })
  var maxX = d3.max(d3.entries(dots), function(c) {
                      return d3.max(c.value, function(v) {
                        var n = v.GDHI;
                        return Math.ceil(n);
                      });
                    });
  var minY = d3.min(d3.entries(dots), function(c) {
                      return d3.min(c.value, function(v) {
                        var n = v.ULEV;
                        return Math.floor(n);
                      });
                    })
  var maxY = d3.max(d3.entries(dots), function(c) {
                      return d3.max(c.value, function(v) {
                        var n = v.ULEV;
                        return Math.ceil(n);
                      });
                    })
  }else{
    var minX = dvc.essential.xAxisScale[0];
    var maxX = dvc.essential.xAxisScale[1];
    var minY = dvc.essential.yAxisScale[0];
    var maxY = dvc.essential.yAxisScale[1];
  }



  var ratio =  height / chart_width;

  var group = d3.map(graphic_data, function(d){return d.group;}).keys();

   x = d3.scaleLinear()
                 .range([0, chart_width])
                 .domain([minX, maxX]);

   y = d3.scaleLinear()
                 .range([height, 0])
                 .domain([minY, maxY]);


  var line = d3.line()
     .x(function(d) { return x(d[0]); })
     .y(function(d) { return y(d[1]); });


  var xAxis = d3.axisBottom(x).tickFormat(function(d){return d}),
      yAxis = d3.axisLeft(y).tickFormat(function(d){return d});

  var colourScale = d3.scaleOrdinal().domain(group).range(dvc.essential.colour_palette);


//specify number or ticks on y axis
if (parseInt(graphic.style("width") ) <= threshold_sm) {
  yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
 } else if (parseInt(graphic.style("width") ) <= threshold_md){
  yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
 } else {
  yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
 }

 //specify number or ticks on y axis
if (parseInt(graphic.style("width") ) <= threshold_sm) {
  xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
 } else if (parseInt(graphic.style("width") ) <= threshold_md){
  xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
 } else {
  xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
 }

  //  outlierButton(x);


      var svg = d3.select('#graphic').append('svg')
                  .attr('width', chart_width + margin.left + margin.right)
                  .attr('height', height + margin.top + margin.bottom)
                  .append("g")
                  .attr("id", "legend");

      var g = svg.append('g')
        .attr('transform', 'translate(' + margin.left + ', ' + (margin.top) + ')')
        .attr('overflow', 'hidden');




      g.append('g')
         .attr('class', 'x-axis')
         .attr('transform', 'translate(0, ' + height + ')')
         .call(xAxis)
         .append('text')
           .attr('x', chart_width)
           .attr('dy', '2.5em')
           .attr('text-anchor', 'end')
           .attr('fill', 'rgb(54, 54, 54)')
           .attr('font-size', '1.2em')
           .text(function(d,i){return dvc.essential.xAxisLabel});

      g.append('g')
         .attr('class', 'y-axis')
         .call(yAxis)
         .append('text')
             .attr('y', 10)
             .attr('dy', '-2em')
             .attr('dx','-3em')
             .attr('text-anchor', 'start')
             .attr('fill', 'rgb(54, 54, 54)')
             .attr('font-size', '1.2em')
             .text(function(d,i){return dvc.essential.yAxisLabel})

        var main = g.append('g')
         .attr('class', 'main')

         dvc.optional.annotateLineX1_Y1_X2_Y2.forEach(function(d,i) {
           main.append('path')
              .datum(dvc.optional.annotateLineX1_Y1_X2_Y2[i])
              .attr('d', line)
              .attr('stroke', dvc.optional.lineColor_opcty[i][0])
              .attr('stroke-width', 2)
              .attr('stroke-opacity',dvc.optional.lineColor_opcty[i][1])
              .attr('fill', 'none')
              .attr('class', 'line');
            })

         main.selectAll('.circles').data(graphic_data).enter().append('circle')
            .attr( "class" , function(d,i){ return "circles " + d.group; })
            .attr( "id" , function (d,i){ return "circle" +  i; })
            .attr( "cx" , function(d) { return x(d[dvc.essential.pickxdata]); })
    				.attr( "cy" , function(d) { return y(d[dvc.essential.pickydata]); })
            .attr('r', 4)
            // .attr('fill', function(d){return colourScale(d.group)})
            .attr('fill',dvc.essential.colour_palette[0])
            // .attr('stroke', "red")
            // .attr('stroke-width', 1)
            .attr('class', 'circles');


      var arrowpoints = [{"x": 66500, "y": 2.34},
                         {"x": 66500, "y": 2.42},
                         {"x": 67500, "y": 2.38}]

      var arrowpoints_coord = []


        main.selectAll("polygon")
        .data([arrowpoints])
        .enter()
          .append('polygon')
          .attr('class','arrowhead')
          .attr("points",function(d) {
              return d.map(function(d) {
                  return [x(d.x),y(d.y)].join(" ");
                }).join(",");
            });

        main.append('line')
          .attr('class','arrowline')
          .attr('x1', x(65500))
          .attr('x2', x(66500))
          .attr('y1', y(2.38))
          .attr('y2', y(2.38))


        if( parseInt(graphic.style("width")) >= dvc.optional.mobileBreakpoint ){
          main.append('text')
            .attr('class','annotation-note-label')
            .attr('id','annotation')
            .text("GDHI for Kensington & Chelsea is beyond the chart scale")
            .style('font-size','10px')
            .attr('x',x(64500))
            .attr('y',y(2.4))
            .call(wrap,50)
            .each(calcAnnoBox)
          }

            function calcAnnoBox(){
              var BBox = this.getBBox()
              d3.selectAll("#annotation")
                .attr('transform','translate(0,'+-BBox.height+')')
            }



          //create link to source
          d3.select('#graphic').select('svg')
                .append("g")
                .attr("id", "source")
                .append("text")
                .attr("text-anchor", "start")
                .style("font-size", "14px")
                .style("font-weight",700)
                .style("fill", "#323132;")
                .attr('y',height + margin.top + margin.bottom+40)
                .attr('x',0)
                .text("Source: "+dvc.essential.sourceText)
                .call(wrap,parseInt(graphic.style("width")))
                // .append("a")
                // .style("fill", "#4774CC")  // it ignored the css !!
                // .attr("xlink:href", dvc.essential.sourceURL)
                // .attr("target", "_blank")
                // .text();

          // make rectangle annotations
          dvc.essential.rectannotations.forEach(function(d,i) {
                   main.append('rect')
                    .datum(dvc.essential.rectannotations[i])
                    .attr("x",x(d.x))
                    .attr("y",y(d.y))
                    .attr("width",Math.abs(x(dvc.essential.rectannotations[i].width)-x(0)))
                    .attr("height",Math.abs(y(dvc.essential.rectannotations[i].height)-y(0)))
                    .attr('class','rect')
                    .attr("fill",d.colour)
                    .attr("opacity",d.opacity);
                })

          // make written annotations
          dvc.essential.textAnnotations.forEach(function(d,i) {
                   main.append('text')
                    .datum(dvc.essential.textAnnotations[i])
                    .attr("x",x(d.x))
                    .attr("y",y(d.y))
                    .attr("class","annotext")
                    .text(d.text)
                    .call(wrap,dvc.essential.textAnnotationWrap);
                  })


//d3-annotations tooltips(from https://bl.ocks.org/Fil/17fc857c3ce36bf8e21ddefab8bc9af4/167bce6e2b706016004a3baf14f838203646a27a)

      // create a container for tooltips
      tipg = svg.append("g")
        .attr("class", "annotation-tip");

      // this function will call d3.annotation when a tooltip has to be drawn
        function tip (d) {
          annotationtip = d3.annotation()
          .type(d3.annotationCalloutCircle)
          .annotations([d].map( function(d){
            return {
              data: {x:d.data[0],y:d.data[1]},
              dx: (d[0] > chart_width/2) ? -50 : 50,
              dy: (d[1] > height/2) ? -50 : 50,
              note: {
                 title: graphic_data[d.index].name+" - "+graphic_data[d.index].group || "??",
                 label: dvc.essential.xAxisLabel+": "+d.data[2]+", "+dvc.essential.yAxisLabel+": "+d.data[1]+"",
                 wrap:dvc.essential.d3AnnotationWrap,
                 bgPadding: {top:4,right:3,left:3,bottom:-5},
              },
              subject: {
                radius: 4,
                radiusPadding: 0,
              },

            };
          }))
          .accessors({ x: function(d){return x(d.x)+margin.left}, y: function(d){return y(d.y)+margin.top}})
          tipg.call(annotationtip);

          d3.select("rect.annotation-note-bg").attr("fill","#eee").attr("fill-opacity",1).attr("opacity",0.9).attr("rx",5).attr("ry",5).attr("stroke","#eee").attr("stroke-width","10px");
          d3.select(".annotation-note-label").attr("fill","#666");
          d3.select(".annotation-note-title").attr("fill","#666");

        }

      //voronoi
      var vorData = d3.merge(makingdata);

      var voronoi = d3.voronoi()
          .x(function(d) {return x(d[0]); })
          .y(function(d) {return y(d[1]); })
          .size([chart_width, height])(vorData);

      var voronoiRadius = chart_width;

      //focus
      var focus = g.append('g').style('display', 'none');

      focus.append('line')
          .attr('id', 'focusLineX')
          .attr('class', 'focusLine');

      focus.append('line')
          .attr('id', 'focusLineY')
          .attr('class', 'focusLine');
      focus.append('circle')
          .attr('id', 'focusCircle')
          .attr('r', 4)
          .attr('class', 'circle focusCircle');

      if ( parseInt(graphic.style("width")) > dvc.optional.mobileBreakpoint ) {

      svg.append('rect')
          .attr('transform', 'translate(' + margin.left + ', ' + margin.top + ')')
          .attr("class","overlay")
          .attr("width",chart_width + margin.right)
          .attr("height",height)
          .attr("opacity",0)
          .on('mouseover', function() { focus.style('display', null); })
          .on('mouseout', function() { focus.style('display', 'none'); tipg.selectAll("g").remove(); })
          .on('mousemove', function() {

              //var [mx, my] = d3.mouse(this); ES6 version
              var mx = d3.mouse(this)[0], my = d3.mouse(this)[1]


              // use the new diagram.find() function to find the Voronoi site
              // closest to the mouse, limited by max distance voronoiRadius
              var site = voronoi.find(mx, my, voronoiRadius);

              tip(site);//tooltip stuff
              var xpos = site[0];
              var ypos = site[1];

              focus.select('#focusCircle')
                  .attr('cx', xpos)
                  .attr('cy', ypos);
            if (xpos < x(60000)){
              focus.select('#focusLineX')
                  .attr('x1', xpos).attr('y1', y(y.domain()[0]))
                  .attr('x2', xpos).attr('y2', ypos)
                  .attr('opacity',1)
                }
            else{
              focus.select('#focusLineX')
                .attr('opacity',0)
            }
              focus.select('#focusLineY')
                  .attr('x1', x(x.domain()[0])).attr('y1', ypos)
                  .attr('x2', xpos).attr('y2', ypos);
          })

}//end if wider than mobileBreakpoint then do stuff


      // createLegend();

    function selectlist() {

      var areanames = d3.map(graphic_data, function(d){return d.name;}).keys();
      var regionnames = d3.map(graphic_data, function(d){return d.group;}).keys();
      var menuarea = d3.zip(regionnames).sort(function(a) {
        return d3.ascending(a);
      });

      //hide area dropdown to screen reader if on mobile
      // if(mobile==true){
      //   d3.select("selectNav").attr('aria-hidden',true)
      // }

      var optns = d3.select("#graphic").append("div").attr("id", "sel").append("select")
        .attr("id", "areaselect")
        .attr("style", "width:100%")
        .attr("class", "chosen-select")
        // .attr('transform','translate('+-height+',0)')
        // .attr('width',chart_width/2)

      optns.append("option")

      optns.selectAll("p").data(menuarea).enter().append("option")
        .attr("value", function(d) {
          return d[0]
        })
        .text(function(d) {
          return d[0]
        });

        myId = null;

        $('#areaselect').chosen({
          placeholder_text_single: "Select a Region",
          allow_single_deselect: true
        })
        //
        d3.select('input.chosen-search-input').attr('id','chosensearchinput')

        $('#areaselect').on('change', function() {

          if ($('#areaselect').val() != "") {
            regionname = $('#areaselect').val()
              updateChart(regionname);
           }
        if ($('#areaselect').val() == "") {
          resetChart();
        }
        });

      }; //end of function selectlist

      function selectlistLA() {
        var dropcodes = graphic_data.map(function(d, i) {
          return "id" + i;
        });
        var dropnames = graphic_data.map(function(d) {
          return d.name;
        });
        var menuarea = d3.zip(dropnames, dropcodes).sort(function(a, b) {
          return d3.ascending(a[0], b[0]);
        });
        //menuarea.shift();
        //menuarea.shift();

        //clear dropdown
        // d3.select("#sel").selectAll("*").remove()
        d3.selectAll(".circles").style("opacity", "1")
        // Build option menu for occupations
        var optns = d3.select("#graphic").append("div").attr("id", "sel")
          .append("select")
          .attr("id", "dropselect")
          .attr("style", "width:300px")
          .attr("class", "chosen-select")
          // .text("Select a Local Authority")

        optns.append("option")
        // .attr("value","first")
        // .text("Select a Local Authority")
        optns.selectAll("p").data(menuarea).enter().append("option")
          .attr("value", function(d) {
            return d[1]
          })
          .attr("id", function(d) {
            return d[1]
          })
          .text(function(d) {
            return d[0]
          });

        myId = null;



        $('#dropselect').chosen({
          width: "98%",
          allow_single_deselect: true,
          placeholder_text_single: "Select a Local Authority"
        }).on('change', function(evt, params) {

          if ($('#dropselect').val() != "") {
            //if(typeof params != 'undefined') {
            clicked = true;
            d3.select(".overlay").style("pointer-events", "none");
            d3.selectAll(".focusCircle2").classed("focusCircle2", false);

            dropcode = $('#dropselect').val();
            dropcode2 = dropcode.substr(2);

            d3.selectAll(".circles").style("opacity", "0.2")
            d3.selectAll(".arrowhead").style("opacity", "0.2")
            d3.selectAll(".arrowline").style("opacity", "0.2")
            d3.selectAll("tspan").style("opacity", "0.2")
            d3.select("#circle" + dropcode2).classed("focusCircle2", true).style("opacity", "1");

            var circleCoord = d3.select("#circle" + dropcode2);

            //var [mx, my] = d3.mouse(this); ES6 version
            var mx = circleCoord.attr('cx'),
                my = circleCoord.attr('cy');

            // use the new diagram.find() function to find the Voronoi site
            // closest to the mouse, limited by max distance voronoiRadius
            var site = voronoi.find(mx, my, voronoiRadius);

            tip(site); //tooltip stuff
            var xpos = site[0];
            var ypos = site[1];

            focus.style('display', null);

            focus.select('#focusCircle')
              .attr('cx', xpos)
              .attr('cy', ypos);

          //word wrapping function from https://stackoverflow.com/questions/24784302/wrapping-text-in-d3
      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
              words = text.text().split(/\s+/).reverse(),
              word,
              line = [],
              lineNumber = 0,
              lineHeight = 1.1, // ems
              x = text.attr("x"),
              y = text.attr("y"),
              dy = 0,//parseFloat(text.attr("dy")),
              tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }//end wrap function
