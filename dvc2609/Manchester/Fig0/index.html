    <style>

	body {
		max-width:800px;
		margin: 0px auto;
		font-family:"Open Sans", Arial;
	}


	h3{
		font-weight:600;
		font-size: 17px;
	}

	h5{
		font-weight:500;
		font-size: 15px;
	}




	.btn--primary {
	background-color: #0F8243;
	color: #fff;
	}
	.btn {
	font-family: "Open Sans",Helvetica,Arial,sans-serif;
	font-weight: 400;
	font-size: 14px;
	display: inline-block;
	width: auto;
	cursor: pointer;
	padding: 6px 16px 10px 16px;
	border: 0 none;
	text-align: center;
	-webkit-appearance: none;
	transition: background-color 0.25s ease-out;
	line-height: 24px;
	}
	.btn--primary:hover, .btn--primary:focus {
	background-color: #0b5d30;
	}
	a {
		text-decoration: underline;
		font-size: 18px;
		font-weight: 400;
		line-height: 32px;
	}

	.visuallyhidden {
	position: absolute;
	width: 1px;
	height: 1px;
	margin: -1px;
	padding: 0;
	overflow: hidden;
	clip: rect(0, 0, 0, 0);
	border: 0;
	}

	.focussed{
	opacity: 0.9;
	stroke:orange;
	stroke-width:5;
	}

	rect:focus{
	outline-style:none;
	}

	path:focus{
	outline-style:none;
	}

	.btn:hover, .btn:focus{
	outline: 3px solid orange;
	}

</style>

<body>

	<div id="altern">
    	<p>Unfortunately your browser cannot display this element. You might need to upgrade to a modern browser - Find out more information here <a href="https://www.gov.uk/help/browsers">https://www.gov.uk/help/browsers</a></p>
        <img src="alt.png" alt="Screenshot">
    </div>
    <h5 class="visuallyhidden">Case study dropdown search</h5>

    <div class="container-fluid" aria-hidden="true">
           <div class="row">
           		<!-- <div class="yearTxt2001" > Select a location:</div> -->
                <div id="LAdropdown" style="width:350px;"></div>
           </div>

    </div> <!--end container-fluid-->

    <script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js"></script>
    <!-- <script src="js/bootstrap.min.js"></script> -->
 	<script src="js/modernizr.custom.56904.js"></script>
  	<script src="./lib/chosen.jquery.js"></script>
    <script src="https://cdn.ons.gov.uk/vendor/d3/3.5.17/d3.min.js"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/0.4.2/pym.min.js"></script>


    <script>

		var pymChild = null;


		function createDropdown(width) {

			// console.log(dropdown_data);

				$("#LAdropdown").empty();

			d3.select("#LAdropdown").insert("label")
				.attr("class", "visuallyhidden")
				.attr("for", "dropdown2")
				.html("Inactive dropdown element, replaced by custom dropdown")

        var opts = d3.select("#LAdropdown").append("select")
						.attr("id","dropdown2")
						.attr("style","width:370px")
						.attr("class","chosen-select")

					//set option for placeholder text
					opts.append("option")
						.attr("value","first")
						.text("");

					opts.selectAll("p")
						.data(dropdown_data) //loop through the loaded data
						.enter()
						.append("option")
						.attr("disabled", function(d){ if (d.active == "FALSE") return true })
						.attr("value", function(d){ return d.url})
						.text(function(d){ return d.areanm})
						$('#dropdown2').chosen({
							"disable_search": false,
							placeholder_text_single:"Manchester"

						})

        d3.select('input.chosen-search-input').attr('id','chosensearchinput')
        d3.select('div.chosen-search').insert('label','input.chosen-search-input')
            .attr('class','visuallyhidden')
            .attr('for','chosensearchinput')
            // .html("Select a variable")

				$('#dropdown2').on('change',function(evt,params){
                d3.select("#selected_var").text($("#dropdown2 option:selected").val())
                goToURL(params.selected);
						});
			

		function goToURL(url) {

			window.location.href = url;

		}

			//use pym to calculate chart dimensions
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		
		}// end drawGraphic


		//check whether browser can cope with svg
		if (Modernizr.svg) {
		   d3.select("#altern").remove();

				//d3.json("sankey-formatted.json", function(error, data) {
				d3.csv("data.csv", function(error, csvData) {
					dropdown_data=csvData;


					csvData.forEach(function(d) {

						d.areacd = d.areacd;

					});


					//use pym to create iframed chart dependent on specified variables
					pymChild = new pym.Child({ renderCallback: createDropdown});

				})

		} else {
			 $('.container-fluid').remove();
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();

			// console.log(pymChild);

			if (pymChild) {
		        pymChild.sendHeight();
		    }
		}
    </script>
