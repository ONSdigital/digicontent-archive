<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title></title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">

  h6 {
     font-size: 16px;
     margin: 16px 0 8px 0;
     font-weight: 700;
     color:#323132;
  }

  </style>
</head>

<body>

  <div id="graphic">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <h6 id="source"></h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="../lib/pym.js" type="text/javascript"></script>
  <script src="../lib/footer.js"></script>
  <script src="../lib/saveSvgAsPng.js" type="text/javascript"></script>

  <script>
    var graphic = d3.select('#graphic');
    var keypoints = d3.select('#keypoints');
    var footer = d3.select(".footer");
    var pymChild = null;

    function drawGraphic(width) {
      var threshold_md = 788;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      //set variables for chart dimensions dependent on width of #graphic
      if (parseInt(graphic.style("width")) < threshold_sm) {
        var margin = {
          top: dvc.optional.margin_sm[0],
          right: dvc.optional.margin_sm[1],
          bottom: dvc.optional.margin_sm[2],
          left: dvc.optional.margin_sm[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[0] * graphic_data.length - margin.top - margin.bottom;
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        var margin = {
          top: dvc.optional.margin_md[0],
          right: dvc.optional.margin_md[1],
          bottom: dvc.optional.margin_md[2],
          left: dvc.optional.margin_md[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[1] * graphic_data.length - margin.top - margin.bottom;
      } else {
        var margin = {
          top: dvc.optional.margin_lg[0],
          right: dvc.optional.margin_lg[1],
          bottom: dvc.optional.margin_lg[2],
          left: dvc.optional.margin_lg[3]
        }
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[2] * graphic_data.length - margin.top - margin.bottom;
      }

      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      var x = d3.scaleLinear()
        .range([0, chart_width]);

      var y = d3.scaleBand()
        .rangeRound([0, height])
        .paddingInner(0.1);

      y.domain(graphic_data.map(function(d) {
        return d.name;
      }));

      var yAxis = d3.axisLeft(y)

      var xAxis = d3.axisBottom(x)
        .tickSize(-height, 0, 0);
        var xAxis2 = d3.axisTop(x)
          .tickSize(-height, 0, 0);

      //specify number or ticks on x axis
      if (parseInt(graphic.style("width")) <= threshold_sm) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
      } else {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
      }

      // parse data into columns
      var bars = {};
      for (var column in graphic_data[0]) {
        if (column == 'name') continue;
        bars[column] = graphic_data.map(function(d) {
          return {
            'name': d.name,
            'amt': d[column],
            'lowerci': d.lowerci,
            'upperci': d.upperci,
          };
        });
      }

      //y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      if (dvc.essential.xAxisScale == "auto_zero_max") {
        var xDomain = [
          0,
          d3.max(d3.entries(bars), function(c) {
            return d3.max(c.value, function(v) {
              var n = v.amt;
              return Math.ceil(n);
            });
          })
        ];
      } else if (dvc.essential.xAxisScale == "auto_min_max") {
        var xDomain = [
          d3.min(d3.entries(bars), function(c) {
            return d3.min(c.value, function(v) {
              var n = v.amt;
              return Math.floor(n);
            });
          }),

          d3.max(d3.entries(bars), function(c) {
            return d3.max(c.value, function(v) {
              var n = v.amt;
              return Math.ceil(n);
            });
          })
        ];
      } else {
        var xDomain = dvc.essential.xAxisScale;
      }

      x.domain(xDomain);

      d3.select("#buttonid").on("click", function() {
        saveSvgAsPng(document.getElementById("chart"), "diagram.png")
      });

      //create svg for chart
      var svg = d3.select('#graphic').append('svg')
        .attr("id", "chart")
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + 30)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

      svg.append("rect")
        .attr("class", "svgRect")
        .attr("width", chart_width)
        .attr("height", height)
        .attr("fill", "transparent")

      svg.append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0, " + height + ")")
        .call(xAxis).append("text")
        .attr("y", 25)
        .attr("x", chart_width)
        .attr("dy", ".71em")
        .style("text-anchor", "start")
        .attr("font-size", "12px")
        .attr("fill", "#666")
        .text(dvc.essential.xAxisLabel);

      //create y axis, if x axis doesn't start at 0 drop x axis accordingly
      svg.append('g')
        .attr('class', 'y axis')
        .attr('transform', function(d) {
          if (xDomain[0] != 0) {
            return 'translate(' + (0) + ',0)'
          } else {
            return 'translate(' + 0 + ', 0)'
          }
        })
        .call(yAxis);

      if (parseInt(graphic.style("width")) < threshold_sm) {
        d3.selectAll(".y .tick text")
          .call(wrap, dvc.optional.margin_sm[3]-10);
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        d3.selectAll(".y .tick text")
          .call(wrap, dvc.optional.margin_md[3]-10);
      } else {
        d3.selectAll(".y .tick text")
          .call(wrap, dvc.optional.margin_lg[3]-10);
      };

      svg.append('g').attr("class", "bars").selectAll('rect')
        .data(bars["value"])
        .enter()
        .append('rect')
        .attr("fill", function(d) {
          if (d.amt > 0) {
            return dvc.essential.colour_palette[0]
          } else {
            return dvc.essential.negative_colour
          }
        })
        .attr("width", function(d) {
          return 0 + Math.abs(x(d.amt) - x(0));
        })
        .attr("x", function(d) {
          return x(Math.min(0, d.amt));
        })
        .attr("y", function(d) {
          return y(d.name);
        })
        .attr("height", y.bandwidth())

          //draw the dots
          svg.selectAll("circles")
            .data(bars["value"])
            .enter()
            .append("circle")
            .attr("cx", function(d) {
              return x(d.amt);
            })
            .attr("cy", function(d) {
              return y(d.name) +14
            })
            .attr("r","5")
            .style("fill",function(d,i){if (d.amt == 0){return "none"} else {return "none"} })

        //now draw the lower ci lines
        svg.selectAll("lines")
          .data(bars["value"])
          .enter()
          .append("line")
          .attr("y1", function(d) { return y(d.name) +12 })
          .attr('y2', function(d) { return y(d.name) +12 })
          .attr('x1', function(d) { return x(d.lowerci) })
          .attr('x2', function(d) { return x(d.amt); })
          .style('stroke', '#171717')
          .style('stroke-width', 1)
          //now draw the twigs ci lines
          svg.selectAll("lines")
            .data(bars["value"])
            .enter()
            .append("line")
            .attr("y1", function(d) { return y(d.name) +8 })
            .attr('y2', function(d) { return y(d.name) +16 })
            .attr('x1', function(d) { return x(d.lowerci) })
            .attr('x2', function(d) { return x(d.lowerci); })
            .style('stroke', '#171717')
            .style('stroke-width', 1)
            //now draw the upper ci lines
            svg.selectAll("lines")
              .data(bars["value"])
              .enter()
              .append("line")
              .attr("y1", function(d) { return y(d.name) +12 })
              .attr('y2', function(d) { return y(d.name) +12 })
              .attr('x1', function(d) { return x(d.upperci) })
              .attr('x2', function(d) { return x(d.amt); })
              .style('stroke', '#171717')
              .style('stroke-width', 1)
              //now draw the twigs ci lines
              svg.selectAll("lines")
                .data(bars["value"])
                .enter()
                .append("line")
                .attr("y1", function(d) { return y(d.name) +8 })
                .attr('y2', function(d) { return y(d.name) +16 })
                .attr('x1', function(d) { return x(d.upperci) })
                .attr('x2', function(d) { return x(d.upperci); })
                .style('stroke', '#171717')
                .style('stroke-width', 1)

      //create centre line if required
      if (dvc.optional.centre_line == true) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('y1', -50)
          .attr('y2', height)
          .attr('x1', x(dvc.optional.centre_line_value))
          .attr('x2', x(dvc.optional.centre_line_value))

          svg.append("line")
            .attr('y1', -30)
            .attr('y2', -30)
            .attr('x1', x(-2))
            .attr('x2', x(6))
            .attr("stroke","#666")
            .attr("stroke-width","3px");

            //lefttop
            svg.append("line").attr('y1', -30).attr('y2', -35).attr('x1', x(-2)).attr('x2', x(-2)+5).attr("stroke","#666").attr("stroke-width","3px");
            //leftbottom
            svg.append("line").attr('y1', -30).attr('y2', -25).attr('x1', x(-2)).attr('x2', x(-2)+5).attr("stroke","#666").attr("stroke-width","3px");
            //righttop
            svg.append("line").attr('y1', -30).attr('y2', -35).attr('x1', x(6)).attr('x2', x(6)-5).attr("stroke","#666").attr("stroke-width","3px");
            //rightbottom
            svg.append("line").attr('y1', -30).attr('y2', -25).attr('x1', x(6)).attr('x2', x(6)-5).attr("stroke","#666").attr("stroke-width","3px");

      } else if (xDomain[0] < 0) {
        svg.append("line")
        svg.append("line")
          .attr("id", "centreline")
          .attr('y1', 0)
          .attr('y2', height)
          .attr('x1', x(0))
          .attr('x2', x(0))
      }

      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x"),
            dy = parseFloat(text.attr("dy")),
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          if (words.length > 2) {
            while (word = words.pop()) {
              line.push(word);
              tspan.text(line.join(" "));
              if (tspan.node().getComputedTextLength() > width) {
                if (lineNumber == 0) {
                  tspan.attr("dy", dy - 0.8 + "em")
                } else {
                  tspan.attr("dy", -dy + 0.45 + "em")
                }
                line.pop();
                tspan.text(line.join(" "));
                line = [word];
                ++lineNumber;
                tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", (0.45 * lineNumber - dy + 0.45) + "em").text(word);
              }
            }
          } else {
            while (word = words.pop()) {
              line.push(word);
              tspan.text(line.join(" "));
              if (tspan.node().getComputedTextLength() > width) {
                if (lineNumber == 0) {
                  tspan.attr("dy", dy - 0.55 + "em")
                } else {
                  tspan.attr("dy", -dy + 0.55 + "em")
                }
                line.pop();
                tspan.text(line.join(" "));
                line = [word];
                ++lineNumber;
                tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", (1.1 * lineNumber - dy + 0.55) + "em").text(word);
              }
            }
          }

        });
      }

      writeAnnotation();

      function writeAnnotation() {

        d3.select("g.x.axis").selectAll(".tick").attr("class",function(d,i){return "tick" + i})
        d3.select(".tick0").selectAll("text").text("half as likely")
        d3.select(".tick1").selectAll("text").text("")
        d3.select(".tick2").selectAll("text").text("2x as likely")
        d3.select(".tick3").selectAll("text").text("4x as likely")
        d3.select(".tick4").selectAll("text").text("6x as likely")

        d3.select("g.x.axis").selectAll(".domain").style("stroke","none");
        d3.select("g.y.axis").attr("transform","translate(20,0)")
        d3.select("g.y.axis").selectAll(".tick").attr("class",function(d,i){return "nametick" + i})
        var reference = [0,6,9,14,19,22,26,32,35,38,42];
        var n;
        for(n=0; n<reference.length; n++){
          d3.select(".nametick" + reference[n]).select("text").style("font-weight","bold");
        }

        if (parseInt(graphic.style("width")) < threshold_sm) {

          dvc.essential.annotationBullet.forEach(function(d, i) {

            d3.select("#keypoints").append("svg")
              .attr("width", "20px")
              .attr("height", "20px")
              .attr("class", "circles")
              .append("circle")
              .attr("class", "annocirc" + (i))
              .attr("r", "2")
              .attr('cy', "12px")
              .attr("cx", "10px");

            d3.select("#keypoints").append("p").text(dvc.essential.annotationBullet[i])
              .attr("font-family", "'Open Sans', sans-serif")
              .attr("font-size", "13px")
              .attr("color", "#666")
              .attr("font-weight", "500");


          }) // end foreach
        } else {

          dvc.essential.annotationChart.forEach(function(d, i) {

            // draw annotation text based on content of var annotationArray ...
            svg.append("text")
              .text(dvc.essential.annotationChart[i])
              .attr("class", "annotext" + i)
              .attr("text-anchor", dvc.essential.annotationAlign[i])
              .attr('y', y(dvc.essential.annotationXY[i][1]))
              .attr('x', x(dvc.essential.annotationXY[i][0]))
              .attr("font-family", "'Open Sans', sans-serif")
              .attr("font-size", "14px")
              .attr("fill", "#666")
              .attr("font-weight", "500");

            d3.select(".annotext2").attr("transform","translate(0,-100)")
            d3.select(".annotext0").attr("transform","translate(0,-60)")
            d3.select(".annotext1").attr("transform","translate(0,-60)")

            d3.select(".annotext3").attr("transform","translate(0,-30)")
            d3.select(".annotext4").attr("transform","translate(0,-30)")
            d3.select(".annotext5").attr("transform","translate(0,-30)")
            d3.select(".annotext6").attr("transform","translate(0,-30)")

            d3.selectAll(".annotext" + (i))
              .each(insertLinebreaks);


            function insertLinebreaks() {

              var str = this;

              var el1 = dvc.essential.annotationChart[i];
              var el = el1.data;

              var words = el1.split('  ');

              d3.select(this /*str*/ ).text('');

              for (var j = 0; j < words.length; j++) {
                var tspan = d3.select(this).append('tspan').text(words[j]);
                if (j > 0)
                  tspan.attr('x', x(dvc.essential.annotationXY[i][0])).attr('dy', '22');
              }
            };

            function createBackRect() {

              var BBox = this.getBBox()

              svg.insert("rect", ".annotext" + (i))
                .attr("width", BBox.width)
                .attr("height", BBox.height)
                .attr("x", BBox.x)
                .attr("y", BBox.y)
                .attr("fill", "white")
                .attr("opacity", 0.4);

            }; // end function createBackRect()

          }); // end foreach

        } // end else ...

        // If you have labels rather than years then you can split the lines using a double space (in the CSV file).

        if (dvc.optional.vertical_line == true) {
          dvc.optional.annotateLineX1_Y1_X2_Y2.forEach(function(d, i) {

            svg.append("line").attr('x1', x(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][0]))
              .attr('x2', x(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][0]))
              .style('stroke', '#888')
              .style('stroke-width', 2)
              .attr('font-size', '13px')
              //.style('stroke-dasharray', '5 5')                         .attr('y1',y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][0][1]))
              .attr('y2', y(dvc.optional.annotateLineX1_Y1_X2_Y2[i][1][1]));
          })
        }

        d3.selectAll("path").attr("fill", "none");

        d3.selectAll(".x line")
          .attr("stroke", "#CCC")
          .attr("stroke-width", "1px")
          .attr("shape-rendering", "crispEdges");



        d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

        d3.selectAll(".y text").attr("font-size", "12px").attr("fill", "#666");
        d3.selectAll(".x text").attr("font-size", "12px").attr("fill", "#666"); // dates - timelines

        d3.selectAll(".y line")
          .attr("stroke", "#CCC")
          .attr("stroke-width", "1px")
          .style("shape-rendering", "crispEdges");



        if (dvc.optional.annotateRect == true) {

          dvc.optional.annotateRectX_Y.forEach(function(d, i) {

            svg.append("rect")
              .attr('x', x(dvc.optional.annotateRectX_Y[i][0][0]))
              .attr('y', y(dvc.optional.annotateRectX_Y[i][0][1]))
              .attr('height', y(dvc.optional.annotateRectX_Y[i][1][1]) - y(dvc.optional.annotateRectX_Y[i][0][1]))
              .attr('width', x(dvc.optional.annotateRectX_Y[i][1][0]) - x(dvc.optional.annotateRectX_Y[i][0][0]))
              .style('fill', dvc.optional.lineColor_opcty[i][0])
              .style('stroke-width', 2)
              .style('opacity', dvc.optional.lineColor_opcty[i][1]);

          })
        }

        d3.select(".y").select("path").style("stroke", "#666")


        // function insertLinebreaksLabels() {
        // 				var str = this.textContent;
        //
        // 				var words = str.split('  ');
        //
        // 				d3.select(this/*str*/).text('');
        //
        // 				for (var j = 0; j < words.length; j++) {
        // 					var tspan = d3.select(this).append('tspan').text(words[j]);
        // 					if (j > 0)
        // 						tspan
        // 						.attr('x', -10)
        // 						.attr('dy', '1em');
        // 						}
        // };

        // d3.selectAll(".y text").each(insertLinebreaksLabels)


      } // end function writeAnnotation()


      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }

    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config

        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          graphic_data = data;

          // graphic_data.forEach(function(d) {
          // 	d.name = d3.time.format(dvc.essential.dateFormat).parse(d.name);

          // });

          names = d3.keys( /*data*/ graphic_data[0]).filter(function(key) {
            return key !== "state";
          });

          /*data*/
          graphic_data.forEach(function(d) {
            //d.ages = names.map(function(name) { return {name: name, value: +d[name]}; });
          });

          //use pym to create iframed chart dependent on specified variables
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });
      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
  </script>
