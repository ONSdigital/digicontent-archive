<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title>Causes of death, ranked by their deviation from the 2015 to 2019 five-year average, England and Wales, deaths registered in 2020</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    .x.axis path {
      display: none;
    }

    /* Full width */

    .btn-form-fullwidth {
      display: -webkit-inline-box;
      display: -ms-inline-flexbox;
      display: inline-flex;
      font-family: 'Open Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 32px;
      width: 100%;
    }

    .form-group-fullwidth {
      display: -webkit-box;
      display: -ms-flexbox;
      display: flex;
      cursor: pointer;
      height: 50px;
      box-sizing: border-box;
      text-align: center;
      width: 100%;
      margin-top: 3px;
      margin-right: 4px;
    }

    .form-group-fullwidth:last-child {
      /*  border-right: solid 3px #206095;*/
    }

    .form-group-fullwidth:focus {
      outline: orange 3px solid;
    }

    .label-primary-fullwidth {
      padding: 12px 16px;
      cursor: pointer;
      color: #206095;
      background: #fff;
      border-top: solid 3px #206095;
      border-left: solid 3px #206095;
      border-bottom: solid 3px #206095;
      border-right: solid 3px #206095;
      width: 100%;
    }

    .label-primary-fullwidth:hover,
    .label-primary-fullwidth:focus {
      background: #206095;
      color: #fff;
      border-color: #206095;
      width: 100%;
      outline: orange 3px solid;

    }

    .radio-primary-fullwidth:checked+.label-primary-fullwidth {
      background: #206095;
      color: #fff;
      border-color: #206095;
      cursor: default;
      width: 100%;

      /*outline: orange 3px solid; */
    }

    .radio-primary-fullwidth {
      display: none;
    }

    h5 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    /* stuff for legend */
    #legend{
      display:flex;
      margin-bottom: 20px;
    }

    .legenditem {
      display:flex;
      font-size: 14px;
      padding-right:25px;
    }

    .square {
      height: 15px;
      width: 15px;
      /* border-radius: 50%; */
    }

    .legendtext{
      font-size:16px;
      color:#707070;
    }

    p{
      line-height:1em;
      margin-bottom:10px;
    }

    @media (max-width: 400px) {
      .legend{
        flex-flow:column;
      }
    }



  </style>
</head>

<body>

  <h5 id="accessibleSummary" class="visuallyhidden">Heart diseases caused significantly more deaths than normal during 2020</h5>

  <div id="buttons">
    <form id="buttonForm" class="btn-form btn-form-fullwidth" role="radiogroup">
      <div class="form-group form-group-fullwidth" role="radio" tabindex="0">
        <input id="button-1" class="radio-primary radio-primary-fullwidth" type="radio" name="button" value="England" aria-checked="true" checked>
        <label class="label-primary label-primary-fullwidth" for="button-1">England</label>
      </div>
      <div class="form-group form-group-fullwidth" role="radio" tabindex="0">
        <input id="button-2" class="radio-primary radio-primary-fullwidth" type="radio" name="button" value="Wales" aria-checked="false">
        <label class="label-primary label-primary-fullwidth" for="button-2">Wales</label>
      </div>
    </form>
  </div>
  <!-- <h5 id="switchSummary" class="visuallyhidden" aria-live="assertive"></h5> -->
  <!-- <div aria-hidden="true" id="legend"></div> -->

  <div id="graphic" aria-hidden="true">
    <img src="fallback.png" alt="[Chart]" />
  </div>

  <div id="keypoints">
    <p></p>
  </div>

  <div class="footer">
  </div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.js" type="text/javascript"></script>
  <script>
    var graphic = d3.select('#graphic');




    var keypoints = d3.select('#keypoints');
    var footer = d3.select(".footer");
    var pymChild = null;

    function drawGraphic() {
      var threshold_md = 600;
      var threshold_sm = dvc.optional.mobileBreakpoint; // 510

      //set variables for chart dimensions dependent on width of #graphic
      if (parseInt(graphic.style("width")) < threshold_sm) {
        var margin = {
          top: dvc.optional.margin_sm[0],
          right: dvc.optional.margin_sm[1],
          bottom: dvc.optional.margin_sm[2],
          left: dvc.optional.margin_sm[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]);
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        var margin = {
          top: dvc.optional.margin_md[0],
          right: dvc.optional.margin_md[1],
          bottom: dvc.optional.margin_md[2],
          left: dvc.optional.margin_md[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]);
      } else {
        var margin = {
          top: dvc.optional.margin_lg[0],
          right: dvc.optional.margin_lg[1],
          bottom: dvc.optional.margin_lg[2],
          left: dvc.optional.margin_lg[3]
        }
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]);
      }

      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      x = d3.scaleLinear()
        .range([0, chart_width])
        .domain([-8,11])

      y = d3.scaleBand()
        .paddingInner(0.1)
        .range([0, height]);

      y.domain(graphic_data.filter(function(d){
        return d.group=="England"
      }).map(function(d) {
        return d.name;
      }).filter(function(d, i, arr) {
        return arr.indexOf(d) === i
      }));

      var yAxis = d3.axisLeft(y)
        .tickPadding(10)
        .tickSize(0)

      var xAxis = d3.axisBottom(x).tickSize(-height)

      //create svg for chart
      svg = d3.select('#graphic')
        .append('svg')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .attr("id", "chart")
        .style("background-color", "#fff")
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + (margin.top) + ")")

      svg.append("text")
        .attr('class', 'x-label')
        .attr("y", height)
        .attr("x", chart_width)
        .style('font-size', '14px')
        .attr("dy", "1.1em")
        .style("text-anchor", "end")
        .text(dvc.essential.xAxisLabel);

      // svg.append('g')
      //   .attr('transform', 'translate(0,' + height + ')')
      //   .attr('class', 'x axis')
      //   .call(xAxis)

      svg.append('g')
        .attr('class', 'y axis')
        .call(yAxis)
        .selectAll('.tick text')
        .call(wrap,margin.left-10)

      svg.selectAll('rect.background')
      .data(graphic_data.filter(function(d){
        return d.group=="England"
      }))
      .enter()
      .append('rect')
      .attr('class', 'background')
      .attr('height', function(d) {
        return y.bandwidth()
      })
      .attr('fill','#e5e6e7')
      .attr('y', function(d) {
        return y(d.name)
      })
      .attr('x', function(d) {
        return x(x.domain()[0])
      })
      .attr('width', function(d) {
        return Math.abs(x(x.domain()[1])-x(x.domain()[0]))
      })

      drawChart(graphic_data.filter(function(d) {
        return d.group == "England"
      }))

      //a function that draws the chart given some data
      function drawChart(data) {
        t = d3.transition()
          .duration(1000)

        y.domain(data.map(function(d) {
          return d.name;
        }).filter(function(d, i, arr) {
          return arr.indexOf(d) === i
        }));



        svg.selectAll('rect.value')
          .data(data)
          .enter()
          .append('rect')
          .merge(d3.selectAll('rect.value'))
          .attr('class', 'value')
          .attr('height', function(d) {
            return y.bandwidth()
          })
          .attr('fill',dvc.essential.colour_palette[0])
          .transition(t)
          .attr('y', function(d) {
            return y(d.name)
          })
          .attr('x', function(d) {
            return d3.min([x(0),x(+d.value)])
          })
          .attr('width', function(d) {
            return Math.abs(x(0)-x(+d.value))
          })

          svg.selectAll('text.background')
            .data(data)
            .enter()
            .append('text')
            .merge(d3.selectAll('text.background'))
            .attr('class','background')
            .style('stroke',function(d){if(d.value<0){return 'white'}else{return '#206095'}})
            .attr('font-size','12px')
            .style('stroke-width','3px')
            .attr('x',function(d){return x(0)})
            .attr('y',function(d){return y(d.name)+y.bandwidth()})
            .attr('dy',-y.bandwidth()/3)
            .attr('dx',4)
            .transition(t)
            .text(function(d){return d.value})

          svg.selectAll('text.value')
            .data(data)
            .enter()
            .append('text')
            .merge(d3.selectAll('text.value'))
            .attr('class','value')
            .attr('fill',function(d){if(d.value>0){return 'white'}else{return '#206095'}})
            .attr('font-size','12px')
            .attr('x',function(d){return x(0)})
            .attr('y',function(d){return y(d.name)+y.bandwidth()})
            .attr('dy',-y.bandwidth()/3)
            .attr('dx',4)
            .transition(t)
            .text(function(d){return d.value})

        svg.select('g.y.axis')
        .transition(t)
        .call(yAxis)

        setTimeout(
          function(){d3.selectAll('.tick text').call(wrap,margin.left-10);}
        , 500);


      }


      //code for clicking on buttons to switch the dataset
      d3.selectAll("input[name='button']")
        .on('click', function() {
          var foo = this.value
          drawChart(graphic_data.filter(function(d) {
            return d.group == foo
          }))
        })


      //code for keyboard control buttons
      d3.selectAll(".form-group-fullwidth")
        .on('keydown', function(e) {
          if (d3.event.keyCode === 13 || d3.event.keyCode === 32) {
            d3.select(this).select("input").attr("aria-checked", "true").property("checked", true);
            var foo= d3.select(this).select("input").node().value
            drawChart(graphic_data.filter(function(d) {
              return d.group == foo
            }))
          }
        })

      //create link to source
      d3.select(".footer").append("h5")
        .text("Source: " + dvc.essential.sourceText)

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config;

        d3.queue()
          .defer(d3.csv, dvc.essential.graphic_data_url)
          .await(function(error, data) {
            //load chart data
            graphic_data = data

            //use pym to create iframed chart dependent on specified variables
            pymChild = new pym.Child({
              renderCallback: drawGraphic
            });

          });
      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }

    function wrap(text, width) {
      text.each(function() {
        var text = d3.select(this),
          words = text.text().split(/\s+/).reverse(),
          word,
          line = [],
          lineNumber = 0,
          lineHeight = 1.1, // ems
          y = text.attr("y"),
          x = text.attr("x"),
          dy = parseFloat(text.attr("dy")),
          tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
        while (word = words.pop()) {
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > width) {
            if (lineNumber == 0) {
              tspan.attr("dy", -0.2 + "em")
            } else if(lineNumber ==1){
              tspan.attr("dy", +1.1 + "em")
            } else if(lineNumber ==2){
              tspan.attr("dy", +2.4 + "em")
            } else if(lineNumber ==3){
              tspan.attr("dy", +3.7 + "em")
            }

            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", (++lineNumber * lineHeight)+0.1 + "em").text(word);
          }
        }
      });
    }
  </script>

</html>
