<!DOCTYPE html>
<html lang="en">

<head>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600|Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
    <title>100 yrs Death</title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />
    <link type="text/css" href="../lib/styles.css" rel="stylesheet" />

   
    <style type="text/css">
		
		#graphic
		{
				position: relative;
		}
			#grid
			{
					position: relative;
					/*background-color: #eee;*/
			}	
		.square {
			stroke:#ffffff;
			stroke-width:2px;
			cursor: pointer;
		}	
		
		.highlighted {
			stroke:#333;
			stroke-width:2px;
		}
		
			#infoPanel
				{
					padding: 0px 0px 0px 10px;
				}
				
				.lineText{
							/*position:relative;*/
							word-wrap: break-word;
							font-size: 15px;
							color:#666;
							font-weight:500;
							background:#FFF;
							padding:1px;
							border:1px #666;
							background-origin:border-box;
							/*text-anchor: start;*/
						}
				.infoText{
							position:relative;
							font-size: 18px;
							color:#666;
							font-weight:800;
							/*text-anchor: start;*/
						}
						.bigText{
							position:relative;
							font-size: 26px;
							color:#AAA;
							font-weight:800;
							padding: 0px 0px 0px 8px;
						}
						#line11{
							height:40px;
						}
						
						.figures{
							/*position:relative;*/
							font-size: 16px;
							font-weight:400;
							text-anchor: middle;
						}
						.smallfigs{
									position:relative;
									font-size: 14px;
									font-weight:400;
									text-anchor: end;
								}
								
								 #legendTab .bsqr /* required */
										{
										   /* display: inline-block;*/
											margin: 0 5px 0 5px;
											padding: 0;
										   /* line-height: 15px;*/
										}
										
										.tableHeader{
													padding: 0 5px 5px 5px;
													background-color: #fff;
													}
										 .tableData{
													padding: 0 5px 0px 5px;
													background-color: #fff;
													}
										/*#dash1 b , #dash5 b*/
										b{
											display: inline-block;
											width: 28px;
											height: 16px;
											/*margin: 4px 7px 10px 5px;*/
											float: left;
										}
										th{
											font-size: 15px;
											color:#666;
											font-weight:600;
											text-anchor: left;	
										}
										td{
											font-size: 13px;
											color:#666;
											font-weight:500;
											text-anchor: left;	
										}
		
		@media screen and (max-width: 600px) {
				.square {
							stroke:#ffffff;
							stroke-width:1px;
						}
								.highlighted {
									stroke:#333;
									stroke-width:2px;
								}	

				.infoText{
						font-size: 12px;
						}
				.lineText{
							/*position:relative;*/
							font-size: 11px;
							font-weight:600;
							/*text-anchor: start;*/
						}
						.bigText{
							position:relative;
							font-size: 16px;
							color:#AAA;
							font-weight:700;
							padding: 0px 0px 0px 5px;
						}		
				.figures{
							/*position:relative;*/
							font-size: 14px;
							font-weight:300;
				}
				.smallfigs{
									font-size: 11px;
									font-weight:300;
								}
										b{
											display: inline-block;
											width: 20px;
											height: 12px;
											/*margin: 4px 7px 10px 5px;*/
											float: left;
										}
										th{
											font-size: 13px;
											font-weight:600;
										}
									
										td{
											font-size: 11px;
											font-weight:500;
										}.tableHeader{
													padding: 0 2px 2px 2px;
										}
										 .tableData{
													padding: 0 2px 0px 2px;
										 }
		}
		
</style>
    
    
</head>
<body>
    
	<div id="graphic">
    	 <img id="fallback" src="fallback.png" alt="[Chart]" />
         
            <div id="legnd"></div>
            
            <div id="infoPanel"></div>
            
            <div id="left"></div>
            
    </div>      
    
    <script src="https://cdn.ons.gov.uk/vendor/d3/3.5.17/d3.min.js" type='text/javascript'></script>
    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script src="../lib/bootstrap.min.js" type="text/javascript"></script>
    
          
    <script>
		
		var dvc = {};
		var graphic = $('#graphic');
		var infoPanel = $('#infoPanel');
		var left = $('#left');
		var legnd = $('#legnd');
		var footer = $(".footer");
		var pymChild = null;
		
		function drawGraphic(width) {
		   	var threshold_md = 767;
		   	var threshold_sm = dvc.optional.mobileBreakpoint;
			dvc.xArray = [];
		
			//dvc.leftwidth = $("#left").width();
	  
		  	//set variables for chart dimensions dependent on width of #graphic
			// dvc.chart_width  &  dvc.height not needed in this heat map template
		    if (graphic.width() < threshold_sm) {     
												dvc.margin = {	top: 	dvc.optional.margin_sm[0], 
																right: 	dvc.optional.margin_sm[1],
																bottom:	dvc.optional.margin_sm[2],
																left: 	dvc.optional.margin_sm[3]
															}; 
												}
			else if (graphic.width() < threshold_md){
												dvc.margin = {	top: 	dvc.optional.margin_md[0],
																right: 	dvc.optional.margin_md[1],
																bottom: dvc.optional.margin_md[2],
																left: 	dvc.optional.margin_md[3]
															};
		  										}
			else { 
												dvc.margin = {	top: 	dvc.optional.margin_lg[0],
																right: 	dvc.optional.margin_lg[1],
																bottom: dvc.optional.margin_lg[2],
																left: 	dvc.optional.margin_lg[3]
															};
				}
				
		chart_width = parseInt(/*d3.select('#graphic').style("width"))*/ graphic.width() ) - dvc.margin.left - dvc.margin.right;
		if(chart_width + dvc.margin.left + dvc.margin.right > 800)	{chart_width = (800 - dvc.margin.left - dvc.margin.right) * (3/4);}
															   else {chart_width = chart_width * (3/4);}
		
		if(graphic.width() < 500) { chart_width = chart_width * (5/4); }
		
				
		// clear out existing graphics
		d3.select("#fallback").remove();
		infoPanel.empty();
		left.empty();
		legnd.empty();
		footer.empty();
									
							
		dvc.names = d3.keys(cause_data[0]);
		
		dvc.yrCause = d3.values(cause_data)//.filter(function(value) { return value;});			
		
			// map the data to see it in columns for each header
		    var block = {};
		    for (var column in cause_data[0]) { 
		      if (column == "yvals") continue; // not yvals
			  		//	array[for each column] map the data under that heading to an associative array
						block[column] = cause_data.map(function(d) {
																		return { //console.log( d[column].split('@') )
																			//	name : value
																				'amt': d[column] // => d.1915, d.1925, d.1935...
																				};
																});
		   									 }; // ends for loop
			
			
			//create link to source				
			d3.select(".footer").append("p")
				.text("Source: ")
				.append("a")
				.attr("href", dvc.essential.sourceURL)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText);
				
		//  Now let get the size of the heat map  // row=12
		dvc.brickWidth = chart_width / 11;
		dvc.brickHeight = 2.6; 
				
		myWidth = chart_width + dvc.margin.left + dvc.margin.right;  // calculated by dvc.leftwidth = $("#left").width();
		//console.log('r,w  ' + row + ' , ' + myWidth);
			
		myColumn = dvc.yrCause.length; 
		myHeight = (myColumn * dvc.brickWidth/dvc.brickHeight) + dvc.margin.top + dvc.margin.bottom;
		// divided by '2' because the blocks are rectangular
				
		 dvc.colour = dvc.essential.varcolour;
	 
			d3.select("#infoPanel").style('width', myWidth+"px") //(graphic.width() * (7/8)) +'px')
							
		
	// Let's get building
		  d3.select("#left")
			.append("svg")
			.attr("id","grid")
			.attr("width", myWidth)
			.attr("height", myHeight)
			.attr("transform", "translate( 0," + dvc.margin.top + ")");
	
	grid();
	table();
	if(graphic.width() < 500) { tabulate(dvc.essential.tableData, ['Tile', 'type']); } else
	{
	tabulate(dvc.essential.tableData, ['Tile', 'type', 'causes']); }
			
function grid(){
				// use nested method to create parent Node for each month					
				allTiles = d3.select('#grid')
								.append("g") 
								.attr("class","tiles")
								.selectAll("g")
								.data(d3.entries(block) )  // top hierarchy of the mapped data. Variable is called 'amt'
								.enter()
								.append("g")
								.attr("id", function(d,i){ return dvc.names[i] }) // was +1, but due to pop() not needed
								.attr("transform", function(d,i) {
																return "translate(" + i*dvc.brickWidth + ", " + 0 + ")";  
																} );
																
					var myDate = 1905;											
					allTiles.selectAll('.tiles')
					   		.data(function(d,i) { return d.value; })  // just give me the 'values' ie cause. 'keys' not required
							.enter()
							.append("rect") 
							.attr("class","square")
							.attr("id", function(d,i) { return "sqr" + i; } ) 
							.attr("y",  function(d,i) {  
														return i*(dvc.brickWidth/dvc.brickHeight);
														})
							.attr("height", dvc.brickWidth/dvc.brickHeight)  
							.attr("width", dvc.brickWidth/1)
							// was 2.2 & 1.05
							.style("fill", function(d,i) { if(i == 0) myDate = myDate + 10;
															var amp  = code_data[i][myDate].split('@');
															//console.log( code_data[i][myDate].split('@') );
															return dvc.colour[ (amp[0].substring(0,4).replace(/[()]/g, '')) ];
															})
							.style("opacity", 0.7)
							.on("mouseout", removeInfo)
							.on("mouseover",updateInfo)
							.attr("transform","translate("+(dvc.margin.left/* + 30*/)+","+(dvc.margin.top + 20)+")");  // plus string width
						
											
					dvc.names.pop(); // shift out the day value - 'yvals'			
				var adding = d3.select('#grid');
				
					  adding.append('g').attr('class', 'figures')
					  		.selectAll('text')
							.data(dvc.names)
							.enter()
							.append("text")
							.style("fill", "#666")
							.attr("x",  function(d,i) {  
												return (i*dvc.brickWidth);
												})
							.text( function(d,i) { if(chart_width < 500)  {
													return '\u2019' + d.substring(2,4); // use first char for mobile
													}
													else
													{
													return d;													} 
												})
							.attr("transform","translate("+(dvc.margin.left+(dvc.brickWidth/2.4)/* + 30*/)+","+(dvc.margin.top + 15)+")");
							
							
					  adding.append('g')//.attr('class', 'yCats')
					  		.selectAll('text')
					  		.append('g')
							.data(cause_data)  // days
							.enter()
							.append("text")
							.style("fill", "#666")
							.attr('class', 'smallfigs')
							.attr("y",  function(d,i) {  
												return (i*dvc.brickWidth/dvc.brickHeight);
												})
							.text( function(d,i) {  return d.yvals//.amt;
													})
							.attr("transform","translate("+(dvc.margin.left -6)+", "+(dvc.margin.top + 32)+")" );
} // end ƒ grid

function table(){
				
							
				d3.select("#infoPanel").append('div').append('p').attr('id', 'headInfo');
				
				topInfo = d3.select("#headInfo");
				topInfo.append('span').attr("class", "infoText col-xs-10 text-left").html("Most common cause of male death:");
				
				d3.select("#infoPanel").append('div').append('p').attr('id', 'cause1');
				line1 = d3.select("#cause1");
				
					line1.append('span')
							.attr("class", "lineText col-xs-10 text-left")
							.attr("id", "line11")
							.html("&nbsp;");// + cause_data[yCoord][monthCol);
							
					line1.append('span')
							.attr("class", "infoText col-xs-2 text-right")
							.attr("vertical-align", "text-bottom")
							.html("Total");
													
				d3.select("#infoPanel").append('div').append('p').attr('id', 'cause2');
				line2 = d3.select("#cause2");
				
					line2.append('span')
							.attr("class", "bigText col-xs-5 text-left")
							.attr("id", "line21")
							.html("&nbsp;");// + cause_data[yCoord][monthCol);
						
					line2.append('span')
							.attr("class", "bigText col-xs-5 text-right")
							.attr("id", "line22")
							.html("&nbsp;");
						
					line2.append('span')
							.attr("class", "bigText col-xs-2 text-right")
							.attr("id", "line23")
							.html("&nbsp;");
																									
} // end ƒ table


function tabulate(data, columns) { 
		var table = d3.select('#legnd').append('table'),
			thead = table.append('thead'),
			tbody = table.append('tbody')
			myColumns = ["Tiles","Type","Causes such as:"];
		
		// append the header row
		thead.append('tr')
		  .selectAll('th')
		  .data(columns)
		  .enter()
		  .append('th')
		  .attr('class', 'tableHeader')
		    .text(function (d,i) { return myColumns[i]; });

		// create a row for each object in the data
		var rows = tbody.selectAll('tr')
		  .data(data)
		  .enter()
		  .append('tr')
		  .attr('class', 'tableRow');

		// create a cell in each row for each column
		var cells = rows.selectAll('td')
		  .data(function (row) {
							return columns.map(function (column) {
												return {colour: row[column], column: column, value: row[column]};
												});
		  					})
		  .enter()
		  .append('td')
		  .attr('class', 'tableData')
		  .attr('id', function(d,i){
									return 'td'+i;
		  })
		  .text(function (d,i) { if(i ==0) { return null }
										else { return d.value; }
								});

	  	d3.selectAll('#td0').append('b')//     function(d,i){return "border" + i})  FOR CSS
							.attr('class', 'key')
		 					.style("background-color", function(d){ return d.value; })
							.style("opacity", 0.7);
										
} // end ƒ table

							
		//use pym to calculate chart dimensions	for grid and table
		    if (pymChild) {
		        pymChild.sendHeight();
		    	}
		
}; // end wrapper ƒ drawGraphic
	
	
function updateInfo(evt){
			format = d3.format(",.0f"); 
			//d3.select("#info").html(evt.amt);
			
			dayRow = d3.select(this).attr("id");
			monthCol = d3.select(this.parentNode).attr("id");
						
			var yCoord = dayRow.substring(3,5);
			
				d3.select(this).classed("highlighted",true);
			
				var result1 = evt.amt.split('@');
				var result2 = num_data[yCoord][monthCol];//.split('@');
				var result3 = per_data[yCoord][monthCol];//.split('@');
				
				d3.select("#line11").html(result1[0] );
				
				d3.select("#line21").html(format(result2) + " deaths");
				d3.select("#line22").html(format(result3) + "% of " );
				d3.select("#line23").html(format(total_data[yCoord][monthCol]) ); 
			
	}


function removeInfo(){
			d3.select(".highlighted").classed("highlighted",false);
			
			d3.selectAll(".lineText").html("&nbsp;");
			
			d3.selectAll(".bigText").html("&nbsp;");
	}
		
			
		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   //load config 
			d3.json("config.json", function(error, config) {
			dvc = config;
			
				//load chart data
				d3.csv("males"+dvc.essential.data_name[0]+".csv", function(error, data) {
				cause_data = data;
					
					d3.csv("male"+dvc.essential.data_name[1]+".csv", function(error, data1) {
					num_data = data1;
						
						d3.csv("males"+dvc.essential.data_name[4]+".csv", function(error, data2) {
						code_data = data2;
						
							d3.csv("males"+dvc.essential.data_name[3]+".csv", function(error, data3) {
							total_data = data3;
							
								d3.csv("male"+dvc.essential.data_name[2]+".csv", function(error, data3) {
								per_data = data3;
												
									//use pym to create iframed chart dependent on specified variables
									pymChild = new pym.Child({ renderCallback: drawGraphic});
									
								});
							});
						});
					});	
				});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
							pymChild.sendHeight();
						  }
		}
    </script>
