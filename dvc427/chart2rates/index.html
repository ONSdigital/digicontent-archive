<!DOCTYPE html>
<html lang="en">

<head>
    <link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600|Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
    <title></title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />
    <style type="text/css">
    
        .LTline { 
				stroke: #dadada; 
				stroke-width: 1px; 
				fill: none; /* must be 'none' */
           		stroke-linecap:round;
				stroke-linejoin:round;
			}

		.line-10 { stroke: #234D70; stroke-width: 2px;}
		.line-0 { stroke: #36ADD9; stroke-width: 2px;}
	
	
		.border0 { border-top: 2px solid #74B630; }
        .border1 { border-top: 2px solid #674796; }
       
		
		#yearLine {stroke:#666; stroke-width:1px;}
		
		#lastCircle, #firstCircle{
			fill:#ee2255;
		}
						
		/*.annotext0, .annotext1, .annotext2{
			cursor:pointer;
		}*/
		
		.overlay{
			cursor:pointer;
		}
		
		.label/* required */
		{
            font-size: 12px;
            fill: #666666;
            text-align: right;
			display:block;
			float:none;
			margin-right:20px;
			margin-top:-15px;
        }
		.info{
			font-size: 18px;
            fill: #666;
            text-anchor: end;
		}
		
    </style>
</head>
<body>

	<div id="graphic">
    	<img src="fallback.png" alt="[Chart]" />
    </div>
	    
    <div id="keypoints">
        <p></p>
    </div>

   <div class="footer">        
   </div>
    
    <script src="https://cdn.ons.gov.uk/vendor/d3/3.5.17/d3.min.js" type='text/javascript'></script>
    <script src="../lib/jquery.js" type="text/javascript"></script>
    <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript" charset="utf-8"></script>
    <script>

		var graphic = $('#graphic');
		var keypoints = $('#keypoints');
		var footer = $(".footer");
		var pymChild = null;
	

function drawGraphic(width) {
	
		   var threshold_md = 788;
		   var threshold_sm = dvc.optional.mobileBreakpoint; 
		  
		   	//set variables for chart dimensions dependent on width of #graphic
		    if (graphic.width() < threshold_sm) {        	
		            var margin = {top: dvc.optional.margin_sm[0], right: dvc.optional.margin_sm[1], bottom: dvc.optional.margin_sm[2], left: dvc.optional.margin_sm[3]}; 
					var chart_width = graphic.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
		    } else if (graphic.width() < threshold_md){
		        	var margin = {top: dvc.optional.margin_md[0], right: dvc.optional.margin_md[1], bottom: dvc.optional.margin_md[2], left: dvc.optional.margin_md[3]}; 
					var chart_width = graphic.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
		  	} else {
		        	var margin = {top: dvc.optional.margin_lg[0], right: dvc.optional.margin_lg[1], bottom: dvc.optional.margin_lg[2], left: dvc.optional.margin_lg[3]}
					var chart_width = graphic.width() - margin.left - margin.right;
		            var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
			}

		chart_width = parseInt(/*d3.select('#graphic').style("width"))*/ graphic.width() ) - margin.left - margin.right;
		if(chart_width + margin.left + margin.right > 800) chart_width = (800 - margin.left - margin.right);
															   
				console.log(graphic.width(), chart_width,"dimensions trbl: ", margin.top, margin.right, margin.bottom, margin.left);
				
				
		    // clear out existing graphics
		    graphic.empty();
			keypoints.empty();
			footer.empty();
			

			x = d3.scale.ordinal()
		   		//.domain(graphic_data.map(function(d) { return d.yvals; }))
		   x.domain(["< 1", "01-04", "05-09", "10-14", "15-19", "20-24", "25-29", "30-34", "35-39", "40-44", "45-49", "50-54", "55-59", "60-64", "65-69", "70-74", "75-79", "80+"]); //  "<1", 
		   
		   	x.rangeBands([0, chart_width], 0);
				//console.log(x.rangeBand());
				
		    var y = d3.scale.linear()
		        .range([height, 0]);


		    var xAxis = d3.svg.axis()
		        .scale(x)
		        .orient("bottom")
		        .tickFormat(function(d,i) {
		            //specify date format for x axis depending on #graphic width
		            if (graphic.width() <= 700) {
		                return (i%2 === 0 ? d : "");
		            } else if (graphic.width() <= threshold_md){
		               return  d;
		            } else {
		                return d;
		            }
		        })
				.tickPadding(5)
		    
		    
		    var yAxis = d3.svg.axis()
		        .scale(y)
		        .orient('left');
		    			    
			//specify number or ticks on 
			if (graphic.width() <= threshold_sm) {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[0])
			 } else if (graphic.width() <= threshold_md){
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[1])
			 } else {
				yAxis.ticks(dvc.optional.y_num_ticks_sm_md_lg[2])
			 }
				
		    //gridlines
		    var y_axis_grid = function() { return yAxis; }

		    var line = d3.svg.line()
				.defined(function(d,i){return d.amt != null})
		        .x(function(d) { return x(d.date); })
		        .y(function(d) { return y(d.amt); });

		   
		   // parse data into columns
		    var lines = {};
		    for (var column in graphic_data[0]) {
		        if (column == 'date') continue;
		        lines[column] = graphic_data.map(function(d) {
		            return {
		                'date': d.date,
		                'amt': d[column]
		            };
		        });
		    }
			


		  	//y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
	   		if (dvc.essential.yAxisScale == "auto_zero_max"){
			   var yDomain = [
								0,
								d3.max(d3.entries(lines), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
							 ];
			} else if (dvc.essential.yAxisScale == "auto_min_max"){
				var yDomain = [
								d3.min(d3.entries(lines), function(c) {
									return d3.min(c.value, function(v) {
										var n = v.amt;
										return Math.floor(n);
									});
								}),
							
								d3.max(d3.entries(lines), function(c) {
									return d3.max(c.value, function(v) {
										var n = v.amt;
										return Math.ceil(n);
									});
								})
					 		];
			} else {
			   var yDomain = dvc.essential.yAxisScale;
		    }
				 
		    y.domain(yDomain);
		    
			//create legend
			if(dvc.essential.legendLabels.length > 1){
			var legend = d3.select('#graphic').append('ul')
			                .attr('class', 'key')
			            .selectAll('g')
			                .data(dvc.essential.legendLabels)
			            .enter().append('li')

				    legend.append('b')
						 .attr("class",function(d,i){return "border" + i})
				    
					legend.append('label')
				         .html(function(d,i) { return dvc.essential.legendLabels[i]; });						
			}

			// label
			d3.select('#graphic').append("p")
		                .attr('class', 'unit')
		  		        .text(function(d,i) { return dvc.essential.yAxisLabel; });
			
				
						
		    //create svg for chart
		    var svg = d3.select('#graphic').append('svg')
				        .attr("width", chart_width + margin.left + margin.right)
				        .attr("height", height + margin.top + margin.bottom +30)
				        .append("g")
				        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
			
			d3.select('#graphic').append("p")
		                .attr('class', 'label')
		  		        .text("Age bands");	
								
			if (graphic.width() >= 500) { 
			
					svg.append("rect")
						.attr("class","svgRect overlay")
						.attr("width", chart_width)
						.attr("height", height)
					    .on("mouseover", function() { focus.style("display", null); })
					    //.on("mouseout", function() { focus.style("display", "none"); })
					    .on("mousemove",/* function() { if (chart_width >= 500)*/ mousemove );
			}
			
				    svg.append('g')
				        .attr('class', 'y axis')
						.attr('transform', 'translate(' + (-x.rangeBand()/2) + ', 0)' )
						.call(yAxis);

				    svg.append('g')
				        .attr('class', 'y grid')
						.attr('transform', 'translate(' + (-x.rangeBand()/2) + ', 0)' )
				        .call(y_axis_grid()
				            .tickSize(-chart_width, 0, 0)
				            .tickFormat('')
				        );
					
					//create x axis, if  doesn't start at 0 drop x axis accordingly	
					svg.append('g')
				        .attr('class', 'x axis')
				        .attr('transform', function(d){ 
				        			if(yDomain[0] != 0){
										return 'translate(0,' + (height + 30) + ')'
									} else {
										return 'translate(0,' + height  + ')'
									}
							})
				        .call(xAxis);
						
						d3.selectAll("g.x.axis").selectAll("g.tick").select("line").attr('transform', 'translate(' + (-x.rangeBand()/2) + ', 0)' );
						d3.selectAll("g.x.axis").selectAll("g.tick").select("text").attr('transform', 'translate(' + (-x.rangeBand()/2) + ', 0)' );
							
				//create icon to symbolise break in  if required					
				if(yDomain[0] > 0 && dvc.essential.yAxisBreak == true){
					var paths = svg.append("defs")
								.append("g")
								.attr("id","icon")
								.append("g");
								
							paths.append("polyline")
								 .attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
								 .attr("stroke", "#666")
								 .attr("fill", "none")
							paths.append("polyline")
								.attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
								.attr("stroke", "#666")
								.attr("fill", "none");
				  
						//specify position of icon				  
						svg.append("g").attr("id","iconpath")
								.attr("transform","translate(-10,3)")
								.append("use")
								.attr("xlink:href","#icon")
								.attr("x", x(x.domain()[0]))
								.attr("y", function(){ 
									if (graphic.width() < threshold_sm) {
										return y(dvc.essential.yAxisBreak_sm_md_lg[0])
									} else if (graphic.width() < threshold_md){
										return y(dvc.essential.yAxisBreak_sm_md_lg[1])
									} else {
										return y(dvc.essential.yAxisBreak_sm_md_lg[2])
									}
								});
				}

				//create centre line if required
				if (dvc.optional.centre_line == true){
					svg.append("line")
						.attr("id","centreline")
						.attr('y1',y(dvc.optional.centre_line_value))
						.attr('y2',y(dvc.optional.centre_line_value))
						.attr('x1',0)
						.attr('x2',chart_width);
				} else if(yDomain[0] <0){
					svg.append("line")
						.attr("id","centreline")
						.attr('y1',y(0))
						.attr('y2',y(0))
						.attr('x1',0)
						.attr('x2',chart_width);
				}  

				 if (graphic.width() >= 500) {
				
				var tooltip=svg.append("g")
								.attr("id", "tooltip")
								.attr("class", "info")
								.attr("transform", "translate("+(chart_width - chart_width/3+margin.left)+", "+(chart_width/5)+")")
							
					tooltip.append("text")
						  .attr("id","date")
						  //.style("font-size", "1.3em");
						  
					tooltip.append("text")
						  .attr("id","y2011")
						  .attr("dy", "1.6em");
						
					tooltip.append("text")
						  .attr("id","y1841")
						  .attr("dy", "3em");
						  
					tooltip.append("text")
						  .attr("id","diff")
						  .attr("dy", "4.5em");	
						  
						  			
				var focus = svg.append("g")
					  .attr("class", "focus")
					  .style("display", "none");
			
					  focus.append("line")
						  .attr("id","yearLine") 	
						  .attr('y1',0)
						  .attr('y2',height);
					
					
					  focus.append("circle")
						  .attr("id","firstCircle") 	
						  .attr("r", 5);
						  
					  focus.append("circle")
						  .attr("id","lastCircle") 	
						  .attr("r", 5);  
				} 
				  
				//create lines 		
			    svg.append('g').selectAll('path')
			        .data(d3.entries(lines))
			        .enter()
			        .append('path')
					//.transition().duration(1500)
			            .attr('class', function(d, i) {
			                return 'LTline line-' + i;
			            })
			            .attr('d', function(d,i) { //console.log(d.value);
			                return line(d.value);
			            });						
			
			d3.select('g').selectAll('path')
					.attr("transform", "translate(" + /*x.rangeBand()/2*/0 + "," + 0 + ")");
						
			
							
			
			writeAnnotation();
							
			function writeAnnotation(){
			
//				if (graphic.width() < threshold_sm) {
//					
//						dvc.essential.annotationBullet.forEach(function(d,i) {
//						
//							d3.select("#keypoints").append("svg")
//								.attr("width","20px")
//								.attr("height","20px")
//								.attr("class","circles")
//								.append("circle")
//								.attr("class", "annocirc" + (i))
//								.attr("r", "2")
//								.attr('cy',"12px")
//								.attr("cx", "10px");
//							
//							d3.select("#keypoints").append("p").text(dvc.essential.annotationBullet[i]);
//						
//						})// end foreach
//				}		
//				else {
					
						dvc.essential.annotationChart.forEach(function(d,i) {	
						
							// draw annotation text based on content of var annotationArray ...
							svg.append("text")
								.text(dvc.essential.annotationChart[i])
								.attr("class","annotext" + i)
								.attr("text-anchor", dvc.essential.annotationAlign[i])
								.attr('y',y(dvc.essential.annotationXY[i][1]))
								.attr('x',x(dvc.essential.annotationXY[i][0]));
										
							d3.selectAll(".annotext" + (i))
								.each(insertLinebreaks)
								.each(createBackRect);	
								
								
							function insertLinebreaks() {
								
								var str = this;
			
								var el1 = dvc.essential.annotationChart[i];
								var el = el1.data;
						
								var words = el1.split('  ');
								
								d3.select(this/*str*/).text('');
							
								for (var j = 0; j < words.length; j++) {
									var tspan = d3.select(this).append('tspan').text(words[j]);
									if (j > 0)
										tspan.attr('x', x(dvc.essential.annotationXY[i][0])).attr('dy', '22');													
								}
							};					
													
							function createBackRect() {
								
							var BBox = this.getBBox()
											
									svg.insert("rect", ".annotext" + (i))
										.attr("width", BBox.width)
										.attr("height", BBox.height)
										.attr("x", BBox.x)
										.attr("y", BBox.y)
										.attr("fill", "white")
										.attr("opacity", 0.4);
										
							}; // end function createBackRect()
						
						
							// draw circles, if var 'dvc.essential.circles' is set to true
							if ( dvc.essential.circles == true ) {
								
								svg.append("circle")
									.attr("class", "annocirc" + (i))
									.attr('cy',y(dvc.essential.annotationCXCY[i][1]))
									.attr('cx',x(dvc.essential.annotationCXCY[i][0]))
									.attr("r", "3");
								
							} // end if ... 
							
						});	// end foreach 	
						
				/*		svg.append( "rect" )
							.attr( "class" , "rect" )
							.attr( "id" , "rect1" )
							.attr( 'x' , x(d3.time.format("%Y").parse("1891")) )
							.attr( 'width' , x(d3.time.format("%Y").parse("1948")) - x(d3.time.format("%Y").parse("1891")) )
							.attr( 'y' , 0 )
							.attr( 'height' , height );
							
						svg.append( "rect" )
							.attr( "class" , "rect" )
							.attr( "id" , "rect2" )
							.attr( 'x' , x(d3.time.format("%Y").parse("1951")) )
							.attr( 'width' , x(d3.time.format("%Y").parse("2011")) - x(d3.time.format("%Y").parse("1951")) )
							.attr( 'y' , 0 )
							.attr( 'height' , height );*/
						
						
							
					
				//} // end else ... 
				
				return;
				
	}// end function writeAnnotation()
							
			//create link to source				
			d3.select(".footer").append("p")
				.text("Source: ")
				.append("a")
				.attr("href", dvc.essential.sourceURL)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText);
			d3.select(".footer").append("p")
				.append("text")
				.text(" and ")
				.append("a")
				.attr("href", dvc.essential.sourceURL2)
				.attr("target", "_blank")
				.html(dvc.essential.sourceText2);
			
			// var bisectDate = d3.bisector(function(d) { return d.lt1; }).left;
			
			

function mousemove() {
	 d3.select(".focus").style("display", "auto");
	// custom invert function
			// https://bl.ocks.org/shimizu/808e0f5cadb6a63f28bb00082dc8fe3f
				x.invert = (function(){
					var domain = x.domain()
					var range = x.range()
					var scale = d3.scale.quantize().domain(range).range(domain)
					return function(x){
						return scale(x)
					}
				})()
				
		   // ypu can get a ordial value:
//		   var ypos = domain[d3.bisect(range, xpos) - 1];
//		   var domain = x.domain(),
//    			range = x.range();

		 var xy = d3.mouse(this)[0], //event.capture.node())
         	 dx = x.invert(xy),
        	 nx = x(dx) + (x.rangeBand()/2)
		 
		 //graphic_data row/date/dx -> lt1 and ly11
		 c = 0;
		 for (var j = 0; j < x.domain().length; j++) {
			 if (x.domain()[c] == dx) {break; }
			 else { c++; }
		 }
		  d = graphic_data[c];
		  
 			d3.select("#firstCircle").transition().duration(100).attr("opacity", 1).attr("transform", "translate(" + (x(d.date)/*+x.rangeBand()/2*/) + "," + y(d.lt1) + ")");
		   d3.select("#lastCircle").transition().duration(100).attr("transform", "translate(" + (x(d.date)/*+x.rangeBand()/2*/) + "," + y(d.lt11) + ")");
		   d3.select("#yearLine").transition().duration(100).attr("x1", x(d.date)/*+x.rangeBand()/2*/).attr("x2", x(d.date)/*+x.rangeBand()/2*/);
		   
		   var diff = d.lt1 - d.lt11;	               
		   fmtround = d3.format(",.1f");
		   d3.select("#date").text("For ages " + (d.date)+ " : ");
			d3.select("#y2011").text(fmtround(d.lt1)+ " deaths per 1,000 in 1915");
		   d3.select("#y1841").text(fmtround(d.lt11)+ " deaths per 1,000 in 2015");
		    d3.select("#diff").text(fmtround(diff)+ " less per 1,000 in 100 years");
}
			
			
						
			//use pym to calculate chart dimensions	
		    if (pymChild) {
		        pymChild.sendHeight();
		    }
		}

		//check whether browser can cope with svg	
		if (Modernizr.svg) {
		   //load config 
			d3.json("config.json", function(error, config) {
			dvc=config

				//load chart data
				d3.csv(dvc.essential.graphic_data_url, function(error, data) {
					graphic_data = data;
					
					graphic_data.forEach(function(d) {
						d.date = d.date; 
						if(d.lt1 != "null"){d.lt1 = parseFloat(d.lt1)} else {d.lt1 = null};
						if(d.lt2 != "null"){d.lt2 = parseFloat(d.lt2)} else {d.lt2 = null};
						if(d.lt3 != "null"){d.lt3 = parseFloat(d.lt3)} else {d.lt3 = null};
						if(d.lt4 != "null"){d.lt4 = parseFloat(d.lt4)} else {d.lt4 = null};
						if(d.lt5 != "null"){d.lt5 = parseFloat(d.lt5)} else {d.lt5 = null};
						if(d.lt6 != "null"){d.lt6 = parseFloat(d.lt6)} else {d.lt6 = null};
						if(d.lt7 != "null"){d.lt7 = parseFloat(d.lt7)} else {d.lt7 = null};
						if(d.lt8 != "null"){d.lt8 = parseFloat(d.lt8)} else {d.lt8 = null};
						if(d.lt9 != "null"){d.lt9 = parseFloat(d.lt9)} else {d.lt9 = null};
						if(d.lt10 != "null"){d.lt10 = parseFloat(d.lt10)} else {d.lt10 = null};
						if(d.lt11 != "null"){d.lt11 = parseFloat(d.lt11)} else {d.lt11 = null};
					});
					
					//use pym to create iframed chart dependent on specified variables
					pymChild = new pym.Child({ renderCallback: drawGraphic});
				});
			})

		} else {
			 //use pym to create iframe containing fallback image (which is set as default)
			 pymChild = new pym.Child();
			if (pymChild) {
		        pymChild.sendHeight();
		    }
