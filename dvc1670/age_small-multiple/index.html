<!DOCTYPE html>
<html lang="en">

<head>
  <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
  <title>Changes in employment status by age over time</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../lib/globalStyle.css" />
  <style type="text/css">
    body {
      color: #323132;
       /*max-width:450px;*/
    }

    #graphic{
      float: left;
      /*max-width: 50%;*/
    }

    #annotation{
      float: left;
      /*max-width: 50%;*/
      font-size: 16px;
      fill: #666;
      font-family: 'Open Sans'
    }

    .annotation{
      font-size: 16px;
      fill: #666;
      font-family: 'Open Sans'
    }


    .x.axis path {
      display: none;
    }

    path {
      fill: none;
    }

    text {
      font-family: 'Open Sans'
    }

    text.x,
    text.y {
      font-size: 12px;
      fill: #666;
    }

    line.y,
    line.x {
      stroke: #ccc;
      stroke-width: 1px;
      shape-rendering: crispEdges;
    }

    #legend {
      font-size: 12px;
    }

    h4 {
      font-size: 16px;
      line-height: 24px;
      margin: 16px 0 16px 0;
      padding: 24px 0 0 0;
      font-weight: bold;
    }

    h5 {
      font-size: 14px;
      margin: 0 0 16px 0;
      font-weight: normal;
      padding-top: 0;
    }

    h5,
    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    ul,
    ol {
      margin: 16px 0;
      padding-left: 32px;
    }

    li {
      margin: 0 0 8px 0;
      line-height: 32px;
      font-weight: 400;
      font-size: 18px;
      padding: 0;
    }

    @media (max-width:767px) {
      li {
        font-size: 16px;
      }
    }

    .line5-yearaverage {
      stroke: #666;
      stroke-dasharray: 5 8 !important;
      stroke-linecap: round !important;
      stroke-width: 2px !important;
    }

    a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
    }

    .btn {
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
    }

    .btn--primary:focus {
      background-color: #0b5d30;
    }

    .btn--primary {
      background-color: #0F8243;
      color: #fff;
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>

<body>
  <h5 class="visuallyhidden" id="screenreadertext"></h5>
  <div aria-hidden="true" id="legend"></div>
  <div aria-hidden="true" id="graphic" style="position:relative">
    <img src="fallback.png" alt="[Chart]" />
  </div>
  <div aria-hidden="true" id="annotation" style="position:relative"></div>
  <h6 id="source"></h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js" type="text/javascript"></script>
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.1.0/d3-annotation.js" type="text/javascript"></script> -->
  <script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <!-- <script src="../lib/d3-legend.min.js" type="text/javascript"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/d3plus-text@1"></script>
  <script>
    var graphic = d3.select('#graphic');
    var annotation = d3.select('#annotation');
    var legend = d3.select('#legend');
    var pymChild = null;

    function drawGraphic() {
      //set the screenreader H5
      d3.select("#screenreadertext").text(dvc.essential.screenreadertext)

      maxweek = d3.max(graphic_data, function(d) {
        return d.date
      })

      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      if (parseInt(graphic.style("width")) < threshold_sm) {
        size = "sm";
        graphic.style("max-width","100%")
        annotation.style("max-width","0%")
        var full_graphic_width = parseInt(graphic.style("width"))
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
        graphic.style("max-width","100%")
        annotation.style("max-width","0%")
        var full_graphic_width = parseInt(graphic.style("width"))
      } else {
        size = "lg";
        graphic.style("max-width","50%")
        annotation.style("max-width","50%")
        var full_graphic_width = parseInt(graphic.style("width"))*2
      }

      if(dvc.essential.categorySort.on==true){
        categorySort = {}
        if (Array.isArray(dvc.essential.categorySort.sortby)) {
          for (i = 0; i < dvc.essential.categorySort.sortby.length; i++) {
            categorySort[dvc.essential.categorySort.sortby[i]] = i;
          }

          graphic_data.sort(function(a, b) {
            return categorySort[a.category] - categorySort[b.category]
          })

          categories = Object.keys(categorySort)
        } else if (dvc.essential.categorySort.sortby == "descending") {
          //auto sort the array by biggest value
          graphic_data.filter(function(d) {
            return d.date == maxweek
          }).sort(function(a, b) {
            return +b.chiffre - (+a.chiffre)
          }).forEach(function(item, i) {
            categorySort[item.category] = i
          });

          graphic_data.sort(function(a, b) {
            return categorySort[a.category] - categorySort[b.category]
          })

          categories = Object.keys(categorySort)
        } else if (dvc.essential.categorySort.sortby == "ascending") {
          graphic_data.filter(function(d) {
            return d.date == maxweek
          }).sort(function(a, b) {
            return +a.chiffre - (+b.chiffre)
          }).forEach(function(item, i) {
            categorySort[item.category] = i
          });

          graphic_data.sort(function(a, b) {
            return categorySort[a.category] - categorySort[b.category]
          })

          categories = Object.keys(categorySort)

        }
      }


      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) / dvc.optional.chart_every[size] - margin.left - margin.right;

      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();
      annotation.selectAll("*").remove();
      legend.selectAll("*").remove();
      d3.select("#source").selectAll("*").remove();
      d3.select("#annotation").selectAll("*").remove();

      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      console.log(full_graphic_width + margin.left + margin.right)


      //draw legend
      legend.append('svg').attr("height", dvc.optional.legendHeight[size])
        // .attr("width",600)
        .attr("width", (full_graphic_width + margin.left + margin.right))
        .append('g')
        .attr('transform', 'translate(5,5)')

      createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        dvc.essential.colour_palette.map(function(d) {
          return d.key
        }).forEach(function(d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").select('svg').append("g")

          var_group.append("rect")
            .attr("class", "rect" + i)
            .attr("fill", dvc.essential.colour_palette[i].colour)
            .attr("x", 0)
            .attr("y", 0)
            .attr("width", 20)
            .attr("height", 5)

          var_group.append("text")
            .text(dvc.essential.colour_palette[i].key)
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "14px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);


          d3.selectAll(".legend" + (i))
            .each(calcPosition);

          function calcPosition() {


            var BBox = this.getBBox()


            //prevY =BBox.width
            d3.select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > full_graphic_width) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function(d) {
                return prevX + 25;
              })


            d3.select(".rect" + (i))
              .attr("y", function(d) {

                if ((prevX + BBox.width + 50) > full_graphic_width) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }

                if (dvc.essential.legendStyle == "rect") {
                  return eval((lineNo * 20) + 5);
                } else {
                  return eval((lineNo * 20) + 12);

                }
              })
              .attr("x", function(d) {
                return prevX;
              })

            prevX = prevX + BBox.width + 50



          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()

      x = d3.scaleTime()
        .range([15, chart_width]);

      x.domain(d3.extent(graphic_data, function(d) {
        return d.date
      }))

      dates = d3.map(graphic_data, function(d) {
        return d.date
      }).keys()


      var xAxis = d3.axisBottom(x)
        // .tickValues(graphic_data
        //   .map(function(d) {
        //     return d.date
        //   }) //just get dates as seconds past unix epoch
        //   // .filter(function(d, i, arr) {
        //   //   return arr.indexOf(d) == i
        //   // }) //find unique
        //   .map(function(d) {
        //     return new Date(d)
        //   }) //map back to dates
        //   .sort(function(a, b) {
        //     return a - b
        //   })
        //   .filter(function(d, i) {
        //     return i % dvc.optional.x_ticks_every[size] === 0 && i < dates.length - dvc.optional.x_ticks_every[size] || i == dates.length - 1 //Rob's fussy comment about labelling the last date
        //   })
        // )
        .tickFormat(d3.timeFormat(dvc.essential.displayTicksFormat))

      line = d3.line()
        .x(function(d) {
          return x(d.date)
        })
        .y(function(d) {
          return y[d.category](d.chiffre)
        })


      nested = d3.nest()
        .key(function(d) {
          return d.category
        })
        .key(function(d) {
          return d.series
        })
        .sortValues(function(a, b) {
          return a.date - b.date;
        })
        .entries(graphic_data)

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      y = {}


      if (dvc.essential.yAxisScale == "auto_zero_max_total") {
        var yDomain = [0, d3.max(graphic_data, function(d) {
          return +d.chiffre
        })];
        nested.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.yAxisScale == "auto_min_max_total") {
        var yDomain = d3.extent(graphic_data, function(d) {
          return +d.chiffre
        });
        nested.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(yDomain)
            .nice();
        });
      } else if (dvc.essential.yAxisScale == "auto_min_max_each") {
        rolledup = d3.nest()
          .key(function(d) {
            return d.category
          })
          .rollup(function(v) {
            return [d3.min(v, function(d) {
              return +d.range
            }), d3.max(v, function(d) {
              return +d.range
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(item.value)
            .nice();
        });

      } else if (dvc.essential.yAxisScale == "auto_zero_max_each") {
        rolledup = d3.nest()
          .key(function(d) {
            return d.category
          })
          .rollup(function(v) {
            return [0, d3.max(v, function(d) {
              return +d.chiffre
            })]
          })
          .entries(graphic_data)

        rolledup.forEach(function(item, i) {
          y[item.key] = d3.scaleLinear()
            .range([height, 0])
            .domain(item.value)
            .nice();
        });

      }



      // sort these hardwired numbers maybe through the dimensions above
      charts = d3.select('#graphic')
        .selectAll('svg')
        .data(nested)
        .enter()
        .append('svg')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)

      charts
        .append('text')
        .attr("x", margin.left)
        .attr("y", 12)
        .text(function(d) {
          return d.key
        })
        .attr('font-weight', 700)
        .attr('font-size', "14px")

      svg = charts
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")")

      svg
        .append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0," + height + ")")
        .call(xAxis)
        .each(function(d, i) {
          if (i % dvc.optional.chart_every[size] == dvc.optional.chart_every[size] - 1 || i == nested.length - 1) {
            d3.select(this).append("text")
              .text(dvc.essential.xAxisLabel)
              .attr("transform", "translate(" + chart_width + "," + (height-margin.bottom+margin.top) + ")")
              .attr('text-anchor', 'end')
              .attr('fill', "#666");
          }
        })

      if (size == "md" | size == "sm"){
      svg
        .append('g')
        .attr('class', "annotation")
        .attr("transform", "translate(0," + (height+60) + ")")
        .append("text")
        .text(function(d){
          if (d.key == "Same occupation"){
            return "In general, those age 35 to 54 years were most likely to remain in the same occupation as the previous year, while those under 35 years were least likely to remain."
          }
          else if (d.key == "Change occupation"){
            return "This is partly explained by the higher rate of changing occupation among those aged under 35 years."
          }
          else if (d.key == "Unemployed"){
            return "Those aged under 35 years were also more likely to become unemployed. This peaked at nearly 3% in 2020 before falling back to 2% in 2021."
          }
          else{
            return "Those aged 55 years and over were most likely to become economically inactive, mostly because of retirement and early retirement and to a lesser extent because of higher rates of redundancy."
          }
        })
        .call(wrap,chart_width)

      }

      //create svg for chart

      drawyaxis = svg
        .append('g')
        .attr('class', 'y axis')

      //y axis label
      svg
        .each(function(d, i) { //only label the first graph
          // if (i % dvc.optional.chart_every[size] == 0) {
            d3.select(this).append("text")
              .attr('transform', 'translate(' + (19 - margin.left) + ', 0)')
              .attr("font-size", "11px")
              .attr("fill", "#666")
              .text(function(d, i) {
                return dvc.essential.yAxisLabel
              });
          // }
        })

      drawyaxis.each(function(d, i) {
        // if (i % dvc.optional.chart_every[size] == 0) {
          d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).ticks(3));
        // } else {
        //   d3.select(this).call(d3.axisLeft(y[d.key]).tickSize(-chart_width).tickFormat("").ticks(3))
        // }

      })

      svg
        .selectAll('g.line')
        .data(function(d) {
          return d.values;
        })
        .enter()
        .append('path')
        .attr("d", function(d) {
          // console.log(d)
          return line(d.values)
        })
        .attr("class", function(d) {
          return "line" + d.key.replace(/\s/g, '')
        })
        .attr("stroke", function(d) {
          return dvc.essential.colour_palette.filter(function(e) {
            return e.key == d.key
          })[0].colour
        })
        .attr('stroke-width', "4px")

      // svg
      //   .append('g')
      //   .attr('transform','translate('+margin.left+',0)')
      //   .append('line')
      //   .attr('x1',x(d3.timeParse(dvc.essential.dateFormat)("Mar-20")))
      //   .attr('x2',x(d3.timeParse(dvc.essential.dateFormat)("Mar-20")))
      //   .attr('y1',0)
      //   .attr('y2',height-margin.bottom)
      //   .style('stroke', '#888')
      //   .style('stroke-width', 2);
          //.style('stroke-dasharray', '5 5');   ,dash px,space px

      // create a big SVG over the top for annotations
      // annotationsLayer = d3.select("#graphic")
      //   .append('svg')
      //   .attr('id', 'annotationLayer')
      //   .attr('height', Math.ceil(nested.length / dvc.optional.chart_every[size]) * (height + margin.top + margin.bottom))
      //   .attr('width', dvc.optional.chart_every[size] * (chart_width + margin.top + margin.bottom))
      //   .style('background-color', "rgba(255, 255, 255, 0)")
      //   .style('position', 'absolute')
      //   .style('left', "0px")
      //   .style('top', "0px")

      if (size = "lg"){
        annotations = d3.select('#annotation')
          .selectAll('svg')
          .data(nested)
          .enter()
          .append('svg')
          .attr('id',function(d){
            return d.key.replace(/\s/g, '')
          })
          .attr('class',"annotation")
          .attr("width", chart_width + margin.left + margin.right)
          .attr("height", height + margin.top + margin.bottom)

          //annotation 1
          var texty = [{
              "text": "In general, those aged <strong>35 to 54 years</strong> were most likely to remain in the same occupation as the previous year, while those aged <strong>under 35 years</strong> were least likely to remain.",
              "x": 5,
              "y": height/4
            }
          ]

          new d3plus.TextBox()
            .data(texty)
            .fontSize(18)
            .fontColor('#323132')
            .fontFamily('Open Sans')
            .width(250)
            .select('#Sameoccupation')
            .x(function(d) {
              return d.x
            })
            .y(function(d) {
              return d.y
            })
            .render();

          d3.selectAll('.d3plus-textBox').each(function(d, i) {
            var transform = d3.select(this).attr('transform').split("(")[1].split(")")[0].split(/[\s,]+/)
            transform = transform.map(function(d) {
              return +d
            })
          })

          d3.select("#d3plus-textBox-0").selectAll('text').selectAll('tspan')._groups.forEach(function(d, i) {
            if (i < 3) {
              d3.select(d[0]).style('fill', "#118C7B")
            } else if (i > 0) {
              d3.select(d[0]).style('fill', "#206095")
            }
          })

          //annotation 2
          var texty = [{
              "text": "This is partly explained by the higher rate of changing occupation among those aged <strong>under 35 years</strong>.",
              "x": 5,
              "y": height/3
            }
          ]

          new d3plus.TextBox()
            .data(texty)
            .fontSize(18)
            .fontColor('#323132')
            .fontFamily('Open Sans')
            .width(250)
            .select('#Changedoccupation')
            .x(function(d) {
              return d.x
            })
            .y(function(d) {
              return d.y
            })
            .render();

          d3.selectAll('#Changedoccupation .d3plus-textBox').each(function(d, i) {
            var transform = d3.select(this).attr('transform').split("(")[1].split(")")[0].split(/[\s,]+/)
            transform = transform.map(function(d) {
              return +d
            })
          })

          d3.select("#Changedoccupation #d3plus-textBox-0").selectAll('text').selectAll('tspan')._groups.forEach(function(d, i) {
            if (i < 5) {
              d3.select(d[0]).style('fill', "#206095")
            } else{
              d3.select(d[0]).style('fill', "#118C7B")
            }
          })

          //annotation 3
          var texty = [{
              "text": "Those aged <strong>under 35 years</strong> were also more likely to become unemployed. This peaked at nearly 3% in 2020 before falling back to 2% in 2021.",
              "x": 5,
              "y": height/4
            }
          ]

          new d3plus.TextBox()
            .data(texty)
            .fontSize(18)
            .fontColor('#323132')
            .fontFamily('Open Sans')
            .width(250)
            .select('#Unemployed')
            .x(function(d) {
              return d.x
            })
            .y(function(d) {
              return d.y
            })
            .render();

          d3.selectAll('#Unemployed .d3plus-textBox').each(function(d, i) {
            var transform = d3.select(this).attr('transform').split("(")[1].split(")")[0].split(/[\s,]+/)
            transform = transform.map(function(d) {
              return +d
            })
          })

          d3.select("#Unemployed #d3plus-textBox-0").selectAll('text').selectAll('tspan')._groups.forEach(function(d, i) {
            if (i < 5) {
              d3.select(d[0]).style('fill', "#206095")
            } else{
              d3.select(d[0]).style('fill', "#118C7B")
            }
          })

          //annotation 4
          var texty = [{
              "text": "Those <strong>aged 55 years and over</strong> were most likely to become economically inactive, mostly because of retirement and early retirement and to a lesser extent because of higher rates of redundancy.",
              "x": 5,
              "y": height/4
            }
          ]

          new d3plus.TextBox()
            .data(texty)
            .fontSize(18)
            .fontColor('#323132')
            .fontFamily('Open Sans')
            .width(250)
            .select('#Inactive')
            .x(function(d) {
              return d.x
            })
            .y(function(d) {
              return d.y
            })
            .render();

          d3.selectAll('#Inactive .d3plus-textBox').each(function(d, i) {
            var transform = d3.select(this).attr('transform').split("(")[1].split(")")[0].split(/[\s,]+/)
            transform = transform.map(function(d) {
              return +d
            })
          })

          d3.select("#Inactive #d3plus-textBox-0").selectAll('text').selectAll('tspan')._groups.forEach(function(d, i) {
            if (i < 5) {
              d3.select(d[0]).style('fill', "#A8BD3A")
            } else{
              d3.select(d[0]).style('fill', "#118C7B")
            }
          })

        }


        function wrap(text, width) {
    				text.each(function () {
    						var text = d3.select(this),
    								words = text.text().split(/\s+/).reverse(),
    								word,
    								line = [],
    								lineNumber = 0,
    								lineHeight = 1.1, // ems
    								x = 0,
    								y = text.attr("y"),
    								dy = 0, //parseFloat(text.attr("dy")),
    								tspan = text.text(null)
    														.append("tspan")
    														.attr("x", x)
    														.attr("y", y)
    														.attr("dy", dy + "em");
    						while (word = words.pop()) {
    								line.push(word);
    								tspan.text(line.join(" "));
    								if (tspan.node().getComputedTextLength() > width) {
    										line.pop();
    										tspan.text(line.join(" "));
    										line = [word];
    										if (lineNumber == 0 & (size == "sm" | size == "md")){
    											++lineNumber
    										}
                        else if (lineNumber < 10 & size == "lg"){
                          ++lineNumber
                        }
    										tspan = text.append("tspan")
    																.attr("x", x)
    																.attr("y", y)
    																.attr("dy",	lineNumber * lineHeight + dy + "em")
    																.text(word);

    						}
    				});
    		}

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config;

        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          graphic_data = data;

          graphic_data.forEach(function(d) {
            d.date = d3.timeParse(dvc.essential.dateFormat)(d.date)
          })
          //use pym to create iframed chart dependent on specified variables
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });

      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
