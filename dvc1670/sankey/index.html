    body {

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MBCBVQS" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <h5 id="alt_text" class="visuallyhidden"></h5>
  <div aria-hidden="true" id="info"></div>
  <div aria-hidden="true" id="graphic">
    <img src="fallback.png" alt="Image of sankey diagram showing ....." />
  </div>

  <h6 id="source"></h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
  <script src="../lib/modernizr.svg.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
  <script src="sankey.js"></script>
<script>


var graphic = d3.select('#graphic');
var pymChild = null;

function drawGraphic(width) {
   var threshold_md = 788;
   var threshold_sm = dvc.optional.mobileBreakpoint;

    //set variables for chart dimensions dependent on width of #graphic
    if (parseInt(graphic.style("width")) < threshold_sm) {
                    var margin = {	top: 	dvc.optional.margin_sm[0],
                            right: 	dvc.optional.margin_sm[1],
                            bottom: dvc.optional.margin_sm[2],
                            left: 	dvc.optional.margin_sm[3]
                          };
                    var size = "sm";
                    var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
                    var height = Math.ceil((chart_width * dvc.optional.aspectRatio_sm[1]) / dvc.optional.aspectRatio_sm[0]) - margin.top - margin.bottom;
                      }

  else if (parseInt(graphic.style("width")) < threshold_md){
                        var margin = {	top: 	dvc.optional.margin_md[0],
                            right: 	dvc.optional.margin_md[1],
                            bottom: dvc.optional.margin_md[2],
                            left: 	dvc.optional.margin_md[3]
                          };
                    var size = "md";
                    var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
                          var height = Math.ceil((chart_width * dvc.optional.aspectRatio_md[1]) / dvc.optional.aspectRatio_md[0]) - margin.top - margin.bottom;
                    }

     else {
                        var margin = {	top: 	dvc.optional.margin_lg[0],
                            right: 	dvc.optional.margin_lg[1],
                            bottom: dvc.optional.margin_lg[2],
                            left: 	dvc.optional.margin_lg[3]
                          };
                    var size = "lg";
                    var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
                          var height = Math.ceil((chart_width * dvc.optional.aspectRatio_lg[1]) / dvc.optional.aspectRatio_lg[0]) - margin.top - margin.bottom;
                    }

    // clear out existing graphics
    graphic.selectAll("*").remove();


    var formatNumber = d3.format(dvc.essential.format),    // zero decimal places
        fmt = function(d) { return dvc.essential.unit_preffix+""+ formatNumber(d) + " " + dvc.essential.unit_suffix; },
        color = d3.scaleOrdinal(dvc.essential.colour_palette);

    colors =  []

    graphic_data.forEach(function(d){
      if(colors.includes(d.target)){

      } else {
        colors.push(d.target)
      }
    })

    color.domain(colors)

        // Set the sankey diagram properties
        var sankey = d3.sankey()
            .nodeWidth(25)
            .nodePadding(10)
            .size([chart_width, height]);

        var path = sankey.link();

        //set up graph in same style as original example but empty
        //prepend T_ and S_ to deal with nodes that have the same name
        graph = {"nodes" : [], "links" : []};

        graphic_data.forEach(function (d) {
          graph.nodes.push({ "name": "S_"+d.source });
          graph.nodes.push({ "name": "T_"+d.target });
          graph.links.push({ "source": "S_"+d.source,
                             "target": "T_"+d.target,
                             "value": +d.value });
         });

        // return only the distinct / unique nodes
        graph.nodes = d3.keys(d3.nest()
          .key(function (d) { return d.name; })
          .object(graph.nodes));

        // loop through each link replacing the text with its index from node
        graph.links.forEach(function (d, i) {
          graph.links[i].source = graph.nodes.indexOf(graph.links[i].source);
          graph.links[i].target = graph.nodes.indexOf(graph.links[i].target);
        });

        // now loop through each nodes to make nodes an array of objects
        // rather than an array of strings
        //remove T_ and S_ as no longer required
        graph.nodes.forEach(function (d, i) {
          graph.nodes[i] = { "name": d.replace("T_","").replace("S_", "") };
        });

        sankey.nodes(graph.nodes)
            .links(graph.links)
            .layout(0);

        var svg = d3.select('#graphic')
              .append('svg')
              .attr("id","chart")
							.style("background-color","#fff")
							.attr("width", chart_width + margin.left + margin.right)
							.attr("height", height + margin.top + margin.bottom )  //+30)
							.append("g")
							.attr("transform", "translate(" + margin.left + "," + margin.top + ")");

					svg.append("rect")
						.style("fill", "#fff")
						.attr("width", chart_width)
						.attr("height", height);

          // add in the links
          var link = svg.append("g").selectAll(".link")
              .data(graph.links)
            .enter().append("path")
              .attr("class", function(d){
                return "link S_"+colors.indexOf(d.source.name)+ " T_"+colors.indexOf(d.target.name)
              })
              .attr("d", path)
              .style("stroke-width", function(d) {
                  return Math.max(1, d.dy);
               })
              .style("stroke", function (d){
                if(colors.indexOf(d.source.name) == 0 & colors.indexOf(d.target.name) == 0){
                  return "white"
                }
                else{
                 return color(d.source.name);
               }
               })
              .sort(function(a, b) { return b.dy - a.dy; })
              .on('mouseover', function(d) {
                  d3.select("#info").html(d.source.name + " &#8594; " + d.target.name  + ": <span class='bold'> "+ fmt(d.value)+"% </span>")
                  d3.select(this).classed("highlight_path", true)
              })
              .on('mouseout', function() {
                  d3.select("#info").html(null);
                  d3.selectAll("path").classed("highlight_path", false)
              })

          // add in the nodes
          var node = svg.append("g").selectAll(".node")
              .data(graph.nodes)
            .enter().append("g")
              .attr("class", "node")
              .attr("transform", function(d) {
                  return "translate(" + d.x + "," + d.y + ")";
              });

          // add the rectangles for the nodes
          node.append("rect")
              .attr("id", function(d,){
                  if(d.sourceLinks.length != 0){
                    return "S_"+colors.indexOf(d.name);
                  } else {
                    return "T_"+colors.indexOf(d.name);
                  }
              })
              // .attr("pointer-events", function(d,){
              //     if(d.sourceLinks.length != 0){
              //       return "all"
              //     } else {
              //       return "none"
              //     }
              // })
              .attr("height", function(d) { return d.dy; })
              .attr("width", sankey.nodeWidth())
              .style("fill", function (d){
                 return color(d.name);
               })
              .on('mouseover', function(d) {
                  d3.select("#info").html(d.name + ": <span class='bold'>"+ fmt(d.value) + "%</span>");
                  d3.select(this).classed("highlight", true);
                  d3.selectAll("."+this.id).classed("highlight_path", true)
              })
              .on('mouseout', function(d) {
                  d3.select("#info").html(null);
                  d3.select(this).classed("highlight", false)
                  d3.selectAll("path").classed("highlight_path", false)
              })



              // add in the title for the nodes
             node.append("text")
                 .attr("x", -6)
                 .attr("y", function(d) { return d.dy / 2; })
                 .attr("dy", ".35em")
                 .attr("text-anchor", "end")
                 .attr("transform", null)
                 .attr("display","none")
                 .text(function(d) { return d.name; })
                 .filter(function(d) {
                   if (size == "sm"){
                    return d.x < chart_width / 2;
                  }
                  else{
                      return d.x < chart_width
                    }
                  })
                 .attr("text-anchor", "start")
                 .attr("display","auto")
                //  .call(wrap, margin.right)
                 .call(wrap,200)
                 .attr("dx",sankey.nodeWidth()+6)

            // node.append("text")
            //   .attr("x",-10)
            //   .attr("y", function(d) { return d.dy / 2; })
            //   .attr("dy", ".35em")
            //   .attr("text-anchor", "end")
            //   .filter(function(d) { return d.x < chart_width / 2; })
            //   .text("%")
            //
            // svg.append("text")
            //   // .attr("x",-20)
            //   .attr("y",-40)
            //   .text("Proportion not staying in same occupation")
            //   .attr("class","yaxislabel")
            //   .call(wrap2,100)


            d3.select("#alt_text").text(dvc.essential.alt_text)

             //create link to source
             d3.select("#source")
               .text("Source: " + dvc.essential.source)

               function wrap(text, width) {
                  text.each(function () {
                      var text = d3.select(this),
                          words = text.text().split(/\s+/).reverse(),
                          word,
                          line = [],
                          lineNumber = 0,
                          lineHeight = 1.1, // ems
                          x = 0,
                          y = text.attr("y"),
                          dy = 0, //parseFloat(text.attr("dy")),
                          tspan = text.text(null)
                                      .append("tspan")
                                      .attr("x", x)
                                      .attr("y", y)
                                      .attr("dy", dy + "em");
                      while (word = words.pop()) {
                          line.push(word);
                          tspan.text(line.join(" "));
                          if (tspan.node().getComputedTextLength() > width) {
                              line.pop();
                              tspan.text(line.join(" "));
                              line = [word];
                              if (lineNumber < 10){
                                 ++lineNumber
                               }
                              tspan = text.append("tspan")
                                          .attr("x", x+6+sankey.nodeWidth())
                                          .attr("y", y)
                                          .attr("dy",	lineNumber * lineHeight + dy + "em")
                                          .text(word);
                          }
                      }
                  });
              }

              function wrap2(text, width) {
                 text.each(function () {
                     var text = d3.select(this),
                         words = text.text().split(/\s+/).reverse(),
                         word,
                         line = [],
                         lineNumber = 0,
                         lineHeight = 1.1, // ems
                         x = -30,
                         y = text.attr("y"),
                         dy = 0, //parseFloat(text.attr("dy")),
                         tspan = text.text(null)
                                     .append("tspan")
                                     .attr("x", x)
                                     .attr("y", y)
                                     .attr("dy", dy + "em");
                     while (word = words.pop()) {
                         line.push(word);
                         tspan.text(line.join(" "));
                         if (tspan.node().getComputedTextLength() > width) {
                             line.pop();
                             tspan.text(line.join(" "));
                             line = [word];
                             if (lineNumber < 10){
                                ++lineNumber
                              }
                             tspan = text.append("tspan")
                                         .attr("x", x)
                                         .attr("y", y)
                                         .attr("dy",	lineNumber * lineHeight + dy + "em")
                                         .text(word);
                         }
                     }
                 });
             }


} //end drawGraphic


//check whether browser can cope with svg
  if (Modernizr.svg) {
     //load config
    d3.json("config.json", function(error, config) {
    dvc=config

      //load chart data
      d3.csv(dvc.essential.graphic_data_url, function(error, data) {
        graphic_data = data;
        graphic_data.sort((a, b) => d3.ascending(b.target))

      //  graphic_data.forEach(function(d) {

      //  });

        //use pym to create iframed chart dependent on specified variables
        pymChild = new pym.Child({ renderCallback: drawGraphic});
      });
    })

  } else {
     //use pym to create iframe containing fallback image (which is set as default)
     pymChild = new pym.Child();
    if (pymChild) {
          pymChild.sendHeight();
      }
  }

</script>
