<body>

  <script>

    var pymChild = null;

    function drawGraphic() {

      codes = d3.map(graphic_datas[0], function(d){return d.codes;}).keys()
      names = d3.map(graphic_datas[0], function(d){return d.names;}).keys()


      margin = dvc.essential.margins;
      csvs = dvc.essential.graphic_data_url
      datakeys = []

      //set dropdown initially as first code
      occupation = codes[0]

      // createDropdown(codes, names)

      createStructure(dvc.essential.setup, occupation)

      function createStructure(setup, occupation) {

        items = d3.select("#variables").selectAll("div.item")
          .data(setup)
          .enter()
          .append('div')
          .attr('class', "item")
          .attr('id', function(d){return d.label})

        infoColumn = items.append('div')
          .attr('class', 'info')

        infoColumn.append('div').html(function(d) {
          return d.label
        }).attr('class', 'category')
        infoColumn.append('div').html("Change year to Sept 2016 – year to Sept 2020").attr('class', 'legendlabel')
        infoColumn.append('div').html("Change year to Sept 2020 – year to Sept 2021").attr('class', 'legendlabel')


        infoDiv = infoColumn.append('div').attr('class', 'infoDiv')

        // infoDiv.append('span')
        //   .attr('id', function(d) {
        //     return 'value' + d.csv
        //   })
        //   .attr('class', 'value')
        //
        // unitOnValue = infoDiv.append('span')
        //   .attr('class', 'unit')

        variableColumn = items.append('div')
          .attr('class', 'variable')



        width = parseInt(d3.select('body').style('width'))

        if (width > dvc.optional.mobileBreakpoint) {
          chart_width = width - parseInt(d3.select('.info').style('width')) - margin.left - margin.right
        } else {
          chart_width = Math.min(400,width - margin.left - margin.right) //- dvc.essential.infoColumnWidth
        }
        height = dvc.essential.heightperstrip - margin.top - margin.bottom

        svg = variableColumn.append('svg')
          .attr('width', chart_width + margin.left + margin.right)
          .attr('height', dvc.essential.heightperstrip)
          .append('g')
          .attr('id', function(d) {
            return "svg" + d.csv
          })
          .attr('transform', 'translate(' + margin.left + ',' + margin.top + ')')

        legend = infoDiv.append('svg').attr('height',dvc.essential.heightperstrip-30)
        .attr('width',Math.min(width,420))
        .append('g')
        .attr('id',function(d){return 'legend'+d.csv})

        svg.each(function(d, i) {
          drawAreaChart(graphic_datas[i], graphic_datas[i].columns[2], d.csv, occupation)
        })

      }


      function drawAreaChart(thisdata, key, selection, occupation) {

        thissvg = d3.select("#svg" + selection)
        thisinfo = d3.select("#legend" + selection)

        // previousdata = thisdata.filter(function(d){
        //   return d.codes == previousOccupation
        // })

        data = thisdata.filter(function(d) {
          return d.codes == occupation;
        })

        //clear svg
        thissvg.selectAll("*").remove()
        thisinfo.selectAll("*").remove()

        var x = d3.scaleTime()
          .range([10, chart_width])
          .domain(d3.extent(data.map(function(d) {
            return d.date
          })))


        var y = d3.scaleLinear()
          .range([dvc.essential.heightperstrip-margin.bottom-margin.top,margin.top])

        var z = d3.scaleOrdinal().range(dvc.essential.colour_palette);

        var stack = d3.stack();

        // var previousArea = d3.area()
        //             .x(function(d, i) { return x(previousdata.date); })
        //             .y0(function(d) { return y(d[0]); })
        //             .y1(function(d) { return y(d[1]); });

        var area = d3.area()
                    .x(function(d, i) { return x(d.data.date); })
                    .y0(function(d) { return y(d[0]); })
                    .y1(function(d) { return y(d[1]); });

        var xAxis = d3.axisBottom(x)
          .tickFormat(function(d,i) {
          	  var fmt = d3.timeFormat(dvc.essential.dateFormat);
              return fmt(d)
            })
        	.tickPadding(5)
          .tickValues([new Date(2016,8,1), new Date(2017,8,1), new Date(2018,8,1), new Date(2019,8,1), new Date(2020,8,1), new Date (2021,8,1)])

        var yAxis = d3.axisLeft(y)
          .tickPadding(10);

        // specify number or ticks on y axis
        if (width <= dvc.optional.mobileBreakpoint) {
          yAxis.ticks(dvc.optional.y_num_ticks_sm_md[0])
         } else {
          yAxis.ticks(dvc.optional.y_num_ticks_sm_md[1])
         }

        var y_axis_grid = function() { return yAxis; }

        var line = d3.line()
 		        .x(function(d) { return x(d.date); })
 		        .y(function(d) { return y(d.amt); });


        //convert data into columns based on categories
        var lines = {};
        for (var column in data[0]) {
            if (column == 'date' | column == "codes" | column == "names" | column == "total") continue;
            lines[column] = data.map(function(d) {
                return {
                    'date': d.date,
                    'amt': d[column]
                };
            });
        }


        //y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
        var minY = d3.min(data, d => +d.Total)
        var maxY = d3.max(data, d => +d.Total)
        if (dvc.essential.yAxisScale == "auto_zero_max"){
          var yDomain = [
            0,maxY
          ]
        }

      //   if (dvc.essential.yAxisScale == "auto_zero_max"){
      //    var yDomain = [
      //           0,
      //           d3.max(d3.entries(lines), function(c) {
      //             return d3.max(c.value, function(v) {
      //               var n = v.amt;
      //               return Math.ceil(n);
      //             });
      //           })
      //          ];
      // } else if (dvc.essential.yAxisScale == "auto_min_max"){
      //   var yDomain = [
      //           d3.min(d3.entries(lines), function(c) {
      //             return d3.min(c.value, function(v) {
      //               var n = v.amt;
      //               return Math.floor(n);
      //             });
      //           }),
      //
      //           d3.max(d3.entries(lines), function(c) {
      //             return d3.max(c.value, function(v) {
      //               var n = v.amt;
      //               return Math.ceil(n);
      //             });
      //           })
      //         ];
      // } else {
      //    var yDomain = dvc.essential.yAxisScale;
      //   }

        y.domain(yDomain);

        thissvg.append("g")
          .attr("class", "y axis")
          .call(d3.axisLeft(y)
              .ticks(5)
              .tickSize(-chart_width))

          thissvg.append('g')
				        .attr('class', 'x axis')
				        .attr('transform', function(d){
				        			if(yDomain[0] != 0){
										return 'translate(0,' + (height + 30) + ')'
									} else {
										return 'translate(0,' + height  + ')'
									}
							})
				        .call(xAxis);

          d3.select(".x").select("path").style("stroke", "#666")

          //create icon to symbolise break in y axis if required
          if(yDomain[0] > 0 && dvc.essential.yAxisBreak == true){
             var paths = thissvg.append("defs")
                   .append("g")
                   .attr("id","icon")
                   .append("g");

               paths.append("polyline")
                  .attr("points", "2.881,9.54 7.94,5.061 12.341,9.54 17.77,5.061")
                  .attr("stroke", "#666")
                  .attr("fill", "none")
               paths.append("polyline")
                  .attr("points", "2.881,14.54 7.94,10.061 12.341,14.54 17.77,10.061")
                  .attr("stroke", "#666")
                  .attr("fill", "none");
          }

          var keys = thisdata.columns.slice(4);
          z.domain(keys);
          stack.keys(keys);


          var layer = thissvg.selectAll(".layer")
          .data(stack(data))
          .enter().append("g")
            .attr("class", "layer")
            .attr('id',function(d){return d.key.replace(/\s/g, '')})

            layer.append("path")
            .attr("class", "area")
            .attr('id',function(d){return d.key.replace(/\s/g, '')})
            .style("fill", function(d) { return z(d.key); })
            .attr("d", area)
            .on("mouseover",function(d){
              var id = d3.select(this).attr('id')
              handleMouseOver(id, selection);
            })
            .on("mouseout", function(d){
              var id = d3.select(this).attr('id')
              handleMouseOff(id, selection);
            });

          d3.selectAll("#Missing").style("fill","#CCC")


          yPos = 20
          if (width <= dvc.optional.mobileBreakpoint){
            xPos = 20
          }
          else{
            xPos = 0
          }
          reverseKeys = keys.reverse()
          //create the legend and info panel
          reverseKeys.forEach(function(d){
            if (d != "Missing"){
              d3.select("#legend"+selection)
              .append('rect')
              .attr('class','legendrect')
              .attr('id',d.replace(/\s/g, ''))
              .attr('y',yPos-15)
              .attr('x',xPos)
              .attr('width',function(d){
                if (width > dvc.optional.mobileBreakpoint){
                  return 400
                }
                else{
                  return width-40
                }
              })
              .attr('height',25)
              .style('opacity',0.8)
              .style("fill", z(d))
              .on("mouseover",function(d){
                var id = d3.select(this).attr('id')
                handleMouseOver(id, selection);
              })
              .on("mouseout", function(d){
                var id = d3.select(this).attr('id')
                handleMouseOff(id, selection);
              })

              d3.select("#legend"+selection)
              .append('text')
              .attr('class','legendtext')
              .attr('id',d.replace(/\s/g, ''))
              .text(d)
              .attr('y',yPos)
              .attr('x',xPos+5)
              .style("fill", "white")
              .on("mouseover",function(d){
                var id = d3.select(this).attr('id')
                handleMouseOver(id, selection);
              })
              .on("mouseout", function(d){
                var id = d3.select(this).attr('id')
                handleMouseOff(id, selection);
              })

              d3.select("#legend"+selection)
              .append('text')
              .attr('class','changetext')
              .attr('id',d.replace(/\s/g, ''))
              .text(function(){
                change = Math.round((data[4][d]-data[0][d])/1000)*1000
                // change = data[5][d] - data[0][d]
                if (change > 100000){
                  return "▲"+d3.format(".3s")(change)
                }
                else if (change < -100000){
                  return "▼"+d3.format(".3s")(-change)
                }
                else if (change > 10000 & change <= 100000){
                  return "▲"+d3.format(".2s")(change)
                }
                else if (change < -10000 & change >= -100000){
                  return "▼"+d3.format(".2s")(-change)
                }
                else if (change >= -10000 & change < 0){
                  return "▼"+d3.format(".1s")(-change)
                }
                else if (change <= 10000 & change > 0){
                  return "▲"+d3.format(".1s")(change)
                }
                else{
                  return "No change"
                }
              })
              .attr('y',yPos)
              .attr('x',xPos+(Math.min(chart_width/3,130)))
              .style("fill", "white")
              .on("mouseover",function(d){
                var id = d3.select(this).attr('id')
                handleMouseOver(id, selection);
              })
              .on("mouseout", function(d){
                var id = d3.select(this).attr('id')
                handleMouseOff(id, selection);
              })

              d3.select("#legend"+selection)
              .append('text')
              .attr('class','percchangetext')
              .attr('id',d.replace(/\s/g, ''))
              .text(function(){
                change = (data[4][d] - data[0][d])/data[0][d]
                if (change >= 0.005){
                  return "▲"+d3.format(".0%")(change)
                }
                else if (change < -0.005){
                  return "▼"+d3.format(".0%")(-change)
                }
                else{
                  return d3.format(".0%")(change)
                }
              })
              .attr('y',yPos)
              .attr('x',xPos+(Math.min(chart_width/1.75,200)))
              .style("fill", "white")
              .on("mouseover",function(d){
                var id = d3.select(this).attr('id')
                handleMouseOver(id, selection);
              })
              .on("mouseout", function(d){
                var id = d3.select(this).attr('id')
                handleMouseOff(id, selection);
              })

              d3.select("#legend"+selection)
              .append('text')
              .attr('class','changetext')
              .attr('id',d.replace(/\s/g, ''))
              .text(function(){
                change = Math.round((data[5][d]-data[4][d])/1000)*1000
                // change = data[5][d] - data[0][d]
                if (change > 100000){
                  return "▲"+d3.format(".3s")(change)
                }
                else if (change < -100000){
                  return "▼"+d3.format(".3s")(-change)
                }
                else if (change > 10000 & change <= 100000){
                  return "▲"+d3.format(".2s")(change)
                }
                else if (change < -10000 & change >= -100000){
                  return "▼"+d3.format(".2s")(-change)
                }
                else if (change >= -10000 & change < 0){
                  return "▼"+d3.format(".1s")(-change)
                }
                else if (change <= 10000 & change > 0){
                  return "▲"+d3.format(".1s")(change)
                }
                else{
                  return "No change"
                }
              })
              .attr('y',yPos)
              .attr('x',xPos+(Math.min(chart_width/1.25,270)))
              .style("fill", "white")
              .on("mouseover",function(d){
                var id = d3.select(this).attr('id')
                handleMouseOver(id, selection);
              })
              .on("mouseout", function(d){
                var id = d3.select(this).attr('id')
                handleMouseOff(id, selection);
              })

              d3.select("#legend"+selection)
              .append('text')
              .attr('class','percchangetext')
              .attr('id',d.replace(/\s/g, ''))
              .text(function(){
                change = (data[5][d] - data[4][d])/data[4][d]
                if (change >= 0.005){
                  return "▲"+d3.format(".0%")(change)
                }
                else if (change < -0.005){
                  return "▼"+d3.format(".0%")(-change)
                }
                else{
                  return d3.format(".0%")(change)
                }
              })
              .attr('y',yPos)
              .attr('x',xPos+(Math.min(chart_width,340)))
              .style("fill", "white")
              .on("mouseover",function(d){
                var id = d3.select(this).attr('id')
                handleMouseOver(id, selection);
              })
              .on("mouseout", function(d){
                var id = d3.select(this).attr('id')
                handleMouseOff(id, selection);
              })


              yPos = yPos+30

            }
          })


          thissvg.append('rect')
            .attr('x',-margin.left)
            .attr('y',-margin.top-10)
            .attr('height',margin.top+margin.bottom)
            .attr('width',chart_width+margin.left)
            .attr('fill',"white")

            thissvg.append('text')
              .attr('class','yaxislabel')
              .attr('x',-margin.left)
              .attr('y',margin.top-10)
              .text(dvc.optional.yAxisLabel)

      }


      function updateAreaChart(thisdata, key, selection, occupation) {

        thissvg = d3.select("#svg" + selection)
        thisinfo = d3.select("#legend" + selection)

        // previousdata = thisdata.filter(function(d){
        //   return d.codes == previousOccupation
        // })

        data = thisdata.filter(function(d) {
          return d.codes == occupation;
        })

        var x = d3.scaleTime()
          .range([10, chart_width])
          .domain(d3.extent(data.map(function(d) {
            return d.date
          })))

        var y = d3.scaleLinear()
          .range([dvc.essential.heightperstrip-margin.bottom-margin.top,margin.top])

        var z = d3.scaleOrdinal().range(dvc.essential.colour_palette);

        var stack = d3.stack();

        var area = d3.area()
                    .x(function(d, i) { return x(d.data.date); })
                    .y0(function(d) { return y(d[0]); })
                    .y1(function(d) { return y(d[1]); });

        var xAxis = d3.axisBottom(x)
          .tickFormat(function(d,i) {
              var fmt = d3.timeFormat(dvc.essential.dateFormat);
              return fmt(d)
            })
          .tickPadding(5)
          .tickValues(d3.timeParse(dvc.essential.dateFormat)(dvc.essential.dateticks))


        var yAxis = d3.axisLeft(y)
          .tickPadding(10);


        // specify number or ticks on y axis
        if (width <= dvc.optional.mobileBreakpoint) {
          yAxis.ticks(dvc.optional.y_num_ticks_sm_md[0])
         } else {
          yAxis.ticks(dvc.optional.y_num_ticks_sm_md[1])
         }

        var y_axis_grid = function() { return yAxis; }

        var line = d3.line()
            .x(function(d) { return x(d.date); })
            .y(function(d) { return y(d.amt); });


        //convert data into columns based on categories
        var lines = {};
        for (var column in data[0]) {
            if (column == 'date' | column == "codes" | column == "names" | column == "total") continue;
            lines[column] = data.map(function(d) {
                return {
                    'date': d.date,
                    'amt': d[column]
                };
            });
        }


        //y domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
        var minY = d3.min(data, d => +d.Total)
        var maxY = d3.max(data, d => +d.Total)
        if (dvc.essential.yAxisScale == "auto_zero_max"){
          var yDomain = [
            0,maxY
          ]
        }

      //           0,

      //             return d3.max(c.value, function(v) {

      //             });
      //           })
      //          ];
      // } else if (dvc.essential.yAxisScale == "auto_min_max"){
      //   var yDomain = [
      //           d3.min(d3.entries(lines), function(c) {
      //             return d3.min(c.value, function(v) {
      //               var n = v.amt;
      //               return Math.floor(n);
      //             });
      //           }),
      //
      //           d3.max(d3.entries(lines), function(c) {
      //             return d3.max(c.value, function(v) {
      //               var n = v.amt;
      //               return Math.ceil(n);
      //             });
      //           })
      //         ];
      // } else {
      //    var yDomain = dvc.essential.yAxisScale;
      //   }

        y.domain(yDomain);

        thissvg.selectAll("g .y.axis")
          .transition().duration(400)
          .call(d3.axisLeft(y)
              .ticks(5)
              .tickSize(-chart_width))

          var keys = thisdata.columns.slice(4);
          z.domain(keys);
          stack.keys(keys);

          thissvg.selectAll("g .layer path")
          .data(stack(data))
          .enter()

            thissvg.selectAll("g .layer path")
            .transition().duration(400).delay(150)
            .attr("d", area)

        d3.selectAll("#legend"+selection+" .changetext").remove("*")
        d3.selectAll("#legend"+selection+" .percchangetext").remove("*")

        yPos = 20
        if (width <= dvc.optional.mobileBreakpoint){
          xPos = 20
        }
        else{
          xPos = 0
        }


        reverseKeys = keys.reverse()
        //create the legend and info panel
        reverseKeys.forEach(function(d){
          if (d != "Missing"){
            d3.select("#legend"+selection)
            .append('text')
            .attr('class','changetext')
            .attr('id',d.replace(/\s/g, ''))
            .text(function(){
              change = Math.round((data[5][d]-data[0][d])/100)*100
              // change = data[5][d] - data[0][d]
              if (change >= 100){
                return "▲"+d3.format(".2s")(change)
              }
              else if (change <= -100){
                return "▼"+d3.format(".2s")(-change)
              }
              else{
                return "No change"
              }
            })
            .attr('y',yPos)
            .attr('x',xPos+130)
            .style("fill", "white")
            .on("mouseover",function(d){
              var id = d3.select(this).attr('id')
              handleMouseOver(id, selection);
            })
            .on("mouseout", function(d){
              var id = d3.select(this).attr('id')
              handleMouseOff(id, selection);
            })

            d3.select("#legend"+selection)
            .append('text')
            .attr('class','percchangetext')
            .attr('id',d.replace(/\s/g, ''))
            .text(function(){
              change = (data[5][d] - data[0][d])/data[0][d]
              if (change >= 0.005){
                return "▲"+d3.format(".0%")(change)
              }
              else if (change < -0.005){
                return "▼"+d3.format(".0%")(-change)
              }
              else{
                return d3.format(".0%")(change)
              }
            })
            .attr('y',yPos)
            .attr('x',xPos+200)
            .style("fill", "white")
            .on("mouseover",function(d){
              var id = d3.select(this).attr('id')
              handleMouseOver(id, selection);
            })
            .on("mouseout", function(d){
              var id = d3.select(this).attr('id')
              handleMouseOff(id, selection);
            })

            yPos = yPos+30
          }
        })
      }

      function handleMouseOver(id, selection){
          d3.selectAll("#svg"+selection+" .area")
            .transition().duration(100).delay(150)
            .style('opacity',0.3)
          d3.selectAll("#legend"+selection+" rect")
            .transition().duration(100).delay(150)
            .style('opacity',0.3)
          d3.selectAll("#"+id+" .area")
            .transition().duration(100).delay(150)
            .style('opacity',0.85)
          d3.selectAll("#legend"+selection+" #"+id+ ".legendrect")
            .transition().duration(100).delay(150)
            .style('opacity',0.85)
      }

      function handleMouseOff(id, selection){
          d3.selectAll("#svg"+selection+" .area")
            .transition().duration(100).delay(250)
            .style('opacity',0.75)
          d3.selectAll("#legend"+selection+" rect")
            .transition().duration(100).delay(250)
            .style('opacity',0.75)
            .style('stroke-width',0)
      }

      function createDropdown(codes, names) {
        var menuarea = d3.zip(codes, names).sort(function(a, b) {
          return d3.ascending(a[1]);
        });

        //clear dropdown
        d3.select("#dropdown").selectAll("*").remove()

        // Build option menu for dropdown
        var optns = d3.select("#dropdown").append("div").attr("id", "sel").append("select")
          .attr("id", "dropselect")
          .attr("class", "chosen-select");

        optns.append("option") //blank option for placeholder

        optns.selectAll("p").data(menuarea).enter().append("option")
          .attr("id", function(d) {
            return d[1].replace(/[,.' ]/g, "").trim()
          })
          .attr("value", function(d) {
            return d[0]
          })
          .text(function(d) {
            return d[1]
          });

        $('#dropselect').chosen({
          width: "98%",
          allow_single_deselect: true,
          placeholder_text_single: "Choose an occupation"
        })
        .on('change', function(evt, params) {
          disableMouseOver();
          setTimeout(function(){
            if (typeof params != 'undefined') {
              svg.each(function(d, i) {
                updateAreaChart(graphic_datas[i], graphic_datas[i].columns[2], d.csv, params.selected)
              })
            } else {
              svg.each(function(d, i) {
                updateAreaChart(graphic_datas[i], graphic_datas[i].columns[2], d.csv, codes[0])
              })
            }
          },100)
          setTimeout(function(){enableMouseOver()},500);
        });

        //label for option
        d3.select('input.chosen-search-input').attr('id', 'chosensearchinput')
        d3.select('div.chosen-search').insert('label', 'input.chosen-search-input').attr('class', 'visuallyhidden').attr('for', 'chosensearchinput').html("Type to select an area")

      } //end createDropdown

      //add source
      d3.select("#source").text("Source: " + dvc.essential.sourceText);

      if (pymChild) {
        pymChild.sendHeight();
      }

      function disableMouseOver() {
        d3.selectAll("path").style("pointer-events", "none")
        d3.selectAll("rect").style("pointer-events", "none")
        d3.selectAll("text").style("pointer-events", "none")

      }

      function enableMouseOver() {
        d3.selectAll("path").style("pointer-events", "all")
        d3.selectAll("rect").style("pointer-events", "all")
        d3.selectAll("text").style("pointer-events", "all")

      }

    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config
        //load chart data
        q = d3.queue()
        dvc.essential.graphic_data_url.forEach(function(d) {
          q.defer(d3.csv, d + ".csv")
        })
        q.awaitAll(function(errors, datas) {
          dvc = config
          graphic_datas = datas
          graphic_datas.forEach(function(data){
            data.forEach(function(d){
              d.date = d3.timeParse(dvc.essential.dateFormat)(d.date);
            })
          })
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        })


      })
    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }
