  h5,h6 {

       margin: 16px 0 8px 0;

  ul, ol {

  }

  li {
      margin: 0 0 8px 0;
      line-height: 32px;
      font-weight: 400;
      font-size: 18px;
      padding: 0;
  }


  a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
  }

  .btn {
      font-family: "Open Sans",Helvetica,Arial,sans-serif;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
  }

  .btn--primary:focus {
  background-color: #0b5d30;
}

  .btn--primary {
  background-color: #0F8243;
  color: #fff;
}

	  @media (max-width: 450px) {

			width:100%;

	  }

    .visuallyhidden{
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
    #buttonGroup {
      display:inline-block;
    }

    .bottonGroup{
      height: 40px;
      color: white;
      margin-left:4px;
      margin-top:10px;
      margin-bottom:0px;
      padding-left: 10px;
      padding-right: 10px;
      padding-bottom: 15px;
      font-weight: bold;
      font-size:18px;
      padding-top: 10px;
      float: left;
      border-width: 0px;
      cursor: pointer;
      cursor: hand;
    }
    .bottonGroup:hover{
      outline: 4px solid orange;
    }
    .bottonGroup:focus{
      outline: 4px solid orange;
    }
    .readmore{
      cursor: pointer;
      cursor: hand;
    }

    .selectedButton{
      outline: 4px solid orange;
    }
    .selecteddiv{
      visibility: visible;
    }
    .hiddendiv{
      visibility: hidden;
    }
    .collapsible{
      color:#4774CC;
      margin-top: 10px;
      text-decoration: underline;
      font-size: 16px;
      cursor: pointer;
      cursor: hand;
    }
    .collapsibleContent{
      display: none;
      min-width: 450px;
      height: 40px;
      margin-top: 10px;
      background-color: #EAEAEA;
      border-color: #dadada;
      border-width: 4px;
      border-style: solid;
      font-size: 16px;
    }
    .collapsibleContent:focus{
      border-color: orange;
    }
    .toptext{
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
      display:none;
    }
    .backtotop{
      text-decoration: underline;
      color: #4774CC;
      cursor: pointer;
      cursor: hand;
    }
