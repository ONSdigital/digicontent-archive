<!DOCTYPE html>
<html lang="en">

<head>
  <title>Population estimates</title>
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700,bold" rel="stylesheet">
  <link href="./css/style-chosen.css" rel="stylesheet" />
  <!-- <link rel="stylesheet" href="../lib/globalStyle.css"> -->

  <style>
    body {
      max-width: 700px;
      margin: 0px auto;
      font-family: 'Open Sans', sans-serif;
    }

    #dropdown {
      position: relative;
      height: 42px;
      max-width: 700px;
      width: 100%;
    }

    @media (min-width: 500px) {
      #info {
        height: 47px;
        width: 100%;
        font-size: 16px;
        margin: 16px 0px 40px 0px;
      }
    }

    @media (max-width: 499px) {
      #info {
        height: 66px;
        width: 100%;
        font-size: 16px;
        margin: 16px 0px 40px 0px;
      }
    }

    /* #info {
	height:25px;
	width:100%;
	font-size:16px;
  margin:16px 0px;
} */

    #label {
      font-weight: bold;
    }

    .dashline {
      color: #707071;
      font-weight: bold;
    }

    .axis path,
    .axis line {
      fill: none;
      stroke: rgb(102, 102, 102);
      shape-rendering: crispEdges;
    }

    .domain {
      display: none;
    }

    .axis text,
    #xaxislabel {
      font-family: 'Open Sans', sans-serif;
      fill: rgb(102, 102, 102);
      font-size: 16px;
    }

    .cells path {
      fill: none;
      pointer-events: all;
    }

    .notselected {
      opacity: 0.1;
    }

    .cellsselected {
      opacity: 1;
      stroke-width: 2px;
      r: 4;
      stroke: #000;
      fill: orange;
    }

    #source {
      font-weight: 400;
      color: #707071;
    }

    .key

    /* required */
      {
      display: inline-block;
      margin: 0 0 1em 0;
      padding: 0;
      line-height: 15px;
    }

    .label {
      white-space: nowrap;
      font-size: 16px;
      fill: #414042;
      font-weight: normal;
      font-family: "Open Sans", Helvetica, sans-serif;
    }

    .key li

    /* required */
      {
      display: inline-block;
      margin: 0 18px 0 0;
      padding: 0;
      line-height: 15px;
    }

    .key b

    /* required */
      {
      display: inline-block;
      width: 35px;
      height: 15px;
      margin-right: 6px;
      float: left;
      background-color: transparent;
      margin-top: 8px;
      border-radius: 15px;
    }

    .key label

    /* required */
      {
      white-space: nowrap;
      font-size: 16px;
      color: #333;
      font-weight: normal;
    }

    .btn-group {
      padding: 10px;
    }

    .btn-group,
    .btn-group-vertical {
      position: relative;
      display: inline-block;
      vertical-align: middle;
    }

    .btn {
      position: relative;
      padding: 10px 15px;
      margin: 0 0 20px;
      line-height: normal;
      color: #fff;
      /* font-size: 1.3em !important; */
      border-radius: 0px;
      display: inline-block;
      text-rendering: optimizeLegibility;
      transition: background-color .2s ease-in, color .2s ease-in;
    }

    .btn:focus {
      outline: none;
      box-shadow: 0 0 0pt 3pt orange;
    }

    .btn--select {
      margin-left: 0px !important;
    }

    .btn--select {
      color: #206095 !important;
      border: 2px solid #206095 !important;
      margin-right: 15px !important;
      margin-bottom: 15px !important;
      transition: all ease .2s;
      border-radius: 30px !important;
    }

    .btn:active,
    .btn.active {
      background-color: #206095;
      color: white !important;
      -webkit-box-shadow: none;
      box-shadow: 0 0 0pt 3pt orange;
    }

    .btn-group>.btn:focus {
      outline: none;
      box-shadow: 0 0 0pt 3pt orange;
    }

    [data-toggle=buttons]>.btn input[type=radio],
    [data-toggle=buttons]>.btn-group>.btn input[type=radio] {
      position: absolute;
      clip: rect(0, 0, 0, 0);
      pointer-events: none;
    }

    input[type=checkbox],
    input[type=radio] {
      -webkit-appearance: none;
    }

    .btn-group input {
      height: 0px;
      width: 0px;
      position: absolute;
      left: -100px;
    }

    input[type=checkbox],
    input[type=radio] {
      margin: 4px 0 0;
      margin-top: 1px\9;
      line-height: normal;
    }

    input[type=checkbox],
    input[type=radio] {
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
      box-sizing: border-box;
      padding: 0;
    }

    input {
      border: none;
      border-radius: 0;
      border-bottom: solid 1px #ddd;
      font-size: 18px;
      line-height: 32px;
      margin: 16px 0;
      padding: 6px 0 0 0;
    }

    input,
    select {
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      font-size: 14px;
    }

    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }

    .btn--primary {
      background-color: #0F8243;
      color: #fff;
    }

    .btn {
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14px;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
      line-height: 24px;
    }

    .btn--primary:hover,
    .btn--primary:focus {
      background-color: #0b5d30;
    }

    a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
    }

    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>

<body>
  <h5 class='visuallyhidden'>The chart canvas is hidden from screen readers. The main message is summarised by the chart title and the data behind the chart is available to download below.</h5>
  <div id="dropdown"></div>
  <div id="info"></div>
  <div><svg width="100%"></svg></div>
  <br />
  <div id="source"></div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.13.0/d3.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js"></script>
  <script src="../lib-sc/chosen.jquery.js"></script>
  <script src="../lib-sc/modernizr.svg.min.js"></script>

  <script>

    var pymChild = null;

    function drawGraphic() {

      //clear the svg first
      d3.select('svg').selectAll("*").remove()

      clicked = false;

      var svg = d3.select("svg"),
        margin = { top: 20, right: 20, bottom: 110, left: 20 },

        svgwidth = parseInt(svg.style("width"));
      heightper = dvc.essential.heightperstrip;

      heightper = heightper;
      width = svgwidth - margin.left - margin.right;

      //get unique groups
      var groups = graphic_data.map(function (obj) { return obj.id; });
      groups = groups.filter(function (v, i) { return groups.indexOf(v) == i; });


      height = (heightper * groups.length) + margin.top + margin.bottom;

      svg.attr("height", height + "px")

      var formatValue = d3.format(",.1f");

      var x = d3.scaleLinear()
        .rangeRound([0, width]);

      if (dvc.essential.xAxisScale == "auto") {
        x.domain(d3.extent(graphic_data, function (d) { return d.value; }));
      } else {
        x.domain(dvc.essential.xAxisScale);
      }

      groupeddata = {}

      // thank you stackoverflow https://stackoverflow.com/a/58429784
      laRegionLookup = [...new Map(graphic_data.map(item => [item["unique"], item])).values()].map(function (d) { return { la: d.unique.replace(/[,' ]+/g, ""), region: d.region } })

      separate = heightper;

      runningtotal = 0;

      for (var j = 0; j < groups.length; j++) {

        groupeddata[j] = graphic_data.filter(function (v, i) { return v.id == groups[j]; });

        if (j > 0) {
          runningtotal = runningtotal + groupeddata[j - 1].length;
        }

        var g = svg.append("g")
          .attr("transform", "translate(" + margin.left + "," + (margin.top + (separate * j)) + ")");

        //Original
        var simulation = d3.forceSimulation(groupeddata[j])
          .force("x", d3.forceX(function (d) { return x(d.value); }).strength(1))
          // .force("x", d3.forceX())
          .force("y", d3.forceY(heightper / 2))
          .force("collide", d3.forceCollide(dvc.essential.dotradius))
          //.force("charge", d3.forceManyBody().strength(8))
          // .force("collide", "soft")
          .stop();

        // console.log(groupeddata[j])
        // Reworked Version
        // var simulation = d3.forceSimulation(groupeddata[j])
        //   //.force("x", d3.forceX(function (d) { return x(d.value); }).strength(7))
        //   // .force("y", d3.forceY(heightper / 2))
        //   .force('charge', d3.forceManyBody().strength(8))
        //   .force('center', d3.forceCenter(svgwidth / 2, heightper / 2));
        // //.force("charge", d3.forceManyBody().strength(8))
        // // .force("collide", "soft")
        // // .stop();

        for (var i = 0; i < 50; ++i) simulation.tick();

        if (svgwidth < dvc.optional.mobileBreakpoint) {
          numberticks = dvc.optional.x_num_ticks_sm_md[0];
        } else {
          numberticks = dvc.optional.x_num_ticks_sm_md[1];
        }

        g.append("text")
          .attr("class", "label")
          .text(groups[j])
          .attr("y", (heightper / 2) + 5)
          .attr("x", -margin.left);

        var cell = g.append("g")
          .attr("class", "cells")
          .selectAll("g").data(d3.voronoi()
            .extent([[-margin.left, 0], [width + margin.right, heightper]])
            .x(function (d) { return d.x; })
            .y(function (d) { return d.y; })
            .polygons(groupeddata[j])).enter().append("g").attr("class", function (d, i) { return i })

        cell.append("circle")
          .attr("r", dvc.essential.dotradius)
          .attr("cx", function (d) { return d.data.x; })
          .attr("cy", function (d) { return d.data.y; })
          .attr("class", function (d, i) { return "cell cell" + (runningtotal + i) + " cellgroup" + d.data.unique.replace(/[,' ]+/g, "").trim() })
          .attr("id", function (d) { return "cell_" + d.data.unique.replace(/[,' ]+/g, "").trim() })
          .attr("fill", function (d) { return dvc.essential.colour_palette[groups.indexOf(d.data.id)] });

        cell.append("path")
          .attr("d", function (d) { return "M" + d.join("L") + "Z"; })
          .attr("class", function (d, i) { return "path" + (runningtotal + i) + " " + d.data.unique.replace(/[,' ]+/g, "").trim() + " cellkey" + d.data.region })
          .attr("id", function (d) { return d.data.unique.replace(/[,' ]+/g, "").trim() })
          .on("mouseover", function (d, i) {
            pathidstr = d3.select(this).attr("class");
            pathgroup = pathidstr.split(" ")[1];
            pathid = pathidstr.split(" ")[0].substr(4);

            cellid = d3.select(this).attr("id");


            pathsize = d.data.id;
            region = d.data.region;
            unique = d.data.unique;

            datafilter = graphic_data.filter(function (d, i) { return d.unique == unique })

            changetext(datafilter[0].value, datafilter[1].value, d.data.unique);
            $("#dropselect").val(pathgroup).trigger("chosen:updated");
            d3.selectAll(".cell").filter(function (d) { return d.data.region != region; }).classed("notselected", true);
            d3.selectAll(".cell" + pathid).classed("cellsselected", true);
            d3.selectAll("#cell_"+ cellid).classed("cellsselected", true);

            //d3.selectAll(".cell").classed("cellsselected", true).each(function() {
            d3.select(this.parentNode).raise()
            //})


          })
          // .on("click", function(d) {
          //
          // 	d3.selectAll(".cells path").style("pointer-events","none");
          // 	clicked = true;
          //
          //
          // })
          .on("mouseout", function (d, i) {
            pathidstr = d3.select(this).attr("class");
            pathid = +pathidstr.substr(4);

            d3.select("#info").html("");
            $("#dropselect").val("").trigger("chosen:updated");
            d3.selectAll(".cell").classed("cellsselected", false)

            d3.selectAll(".cell").filter(function (d) { return d.data.region != region; }).classed("notselected", false);

            if (clicked == true) {

              unique = d.data.unique;

              datafilter = graphic_data.filter(function (d, i) { return d.unique == unique })

              changetext(datafilter[0].value, datafilter[1].value, d.data.unique);

              $("#dropselect").val("id" + pathid).trigger("chosen:updated");
              d3.select(".cell" + pathid).classed("cellsselected", true)

            }
          })

        if (j == 0) {
          g.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", "translate(0,0)");
          // .call(d3.axisTop(x).ticks(numberticks, ".0%").tickSize(0).tickFormat(function (d) { return d + "%" }));
        }

        if (j == groups.length - 1) {
          g.append("g")
            .attr("class", "axis axis--x")
            .attr("transform", "translate(0," + (-heightper * (groups.length - 1)) + ")")
            .call(d3.axisBottom(x).ticks(numberticks, ".0%").tickSize((height - heightper) + 20).tickFormat(function (d) { return d + "%" }))
          g.selectAll(".axis--x line").style("stroke", "#ddd").attr("stroke-dasharray", "2,2");
        }
      }

      // annotationCreation();

      function annotationCreation() {
        //create line breaks for annotation
        var insertLinebreaks = function () {

          var el1 = this.firstChild;
          var el = el1.data;

          var words = el.split('  ');


          d3.select(this).text('');

          xpos = d3.select(this).attr("x");


          for (var i = 0; i < words.length; i++) {
            var tspan = d3.select(this).append('tspan').text(words[i]);
            if (i > 0) {
              tspan.attr('x', xpos).attr('dy', '13');
            }
          }

          if (words.length > 1) {
            d3.select(this).attr("transform", "translate(0," + ((words.length - 1) * (-13 / 2)) + ")")
          }

        };

        d3.selectAll(".label").each(insertLinebreaks).call(wrap, margin.left - 10);

      }//end of annotationCreation

      selectlist(graphic_data);

      function selectlist(datacsv) {

        var dropcodes = datacsv.map(function (d, i) { return "id" + i; });
        //var dropnames =  datacsv.map(function(d) { return d.unique; });
        var dropnames = datacsv.map(function (d) { return d.unique; })
          .filter(function (x, i, a) {
            return a.indexOf(x) == i;
          });
        var menuarea = d3.zip(dropnames, dropcodes).sort(function (a, b) { return d3.ascending(a[0], b[0]); });

        //clear dropdown
        d3.select("#dropdown").selectAll("*").remove()

        // Build option menu for local authorities
        var optns = d3.select("#dropdown").append("div").attr("id", "sel").append("select")
          .attr("id", "dropselect")
          .attr("style", "width:300px")
          .attr("class", "chosen-select");

        d3.select('input.chosen-search-input').attr('id', 'chosensearchinput')
        d3.select('div.chosen-search')
          .insert('label', 'input.chosen-search-input')
          .attr('class', 'visuallyhidden')
          .attr('for', 'chosensearchinput')
          .html("Type to select a local authority")

        optns.append("option")
          // .attr("value", "first")
          // .text("");
        optns.selectAll("p").data(menuarea).enter().append("option")
          .attr("value", function (d) { return d[0].replace(/[,' ]+/g, "").trim() })
          .attr("id", function (d) { return d[1] })
          .text(function (d) { return d[0] });

        myId = null;

        $('#dropselect').chosen({ width: "98%", allow_single_deselect: true, placeholder_text_single: "Choose a local authority" }).on('change', function (evt, params) {

          if ($('#dropselect').val() != "") {
            //if(typeof params != 'undefined') {
            clicked = true;
            d3.selectAll(".cell").classed("cellsselected", false);
            d3.selectAll(".cells path").style("pointer-events", "none")

            dropcode = $('#dropselect').val();

            region = laRegionLookup.filter(function (d) { return d.la == dropcode })[0].region

            d3.selectAll(".cell").classed("notselected", false);
            d3.selectAll(".cell").filter(function (d) { return d.data.region != region; }).classed("notselected", true);
            d3.selectAll(".cellgroup" + dropcode.replace(/[,' ]+/g, "").trim()).classed("cellsselected", true);

            function changetext(value, value2, id) {
              d3.select("#info").html("<span id='label' style='color: #871A5B;''>" + formatValue(value)+ "% " +"</span>"+ dvc.essential.infoText + " " + "<span id='label' style='color: #206095;''>"+formatValue(value2)+ "% "+ "</span>" + dvc.essential.infoText2  + `<br><br><span>Local authorities within the same region (${region}) are highlighted</span>`);
            }

// +<span id='label' style="color: #871A5B;"> test text </span>


            d3.selectAll(".cellsselected").each(function () {
              d3.select(this.parentNode).raise()
            })

            uniquename = $('#dropselect option:selected').text();

            datafilter = datacsv.filter(function (d, i) { return d.unique == uniquename })

            // console.log(datafilter)

            changetext(datafilter[0].value, datafilter[1].value, datafilter[0].unique)

            //           d3.select('abbr').on('keypress',function(evt){
            //             if(d3.event.keyCode==13 || d3.event.keyCode==32){
            //               d3.event.preventDefault()

            //               clicked = false;

            //               d3.select(".cell" + dropcodeid).classed("cellsselected",false)
            //               d3.selectAll(".cells path").style("pointer-events","all")



            //               d3.select("#info").html("");

            //               $("#dropselect").val(null).trigger('chosen:updated');
            //             }
            //           })

            // 			}
            // 			else {

            // 				clicked = false;

            //         d3.selectAll(".cell").filter(function(d) { return d.data.region != region; }).classed("notselected",false);
            // 				d3.selectAll(".cell").classed("cellsselected", false);
            // 				d3.selectAll(".cells path").style("pointer-events","all");

            // 			}
            // 	});
            // } //end selectlist

            d3.selectAll(".cellsselected").each(function () {
              d3.select(this.parentNode).raise()
            })
            d3.select('button.abbr').on('keypress', function (evt) {
              if (d3.event.keyCode == 13 || d3.event.keyCode == 32) {
                d3.event.preventDefault()

                clicked = false;

                d3.selectAll(".cellgroup" + dropcode).classed("cellsselected", false) //remove highlight dot
                d3.selectAll(".cell").filter(function (d) { return d.data.region != region; }).classed("notselected", false); // make all dots full opacity
                d3.selectAll(".cells path").style("pointer-events", "all") //turn on voronoi

                d3.select("#info").html("");

                $("#dropselect").val("").trigger('chosen:updated');
                d3.select("#info").html("");
              }
            })

          }
          else {

            clicked = false;

            d3.selectAll(".cell").filter(function (d) { return d.data.region != region; }).classed("notselected", false);
            d3.selectAll(".cell").classed("cellsselected", false);
            d3.selectAll(".cells path").style("pointer-events", "all");
            d3.select("#info").html("");

          }
        });
      } //end selectlist

      function changetext(value, value2, id) {
        d3.select("#info").html("<span id='label' style='color: #871A5B;''>" + formatValue(value)+ "% " +"</span>"+ dvc.essential.infoText + " " + "<span id='label' style='color: #206095;''>"+formatValue(value2)+ "% "+ "</span>" + dvc.essential.infoText2  + `<br><br><span>Local authorities within the same region (${region}) are highlighted</span>`);
      }

      d3.select("#info").html("<span id='label'></span> <br><span>Local authorities within the same region are highlighted</span>");

      //add xaxislabel
      svg.append("g")
        .attr("transform", "translate(" + (svgwidth - margin.right) + "," + (height - 30) + ")")
        .append("text")
        .attr("id", "xaxislabel")
        .attr("text-anchor", "end")
        .text(dvc.essential.xAxisLabel)
        .call(wrap, svgwidth);

      //darker zero line.

      // svg.append("line")
      //   .attr("x1", x(0) + margin.left)
      //   .attr("x2", x(0) + margin.left)
      //   .attr("y1", 10)
      //   .attr("y2", (172))
      //   .style('stroke', '#707071')
      //   .style('stroke-width', 2)
      //   .style('stroke-dasharray', '5 5')

      // console.log((height - heightper));

      //add source
      d3.select("#source").text("Source: " + dvc.essential.sourceText);

      if (pymChild) {
        pymChild.sendHeight();
      }

    }

    function wrap(text, width) {
      text.each(function () {
        var text = d3.select(this),
          words = text.text().split(/\s+/).reverse(),
          word,
          line = [],
          lineNumber = 0,
          lineHeight = 1.1, // ems
          x = text.attr("x")
        y = text.attr("y") != undefined ? text.attr("y") : 0,
          dy = text.attr("dy") != undefined ? parseFloat(text.attr("dy")) : 0,
          tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
        while (word = words.pop()) {
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > width) {
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
          }
        }
      });
    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function (error, config) {
        dvc = config
        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function (error, data) {
          graphic_data = data;

          pymChild = new pym.Child({ renderCallback: drawGraphic });
          //use pym to create iframed chart dependent on specified variables

        });
      })
    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    function type(d) {
      if (!d.value) return;
      d.value = +d.value;
      return d;
