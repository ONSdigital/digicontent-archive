    function wrap(text, width) {
      text.each(function() {
        var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x"),
            dy = parseFloat(text.attr("dy")),
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
 if (words.length > 4) {
        while (word = words.pop()) {
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > width) {
            if(lineNumber==0){tspan.attr("dy",-1.1+"em")}else{tspan.attr("dy",+1.1+"em")}
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            ++lineNumber;
            tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", 1.1 + "em").text(word);
          }
        }
      }else{
        while (word = words.pop()) {
             line.push(word);
             tspan.text(line.join(" "));
             if (tspan.node().getComputedTextLength() > width) {
               if (lineNumber == 0) {
                 tspan.attr("dy", dy - 0.55 + "em")
               } else {
                 tspan.attr("dy", -dy + 0.55 + "em")
               }
               line.pop();
               tspan.text(line.join(" "));
               line = [word];
               ++lineNumber;
               tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", (1.1 * lineNumber - dy + 0.55) + "em").text(word);
             }
           }

      }
      });
    }


    function twolinewrap(text, width) {
      text.each(function() {
             var text = d3.select(this),
                 words = text.text().split(/\s+/).reverse(),
                 word,
                 line = [],
                 lineNumber = 0,
                 lineHeight = 1.1, // ems
                 y = text.attr("y"),
                 x = text.attr("x"),
                 dy = parseFloat(text.attr("dy")),
                 tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
             while (word = words.pop()) {
               line.push(word);
               tspan.text(line.join(" "));
               if (tspan.node().getComputedTextLength() > width) {
                 if(lineNumber==0){tspan.attr("dy",-0.55+"em")}//else if(lineNumber==1) {tspan.attr("dy",0+"em")}else{}
                 line.pop();
                 tspan.text(line.join(" "));
                 line = [word];
                 tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ((++lineNumber*1.1)-0.55) + "em").text(word);
                 // ++lineNumber;
               }
             }
           });
        }

      function showTooltip(d){

							};

				});

				// Cycle through data and sum all data for all data columns
				d3.csv(dvc.essential.graphic_data_url).row(function(d) {
							  var mySum = 0;
							  for (var o in d) { // iterate all the properties of d
								  if (o === "group") continue; // if it's our key field skip it
								  else mySum += +d[o]; // everyone else into the sum
								}
