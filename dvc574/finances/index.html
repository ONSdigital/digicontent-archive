			function createLegend(){

							var prevX= 0;
							var prevY= 0;
							 lineNo = 0;
							var lineNoOld = 0;

						dvc.essential.legendLabels.forEach(function(d,i) {

							// draw legend text based on content of var legendLabels ...
							var_group= d3.select("#legend").append("g")

							var_group.append("rect")
								.attr("class","rect" + i)
								.attr("fill", dvc.essential.colour_palette[i])
								.attr("x", 0)
								.attr("y", 0)
								.attr("width", function(d){
									if(dvc.essential.legendStyle=="rect"){
										return 15;
									} else {
										return 20;
									}
								})
								.attr("height", function(d){
									if(dvc.essential.legendStyle=="rect"){
										return 15;
									} else {
										return 3;
									}
								})

							var_group.append("text")
								.text(dvc.essential.legendLabels[i])
								.attr("class","legend" + i)
								.attr("text-anchor", "start")
								.style("font-size", "16px")
								.style("fill", "#666")
								.attr('y',15)
								.attr('x',0);



							d3.selectAll(".legend" + (i))
								.each(calcPosition);



							function calcPosition() {


							var BBox = this.getBBox()

								d3.select(".legend" + (i))
										.attr("y",function(d){
													if((prevX+BBox.width +50)>parseInt(graphic.style("width")) ){
														lineNoOld = lineNo;
														lineNo=lineNo + 1;
														prevX = 0;
													}
												return eval((lineNo*20) + 20);
										})
										.attr("x",function(d){ return prevX+25;})


								d3.select(".rect" + (i))
										.attr("y",function(d){

												if((prevX+BBox.width +50)>parseInt(graphic.style("width")) ){
													lineNoOld = lineNo;
													lineNo=lineNo + 1;
													prevX = 0;
												}

												if(dvc.essential.legendStyle=="rect"){
													return eval((lineNo*20)+5);
												} else {
													return eval((lineNo*20)+12);

												}
										})
										.attr("x",function(d){ return prevX; })

								prevX = prevX + BBox.width +50

							//	d3.select("#chart").attr("transform", "translate(0, 0)")


							}; // end function calcPosition()
						});	// end foreach

      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
              words = text.text().split(/\s+/).reverse(),
              word,
              line = [],
              lineNumber = 0,
              lineHeight = 1.1, // ems
              y = text.attr("y"),
              x = text.attr("x"),
              dy = parseFloat(text.attr("dy")),
              tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              tspan.attr("dy",(dy-0.55)+"em")
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy -0.55 + "em").text(word);
            }
          }
        });
      }

      function threelinewrap(text, width) {
      text.each(function() {
        var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x"),
            dy = parseFloat(text.attr("dy")),
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
        while (word = words.pop()) {
          line.push(word);
          tspan.text(line.join(" "));
          if (tspan.node().getComputedTextLength() > width) {
            if(lineNumber==0){tspan.attr("dy",-1.1+"em")}else{tspan.attr("dy",((lineNumber-1)*1.1)+"em")}
            line.pop();
            tspan.text(line.join(" "));
            line = [word];
            ++lineNumber;
            tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ((lineNumber-1)*1.1) + "em").text(word);
          }
        }
      });
    }

      function showTooltip(d){

      }

			d3.json("config.json", function(error, config) {

				dvc=config;

				d3.csv(dvc.essential.graphic_data_url, function(error, data) {

					graphic_data = data;

					ageNames = d3.keys(graphic_data[0]).filter(function(key) { return key !== "state"; });


					/* START MODIFIED */
					dvc.dataMinArray = [];
					dvc.dataMaxArray = [];
					/* END MODIFIED */

					graphic_data.forEach(function(d,i) {

						/* START MODIFIED */
						dvc.dataMinArray[i] = [];
						dvc.dataMaxArray[i] = [];
						dvc.minVal = Infinity;
						dvc.maxVal = -Infinity;
						/* END MODIFIED */

					  	d.ages = ageNames.map(function(name) {

							/* START MODIFIED */
							if ( +d[name]<=dvc.minVal ){
								dvc.minVal = +d[name];
								dvc.dataMinArray[i] = +d[name];
							}

							if ( +d[name]>=dvc.maxVal ){
								dvc.maxVal = +d[name];
								dvc.dataMaxArray[i] = +d[name];
							}
							/* END MODIFIED */

						  	return {parent:d.state,name: name, value: +d[name]};
						});

					});

					pymChild = new pym.Child({renderCallback: drawGraphic});
				});
			})
