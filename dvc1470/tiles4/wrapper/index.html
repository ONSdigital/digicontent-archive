<!DOCTYPE html>
<html lang="en">

<head>
    <title>Coronavirus (COVID-19) ONS Dashboard</title>

    <meta name="description" content="noindex">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

    <link rel="stylesheet" href="../../lib/globalStyle.css" />
	<style>

	body{
    max-width:950px;
    color: #323132;
    min-height: 580px;
    padding-bottom: 20px;
  }

  #intro, #bottomSection{
    max-width: 700px;
    /* margin:0px auto; */
  }

section {
  margin-bottom:40px !important;
}

h1{
  font-size: 30px;
  font-weight: 700;
  width:100%;
  color:#323132;
  font-family: "Open Sans";
  margin-bottom: 7px;
}
h2{
  font-size: 20px;
  width:100%;
  font-weight: 700;
  color:#323132;
  font-family: "Open Sans";
  margin-bottom: 20px;
}

h3 {
  font-size:18px;
  margin-bottom: 10px;
}
p {
  font-size:18px;
  margin-bottom: 12px;
}
  h5,h6 {
       font-size: 16px;
       padding-top: 0px;
       padding: 0px;
       font-weight: 700;
       color:#323132;
       font-family: "Open Sans";
    }

    #selectionDescription {
         font-size: 22px;
         font-weight: 700;
         padding-left: 0px;
         color:#323132;
         font-family: "Open Sans";
      }

  ul, ol {
    margin: 16px 0;
    padding-left: 32px;
  }

  li {
      margin: 0 0 8px 0;
      line-height: 32px;
      font-weight: 400;
      font-size: 18px;
      padding: 0;
  }


  a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
  }

  .btn {
      font-family: "Open Sans",Helvetica,Arial,sans-serif;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
  }

  .btn--primary:focus {
  background-color: #0b5d30;
}

  .btn--primary {
  background-color: #0F8243;
  color: #fff;
}

.tile {
  width: calc(33.3% - 10px);
  margin-left:5px;
  margin-right:5px;
}

	  @media (max-width: 550px) {
  		#top, #btm {
  			width:100%;

  		}

      .tile {
        width: 100%;
        margin-left:0px;
        margin-right:0px;
        /* margin-left:10px; */
      }
	  }
    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    #small {
      clear:both;
      height: 1px;
    }


    </style>

</head>
<body>

  <section id="overview" style="margin-top:20px;">
    <div aria-live="assertive" id="tileshere"></div>
    <div id="small"></div>
  </section>


    <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
    <script src="../../lib/modernizr.svg.min.js" type="text/javascript"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>

    <script>



    var pymChild = null;
    pymChild = new pym.Child();
	pym.Child({ renderCallback: drawgraphic })

	function drawgraphic(){
      //read in l1 data and draw on load
      d3.csv("../level1.csv", function(error, data){
        graphic_data_l1 = data;
        drawl1(graphic_data_l1);
      });


      function drawl1(graphic_data_l1){
        d3.select("#tileshere").selectAll("*").remove();
        //d3.select("#selectionDescription").text("Latest headlines about the pandemic");

        //draw tiles
        graphic_data_l1.forEach(function(d,i){
          d3.select("#tileshere")
            .append("div")
            .attr("aria-hidden","true")
            .style("float","left")
            .style("min-height","50px")
            .style("width", "350px")
            .style("margin-left", "10px")
            .style("margin-right", "20px")
            .style("margin-bottom","10px")
            .style("border-radius","9px")
            .style("outline","4px solid "+graphic_data_l1[i].colour)
            .style("outline-offset","-4px")
            .attr("class","tile tile"+i)
        })
          populate1();
      }

      function populate1(){
          graphic_data_l1.forEach(function(d,i){
            //add titles
            d3.select(".tile"+i)
              .append("div")
              .text(graphic_data_l1[i].title)
              .style("height","60px")
              .style("font-size","18px")
              .style("background-color",graphic_data_l1[i].colour)
              .style("color","#fff")
              .style("font-weight","bold")
              .style("padding-left","8px")
              .style("padding-right","8px")
              .style("padding-top","4px")

            //create subtitle
            d3.select(".tile"+i)
              .append("div")
              .text(graphic_data_l1[i].subtitle)
              .style("font-size","16px")
              .style("padding-left","8px")
              .style("padding-right","8px")
              .style("padding-top","0px")
              .style("min-height","55px")
              .style("margin-bottom","0px")

            //create divs for charts
            d3.select(".tile"+i)
              .append("div")
              .style("width",function(){return "calc(100% - 16px)"})
              .attr("id","l1chartdiv"+i);

            //create source text
            d3.select(".tile"+i)
              .append("div")
              .text(graphic_data_l1[i].sourcetext)
              .style("font-size","14px")
              .style("padding-left","8px")
              .style("padding-right","8px")
              .style("padding-top","4px")
              .style("padding-bottom","4px")

              var pymParent = new pym.Parent("l1chartdiv"+i, graphic_data_l1[i].charturl, {title: "Chart - " + graphic_data_l1[i].title});
          })
          onClicks();
      };


    function onClicks(){ //function for hashing
    d3.select(".tile0").style("cursor","pointer").style("cursor","hand").on("click",function(){window.open('https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/conditionsanddiseases/articles/coronaviruscovid19latestinsights/infections','_blank');})
    d3.select(".tile1").style("cursor","pointer").style("cursor","hand").on("click",function(){window.open('https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/conditionsanddiseases/articles/coronaviruscovid19latestinsights/hospitals','_blank');})
    d3.select(".tile2").style("cursor","pointer").style("cursor","hand").on("click",function(){window.open('https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/conditionsanddiseases/articles/coronaviruscovid19latestinsights/deaths','_blank');})
    d3.select(".tile3").style("cursor","pointer").style("cursor","hand").on("click",function(){window.open('https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/conditionsanddiseases/articles/coronaviruscovid19latestinsights/antibodies','_blank');})
    }

		pymChild.sendHeight();

		setTimeout(function(){
			pymChild.sendHeight();
		},3000);

    setInterval(function(){
			pymChild.sendHeight();
		},1000);
	}


    </script>
