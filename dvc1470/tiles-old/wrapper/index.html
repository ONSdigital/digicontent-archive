<!DOCTYPE html>
<html lang="en">

<head>
    <title>Coronavirus (COVID-19) ONS Dashboard</title>

    <meta name="description" content="noindex">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

    <link rel="stylesheet" href="../../lib/globalStyle.css" />
	<style>

	body{
    max-width:950px;
    color: #323132;
  }

  #intro, #bottomSection{
    max-width: 700px;
    /* margin:0px auto; */
  }

section {
  margin-bottom:30px !important;
}

h1{
  font-size: 30px;
  font-weight: 700;
  width:100%
  color:#323132;
  font-family: "Open Sans";
  margin-bottom: 7px;
}
h2{
  font-size: 20px;
  width:100%;
  font-weight: 700;
  color:#323132;
  font-family: "Open Sans";
  margin-bottom: 20px;
}

h3 {
  font-size:18px;
  margin-bottom: 10px;
}
p {
  font-size:18px;
  margin-bottom: 12px;
}
  h5,h6 {
       font-size: 16px;
       padding-top: 0px;
       padding: 0px;
       font-weight: 700;
       color:#323132;
       font-family: "Open Sans";
    }

    #selectionDescription {
         font-size: 22px;
         font-weight: 700;
         padding-left: 0px;
         color:#323132;
         font-family: "Open Sans";
      }

  ul, ol {
    margin: 16px 0;
    padding-left: 32px;
  }

  li {
      margin: 0 0 8px 0;
      line-height: 32px;
      font-weight: 400;
      font-size: 18px;
      padding: 0;
  }


  a {
      text-decoration: underline;
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
  }

  .btn {
      font-family: "Open Sans",Helvetica,Arial,sans-serif;
      display: inline-block;
      width: auto;
      cursor: pointer;
      padding: 6px 16px 10px 16px;
      border: 0 none;
      text-align: center;
      -webkit-appearance: none;
      transition: background-color 0.25s ease-out;
  }

  .btn--primary:focus {
  background-color: #0b5d30;
}

  .btn--primary {
  background-color: #0F8243;
  color: #fff;
}

.tile {
  width: calc(33.3% - 10px);
  margin-left:5px;
  margin-right:5px;
}

	  @media (max-width: 550px) {
  		#top, #btm {
  			width:100%;

  		}

      .tile {
        width: 100%;
        margin-left:0px;
        margin-right:0px;
        /* margin-left:10px; */
      }
	  }
    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    #buttonGroup {
      display:inline-block;
    }

    .bottonGroup{
      height: 40px;
      color: white;
      margin-left:4px;
      margin-top:10px;
      margin-bottom:0px;
      padding-left: 6px;
      padding-right: 6px;
      padding-bottom: 15px;
      font-weight: bold;
      font-size:18px;
      padding-top: 10px;
      float: left;
      border-width: 0px;
      cursor: pointer;
      cursor: hand;
    }
    .bottonGroup:hover{
      outline: 4px solid orange;
    }
    .bottonGroup:focus{
      outline: 4px solid orange;
    }
    .readmore{
      cursor: pointer;
      cursor: hand;
    }

    .selectedButton{
      outline: 4px solid orange;
    }
    .collapsible{
      color:#4774CC;
      margin-top: 10px;
      text-decoration: underline;
      font-size: 16px;
      cursor: pointer;
      cursor: hand;
    }
    .collapsibleContent{
      display: none;
      min-width: 450px;
      height: 40px;
      margin-top: 10px;
      background-color: #EAEAEA;
      border-color: #dadada;
      border-width: 4px;
      border-style: solid;
      font-size: 16px;
    }
    .collapsibleContent:focus{
      border-color: orange;
    }
    .toptext{
      font-size: 18px;
      font-weight: 400;
      line-height: 32px;
      display:none;
    }
    .backtotop{
      text-decoration: underline;
      color: #4774CC;
      cursor: pointer;
      cursor: hand;
    }
    .moreTwisty{
      cursor: hand;
      cursor: pointer;
    }


    </style>

</head>
<body>

  <section id="overview" style="margin-top:20px;">
    <div aria-live="assertive" id="tileshere"></div>
  </section>

  <div style="width:100%; height:30px; clear:both; background-color:#fff; margin-top:20px; margin-bottom:20px;"></div>
  <div style="width:100%; height:10px; background-color:#fff; margin-top:20px; margin-bottom:20px;"></div>
<section id="intro">
</section>

    <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
    <script src="../../lib/modernizr.svg.min.js"></script>
    <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>

    <script>

    var moreTwisty = "closed";
    d3.select(".moreTwisty").on("click",function(){
      if(moreTwisty == "closed"){
        d3.select(".secondgroup").style("display","block");
        d3.select(".moreTwisty").text("More options ▼");
        moreTwisty = "open";
      }else{
        d3.select(".secondgroup").style("display","none");
        d3.select(".moreTwisty").text("More options ▶");
        moreTwisty = "closed";
      }
    })

    d3.csv("../level2.csv", function(error, data) {
      graphic_data = data;
    });

    var pymChild = null;
    pymChild = new pym.Child();
	pym.Child({ renderCallback: drawgraphic })

	function drawgraphic(){

      //var pymParent = new pym.Parent('glossary', 'https://www.ons.gov.uk/visualisations/dvc988/line/index.html', {title: "Interactive - Glossary of common Covid terms"});

      //load and draw top story boxes
      //read in l1 data and draw on load
      d3.csv("../toptext.csv", function(error, data) {
        graphic_data_toptext = data;
        d3.select("#toptextWrapper").selectAll("*").remove();
        graphic_data_toptext.forEach(function(d,i){
          d3.select("#toptextWrapper")
            .append("h2")
            .attr("id","selectionDescription")
            .attr("class","toptext toptext" + graphic_data_toptext[i].Text_Class)
            .html(graphic_data_toptext[i].Title)
          d3.select("#toptextWrapper")
            .append("h3")
            .attr("class","toptext toptext" + graphic_data_toptext[i].Text_Class)
            .html(graphic_data_toptext[i].Commentary)
        })
        //display the one that shows on load
        d3.selectAll(".toptextheadlines").style("display","block")
      });


      //on load draw top level
      //drawTopLevel();
      //some global vars
      embedSwitch = "closed";
      possibleFilters = "";
      startFresh = true;
      //empty filter by var
      description = [];
      descriptionfiltered = [];

      //read in l1 data and draw on load
      d3.csv("../level1.csv", function(error, data){
        graphic_data_l1 = data;
        drawl1(graphic_data_l1);
        checkUrl();
      });

      function drawlevel1fromhash(){
        d3.csv("../level1.csv", function(error, data) {
          d3.selectAll(".toptext").style("display","none")
          d3.selectAll(".toptextheadlines").style("display","block")
          d3.select("#analysisHere").style("max-width","950px")
          graphic_data_l1 = data;

          drawl1(graphic_data_l1);
        });
      }

      //dealing with top level view on click of button
      d3.select(".headlinesButton").on("click",function(){
        d3.csv("../level1.csv", function(error, data) {
          d3.selectAll(".toptext").style("display","none")
          d3.selectAll(".toptextheadlines").style("display","block")
          d3.select("#analysisHere").style("max-width","950px")
          graphic_data_l1 = data;

		  window.parent.location.hash = "headlines";

          drawl1(graphic_data_l1);
        });
      });

//bookmark here
      function drawl1(graphic_data_l1){ //function for hashing

        //change button feedback
        d3.selectAll(".bottonGroup").classed("selectedButton",false)
        d3.select(".headlinesButton").classed("selectedButton",true)
        //clear out stuff and change the heading
        d3.select("#tileshere").selectAll("*").remove();
        //d3.select("#selectionDescription").text("Latest headlines about the pandemic");

        //draw tiles
        graphic_data_l1.forEach(function(d,i){
          d3.select("#tileshere")
            .append("div")
            .attr("aria-hidden","true")
            .style("float","left")
            .style("min-height","100px")
            .style("margin-bottom","8px")
            .style("border-radius","9px")
            .style("outline","4px solid "+graphic_data_l1[i].colour)
            .style("outline-offset","-4px")
            .attr("class","tile tile"+i);
        })
          populate1();
      }

      function populate1(){
          graphic_data_l1.forEach(function(d,i){
            //add titles
            d3.select(".tile"+i)
              .append("div")
              .text(graphic_data_l1[i].title)
              .style("height","60px")
              .style("font-size","18px")
              //.style("min-width",function(){return "calc(100% - 10px)"})
              .style("background-color",graphic_data_l1[i].colour)
              .style("color","#fff")
              .style("font-weight","bold")
              .style("padding-left","8px")
              .style("padding-right","8px")
              .style("padding-top","4px")

            //create subtitle
            d3.select(".tile"+i)
              .append("div")
              .text(graphic_data_l1[i].subtitle)
              .style("font-size","16px")
              .style("padding-left","8px")
              .style("padding-right","8px")
              .style("padding-top","0px")
              .style("min-height","55px")
              .style("margin-bottom","0px")

            //create divs for charts
            d3.select(".tile"+i)
              .append("div")
              .style("width",function(){return "calc(100% - 16px)"})
              .attr("id","l1chartdiv"+i);

            //create source text
            d3.select(".tile"+i)
              .append("div")
              .text(graphic_data_l1[i].sourcetext)
              .style("font-size","14px")
              .style("padding-left","8px")
              .style("padding-right","8px")
              .style("padding-top","4px")
              .style("padding-bottom","4px")

              var pymParent = new pym.Parent("l1chartdiv"+i, graphic_data_l1[i].charturl, {title: "Chart - " + graphic_data_l1[i].title});


            d3.selectAll(".readmore").on("click",function(){
                d3.selectAll(".bottonGroup").classed("selectedButton",false)
                whichButton = d3.select(this).attr("whichButton")
                d3.select("." + whichButton).classed("selectedButton",true)

                view = d3.select(this).attr("view");
                heading = d3.select(this).attr("heading");

                d3.selectAll(".toptext").style("display","none")
                d3.selectAll(".toptext"+view).style("display","block")


                window.parent.document.documentElement.scrollTop = 500;
                //
                // document.body.scrollTop = 0; // For Safari
                // document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera

                changeView(view,heading);
              })
          })
      };

      d3.csv("../level2.csv", function(error, data) {
        graphic_data = data;
      });

          d3.selectAll(".Button").on("click",function(){
              d3.selectAll(".bottonGroup").classed("selectedButton",false)
              d3.select(this).classed("selectedButton",true)
              d3.selectAll(".toptext").style("display","none")

              view = d3.select(this).attr("view");
              d3.selectAll(".toptext"+view).style("display","block")
              heading = d3.select(this).attr("heading");

              changeView(view,heading);
            })

            function changeView(view,heading){ //function for hashing

                window.parent.location.hash = view;

                description = [];

                checker = "sortby_" + view;
                console.log(checker)

                description = graphic_data.filter(function(d){return d[checker]!==""}).sort(function(x, y){return d3.ascending(x[checker], y[checker]);})
                console.log(description)

              //empty stuff out
              d3.select("#analysisHere").selectAll("*").remove();
              d3.select("#analysisHere").style("max-width","700px")
              //change the heading
              //d3.select("#selectionDescription").text(heading);
              //d3.select(".toptextheadlines").style("display","none")
              //draw associated charts
              description.forEach(function(d,i){
                //set up coloured tags
                d3.select("#analysisHere")
                  .append("div")
                  .style("width","200px")
                  .style("height","8px")
                  .style("border-radius","9px")
                  .style("background-color",description[i].colour)
                  .style("margin-top","40px");
                  //set up titles
                  d3.select("#analysisHere")
                    .append("h2")
                    .style("font-size","20px")
                    .style("margin-bottom","16px")
                    .style("margin-top","15px")
                    .text(description[i].title)
                    .style("line-height",1.75);
                    //set up subtitles
                    d3.select("#analysisHere")
                      .append("h2")
                      .style("font-size","16px")
                      .style("font-weight","500")
                      .style("line-height",1.75)
                      .style("margin-bottom","16px")
                      .text(description[i].subtitle);
                      //set up charts
                      d3.select("#analysisHere")
                        .append("div")
                        .attr("id","chartDiv" + i)
                        .style("margin-bottom","24px");
                        //set up commentary
                        d3.select("#analysisHere")
                          .append("p")
                          .style("font-size","18px")
                          .html(description[i].commentary)
                          .style("margin-bottom","10px")
                          .style("line-height","32px");
                          //set up date stamp
                        d3.select("#analysisHere")
                          .append("p")
                          .style("font-size","18px")
                          .text("Last updated: " + description[i].datestamp)
                          .style("line-height","32px");
                          //set up source
                          if(description[i].sourcename == "null"){
                            //donothing
                          } else {
                            d3.select("#analysisHere")
                              .append("a")
                              .style("font-size","16px")
                              .attr("href",description[i].source)
                              .attr("target","_blank")
                              .text("Read more about this in " + description[i].sourcename)
                              .style("line-height",1.75);
                          };
                            //set up dara download link

                            if (description[i].charturl=="null") {
                              //donothing
                            } else {

                            d3.select("#analysisHere")
                              .append("a")
                              .style("font-size","16px")
                              .attr("href",description[i].datadownload)
                              .attr("target","_blank")
                              .html("</br> Download the data")
                              .style("line-height",1.75);
                            //append button for embed code
                            d3.select("#analysisHere")
                              .append("div")
                              .attr("class","collapsible collapsible"+i)
                              .attr("refersTo","collapsibleContent"+i)
                              .text("▶ Embed this chart");
                              d3.select("#analysisHere")
                                .append("input")
                                .style("margin-left","4px")
                                .attr("class","collapsibleContent collapsibleContent"+i)
                                .attr("value","<iframe height='500px' width='100%' src='"+description[i].charturl+"'></iframe>");
                            }//ends else
                            //set up some padding
                            d3.select("#analysisHere").append("div").attr("aria-hidden","true").style("margin-bottom","70px");


                              //deal with embedding twisties
                              d3.selectAll(".collapsible").on("click",function(){
                                refersTo = d3.select(this).attr("refersTo");
                                if(embedSwitch=="closed"){
                                  d3.select("."+refersTo).style("display","block")
                                  embedSwitch = "open";
                                  d3.select(this).text("▼ Embed this chart")
                                } else {
                                  d3.selectAll(".collapsibleContent").style("display","none")
                                  embedSwitch = "closed";
                                  d3.selectAll(".collapsible").text("▶ Embed this chart")
                                }
                              })
              })
              populateCharts(description);
              d3.select("#analysisHere")
                .append("p")
                .attr("class","backtotop")
                .style("font-size","18px")
                .text("Back to the top")
                .style("line-height","32px");

                d3.select(".backtotop").on("click",function(){
                  window.parent.document.documentElement.scrollTop = 500;
                })

            }




            function populateCharts(description){

              for (i = 0; i < description.length; i++) {
                if(description[i].charturl=="null"){
                  //donothing
                } else {
                  var pymParent = new pym.Parent("chartDiv" + i, description[i].charturl, {title:"Chart - " + description[i].title});
                }
              }
            };


            	function checkUrl() {

            		//urlLocal = window.location.href;
            		urlParent = window.parent.location.href;

            		//var listnamesLocal = urlLocal.split("#")[1];
            		var listnamesParent = urlParent.split("#")[1];

                listnamesAll = listnamesParent;

                if(listnamesAll != undefined) {
                  //do change view here

                  if(listnamesAll == "headlines"){
                    d3.selectAll(".bottonGroup").classed("selectedButton",false)
                    d3.select("."+listnamesAll+"Button").classed("selectedButton",true)
                    d3.selectAll(".toptext").style("display","none")
                    d3.selectAll(".toptext"+listnamesAll).style("display","block")
                    drawlevel1fromhash()
                  } else {
                    d3.selectAll(".bottonGroup").classed("selectedButton",false)
                    d3.select("."+listnamesAll+"Button").classed("selectedButton",true)
                    d3.selectAll(".toptext").style("display","none")
                    d3.selectAll(".toptext"+listnamesAll).style("display","block")
                    whatevs = "";
                    changeView(listnamesAll,whatevs);
                  }
                }
            	}


		pymChild.sendHeight();

		setTimeout(function(){
			pymChild.sendHeight();
		},3000);

    setInterval(function(){
			pymChild.sendHeight();
		},1000);
	}




    </script>
