<!DOCTYPE html>
<html lang="en">

<head>
    <link href='https://fonts.googleapis.com/css?family=Open+Sans:400,700' rel='stylesheet' type='text/css'>
    <title>Line chart</title>

    <meta name="description" content="">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <link rel="stylesheet" href="../lib/globalStyle.css" />

    <style type="text/css">

    body {
      max-width: 330px;
    }

    .statTitle{
      font-size: 18px;
      font-weight: bold;
    }
    .statSubtitle{
      font-size: 14px;
      margin-bottom: 10px;
      color: #666;
    }
    .statValue{
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .statSource{
      font-size: 14px;
      margin-bottom: 6px;
      color: #666;
    }


    </style>
</head>
<body>
   <div id="graphic"></div>

   		<script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
   		<script src="../lib/modernizr.svg.min.js" type="text/javascript"></script>
   		<script src="../lib/d3v4jetpack.js" type="text/javascript"></script>

   <script>

		var graphic = d3.select('#graphic');
    var graphic_data = null;

function drawGraphic(){
  graphic_data.forEach(function(d,i){
    //add separator Line
    d3.select("#graphic")
    .append("div")
    .style("width","100%")
    .style("height","4px")
    .style("border-radius","3px")
    .style("background-color",graphic_data[i].colour)
    .style("margin-bottom","6px");

    //Add titles
    d3.select("#graphic")
    .append("h3")
    .attr("class","statTitle")
    .style("color",graphic_data[i].colour)
    .text(graphic_data[i].title)

    //Add subtitles
    d3.select("#graphic")
    .append("p")
    .attr("class","statSubtitle")
    .text(graphic_data[i].subtitle);

    //Add value
    d3.select("#graphic")
    .append("p")
    .attr("class","statValue")
    .style("color",graphic_data[i].colour)
    .text(function(){
      if(graphic_data[i].updownthesame == "up"){return graphic_data[i].latestdata + " ▲"}
      else if(graphic_data[i].updownthesame == "down"){return graphic_data[i].latestdata + " ▼"}
      else{return graphic_data[i].latestdata + " ◀▶"}
    });

    //Add source
    d3.select("#graphic")
    .append("p")
    .attr("class","statSource")
    .text("Source: " + graphic_data[i].sourcetext);
  })
}


	//check whether browser can cope with svg
		if (Modernizr.svg) {
				//load chart data
				d3.csv("../level1.csv", function(error, data) {
					graphic_data = data;
          console.log(graphic_data);
          drawGraphic();
				});
		};

    </script>
