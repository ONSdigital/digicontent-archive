<!DOCTYPE html>
<html lang="en">

<head>
  <title>Triple region chart</title>

  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">

  <link rel="stylesheet" href="../../lib/globalStyle.css" />
  <link href="./css/chosen.css" rel="stylesheet" /> <!-- for chosen button -->
  <style>
    body {
      max-width: 700px;
    }

    iframe {
      max-width: 700px;
      min-height: 189px;
      float: left;
    }

    h6 {
      font-size: 16px;
      margin: 16px 0 8px 0;
      font-weight: 700;
      color: #323132;
    }


    .btn--primary {
      background-color: #0F8243;
      color: #fff;
    }

    a {
      text-decoration: underline;
      word-wrap: break-word;
    }

    /* .footer-link {
          color: #206095 !important;
        } */

    #descriptionp {
      max-width: 400px;
      font-size: 16px;
      color: #222;
    }

    ul,
    ol {
      margin: 0px 0;
      padding-left: 16px;
    }

    li {
      font-size: 12px;
      font-weight: 400;
      line-height: 24px;
      margin: 0px 0;
      padding: 6px 0 10px 16px;
    }

    .revealhilight {
      font-size: 14px;
      font-weight: bold;
      color: #0075A3;
    }

    select {
      position: relative;
      height: 40px;
      background: white;
      border: none;
      width: 234px;
      ;
    }

    .select select {
      /* font-size: 1.1em; */
      border: none;
      box-shadow: none;
      border-radius: 0;
      background: transparent;
      height: 100%;
      width: 100%;
      cursor: pointer;
      outline: none;
      padding-right: 35px;
      padding-left: 4px;
      border: 2px solid #206095;
      -moz-appearance: none;
      -webkit-appearance: none;
    }

    #yearbox {
      font-size: 12px;
    }

    option {
      font-size: 12px;
    }

    .borderbox {
      border: 2px solid #1b5f97;
      /* height: 40px;*/
      width: 10%;
      margin-top: 25px;
      /* display: inline-block; */
    }

    .button {
      overflow: visible;
      text-transform: none;
      font: inherit;
    }

    .btn--primary {
      background-color: #206095 !important;
    }

    .btn {
      position: relative;
      padding: 10px 15px;
      margin: 0 0 20px;
      line-height: normal;
      color: #fff;
      font-size: 1.3em !important;
      border-radius: 0px;
      display: inline-block;
      text-rendering: optimizeLegibility;
      transition: background-color .2s ease-in, color .2s ease-in;
    }


    .chosen-container:focus {
      margin-top: 10px;
      outline: 3px solid #FFA23A;
    }


    .visuallyhidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>

</head>

<body>





  <img id="smallimage" src="small.png" alt="" width="350">
  <h5 class="visuallyhidden"></h5>



  <div id="inputform" style="clear: both;">
    <label style="font-size:18px;" for="yearbox" aria-label="Select a term to see its description">Select a region to
      highlight on the charts</label>

    <div style="margin-bottom:15px; max-width:300px;">
      <select name="select" id="yearbox" class="chosen-select">
        <option selected="" disabled="">Select a region</option>


        <option value='em'>East Midlands</option>
        <option value='e'>East of England</option>
        <option value='l'>London</option>
        <option value='ne'>North East</option>
        <option value='nw'>North West</option>
        <option value='se'>South East</option>
        <option value='sw'>South West</option>
        <option value='wm'>West Midlands</option>
        <option value='yh'>Yorkshire and The Humber</option>





      </select>
    </div>


  </div>

  <div id="infect" aria-hidden="true"></div>
  <div id="hosp" aria-hidden="true"></div>
  <div id="death" aria-hidden="true"></div>


  <h6 style="clear:both; padding-top:10px;">Source: Coronavirus (COVID-19) Infection Survey and Deaths registered weekly from the Office for National Statistics, and Severe Acute Respiratory Infection Watch surveillance system from the UK Health Security Agency</h6>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js"></script>
  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/jquery/2.1.4/jquery.min.js" type="text/javascript"></script>
  <script src="../../lib/chosen.jquery.js"></script>
  <script src="../../lib/chosen.order.jquery.min.js"></script>


  <script>

    var pymChild = null;

    $(".chosen-select").chosen({
      allow_single_deselect: true,
      disable_search: true
    })

    pymChild = new pym.Child();



    pym.Child({ renderCallback: drawgraphic })

    function drawgraphic() {

      var pymParent = new pym.Parent('death', '../death/index.html', {});
      var pymParent = new pym.Parent('hosp', '../hosp/index.html', {});
      var pymParent = new pym.Parent('infect', '../infect/index.html', {});

      d3.select("#smallimage").remove();

      pymChild.sendHeight();

      termselected = "l";

      //add event listeners to chosen dropdown
      d3.select(".chosen-drop").on("click", function () {
        termselected = d3.select("#yearbox").property("value");
        setregion(termselected);
      })
      d3.select(".chosen-drop").on("touchend", function () {
        termselected = d3.select("#yearbox").property("value");
        setregion(termselected);
      })

      d3.select(".chosen-drop").on("keyup", function () {
        if (d3.event.keyCode === 13) {
          setTimeout(function () {
            termselected = d3.select("#yearbox").property("value");
            setregion(termselected);
          }, 100);
        }
      })

      selectedregion = "se";

      function setregion(termselected) {
        selectedregion = termselected;
      }


      setTimeout(function () {
        pymChild.sendHeight();
      }, 3000);

      setInterval(function () {
        pymChild.sendHeight();
      }, 6000);
    }


  </script>

</html>
