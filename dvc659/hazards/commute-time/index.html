<!DOCTYPE html>
<html lang="en">

<head>
  <title>Commute Time</title>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,700" rel="stylesheet">
  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />

  <link rel="stylesheet" href="../../lib/globalStyle.css" />
  <style type="text/css">
    body {
      padding-bottom: 20px;
    }

    path.connector-end.connector-arrow {
      fill: grey;
    }

    body {
      max-width: 700px;
    }

    g.tick line {
      stroke: #ccc;
    }

    path.connector-end.connector-arrow {
      fill: grey;
    }

    .annotation text {
      fill: #58595B;
    }

    .annotation-tip {
      pointer-events: none;
    }

    @media(max-width: 550px) {
      .annotation-tip {
        display: none;
      }
    }

    .annotation-tip .annotation-note-bg {
      fill: white;
      fill-opacity: 0.9;
    }

    .annotation.badge path.subject-pointer,
    .annotation.badge path.subject {
      fill: #e8336D;
      stroke: none;
    }

    text.badge-text {
      fill: white;
    }

    .annotation.badge path.subject-ring {
      fill: none;
      stroke: none;
    }

    #graphic .axis text {
      font-size: 16px;
      fill: #58595B;
    }

    h3,
    h4,
    h5 {
      font-weight: 700;
      margin: 16px 0 0 0;
      padding: 3px 0 5px 0;
      font-family: "Open Sans", Helvetica, Arial, sans-serif;
      color: #323132;
      -webkit-font-smoothing: antialiased;
    }


    h3 {
      font-size: 24px;
      line-height: 32px;
    }

    h4 {
      font-size: 20px;
      line-height: 32px;
    }

    h5 {
      padding: 0px;
      font-size: 16px;
      line-height: 32px;
    }

    @media(max-width: 767px) {
      h3 {
        font-size: 18px;
        line-height: 24px;
      }

      h4 {
        font-size: 16px;
        line-height: 24px;
      }

      h5 {
        font-size: 14px;
        line-height: 24px;
      }
    }


  </style>

</head>

<body>
  <!-- <h3>Providing fewer hours of care for an adult increases satisfaction with life and satisfaction with health</h3> -->
  <div id="graphic"><img src="fallback.png" alt="[Chart]" /></div>




  <!-- Define the source -->
  <div id="footer"> </div>

  <script src="https://cdn.ons.gov.uk/vendor/d3/4.2.7/d3.min.js" type="text/javascript"></script>
  <script src="../../lib/modernizr.svg.min.js" type="text/javascript"></script>
  <script src="https://cdn.ons.gov.uk/vendor/pym/1.3.2/pym.min.js" type="text/javascript"></script>
  <script src="../../lib/d3-annotation.js" type="text/javascript"></script>
  <script src="../../lib/d3plus-text.v0.9.full.min.js"></script>
  <script>
    var ageNames;
    var graphic = d3.select('#graphic');
    var keypoints = d3.select('#keypoints');
    var footer = d3.select(".footer");
    var pymChild = null;


    function drawGraphic(width) {

      var threshold_md = 650; // new code ..
      var threshold_sm = dvc.optional.mobileBreakpoint;

      //set variables for chart dimensions dependent on width of #graphic
      if (parseInt(graphic.style("width")) < threshold_sm) {
        var margin = {
          top: dvc.optional.margin_sm[0],
          right: dvc.optional.margin_sm[1],
          bottom: dvc.optional.margin_sm[2],
          left: dvc.optional.margin_sm[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[0] * graphic_data.length - margin.top - margin.bottom;
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        var margin = {
          top: dvc.optional.margin_md[0],
          right: dvc.optional.margin_md[1],
          bottom: dvc.optional.margin_md[2],
          left: dvc.optional.margin_md[3]
        };
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[1] * graphic_data.length - margin.top - margin.bottom;
      } else {
        var margin = {
          top: dvc.optional.margin_lg[0],
          right: dvc.optional.margin_lg[1],
          bottom: dvc.optional.margin_lg[2],
          left: dvc.optional.margin_lg[3]
        }
        var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
        var height = dvc.essential.barHeight_sm_md_lg[2] * graphic_data.length - margin.top - margin.bottom;
      }


      // clear out existing graphics
      graphic.selectAll("*").remove();
      keypoints.selectAll("*").remove();
      footer.selectAll("*").remove();

      var num_ticks = 10;

      var color = d3.scaleOrdinal().range(dvc.essential.colour_palette);

      // vertical
      y0 = d3.scaleBand().rangeRound([0, height]).paddingInner(0.1);;
      var y1 = d3.scaleBand();
      var x = d3.scaleLinear().range([0, chart_width]);


      var parseDate = d3.timeParse("%Y");

      var xAxis = d3.axisBottom(x)
        .tickFormat(function(d) {
          return d3.format(".0f")((d - 1) * 100) + "%"
        });


      var legend = d3.select('#graphic').append('svg')
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + 30)
        .attr("title", dvc.essential.title)
        .attr("desc", dvc.essential.desc)
        .append("g")
        .attr("id", "legend")

      var svg = d3.select('svg')
        .attr("id", "chart")
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + 30)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + (margin.top + 30) + ")")




      // vertical
      y0.domain(graphic_data.map(function(d) {
        return d.state;
      }));
      y1.domain(ageNames).range([0, y0.bandwidth()]);

      //x domain calculations	: zero to intelligent max choice, or intelligent min and max choice,  or interval chosen manually
      if (dvc.essential.xAxisScale == "auto_zero_max") {
        var xDomain = [0, Math.ceil(dvc.maxVal / 100) * 100];
      } else if (dvc.essential.xAxisScale == "auto_min_max") {
        var xDomain = [dvc.minVal, Math.ceil(dvc.maxVal / 100) * 100];
      } else {
        var xDomain = dvc.essential.xAxisScale;
      }
      // if (parseInt(graphic.style("width")) < threshold_sm) {var xDomain=[-25,10]}


      x.domain(xDomain);

      var yAxis = d3.axisLeft(y0)
        // .tickFormat(function(d, i) {
        //
        //   //specify date format for x axis depending on #graphic width
        //   if (parseInt(graphic.style("width")) <= threshold_sm) {
        //     var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[0]);
        //   } else if (parseInt(graphic.style("width")) <= threshold_md) {
        //     var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[1]);
        //   } else {
        //     var fmt = d3.timeFormat(dvc.optional.xAxisTextFormat_sm_md_lg[2]);
        //   }
        //
        //   if (dvc.essential.GraphType == "clusterBar") {
        //     return d;
        //   } /* new code */
        //   else {
        //     return fmt(d);
        //   } /* new code */
        //
        // })
        .tickPadding(5);

      //specify number of ticks on x axis
      if (parseInt(graphic.style("width")) < threshold_sm) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[0])
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[1])
      } else {
        xAxis.ticks(dvc.optional.x_num_ticks_sm_md_lg[2])
      }

      //specify number or ticks on y axis
      if (parseInt(graphic.style("width")) <= threshold_sm) {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[0]));
      } else if (parseInt(graphic.style("width")) <= threshold_md) {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[1]));
      } else {
        yAxis.tickValues(y0(dvc.optional.y_num_ticks_sm_md_lg[2]));
      }



      svg.append("g")
        .attr("class", "x axis")
        .attr("id", "xAxis")
        .attr('transform', function(d) {
          // if (xDomain[0] != 0) {
          //   return 'translate(' + (0) + ',' + height + ')';
          // } else {
          return 'translate(' + (0) + ',' + height + ')';
          // }
        })
        .call(xAxis.tickSize(-height, 0))

        d3.select('.x path.domain').style('stroke','none')

      //create y axis, if x axis doesn't start at 0 nudge y axis accordingly
      svg.append('g')
        .attr('class', 'y axis')
        .call(yAxis);

      d3.select(".y").select("path").style("stroke", "#666")

      var state = svg.selectAll(".state")
        .data(graphic_data)
        .enter()
        .append("g")
        .attr("class", "g")
        .attr("transform", function(d, i) {
          return "translate(0," + parseFloat(y0(d.state)) + ")";
        });

      tipg = svg.append("g")
        .attr("class", "annotation-tip");

      // annotations
      if (parseInt(graphic.style("width")) >= threshold_sm) {

        var annotations = [

          {
            note: {
              label: "More likely to leave current job",
              bgPadding: 5,
              // wrap: 200,
              align: "left",
              orientation: "top",
              wrap: 140
              // lineType: "vertical"
            },
            x: x(1.20) + margin.left,
            y: y0("50 minutes longer") + margin.top + 20,
            dy: 0,
            dx: x(1) - x(1.10),
            type: d3.annotationLabel,
            connector: {
              end: "arrow",
            },

          },

          {
            note: {
              title: "Comparison group:\n10 minute commute",
              bgPadding: 5,
              wrap: 200,
              align: "middle",
              orientation: "top",
              wrapSplitter: /\n/
              // lineType: "vertical"
            },
            x: x(1) + margin.left,
            y: y0("50 minutes longer") + margin.top + 23,
            // dy: 0,
            // dx: x(1.0)-x(0.9),
            type: d3.annotationLabel,
            connector: {
              end: "arrow",
            },

          }
        ]
      } else {

        var annotations = [{
          x: x(1.223280082) + margin.left + y1.bandwidth() / 2,
          y: y0("30 minutes longer") + 1.5 * y1.bandwidth() + margin.top + 30,
          type: d3.annotationBadge,
          subject: {
            text: "A",
            radius: 14,
          }
        },
        {
          note: {
            label: "More likely to leave current job",
            bgPadding: 5,
            // wrap: 200,
            align: "left",
            orientation: "top",
            wrap: 140
            // lineType: "vertical"
          },
          x: x(1.20) + margin.left,
          y: y0("50 minutes longer") + margin.top + 20,
          dy: 0,
          dx: x(1) - x(1.10),
          type: d3.annotationLabel,
          connector: {
            end: "arrow",
          },

        },

        {
          note: {
            title: "Comparison group:\n10 minute commute",
            bgPadding: 5,
            wrap: 200,
            align: "left",
            orientation: "top",
            wrapSplitter: /\n/
            // lineType: "vertical"
          },
          x: 0,
          y: y0("50 minutes longer") + margin.top +30,
          // dy: 0,
          // dx: x(1.0)-x(0.9),
          type: d3.annotationLabel,
          connector: {
            end: "arrow",
          },

        }]

        var annotationLegend = [{
          note: {
            label: "Women with a longer commute are more likely than men to leave their current job."
          },
          subject: {
            text: "A",
          },
          x: 15,
          y: 15
        }]
      }


      var makeAnnotations = d3.annotation()
        .notePadding(0)
        .accessors({
          x: function(d) {
            return x(d.x) + margin.left
          },
          y: function(d) {
            return y0(d.y) + margin.top + 30
          }
        })
        .annotations(annotations)


      var texty = [{
          "text": "<strong>Women</strong> with <strong>a longer commute</strong> are <strong>more likely</strong> than <strong>men</strong> to leave their current job.",
          "x": margin.left + x(1.205),
          "y": margin.top + y0("30 minutes longer") + y1.bandwidth() + 5
        }
      ]

      if (parseInt(graphic.style("width")) >= threshold_sm) {

      new d3plus.TextBox()
        .data(texty)
        .fontSize(16)
        .fontColor('#323132')
        .fontFamily('Open Sans')
        .width(150)
        .select('#chart')
        .x(function(d) {
          return d.x
        })
        .y(function(d) {
          return d.y
        })
        .render();

      d3.selectAll('.d3plus-textBox').each(function(d, i) {
        var transform = d3.select(this).attr('transform').split("(")[1].split(")")[0].split(/[\s,]+/)
        transform = transform.map(function(d) {
          return +d
        })
        var bbox = this.getBBox();

        d3.select('svg').append('rect')
          .attr('x', (bbox.x + transform[0]))
          .attr('y', (bbox.y + transform[1]))
          .attr('width', bbox.width)
          .attr('height', bbox.height)
          .attr("fill", "white")
          .attr("opacity", 0.6);
      })

      d3.selectAll('.d3plus-textBox').remove()

      new d3plus.TextBox()
        .data(texty)
        .fontSize(16)
        .fontColor('#323132')
        .fontFamily('Open Sans')
        .width(150)
        .select('#chart')
        .x(function(d) {
          return d.x
        })
        .y(function(d) {
          return d.y
        })
        .render();

      d3.select("#d3plus-textBox-0").selectAll('text').selectAll('tspan')._groups.forEach(function(d, i) {
        if (i === 0) {
          d3.select(d[0]).style('fill', dvc.essential.colour_palette[1])
        } else if (i === 3) {
          d3.select(d[0]).style('fill', dvc.essential.colour_palette[0])
        }
      })

    }//end of if d3textbox

      d3.select("svg")
        .append("g")
        .attr("class", "annotation-group")
        .call(makeAnnotations)

      if (parseInt(graphic.style("width")) < threshold_sm) {
        var makeLegendAnno = d3.annotation()
          .type(d3.annotationBadge)
          .annotations(annotationLegend)

        d3.select("svg")
          .append('g')
          .attr("class", "annotation-legend")
          .attr("transform", "translate(0 " + (height + margin.top + margin.bottom + 30) + ")")
          .call(makeLegendAnno)

        d3.select("svg g.annotation-legend")
          .selectAll("text.legend")
          .data(annotationLegend)
          .enter()
          .append('text')
          .attr("class", "legend")
          .text(function(d) {
            return d.note.label
          })
          .attr("x", 50)
          .attr("dy", 0)
          .attr("y", function(d, i) {
            return 20 + i * 60
          })
          .call(wrap, chart_width + margin.left - 50)

      }

      d3.selectAll(".note-line").style("opacity", 0)

      createLegend();

      function createLegend() {

        var prevX = 0;
        var prevY = 0;
        lineNo = 0;
        var lineNoOld = 0;

        dvc.essential.legendLabels.forEach(function(d, i) {

          // draw legend text based on content of var legendLabels ...
          var_group = d3.select("#legend").append("g")

          var_group.append("circle")
            .attr("class", "rect" + i)
            .attr("fill", dvc.essential.colour_palette[i])
            .attr("cx", 20)
            .attr("cy", 20)
            .attr("r", 5)


          var_group.append("text")
            .text(dvc.essential.legendLabels[i])
            .attr("class", "legend" + i)
            .attr("text-anchor", "start")
            .style("font-size", "16px")
            .style("fill", "#666")
            .attr('y', 15)
            .attr('x', 0);



          d3.selectAll(".legend" + (i))
            .each(calcPosition);



          function calcPosition() {
            var BBox = this.getBBox()

            d3.select(".legend" + (i))
              .attr("y", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                return eval((lineNo * 20) + 20);
              })
              .attr("x", function(d) {
                return prevX + 25;
              })

            d3.select(".rect" + (i))
              .attr("cy", function(d) {
                if ((prevX + BBox.width + 50) > parseInt(graphic.style("width"))) {
                  lineNoOld = lineNo;
                  lineNo = lineNo + 1;
                  prevX = 0;
                }
                if (dvc.essential.legendStyle == "rect") {
                  return eval((lineNo * 20) + 15);
                } else {
                  return eval((lineNo * 20) + 12);
                }
              })
              .attr("cx", function(d) {
                return prevX + 10;
              })

            prevX = prevX + BBox.width + 50

          }; // end function calcPosition()
        }); // end foreach
      } // end function createLegend()



      legend_height = d3.select("#legend").node().getBBox()

      if (parseInt(graphic.style("width")) > threshold_sm) {
        d3.select('#chart').attr("height", height + margin.top + margin.bottom + legend_height.height)
      } else {
        d3.select('#chart').attr("height", height + margin.top + margin.bottom + legend_height.height + 105)
      }

      //create link to source
      d3.select('#footer').selectAll("*").remove()

      d3.select('#footer')
        .append("h5")
        .html("Source: " + dvc.essential.sourceText)



      svg.append("text")
        .attr('class', 'unit')
        .style("font-size", "16px")
        .attr("text-anchor", "end")
        .attr("fill", "#58595B")
        .attr("x",chart_width)
        .attr("y",height + 40)
        .text(function(d, i) {
          return dvc.essential.xAxisLabel
        })
        .call(wrap,chart_width+margin.left);


      state.selectAll("circles")
        .data(function(d) {
          return d.ages;
        })
        .enter()
        .append("circle")
        // .attr("width",function(d) { return 0 + Math.abs(x(d.value) - x(1));} )
        .attr("cx", function(d) {
          return x(d.value);
        })
        .attr("cy", function(d) {
          return y1.bandwidth() //return y1(d.name) + y1.bandwidth() / 2;
        })
        .attr("r", function(d) {
          return 5;
        })
        .style("fill", function(d) {
          return color(d.name);
        })
        .style("opacity", 1)
      // .on("mouseover",function(d){showTooltip(d)})
      // .on("mouseout",function(){hideTooltip();});

      //create centre line if required
      if (dvc.optional.centre_line == true) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('x1', x(dvc.optional.centre_line_value))
          .attr('x2', x(dvc.optional.centre_line_value))
          .attr('y1', 0)
          .attr('y2', height);
      } else if (xDomain[0] < 0) {
        svg.append("line")
          .attr("id", "centreline")
          .attr('y1', 0)
          .attr('y2', height)
          .attr('x1', x(0))
          .attr('x2', x(0));
      }

      function showTooltip(d) {
        annotationtip = d3.annotation()
          .type(d3.annotationLabel)
          .annotations([d].map(function(d){
            return {
              id: "tooltip",
              y: y0(d.parent) + y1(d.name) + 3,
              x: x(+d.value) / 2 + margin.left,
              dx: 0,
              dy: 0,
              note: {
                title: d3.format(".1f")(d.value) + "%",
                wrap: 200,
                bgPadding: {
                  top: 4,
                  right: 3,
                  left: 3,
                  bottom: -5
                },
              },
              disable: ["connector", "subject"]
            };
          }))
        tipg.call(annotationtip);
        d3.select(".annotation-tip").selectAll("rect.annotation-note-bg").attr("rx", 5).attr("ry", 5)
      }

      function hideTooltip() {
        tipg.selectAll("g").remove();
      }

      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x"),
            dy = 0//parseFloat(text.attr("dy")),
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }

      d3.selectAll("path").attr("fill", "none");

      d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

      d3.selectAll(".y text").attr("font-size", "12px").attr("fill", "#666");
      d3.selectAll(".x text").attr("font-size", "12px").attr("fill", "#666"); // dates - timelines

      d3.selectAll(".x line")
        .attr("stroke", "#CCC")
        .attr("stroke-width", "1px")
        .style("shape-rendering", "crispEdges");



      if (pymChild) {
        pymChild.sendHeight();
      }
    }


    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {

        dvc = config;

        d3.csv(dvc.essential.graphic_data_url, function(error, data) {

          graphic_data = data;

          ageNames = d3.keys(graphic_data[0]).filter(function(key) {
            return key !== "state";
          });


          /* START MODIFIED */
          dvc.dataMinArray = [];
          dvc.dataMaxArray = [];
          /* END MODIFIED */

          graphic_data.forEach(function(d, i) {

            /* START MODIFIED */
            dvc.dataMinArray[i] = [];
            dvc.dataMaxArray[i] = [];
            dvc.minVal = Infinity;
            dvc.maxVal = -Infinity;
            /* END MODIFIED */

            d.ages = ageNames.map(function(name) {

              /* START MODIFIED */
              if (+d[name] <= dvc.minVal) {
                dvc.minVal = +d[name];
                dvc.dataMinArray[i] = +d[name];
              }

              if (+d[name] >= dvc.maxVal) {
                dvc.maxVal = +d[name];
                dvc.dataMaxArray[i] = +d[name];
              }
              /* END MODIFIED */

              return {
                parent: d.state,
                name: name,
                value: +d[name]
              };
            });

          });

          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });
      })
    } else {
      pymChild = new pym.Child();
      pymChild.sendHeight();
