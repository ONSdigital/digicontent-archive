    function drawGraphic(width) {
      var threshold_md = dvc.optional.middleBreakpoint;
      var threshold_sm = dvc.optional.mobileBreakpoint;

      //set variables for chart dimensions dependent on width of #graphic
      if(parseInt(graphic.style("width"))< threshold_sm){
        size = "sm";
      } else if (parseInt(graphic.style("width")) < threshold_md) {
        size = "md";
      } else {
        size = "lg";
      }

      var margin = dvc.optional.margin[size]
      var chart_width = parseInt(graphic.style("width")) - margin.left - margin.right;
      var height = Math.ceil((chart_width * dvc.optional.aspectRatio[size][1]) / dvc.optional.aspectRatio[size][0]);

      // clear out existing graphics
      graphic.selectAll("*").remove();

      var x = d3.scaleLinear()
        .range([0, chart_width]);

      var y = d3.scaleBand()
        .range([0, height])
        .paddingInner(0.2);

      y.domain(graphic_data.map(function(d) {
        return d.name;
      }));

      var yAxis = d3.axisLeft(y)

      var xAxis = d3.axisBottom(x)
        .tickSize(-height, 0, 0);

      //specify number or ticks on x axis
      xAxis.ticks(dvc.optional.x_num_ticks[size])

      var svg = d3.select('#graphic').append('svg')
        .attr("id", "chart")
        .style("background-color", "#fff")
        .attr("width", chart_width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom + 30)
        .append("g")
        .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

      svg.append("rect")
        .attr("class", "svgRect")
        .attr("width", chart_width)
        .attr("height", height)
        .attr("fill", "transparent")

      svg.append('g')
        .attr('class', 'x axis')
        .attr("transform", "translate(0, " + height + ")")
        .call(xAxis)
        .append("text")
        .attr("y", 30)
        .attr("x", chart_width)
        .attr("dy", "0em")
        .style("text-anchor", "end")
        .attr("font-size", "12px")
        .attr("fill", "#666")

        })

        })

      svg.selectAll('line.lowerci').data(graphic_data).enter()

      svg.selectAll('line.upperci').data(graphic_data).enter()

          .attr('x1',function(d){return x(d.upperCI)})

      svg.selectAll('line.connectingci').data(graphic_data).enter()
        .append('line')
        .attr('class','connectingci')
          .attr('y1',function(d){return y(d.name)+y.bandwidth()/2})

          .attr('x1',function(d){return x(d.lowerCI)})
          .attr('x2',function(d){return x(d.upperCI)})
          .attr('stroke','#003C57')

    function wrap2(text, width) {
        text.each(function() {
          var text = d3.select(this),
              words = text.text().split(/\s+/).reverse(),
              word,
              line = [],
              lineNumber = 0,
              lineHeight = 1.1, // ems
              y = text.attr("y"),
              x = text.attr("x"),
              dy = parseFloat(text.attr("dy")),
              tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", dy + "em");
          while (word = words.pop()) {
            line.push(word);
            tspan.text(line.join(" "));
            if (tspan.node().getComputedTextLength() > width) {
              line.pop();
              tspan.text(line.join(" "));
              line = [word];
              tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
            }
          }
        });
      }

      function wrap(text, width) {
        text.each(function() {
          var text = d3.select(this),
            words = text.text().split(/\s+/).reverse(),
            word,
            line = [],
            lineNumber = 0,
            lineHeight = 1.1, // ems
            y = text.attr("y"),
            x = text.attr("x"),
            dy = parseFloat(text.attr("dy")),
            tspan = text.text(null).append("tspan").attr("x", x).attr("y", y).attr("dy", 0 + "em");
          if (words.length > 2) {
            while (word = words.pop()) {
              line.push(word);
              tspan.text(line.join(" "));
              if (tspan.node().getComputedTextLength() > width) {
                if (lineNumber == 0) {
                  tspan.attr("dy", -0.55 + "em")
                } else {
                  tspan.attr("dy", 0.55 + "em")
                }
                line.pop();
                tspan.text(line.join(" "));
                line = [word];
                ++lineNumber;
                tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy",function(){
                  if(lineNumber==2){
                    return (0.55 * (lineNumber+1) ) + "em"
                  }else {
                    return (0.55 * lineNumber ) + "em"
                  }
                }).text(word);
              }
            }
          } else {
            while (word = words.pop()) {
              line.push(word);
              tspan.text(line.join(" "));
              if (tspan.node().getComputedTextLength() > width) {
                if (lineNumber == 0) {
                  tspan.attr("dy", -0.55 + "em")
                } else {
                  tspan.attr("dy", 0.55 + "em")
                }
                line.pop();
                tspan.text(line.join(" "));
                line = [word];
                ++lineNumber;
                tspan = text.append("tspan").attr("x", x).attr("y", y).attr("dy", (0.55 * lineNumber) + "em").text(word);
              }
            }
          }

        });
      }

        d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

        // function insertLinebreaksLabels() {
        // 				var str = this.textContent;

        //

        // };

        // d3.selectAll(".y text").each(insertLinebreaksLabels)


      } // end function writeAnnotation()


      d3.select('#source')
        .text('Source: ' + dvc.essential.sourceText);

      d3.selectAll("text").attr("font-family", "'Open Sans', sans-serif");

      //use pym to calculate chart dimensions
      if (pymChild) {
        pymChild.sendHeight();
      }
    }

    //check whether browser can cope with svg
    if (Modernizr.svg) {
      //load config
      d3.json("config.json", function(error, config) {
        dvc = config

        //load chart data
        d3.csv(dvc.essential.graphic_data_url, function(error, data) {
          graphic_data = data;

          graphic_data.forEach(function(d) {
            d.value = +d.value
          });

          //use pym to create iframed chart dependent on specified variables
          pymChild = new pym.Child({
            renderCallback: drawGraphic
          });
        });
      })

    } else {
      //use pym to create iframe containing fallback image (which is set as default)
      pymChild = new pym.Child();
      if (pymChild) {
        pymChild.sendHeight();
