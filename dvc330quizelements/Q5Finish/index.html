		#slider:before{
			display:block;
			/*background-image: url('../img/rangeBar.png');	*/
			background-position:0px 10px;
			background-repeat: repeat-x;
			margin-left:9px;
			width:calc(100%-9px);
			height:30px;
			position:relative;
			position:absolute;
			content:""
		}
		
		#range td{
			border:none;
		}
		
		.rangeGrip{
			width:30px;
			height:30px;
			cursor:ew-resize;
			background-color:#dadada;
			-webkit-animation-name: gripper; /* Chrome, Safari, Opera */
			animation-iteration-count: infinite;
			animation-name: gripper;
			animation-duration: 2s;
		  border: 6px solid #FFF;
		  border-radius: 18px;
		  box-shadow: 0 0 2px #888;
			z-index:8;
		}
		/* Chrome, Safari, Opera */
		@-webkit-keyframes gripper {
			0% {border:11px solid #FFF;}
			50% {border:4px solid #FFF;}
			100% {border:11px solid #FFF;}
		}
		/* Standard syntax */
		@keyframes gripper {
			0% {border:11px solid #FFF;}
			50% {border:4px solid #FFF;}
			100% {border:11px solid #FFF;}
		}
		
		
		.rangeDrag .rangeGrip, .rangeGrip:hover{
